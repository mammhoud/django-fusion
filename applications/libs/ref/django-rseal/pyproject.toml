[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-rseal"
version = "0.1.0"
description = "Automation layer for Django applications with email services, task orchestration, workflows, and AI integrations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mahmoud", email = "mahmoud@example.com"}
]
keywords = ["django", "email", "tasks", "workflows", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "Django>=4.2",
    "celery>=5.0",
    "wagtail",
    "django-modelcluster",
    "django-taggit",
    "django-colorfield",
    "django-filter",
    "faker>=0.7.7",
    "toposort>=1.5",
]

[project.optional-dependencies]
mcp = [
    "mcp",
]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.0",
    "mypy>=1.0",
    "django-stubs>=4.0",
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.0",
]

[project.urls]
Homepage = "https://github.com/mammhoud/django-rseal"
Repository = "https://github.com/mammhoud/django-rseal.git"
Documentation = "https://github.com/mammhoud/django-rseal#readme"
Issues = "https://github.com/mammhoud/django-rseal/issues"

[tool.uv.sources]
django-osoul = { git = "https://github.com/mammhoud/django-osoul", branch = "generic" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
