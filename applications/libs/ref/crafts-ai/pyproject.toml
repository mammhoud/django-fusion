[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nawaai"
version = "0.2.0"
description = "Standalone AI/MCP toolkit — no Django required"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mahmoud", email = "mahmoud@example.com"}
]
keywords = ["ai", "mcp", "chat", "orchestrator", "seeder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "hypothesis>=6.151.6",
]

[project.optional-dependencies]
faker = ["Faker>=0.7.7"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.3"]
mcp = ["mcp"]
rasa = ["requests>=2.28"]
rseal = ["django-rseal"]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.151.6",
    "Faker>=0.7.7",
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.0",
]

[project.scripts]
craftsai = "crafts_ai.orchestrator.cli:main"

[project.urls]
Homepage = "https://github.com/mammhoud/crafts-ai"
Repository = "https://github.com/mammhoud/crafts-ai.git"
Documentation = "https://github.com/mammhoud/crafts-ai#readme"
Issues = "https://github.com/mammhoud/crafts-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["crafts_ai"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
