[project]
name = "ceptor-ai"
version = "0.1.0"
description = "Standalone AI/MCP and Django customizer toolkit for the structa.cloud monorepo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "django-mcp-server>=0.1.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
mcp = ["fastapi>=0.110"]
test = ["pytest", "hypothesis>=6.0"]


[project.scripts] 
ceptor-ai = "ceptor_ai.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"], include = ["ceptor_ai*"]}}
include-package-data = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
