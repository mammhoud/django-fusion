{% if page_obj and paginator and paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <button class="pagination__btn pagination__btn--prev"
            hx-get="{{ url }}?page={{ page_obj.previous_page_number }}"
            hx-target="closest [data-fragment]"
            hx-swap="innerHTML"
            aria-label="Previous page">
      &laquo; Previous
    </button>
  {% endif %}

  <span class="pagination__info">
    Page {{ page_obj.number }} of {{ paginator.num_pages }}
  </span>

  {% if page_obj.has_next %}
    <button class="pagination__btn pagination__btn--next"
            hx-get="{{ url }}?page={{ page_obj.next_page_number }}"
            hx-target="closest [data-fragment]"
            hx-swap="innerHTML"
            aria-label="Next page">
      Next &raquo;
    </button>
  {% endif %}
</nav>
{% endif %}
