{% if breadcrumbs %}
<nav aria-label="Breadcrumb" class="breadcrumbs">
  <ol class="breadcrumbs__list" itemscope itemtype="https://schema.org/BreadcrumbList">
    {% for crumb in breadcrumbs %}
      <li class="breadcrumbs__item{% if forloop.last %} breadcrumbs__item--active{% endif %}"
          itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        {% if forloop.last %}
          <span class="breadcrumbs__current" itemprop="name" aria-current="page">
            {{ crumb.title }}
          </span>
        {% else %}
          <a class="breadcrumbs__link" href="{{ crumb.url }}" itemprop="item">
            <span itemprop="name">{{ crumb.title }}</span>
          </a>
          <span class="breadcrumbs__separator" aria-hidden="true">/</span>
        {% endif %}
        <meta itemprop="position" content="{{ forloop.counter }}" />
      </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
