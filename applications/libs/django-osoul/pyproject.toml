[project]
name = "django-osoul"
version = "0.1.0"
description = "Reusable Django and Wagtail helpers for Structa Cloud sites"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "wagtail",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_osoul"]

[tool.pytest.ini_options]
addopts = ["-v"]
testpaths = ["tests"]
pythonpath = ["src"]
