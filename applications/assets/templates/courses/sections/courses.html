<!-- Course Catalog Section — BEM -->

    <div class="container">
        <!-- Controls: search, sort, and view toggle -->
        <div class="rbt-course-catalog__header">
            <div class="rbt-course-catalog__controls">
                {% include "courses/sections/search.html" %}
                {% include "courses/partials/view_toggle.html" %}

        <!-- Grid View (default) -->
        {% include "courses/sections/grid.html" %}

        {% include "courses/sections/list.html" %}
    </div>
</div>
