{% load i18n %}
{# Load More pagination component — uses HTMX to append next page #}
{% if page_obj and page_obj.has_next %}
<div class="pagination-load-more text-center mt-4">
    <button class="btn btn-outline-primary"
            hx-get="?page={{ page_obj.next_page_number }}"
            hx-target="#product-grid"
            hx-swap="beforeend"
            hx-indicator="#load-more-spinner">
        <span id="load-more-spinner" class="htmx-indicator spinner-border spinner-border-sm me-2" role="status"></span>
        {% trans "Load More" %}
    </button>
</div>
{% endif %}
