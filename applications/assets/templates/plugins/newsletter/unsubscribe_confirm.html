{% extends "base_page.html" %}
{% load static i18n %}

{% block content %}
<section class="newsletter-unsubscribe py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card">
                    <div class="card-body py-5">
                        <i class="fas fa-question-circle fa-4x text-warning mb-4"></i>
                        <h2 class="card-title">{% trans "Unsubscribe from Newsletter?" %}</h2>
                        <p class="text-muted">
                            {% trans "Are you sure you want to unsubscribe" %}
                            <strong>{{ subscriber.email }}</strong>
                            {% trans "from our newsletter?" %}
                        </p>
                        
                        <form method="post" class="mt-4">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">
                                {% trans "Yes, Unsubscribe Me" %}
                            </button>
                            <a href="/" class="btn btn-outline-secondary ms-2">
                                {% trans "Cancel" %}
                            </a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
