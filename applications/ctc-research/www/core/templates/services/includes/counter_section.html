{% load i18n %}
{# Counter/stats section block #}
<section class="counter-section py-5 bg-primary text-white">
    <div class="container">
        <div class="row g-4 text-center">
            {% for counter in block.value.counters %}
            <div class="col-6 col-md-3">
                <div class="counter-item">
                    <div class="counter-item__number display-4 fw-bold">{{ counter.number }}</div>
                    <div class="counter-item__label">{{ counter.label }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
