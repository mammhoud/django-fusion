# ============================================================
# CTC Research Website + Worker
# ============================================================
services:
  ctc-research-website:
    build:
      context: ../..
      dockerfile: compose/Dockerfile
      args:
        PROJECT_PATH: ctc-research
    image: ctc-research-website:latest
    container_name: ctc-research-website
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: ../../.env
        required: false
    environment:
      RUNNING_ENV: docker
      APP_MODULE: ${APP_MODULE:-server:application}
      SERVER_TYPE: ${SERVER_TYPE:-gunicorn}
      SERVER_ENV: ${SERVER_ENV:-production}
      DEBUG: ${DEBUG:-False}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-configs.settings}
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/2
      LOG_DIR: /app/logs
      USE_X_FORWARDED_HOST: "true"
      SECURE_PROXY_SSL_HEADER: HTTP_X_FORWARDED_PROTO,https
      WEBSITE: ctc-research
      DJANGO_SITE: ctc-research
      DJANGO_WEBSITE: ctc-research
      PROJECT_PATH: ctc-research
      WEBSITE_HOST: ${CTC_RESEARCH_HOST:-ctc-research.com}
      ALLOWED_HOSTS: ctc-research.com,www.ctc-research.com,arch.ctc-research.com,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://ctc-research.com,https://www.structa.cloud,https://www.ctc-research.com,https://arch.ctc-research.com
      DB_NAME: ${DB_NAME_CTC:-db_ctc}
      PORT: "5070"
      CELERY_TASK_DEFAULT_QUEUE: ctc-research
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5070/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ../../configs:/app/configs:z
      - ../../assets:/app/assets:z
      - ../../ctc-research:/app/ctc-research:z
      - ctc-research-static:/app/ctc-research/static:rw
      - ctc-research-media:/app/ctc-research/media:rw
      - ../../logs:/app/logs:z
    expose:
      - "5070"
    networks:
      - common
      - warehouse-net

  ctc-worker:
    build:
      context: ../..
      dockerfile: compose/Dockerfile
      args:
        PROJECT_PATH: ctc-research
    image: ctc-worker:latest
    container_name: ctc-worker
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: ../../.env
        required: false
    environment:
      # Full environment block (same as web, minus PORT and healthcheck specific vars)
      RUNNING_ENV: docker
      SERVER_TYPE: ${SERVER_TYPE:-gunicorn}
      SERVER_ENV: ${SERVER_ENV:-production}
      DEBUG: ${DEBUG:-False}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-configs.settings}
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/2
      LOG_DIR: /app/logs
      USE_X_FORWARDED_HOST: "true"
      SECURE_PROXY_SSL_HEADER: HTTP_X_FORWARDED_PROTO,https
      WEBSITE: ctc-research
      DJANGO_SITE: ctc-research
      DJANGO_WEBSITE: ctc-research
      PROJECT_PATH: ctc-research
      WEBSITE_HOST: ${CTC_RESEARCH_HOST:-ctc-research.com}
      DB_NAME: ${DB_NAME_CTC:-db_ctc}
      CELERY_TASK_DEFAULT_QUEUE: ctc-research
    command: celery -A tasks.celery:app worker --loglevel=info --queues=ctc-research
    volumes:
      - ../../configs:/app/configs:z
      - ../../assets:/app/assets:z
      - ../../ctc-research:/app/ctc-research:z
      - ../../logs:/app/logs:z
    networks:
      - common
      - warehouse-net

networks:
  common:
    external: true
  warehouse-net:
    external: true

volumes:
  ctc-research-static:
    external: true
  ctc-research-media:
    external: true
