{% load i18n static %}

<section class="fragment--form">
  <section class="auth__card card card--form text-center">
    <div class="auth__logo mb-4"><a href="/"><img src="{% static 'images/logo.png' %}" style="max-height:60px" alt="Logo"></a></div>
    <h2 class="auth__form-title">{% trans "Check Your Email" %}</h2>
    <div class="alert alert-success">{% trans "We've sent a password reset link to your email address." %}</div>
    <p class="small text-muted">{% trans "Didn't receive it? Check your spam folder." %}</p>
    <a href="{% url 'account_login' %}" class="btn btn-primary" hx-get="{% url 'account_login' %}" hx-target=".fragment--form" hx-swap="innerHTML">{% trans "Back to Login" %}</a>
  </section>
</section>
