{% load i18n static %}

<section class="fragment--form">
  <section class="auth__card card card--form">
    <header class="auth__form-header text-center">
      <h2 class="auth__form-title">{% trans "Request Login Code" %}</h2>
      <p>{% trans "Enter your email or phone to receive a login code." %}</p>
    </header>
    <form method="post" action="{% url 'account_request_login_code' %}" hx-post="{% url 'account_request_login_code' %}" hx-target=".fragment--form" hx-swap="innerHTML">
      {% csrf_token %}
      <div class="form__group mb-4"><label for="id_login">{% trans "Email or phone" %}</label><input id="id_login" name="login" type="text" class="form-control" required></div>
      <button class="btn btn-gradient w-100" type="submit">{% trans "Send Code" %}</button>
    </form>
  </section>
</section>
