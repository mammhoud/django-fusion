{% load i18n static %}

<section class="fragment--form">
  <section class="auth__card card card--form">
    <header class="auth__form-header text-center">
      <div class="auth__logo mb-4"><a href="/"><img src="{% static 'images/logo.png' %}" style="max-height:60px" alt="Logo"></a></div>
      <h2 class="auth__form-title">{% trans "Forgot Password?" %}</h2>
      <p class="auth__form-subtitle text-muted mb-4">{% trans "Enter your email and we'll send you a reset link" %}</p>
    </header>
    {% include "account/snippets/messages.html" %}
    <form method="post" action="{% url 'account_reset_password' %}" hx-post="{% url 'account_reset_password' %}" hx-target=".fragment--form" hx-swap="innerHTML" hx-indicator="#reset-spinner">
      {% csrf_token %}
      <div class="form__group mb-4"><label for="id_email">{% trans "Email" %}</label><input id="id_email" name="email" type="email" class="form-control" required></div>
      <div class="d-grid"><button class="btn btn-gradient hover-icon-reverse radius-round w-100 py-2" type="submit"><span class="icon-reverse-wrapper"><span class="btn-text">{% trans "Send Reset Link" %}</span><span class="btn-icon"><i class="fas fa-paper-plane"></i></span><span class="btn-icon"><i class="fas fa-paper-plane"></i></span></span><span id="reset-spinner" class="spinner-border spinner-border-sm ms-2 htmx-indicator" style="display:none"></span></button></div>
    </form>
    <footer class="auth__footer mt-3 text-center"><a href="{% url 'account_login' %}" hx-get="{% url 'account_login' %}" hx-target=".fragment--form" hx-swap="innerHTML">{% trans "Back to Login" %}</a></footer>
  </section>
</section>
