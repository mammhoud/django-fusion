<!-- page title area start -->
<section class="page__title p-relative pt-200 pb-200" data-background="{{ page.page_title_background.url }}">
    <div class="container">
        <div class="row">
            <div class="col-xl-12 col-lg-12 col-md-12">
                <div class="page__title-inner text-center">
                    <div class="page__title-breadcrumb">                                 
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="/">{{ page.breadcrumb_home_text }}</a></li>
                                <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
                            </ol>
                        </nav>
                    </div>
                    <h1>{{ page.page_title }}</h1>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- page title area end -->
