{% load static i18n wagtailcore_tags components %}
{% prop block %}

<section class="contact__map-area">
    <div class="container-fluid p-0">
        <div class="row gx-0">
            <div class="col-xl-12">
                <div class="contact__map">
                    <iframe src="{{ block.value.map_embed_url }}"
                            style="width: 100%; height: {{ block.value.map_height|default:'500px' }}; border: 0;"
                            allowfullscreen="" loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</section>
