{% load i18n %}
<div class="card h-100 shadow-sm">
    <div class="card-header bg-transparent border-bottom-0">
        <h5 class="card-title mb-0">
            <svg class="icon icon-chart-line" aria-hidden="true" width="20" height="20">
                <use href="#icon-chart-line"></use>
            </svg>
            {% trans "Quick Stats" %}
        </h5>
    </div>
    <div class="card-body pt-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">{% trans "People" %}</span>
            <span class="h5 mb-0">{{ total_people }}</span>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">{% trans "Newsletters" %}</span>
            <span class="h5 mb-0">{{ total_newsletters }}</span>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <span class="text-muted">{% trans "Recent pages" %}</span>
            <span class="h5 mb-0">{{ recent_pages|length }}</span>
        </div>
    </div>
</div>
