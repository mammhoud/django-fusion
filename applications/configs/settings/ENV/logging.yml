default:
  # ====================================
  # 📝 Logging Configuration
  # ====================================

  # Defaults for all environments
  LOGGING:
    LOG_LEVEL: "INFO"
    LOG_FORMAT: "verbose"
    LOG_TO_CONSOLE: true
    LOG_TO_FILE: true
    LOG_TO_SENTRY: false

    # Log rotation
    MAX_LOG_SIZE: 10485760  # 10 MB
    BACKUP_COUNT: 5
    COMPRESS_LOGS: false

    # Structured logging
    STRUCTURED_LOGGING: true
    INCLUDE_CONTEXT: true
    INCLUDE_TRACE_ID: true

    # Performance logging
    LOG_SLOW_REQUESTS: false
    SLOW_REQUEST_THRESHOLD: 1000
    LOG_SQL_QUERIES: false
    SQL_QUERY_THRESHOLD: 100

  # Site-specific log directories
  # Each site writes to its own directory under LOG_ROOT
  LOG_DIR_PER_SITE: true
  LOG_FILE: "application.log"
  ERROR_LOG_FILE: "error.log"
  DEBUG_LOG_FILE: "debug.log"
