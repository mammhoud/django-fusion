# ============================================================
# Website Applications Orchestration
# ============================================================
# This file defines the three main website services for the
# Coolify infrastructure: ctc-research, lms-demo, and VResume.
#
# These services integrate with the shared coolify infrastructure:
#   - PostgreSQL database (coolify-db)
#   - Redis cache (coolify-redis)
#   - Traefik reverse proxy (traefik-net)
#   - Shared infrastructure networks (coolify, utilities-net, warehouse-net)
#
# Include this file with:
#   docker compose -f ../source/docker-compose.yml \
#                  -f ../source/docker-compose.prod.yml \
#                  -f ../source/docker-compose.custom.yml \
#                  -f docker-compose.applications.yml
# ============================================================

networks:
  traefik-net:
    name: traefik-net
    external: true
  coolify:
    name: coolify
    external: true
  internal:
    name: coolify-internal
    external: true
  utilities-net:
    name: utilities-net
    external: true
  warehouse-net:
    name: warehouse-net
    external: true

volumes:
  # Shared application data volumes
  ctc-research-static:
    name: ctc-research-static
  ctc-research-media:
    name: ctc-research-media
  lms-demo-static:
    name: lms-demo-static
  lms-demo-media:
    name: lms-demo-media
  vresume-static:
    name: vresume-static
  vresume-media:
    name: vresume-media

# ============================================================
# Base Configuration for Website Services
# ============================================================
x-website-base: &website-base
  build:
    context: .
    dockerfile: ../compose/django/Dockerfile
  restart: unless-stopped
  working_dir: /app
  env_file:
    - path: .env
      required: false
  labels:
    # Traefik configuration for each site
    traefik.enable: "true"
    traefik.http.routers.${WEBSITE}.entrypoints: "web,websecure"
    traefik.http.routers.${WEBSITE}.rule: "Host(`${WEBSITE_HOST}`)"
    traefik.http.routers.${WEBSITE}.service: "${WEBSITE}-service"
    traefik.http.services.${WEBSITE}-service.loadbalancer.server.port: "8000"
    traefik.http.services.${WEBSITE}-service.loadbalancer.healthcheck.path: "/health/"
    traefik.http.services.${WEBSITE}-service.loadbalancer.healthcheck.interval: "30s"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  environment: &website-env
    RUNNING_ENV: docker
    SERVER_TYPE: ${SERVER_TYPE:-gunicorn}
    SERVER_ENV: ${SERVER_ENV:-production}
    DEBUG: ${DEBUG:-False}
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-settings}
    DJANGO_SITE: ${DJANGO_SITE:-${WEBSITE}}
    DJANGO_WEBSITE: ${DJANGO_WEBSITE:-${WEBSITE}}
    WEBSITE: ${WEBSITE}
    WEBSITE_HOST: ${WEBSITE_HOST}
    # Database configuration - using coolify PostgreSQL
    DB_TYPE: ${DB_TYPE:-postgres}
    DB_HOST: ${DB_HOST:-coolify-db}
    DB_PORT: ${DB_PORT:-5432}
    DB_NAME: ${DB_NAME:-db_${WEBSITE}}
    DB_USER: ${DB_USER:-coolify}
    DB_PASSWORD: ${DB_PASSWORD:-coolify_password}
    # Cache configuration - using coolify Redis
    REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@coolify-redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@coolify-redis:6379/1
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password}@coolify-redis:6379/2
    # Celery configuration
    CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-${WEBSITE}}
    LOG_DIR: /app/logs
    # Additional settings
    ALLOWED_HOSTS: ${WEBSITE_HOST},localhost,127.0.0.1
  volumes:
    - ./configs:/app/configs:z
    - ./assets:/app/assets:z
    - ./logs:/app/logs:z
  networks:
    - traefik-net
    - coolify
    - internal
    - utilities-net
    - warehouse-net
  depends_on:
    coolify-db:
      condition: service_healthy
    coolify-redis:
      condition: service_healthy

# ============================================================
# Website Services
# ============================================================
services:
  # ─────────────────────────────────────────────────────────
  # CTC Research Website
  # ─────────────────────────────────────────────────────────
  ctc-research-web:
    <<: *website-base
    container_name: ctc-research-web
    environment:
      <<: *website-env
      WEBSITE: ctc-research
      WEBSITE_HOST: ${CTC_RESEARCH_HOST:-ctc-research.local}
      DB_NAME: ${DB_NAME:-db_ctc_research}
      CELERY_TASK_DEFAULT_QUEUE: ctc-research
    volumes:
      - ./configs:/app/configs:z
      - ./assets:/app/assets:z
      - ./ctc-research:/app/ctc-research:z
      - ctc-research-static:/app/ctc-research/static:rw
      - ctc-research-media:/app/ctc-research/media:rw
      - ./logs:/app/logs:z
    ports:
      - "${CTC_RESEARCH_PORT:-8001}:8000"
    expose:
      - "8000"

  # ─────────────────────────────────────────────────────────
  # LMS Demo Website
  # ─────────────────────────────────────────────────────────
  lms-demo-web:
    <<: *website-base
    container_name: lms-demo-web
    environment:
      <<: *website-env
      WEBSITE: lms-demo
      WEBSITE_HOST: ${LMS_DEMO_HOST:-lms-demo.local}
      DB_NAME: ${DB_NAME:-db_lms_demo}
      CELERY_TASK_DEFAULT_QUEUE: lms-demo
    volumes:
      - ./configs:/app/configs:z
      - ./assets:/app/assets:z
      - ./lms-demo:/app/lms-demo:z
      - lms-demo-static:/app/lms-demo/static:rw
      - lms-demo-media:/app/lms-demo/media:rw
      - ./logs:/app/logs:z
    ports:
      - "${LMS_DEMO_PORT:-8002}:8000"
    expose:
      - "8000"

  # ─────────────────────────────────────────────────────────
  # VResume Website
  # ─────────────────────────────────────────────────────────
  vresume-web:
    <<: *website-base
    container_name: vresume-web
    environment:
      <<: *website-env
      WEBSITE: vresume
      WEBSITE_HOST: ${VRESUME_HOST:-vresume.local}
      DB_NAME: ${DB_NAME:-db_vresume}
      CELERY_TASK_DEFAULT_QUEUE: vresume
    volumes:
      - ./configs:/app/configs:z
      - ./assets:/app/assets:z
      - ./VResume:/app/VResume:z
      - vresume-static:/app/VResume/static:rw
      - vresume-media:/app/VResume/media:rw
      - ./logs:/app/logs:z
    ports:
      - "${VRESUME_PORT:-8003}:8000"
    expose:
      - "8000"
