[project]
name = "websites-workspace"
version = "1.0.3"
description = "Shared Django workspace for Structa Cloud and CTC Research websites"
requires-python = ">=3.11"
dependencies = [
    # Core
    "click",
    "colorlog",
    "fire",
    "django>=4.2",
    "twilio>=9.0",
    # Auth & accounts
    "django-allauth[socialaccount]",
    # UI & templates
    "django-bird",
    "django-colorfield",
    "django-crispy-forms",
    "django-heroicons",
    "django-htmx",
    "django-unfold",
    # Dev tools
    "bumpver",
    "django-debug-toolbar",
    "django-extensions",
    "django-silk",
    "django-stubs",
    # Data & forms
    "django-embed-video",
    "django-import-export",
    "django-simple-history",
    "django-tables2",
    "django-webpack-loader",
    # API
    "django-ninja",
    "ninja",
    # Payments
    "django-paypal",
    "stripe",
    # Cache & queue
    "django-redis",
    "django-rq",
    "celery[redis]",
    "django-celery-beat",
    "django-celery-results",
    # Storage & media
    "django-storages[boto3]",
    # Config & env
    "django-environ",
    "dynaconf[vault]",
    "environ",
    # Logging & monitoring
    "django-structlog",
    "python-json-logger",
    "structlog",
    "sentry-sdk[django]",
    # Wagtail CMS
    "wagtail",
    "wagtail-font-awesome-svg",
    "wagtail-newsletter[mailchimp]",
    "wagtail-transfer",
    "wagtailfontawesome",
    # Server
    "gunicorn",
    "uvicorn",
    "watchfiles",
    "whitenoise",
    # DB
    "psycopg",
    "psycopg-binary",
    # Utilities and tests
    "draftjs-exporter",
    "fido2",
    "hypothesis",
    "jinja2",
    "jwt",
    "livereload",
    "marshmallow",
    "pydantic",
    "pydantic-settings",
    "pytest",
    "pytest-django",
    "virtualenv",
    # Internal libs (sourced from GitHub — see [tool.uv.sources])
    "django-grep",
    "django-osoul",
    "django-rseal",
    "ollama>=0.6.2",
]

[project.optional-dependencies]
test = ["pytest", "pytest-django", "hypothesis"]
dev = ["bumpver", "django-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["configs", "tasks"]

# GitHub sources for internal libs — used by all websites.
# Pin to the 'generic' branch; uv resolves the exact commit at lock/sync time.
[tool.uv.sources]
django-osoul = { git = "https://github.com/mammhoud/django-osoul", branch = "generic" }
django-rseal = { git = "https://github.com/mammhoud/django-rseal", branch = "generic" }
django-grep  = { git = "https://github.com/mammhoud/django-grep",  branch = "generic" }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["--strict-markers", "--strict-config", "-v", "--tb=short", "--no-header", "--import-mode=importlib"]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
    "unit: unit tests",
    "django_db: enable database access for tests",
]

[tool.bumpver]
current_version = "1.0.3"
version_pattern = "MAJOR.MINOR.PATCH[-TAG]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['version = "{version}"']
"__about__.py"   = ['^__version__ = "{version}"']
