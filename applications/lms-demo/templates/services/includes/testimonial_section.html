{% load i18n %}
{# Testimonials section block #}
<section class="testimonial-section py-5 bg-light">
    <div class="container">
        <div class="row g-4">
            {% for testimonial in block.value.testimonials %}
            <div class="col-md-6 col-lg-4">
                <div class="testimonial-card h-100 p-4 bg-white rounded shadow-sm">
                    <blockquote class="mb-3">
                        <p class="fst-italic">"{{ testimonial.quote }}"</p>
                    </blockquote>
                    <footer class="d-flex align-items-center gap-2">
                        <div>
                            <strong>{{ testimonial.author }}</strong>
                            {% if testimonial.role %}
                            <small class="d-block text-muted">{{ testimonial.role }}</small>
                            {% endif %}
                        </div>
                    </footer>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
