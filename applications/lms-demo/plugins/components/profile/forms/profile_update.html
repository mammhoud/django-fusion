{% load i18n %}

<form id="profile-update-form" method="post" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  {% if form.errors %}
    <div class="alert alert-danger">
      {% for field in form %}
        {% for error in field.errors %}
          <p>{{ error }}</p>
        {% endfor %}
      {% endfor %}
    </div>
  {% endif %}

  <div class="form-group">
    <input id="name" name="name" type="text" value="{{ user.name }}" required />
    <label for="name">{% trans "Full Name" %}</label>
    <span class="focus-border"></span>
  </div>

  <div class="form-group">
    <input id="email" name="email" type="email" value="{{ user.email }}" required />
    <label for="email">{% trans "Email Address" %}</label>
    <span class="focus-border"></span>
  </div>

  <div class="form-group">
    <input id="username" name="username" type="text" value="{{ user.username }}" required />
    <label for="username">{% trans "Username" %}</label>
    <span class="focus-border"></span>
  </div>

  <div class="form-group">
    <input id="avatar" name="avatar" type="file" accept="image/*" />
    <label for="avatar">{% trans "Profile Picture" %}</label>
    <span class="focus-border"></span>
  </div>

  <div class="form-group">
    <textarea id="bio" name="bio" rows="4">{{ user.profile.bio }}</textarea>
    <label for="bio">{% trans "About You (Bio)" %}</label>
    <span class="focus-border"></span>
  </div>

  <div class="form-submit-group">
    <button type="submit" class="btn btn-md btn-gradient hover-icon-reverse radius-round w-100">
      <span class="icon-reverse-wrapper">
        <span class="btn-text">{% trans "Update Profile" %}</span>
        <span class="btn-icon"><i class="feather-save"></i></span>
        <span class="btn-icon"><i class="feather-save"></i></span>
      </span>
    </button>
  </div>
</form>
