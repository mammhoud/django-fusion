# =============================================================================
# Legacy Blinko host — blinko.structa.cloud → space.structa.cloud
# =============================================================================
# The former Blinko note-taking service was replaced by AFFiNE. This router
# keeps blinko.localhost / blinko.structa.cloud served by the shared-media
# nginx, which responds with a 301 to space.structa.cloud / space.localhost (see
# applications/proxy/nginx/default.conf.template). Keeping the router means the
# existing Let's Encrypt cert for blinko.structa.cloud keeps serving the
# redirect until it is dropped entirely.
# =============================================================================
http:
  routers:
    blinko-http:
      rule: 'Host(`blinko.localhost`) || Host(`blinko.structa.cloud`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: blinko-service
      priority: 150

    blinko-https:
      rule: 'Host(`blinko.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [compress]
      service: blinko-service
      tls:
        certResolver: letsencrypt-http
      priority: 150

    blinko-localhost-https:
      rule: 'Host(`blinko.localhost`)'
      entryPoints: [web-secure]
      middlewares: [compress]
      service: blinko-service
      priority: 150

  services:
    blinko-service:
      loadBalancer:
        servers:
          - url: 'http://shared-media:80'
        passHostHeader: true
