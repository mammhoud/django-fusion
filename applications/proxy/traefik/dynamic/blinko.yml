# =============================================================================
# Blinko → FileGator redirect
# =============================================================================
# Blinko was replaced by FileGator (2026-08): no Blinko container or route
# remains, so blinko.structa.cloud / blinko.localhost previously fell through
# to the catch-all (404). These routers redirect both hosts to the canonical
# FileGator host so old bookmarks resolve cleanly instead of erroring.
#
# Each router still declares `noop@internal` — Traefik requires a service even
# when a redirect middleware answers the request (see catchall.yml).
# =============================================================================
http:
  middlewares:
    blinko-to-filegator:
      redirectRegex:
        regex: '^https://blinko\.(?:structa\.cloud|localhost)(.*)'
        replacement: 'https://filegator.structa.cloud${1}'
        permanent: true

  routers:
    blinko-http:
      rule: 'Host(`blinko.structa.cloud`) || Host(`blinko.localhost`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: noop@internal
      priority: 200

    blinko-https:
      rule: 'Host(`blinko.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [blinko-to-filegator]
      service: noop@internal
      tls:
        certResolver: letsencrypt-http
      priority: 200

    blinko-localhost-https:
      rule: 'Host(`blinko.localhost`)'
      entryPoints: [web-secure]
      middlewares: [blinko-to-filegator]
      service: noop@internal
      priority: 200
