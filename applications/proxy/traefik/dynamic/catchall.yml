# =============================================================================
# Catch-all — Traefik router config  [INFRASTRUCTURE]
# =============================================================================
# Lowest-priority (1) router that catches any unmatched host.
# Redirects HTTP → HTTPS, serves a silent noop response on HTTPS.
# Always active — required for safe default handling of unknown hosts.
# =============================================================================

http:
  routers:
    catchall-http:
      rule: HostRegexp(`{host:.+}`)
      entryPoints:
      - web
      priority: 1
      middlewares:
      - redirect-to-https
      service: noop@internal
    catchall-https:
      rule: HostRegexp(`{host:.+}`)
      entryPoints:
      - web-secure
      priority: 1
      service: noop@internal
