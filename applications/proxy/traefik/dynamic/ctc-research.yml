# =============================================================================
# CTC Research — Precis dual-host routing
# =============================================================================
# Precis remains available on its local lms-fusion ports/hostnames while this
# file exposes the same frontend and backend for ctc-research.com.
# =============================================================================

http:
  routers:
    ctc-site-http:
      rule: 'Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: ctc-frontend-service
      priority: 10
    ctc-site-https:
      rule: 'Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)'
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: ctc-frontend-service
      priority: 10
      tls:
        certResolver: letsencrypt-http
    ctc-api:
      rule: '(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/api`) || PathPrefix(`/apis/`) || PathPrefix(`/fragment/`))'
      entryPoints: [web, web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: ctc-backend-service
      priority: 100
    ctc-media:
      rule: '(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`) || PathPrefix(`/sites/`))'
      entryPoints: [web, web-secure]
      middlewares: [compress, security-headers]
      service: ctc-media-service
      priority: 110

  services:
    ctc-frontend-service:
      loadBalancer:
        servers:
          - url: 'http://lms-fusion-frontend:3002'
        healthCheck:
          path: /
          interval: 30s
          timeout: 10s
    ctc-backend-service:
      loadBalancer:
        servers:
          - url: 'http://lms-fusion-backend:5074'
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
    ctc-media-service:
      loadBalancer:
        servers:
          - url: 'http://shared-media:80'
