# =============================================================================
# Structa Cloud (core) — Traefik router config  [DORMANT]
# =============================================================================
# Container "lms-web" is NOT currently running.
# Route core.structa.cloud → no backend available.
# This was the original structa.cloud site — now replaced by landing-fusion.yml
# which serves structa.cloud and www.structa.cloud via landing-fusion-backend.
# To activate: deploy the LMS compose stack.
# =============================================================================

http:
  routers:
    structa-core-http:
      rule: 'Host(`core.structa.cloud`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: structa-core-service
      priority: 10
    structa-core-https:
      rule: 'Host(`core.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: structa-core-service
      priority: 10
      tls:
        certResolver: letsencrypt-http
    structa-media-http:
      rule: 'Host(`core.structa.cloud`) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))'
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: structa-media-service
      priority: 100
    structa-media-https:
      rule: 'Host(`core.structa.cloud`) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))'
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: structa-media-service
      priority: 100
      tls:
        certResolver: letsencrypt-http
  services:
    structa-core-service:
      loadBalancer:
        servers:
          - url: 'http://lms-web:5071'
        healthCheck:
          path: /health/
          hostname: core.structa.cloud
          interval: 30s
          timeout: 10s
    structa-media-service:
      loadBalancer:
        servers:
          - url: 'http://shared-proxy:80'
