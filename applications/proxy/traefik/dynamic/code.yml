# =============================================================================
# Code host aliases — authenticated Coder entrypoint
# =============================================================================
# code-server is an authenticated Coder app, not a standalone public service.
# These aliases redirect to the Coder control plane instead of exposing a
# workspace container without an owner/workspace context.
#
# Public code.structa.cloud requires an external DNS record pointing to this
# proxy before Let's Encrypt can issue its certificate.
# =============================================================================
http:
  routers:
    code-http:
      rule: 'Host(`code.localhost`) || Host(`code.structa.cloud`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: noop@internal
      priority: 170

    code-https:
      rule: 'Host(`code.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [redirect-code-public]
      service: noop@internal
      tls:
        certResolver: letsencrypt-http
      priority: 170

    code-localhost-https:
      rule: 'Host(`code.localhost`)'
      entryPoints: [web-secure]
      middlewares: [redirect-code-local]
      service: noop@internal
      priority: 170
