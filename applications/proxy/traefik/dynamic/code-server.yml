# =============================================================================
# code-server — per-workspace IDE (port 8086)
# =============================================================================
# Routes code.localhost / code.structa.cloud / ws.structa.cloud to the
# shared-media nginx, which proxies to the workspace container
# coder-dev-code-server:8086 with WebSocket upgrade support (see
# applications/proxy/nginx/default.conf).
#
# Public hosts use Let's Encrypt; the .localhost host stays on the mkcert
# default cert. They are split because a single certResolver router bundling
# a .localhost SAN fails ACME (".localhost" is not a public suffix), which
# would block issuance for the public domains too.
# =============================================================================
http:
  routers:
    code-server-http:
      rule: 'Host(`code.localhost`) || Host(`code.structa.cloud`) || Host(`ws.structa.cloud`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: code-server-service
      priority: 150

    code-server-https:
      rule: 'Host(`code.structa.cloud`) || Host(`ws.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [compress]
      service: code-server-service
      tls:
        certResolver: letsencrypt-http
      priority: 150

    code-server-localhost-https:
      rule: 'Host(`code.localhost`)'
      entryPoints: [web-secure]
      middlewares: [compress]
      service: code-server-service
      priority: 150

  services:
    code-server-service:
      loadBalancer:
        servers:
          - url: 'http://shared-media:80'
        passHostHeader: true
