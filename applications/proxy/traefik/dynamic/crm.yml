# =============================================================================
# Loop-CRM — active CRM subdomain routing
# =============================================================================
# Frontend serves the Astro overview shell. Django owns authenticated account,
# API, HTMX, and domain screens so CRM/marketing/finance mutations remain real.
# Requires DNS A/AAAA records for crm.structa.cloud and www.crm.structa.cloud.
# =============================================================================

http:
  routers:
    loop-crm-backend-http:
      rule: '(Host(`crm.structa.cloud`) || Host(`www.crm.structa.cloud`)) && (PathPrefix(`/api`) || PathPrefix(`/bolt`) || PathPrefix(`/accounts`) || PathPrefix(`/account`) || PathPrefix(`/admin`) || PathPrefix(`/fragments`) || PathPrefix(`/fragment`) || PathPrefix(`/crm`) || PathPrefix(`/marketing`) || PathPrefix(`/attribution`) || PathPrefix(`/finance`) || PathPrefix(`/settings`) || PathPrefix(`/static`) || PathPrefix(`/media`))'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: loop-crm-backend
      priority: 200
    loop-crm-backend-https:
      rule: '(Host(`crm.structa.cloud`) || Host(`www.crm.structa.cloud`)) && (PathPrefix(`/api`) || PathPrefix(`/bolt`) || PathPrefix(`/accounts`) || PathPrefix(`/account`) || PathPrefix(`/admin`) || PathPrefix(`/fragments`) || PathPrefix(`/fragment`) || PathPrefix(`/crm`) || PathPrefix(`/marketing`) || PathPrefix(`/attribution`) || PathPrefix(`/finance`) || PathPrefix(`/settings`) || PathPrefix(`/static`) || PathPrefix(`/media`))'
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: loop-crm-backend
      priority: 200
      tls:
        certResolver: letsencrypt-http
    loop-crm-site-http:
      rule: 'Host(`crm.structa.cloud`) || Host(`www.crm.structa.cloud`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: loop-crm-frontend
      priority: 100
    loop-crm-site-https:
      rule: 'Host(`crm.structa.cloud`) || Host(`www.crm.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: loop-crm-frontend
      priority: 100
      tls:
        certResolver: letsencrypt-http

  services:
    loop-crm-backend:
      loadBalancer:
        servers:
          - url: 'http://loop-crm-backend:8074'
        healthCheck:
          path: /
          interval: 15s
          timeout: 8s
    loop-crm-frontend:
      loadBalancer:
        servers:
          - url: 'http://loop-crm-frontend:3000'
        healthCheck:
          path: /__health__
          interval: 15s
          timeout: 8s
