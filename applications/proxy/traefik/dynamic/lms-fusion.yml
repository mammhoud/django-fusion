# =============================================================================
# lms-fusion — Traefik router config  [DORMANT]
# =============================================================================
# Containers "lms-fusion-frontend" and "lms-fusion-backend" NOT currently running.
# Routes lms-fusion.com / www.lms-fusion.com / lms-fusion.localhost
# → no backend available.
# Local development host: lms-fusion.localhost
# To activate: deploy the LMS-Fusion compose stack.
# =============================================================================

http:
  routers:
    lms-fusion-site-http:
      rule: 'Host(`lms-fusion.localhost`) || Host(`lms-fusion.com`) || Host(`www.lms-fusion.com`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: lms-fusion-frontend-service
      priority: 10

    lms-fusion-site-https:
      rule: 'Host(`lms-fusion.localhost`) || Host(`lms-fusion.com`) || Host(`www.lms-fusion.com`)'
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: lms-fusion-frontend-service
      tls:
        certResolver: letsencrypt-http
      priority: 10

    lms-fusion-api:
      rule: '(Host(`lms-fusion.localhost`) || Host(`lms-fusion.com`) || Host(`www.lms-fusion.com`)) && (PathPrefix(`/api`) || PathPrefix(`/apis/`) || PathPrefix(`/fragment/`) || PathPrefix(`/accounts/`) || PathPrefix(`/learning/`) || PathPrefix(`/profile/dashboard/`) || PathPrefix(`/profile/profile/`) || PathPrefix(`/profile/edit/`) || PathPrefix(`/profile/courses/`) || PathPrefix(`/profile/certifications/`) || PathPrefix(`/profile/notes/`) || PathPrefix(`/profile/settings/`) || PathPrefix(`/profile/messages/`) || PathPrefix(`/profile/blog/`))'
      entryPoints: [web, web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: lms-fusion-backend-service
      tls:
        certResolver: letsencrypt-http
      priority: 100

    lms-fusion-media:
      rule: '(Host(`lms-fusion.localhost`) || Host(`lms-fusion.com`) || Host(`www.lms-fusion.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`) || PathPrefix(`/sites/`))'
      entryPoints: [web, web-secure]
      middlewares: [compress, security-headers]
      service: lms-fusion-media-service
      priority: 110

  services:
    lms-fusion-frontend-service:
      loadBalancer:
        servers:
          - url: 'http://lms-fusion-frontend:3002'
        healthCheck:
          path: /
          interval: 30s
          timeout: 10s

    lms-fusion-backend-service:
      loadBalancer:
        servers:
          - url: 'http://lms-fusion-backend:5074'
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s

    lms-fusion-media-service:
      loadBalancer:
        servers:
          - url: 'http://shared-media:80'
