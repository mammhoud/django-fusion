http:
  routers:
    coder-http:
      rule: 'Host(`coder.localhost`) || Host(`coder.structa.cloud`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: coder-service
      priority: 10
    coder-https:
      rule: 'Host(`coder.localhost`) || Host(`coder.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [compress]
      service: coder-service
      priority: 10
  services:
    coder-service:
      loadBalancer:
        servers:
          - url: 'http://coder:7080'
        passHostHeader: true
