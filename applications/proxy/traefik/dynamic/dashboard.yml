# =============================================================================
# Traefik dashboard — router config  [NO DNS]
# =============================================================================
# The dashboard service (api@internal) is always available, but the domain
# traefik.structa.cloud has no public DNS record (NXDOMAIN).
# TLS certResolver removed — uses fallback cert to suppress ACME noise.
# Access via: https://<server-ip>:8080/dashboard/ (if dashboard port exposed).
# To re-enable: add a DNS A record for traefik.structa.cloud → server IP,
# then restore "tls: certResolver: letsencrypt-http".
# =============================================================================

http:
  routers:
    traefik-dashboard:
      rule: Host(`traefik.structa.cloud`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      entryPoints:
      - web-secure
      service: api@internal
      middlewares:
      - basic-auth
