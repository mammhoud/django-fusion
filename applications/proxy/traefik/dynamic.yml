# ============================================
# Traefik Static Configuration (full)
# ============================================

global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO
  format: common

accessLog:
  format: common
  bufferingSize: 100

api:
  dashboard: true
  debug: false
  insecure: false          # dashboard is not exposed by default; use secure entrypoint

ping: {}                   # health check endpoint – exposed on :8080

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: web-secure
          scheme: https
          permanent: true

  web-secure:
    address: ":443"
    http:
      tls: {}

  # Optional UDP entrypoint (if you need explicit UDP routing)
  # web-secure-udp:
  #   address: ":443/udp"

providers:
  file:
    directory: /etc/traefik/dynamic   # correct path for dynamic configs
    watch: true

# ===========================================================================
# ACME / Let's Encrypt — certificate resolver (HTTP-01)
# ===========================================================================
# All sites obtain trusted Let's Encrypt certs via HTTP-01 challenge on port 80.
# Traefik handles auto-renewal natively.
#
# Prerequisites:
#   - applications/proxy/acme/acme.json must exist with mode 0600
#     Run: ./applications/proxy/scripts/manage-certs.sh bootstrap-acme
#   - DNS A records for each domain must point to this server (187.77.166.222)
#   - Port 80 must be reachable from the internet
#
certificatesResolvers:
  letsencrypt-http:
    acme:
      email: structa.cloud@gmail.com
      storage: /etc/traefik/acme/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web
