http:
  routers:
    shared-media-http:
      rule: 'Host(`media.structa.cloud`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: shared-media-service
    shared-media-https:
      rule: 'Host(`media.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: shared-media-service
      tls:
    ctc-media-http:
      rule: 'Host(`media.ctc-research.com`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: ctc-media-service
    ctc-media-https:
      rule: 'Host(`media.ctc-research.com`)'
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: ctc-media-service
      tls:
  services:
    shared-media-service:
      loadBalancer:
        servers:
          - url: 'http://shared-media:80'
    ctc-media-service:
      loadBalancer:
        servers:
          - url: 'http://shared-media:80'
