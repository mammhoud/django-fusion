# Shared-media Nginx, documentation, AFFiNE, and FileGator services.
#
# AFFiNE and FileGator are shared infrastructure. They are intentionally not
# part of a Coder workspace or the repository devcontainer, so restarting or
# deleting a workspace cannot delete the shared services or their data.

networks:
  traefik-net:
    external: true
  common:
    external: true
  warehouse-net:
    external: true

x-media-base: &media-base
  build:
    context: ../..
    dockerfile: applications/proxy/nginx/Dockerfile
  restart: unless-stopped
  networks:
    - traefik-net
    - common
  healthcheck:
    test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && wget -qO- http://127.0.0.1/health/ | grep -qx healthy"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

services:
  shared-media:
    <<: *media-base
    container_name: shared-media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shared-media.rule=Host(`media.structa.cloud`) || Host(`media.ctc-research.com`) || Host(`media.lms.com`) || Host(`media.vresume.structa.cloud`)"
      - "traefik.http.services.shared-media.loadbalancer.server.port=80"
    volumes:
      - ../projects/ctc-research/assets/staticfiles:/var/www/sites/ctc-research/static:ro
      - ../projects/lms/assets/staticfiles:/var/www/sites/lms/static:ro
      - ../projects/portfolio/assets/staticfiles:/var/www/sites/vresume/static:ro
      - lms-fusion-static:/var/www/sites/lms-fusion/static:ro
      - ../projects/assets/static:/var/www/static:ro
      - ../projects/ctc-research/assets/media:/var/www/media/ctc-research:ro
      - ../projects/lms/assets/media:/var/www/media/lms:ro
      - ../projects/portfolio/assets/media:/var/www/media/vresume:ro
      - lms-fusion-media:/var/www/media/lms-fusion:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/www:/var/www/html:ro
    networks:
      - traefik-net
      - common
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  docus:
    build:
      context: ../..
      dockerfile: docs/Dockerfile
    image: structa-docus:latest
    container_name: docus
    restart: unless-stopped
    environment:
      NUXT_APP_BASE_URL: /docs/
      NUXT_SITE_URL: https://docs.structa.cloud
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    networks:
      - traefik-net
      - common
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/docs/en/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  affine-migration:
    image: ghcr.io/toeverything/affine:${AFFINE_VERSION:-stable}
    container_name: proxy-affine-migration
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    volumes:
      - ./affine-data/storage:/root/.affine/storage
      - ./affine-data/config:/root/.affine/config
    environment:
      DATABASE_URL: postgresql://affine:${AFFINE_DB_PASSWORD:?AFFINE_DB_PASSWORD must be set}@postgres:5432/affine
      REDIS_SERVER_HOST: default-redis
      REDIS_SERVER_PORT: "6379"
      REDIS_SERVER_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      AFFINE_INDEXER_ENABLED: "false"
    networks:
      - common
      - warehouse-net
    restart: "no"

  affine:
    image: ghcr.io/toeverything/affine:${AFFINE_VERSION:-stable}
    container_name: proxy-affine
    depends_on:
      affine-migration:
        condition: service_completed_successfully
    volumes:
      - ./affine-data/storage:/root/.affine/storage
      - ./affine-data/config:/root/.affine/config
    environment:
      DATABASE_URL: postgresql://affine:${AFFINE_DB_PASSWORD:?AFFINE_DB_PASSWORD must be set}@postgres:5432/affine
      REDIS_SERVER_HOST: default-redis
      REDIS_SERVER_PORT: "6379"
      REDIS_SERVER_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_SERVER_EXTERNAL_URL:-https://space.structa.cloud}
      AFFINE_SERVER_PORT: "3010"
      AFFINE_INDEXER_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3010/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - common
      - warehouse-net
    restart: unless-stopped

  filegator:
    image: filegator/filegator:latest
    container_name: proxy-filegator
    user: root
    command: ["sh", "-c", "chown -R www-data:www-data /var/www/filegator/private /var/www/filegator/repository && exec apache2-foreground"]
    volumes:
      - ./filegator-data/repository:/var/www/filegator/repository
      - ./filegator-data/private:/var/www/filegator/private
    networks:
      - common
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  lms-fusion-static:
    name: lms-fusion-static
    external: true
  lms-fusion-media:
    name: lms-fusion-media
    external: true
