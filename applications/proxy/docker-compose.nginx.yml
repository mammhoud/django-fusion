# ============================================================
# Workspace Shared Media Frontend (Nginx)
# ============================================================
# Provides static/media server with shared proxy settings

networks:
  traefik-net:
    external: true
  common:
    external: true

x-proxy-common: &proxy-common
  restart: unless-stopped
  networks:
    - traefik-net
    - common
x-media-base: &media-base
  build:
    # Context is the repo root so the shared-media Dockerfile and the Docus
    # service can use one repository-relative Compose boundary.
    context: ../..
    dockerfile: applications/proxy/nginx/Dockerfile
  restart: unless-stopped
  networks:
    - traefik-net
    - common
  # Resolver smoke test: (1) nginx -t syntax check, (2) the variable-upstream
  # resolver directive is ACTIVE in the effective config, (3) a real request
  # through a variable upstream (+ /__resolver_probe__ location) returns 200.
  # All three must pass or the container is unhealthy — catching the "no
  # resolver defined" regression at deploy time (variable upstreams 502 even
  # when the workspace containers are up). NOTE: nginx -T echoes comment
  # lines, so the grep is anchored to the directive start to avoid matching
  # a commented-out resolver.
  healthcheck:
    test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && nginx -T 2>/dev/null | grep -qE '^[[:space:]]*resolver 127[.]0[.]0[.]11' && curl -fsS -o /dev/null http://127.0.0.1/__resolver_probe__ || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    # Probe targets the filegator container, so the resolver path is
    # exercised against a stable in-stack
    # container. start_period gives first-start grace for image pulls.
    start_period: 30s

services:
  shared-media:
    <<: *media-base
    container_name: shared-media


    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shared-media.rule=Host(`media.structa.cloud`) || Host(`media.ctc-research.com`) || Host(`media.lms.com`) || Host(`media.vresume.structa.cloud`)"
      - "traefik.http.services.shared-media.loadbalancer.server.port=80"
    volumes:
      # Site build output staticfiles
      - ../projects/ctc-research/assets/staticfiles:/var/www/sites/ctc-research/static:ro
      - ../projects/lms/assets/staticfiles:/var/www/sites/lms/static:ro
      - ../projects/portfolio/assets/staticfiles:/var/www/sites/vresume/static:ro
      - lms-fusion-static:/var/www/sites/lms-fusion/static:ro
      # Shared application static files
      - ../projects/assets/static:/var/www/static:ro
      # Site-specific media uploads
      - ../projects/ctc-research/assets/media:/var/www/media/ctc-research:ro
      - ../projects/lms/assets/media:/var/www/media/lms:ro
      - ../projects/portfolio/assets/media:/var/www/media/vresume:ro
      # Fusion media volumes are created by the site compose files.
      - lms-fusion-media:/var/www/media/lms-fusion:ro
      # FileGator repository — same host dir FileGator writes uploads to, so
      # files appear at media.structa.cloud/media/filegator/* via location
      # /media/ (read-only view for serving).
      - ../../projects/assets/media/filegator:/var/www/media/filegator:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/nginx.conf:ro
      # Root index page served at media.structa.cloud/ (location = /).
      - ./nginx/www:/var/www/html:ro
    networks:
      - traefik-net
      - common

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------
  # Docus — Nuxt documentation server (docs.structa.cloud)
  # ----------------------------------------------------------
  # Docus owns SSR, content search, locale routing, sitemap, and LLM routes.
  # shared-media Nginx proxies /docs/ and the docs host to this service.
  docus:
    build:
      context: ../..
      dockerfile: docs/Dockerfile
    image: structa-docus:latest
    container_name: docus
    restart: unless-stopped
    environment:
      NUXT_APP_BASE_URL: /docs/
      NUXT_SITE_URL: https://docs.structa.cloud
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    networks:
      - traefik-net
      - common
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/docs/en/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------
  # FileGator — self-hosted file manager (media.structa.cloud/filegator/)
  # ----------------------------------------------------------
  # Served under the shared-media host via nginx `location /filegator/`
  # (see ./nginx/default.conf). The image listens on 8080; assets are
  # relative and the SPA builds its API base from window.location.pathname,
  # so no asset rewriting is required. Docs: https://docs.filegator.io/
  filegator:
    image: filegator/filegator:latest
    container_name: filegator
    restart: unless-stopped
    networks:
      - traefik-net
      - common
    volumes:
      # File repository — bind-mounted to the shared media tree so uploads
      # become publicly servable at media.structa.cloud/media/filegator/*
      # (shared-media mounts the same host dir under /var/www/media/filegator).
      # Owned by www-data (uid 33) so the container can write through.
      # NOTE: paths resolve from this compose file's dir (applications/proxy),
      # so the repo media tree is two levels up: ../../projects/assets/media.
      - ../../projects/assets/media/filegator:/var/www/filegator/repository
      # Private data (logs, sessions)
      - filegator-private:/var/www/filegator/private
      # Hardened configuration (csrf key, secure cookies, upload limits)
      - ./filegator/configuration.php:/var/www/filegator/configuration.php:ro
      # Version-controlled admin credentials — bind-mounted read-write so
      # UI user-management edits persist to the repo and survive volume
      # recreation (a fresh volume would otherwise regenerate the baked
      # admin/admin123 default from users.json.blank).
      - ./filegator/users.json:/var/www/filegator/private/users.json
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # NOTE: Docus is a separate Nuxt service proxied by shared-media Nginx.
  # Rebuild both services after documentation changes:
  #   docker compose -f docker-compose.nginx.yml build docus shared-media

volumes:
  filegator-private:
    name: filegator-private
  # Shared media volumes are named explicitly so standalone proxy and app
  # Compose invocations resolve the same resources without a pre-create step.
  lms-fusion-static:
    name: lms-fusion-static
    external: true
  lms-fusion-media:
    name: lms-fusion-media
    external: true
