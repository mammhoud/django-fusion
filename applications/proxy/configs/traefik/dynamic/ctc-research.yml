# =============================================================================
# CTC Research — Precis standalone stack routing
# =============================================================================
# Containers: precis-ctc-website   (Django + django-fusion, port 5070)
#             precis-ctc-frontend  (Astro shell, port 3002)
# Domain: ctc-research.com / www.ctc-research.com / arch.ctc-research.com
# Backend paths (/admin, /api, /apis/, /fragment/) route to the backend; static
# /media/sites assets route to shared-proxy; everything else is the frontend.
# TLS: Let's Encrypt HTTP-01 (certResolver: letsencrypt-http).
# =============================================================================

http:
  routers:
    ctc-site-http:
      rule: 'Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: ctc-frontend-service
      priority: 10
    ctc-site-https:
      rule: 'Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)'
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: ctc-frontend-service
      priority: 10
      tls:
        certResolver: letsencrypt-http
    ctc-api:
      rule: '(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/admin`) || PathPrefix(`/api`) || PathPrefix(`/apis/`) || PathPrefix(`/fragment/`))'
      entryPoints: [web, web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: ctc-backend-service
      priority: 100
    ctc-media:
      rule: '(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`) || PathPrefix(`/sites/`))'
      entryPoints: [web, web-secure]
      middlewares: [compress, security-headers]
      service: ctc-media-service
      priority: 110

  services:
    ctc-frontend-service:
      loadBalancer:
        servers:
          - url: 'http://precis-ctc-frontend:3002'
        healthCheck:
          path: /
          interval: 30s
          timeout: 10s
    ctc-backend-service:
      loadBalancer:
        servers:
          - url: 'http://precis-ctc-website:5070'
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
    ctc-media-service:
      loadBalancer:
        servers:
          - url: 'http://shared-proxy:80'
