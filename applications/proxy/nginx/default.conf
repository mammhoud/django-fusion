server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json image/svg+xml;

    # MIME types
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        application/javascript                js;
        application/json                      json;
        application/font-woff                 woff;
        application/font-woff2                woff2;
        font/ttf                              ttf;
        font/otf                              otf;
    }

    # Site-specific webpack bundles (collected into each site's STATIC_ROOT)
    location /static/bundles/ctc-research/ {
        alias /var/www/sites/ctc-research/static/bundles/ctc-research/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /static/bundles/lms/ {
        alias /var/www/sites/lms/static/bundles/lms/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /static/bundles/vresume/ {
        alias /var/www/sites/vresume/static/bundles/vresume/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Site-specific static files
    location /sites/ctc-research/static/ {
        alias /var/www/sites/ctc-research/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /sites/lms/static/ {
        alias /var/www/sites/lms/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /sites/vresume/static/ {
        alias /var/www/sites/vresume/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Shared static files
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Site-specific media files
    location /media/ctc-research/ {
        alias /var/www/media/ctc-research/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /media/lms/ {
        alias /var/www/media/lms/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /media/vresume/ {
        alias /var/www/media/vresume/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Shared media files (legacy)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Return 404 for any other requests (this is a media-only server)
    location / {
        return 404;
    }
}
