# Docker embedded DNS: the code-server / FileGator upstreams use variable
# proxy_pass (see below), so nginx must resolve their container names at
# request time via this resolver — otherwise requests 502 with "no resolver
# defined" even when the workspace container is up.
resolver 127.0.0.11 valid=30s ipv6=off;


# Fusion sites use the same public /static/ and /media/ URLs. Select their
# named-volume roots by the Host header while preserving the legacy shared
# paths for the existing sites and media subdomains.
map $host $static_root {
    default /var/www/static;
    cms-fusion.localhost /var/www/sites/cms-fusion/static;
    cms-fusion.com /var/www/sites/cms-fusion/static;
    www.cms-fusion.com /var/www/sites/cms-fusion/static;
    lms-fusion.localhost /var/www/sites/lms-fusion/static;
    lms-fusion.com /var/www/sites/lms-fusion/static;
    www.lms-fusion.com /var/www/sites/lms-fusion/static;
    ctc-research.com /var/www/sites/lms-fusion/static;
    www.ctc-research.com /var/www/sites/lms-fusion/static;
    arch.ctc-research.com /var/www/sites/lms-fusion/static;
}

map $host $media_root {
    default /var/www/media;
    cms-fusion.localhost /var/www/media/cms-fusion;
    cms-fusion.com /var/www/media/cms-fusion;
    www.cms-fusion.com /var/www/media/cms-fusion;
    lms-fusion.localhost /var/www/media/lms-fusion;
    lms-fusion.com /var/www/media/lms-fusion;
    www.lms-fusion.com /var/www/media/lms-fusion;
    ctc-research.com /var/www/media/lms-fusion;
    www.ctc-research.com /var/www/media/lms-fusion;
    arch.ctc-research.com /var/www/media/lms-fusion;
}

server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/markdown text/javascript application/javascript application/xml application/json image/svg+xml;

    # MIME types
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        application/javascript                js;
        application/json                      json;
        application/font-woff                 woff;
        application/font-woff2                woff2;
        font/ttf                              ttf;
        font/otf                              otf;
    }

    # Site-specific webpack bundles (collected into each site's STATIC_ROOT)
    location /static/bundles/ctc-research/ {
        alias /var/www/sites/ctc-research/static/bundles/ctc-research/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /static/bundles/lms/ {
        alias /var/www/sites/lms/static/bundles/lms/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /static/bundles/vresume/ {
        alias /var/www/sites/vresume/static/bundles/vresume/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /static/bundles/cms-fusion/ {
        alias /var/www/sites/cms-fusion/static/bundles/cms-fusion/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /static/bundles/lms-fusion/ {
        alias /var/www/sites/lms-fusion/static/bundles/lms-fusion/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Site-specific static files
    location /sites/ctc-research/static/ {
        alias /var/www/sites/ctc-research/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /sites/lms/static/ {
        alias /var/www/sites/lms/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /sites/vresume/static/ {
        alias /var/www/sites/vresume/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /sites/cms-fusion/static/ {
        alias /var/www/sites/cms-fusion/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /sites/lms-fusion/static/ {
        alias /var/www/sites/lms-fusion/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Shared static files
    location /static/ {
        alias $static_root/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Site-specific media files
    location /media/ctc-research/ {
        alias /var/www/media/ctc-research/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /media/lms/ {
        alias /var/www/media/lms/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location /media/vresume/ {
        alias /var/www/media/vresume/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Shared media files. Fusion hosts resolve to their named-volume root
    # through $media_root; legacy hosts retain /var/www/media/.
    location /media/ {
        alias $media_root/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Resolver smoke probe — exercised by the shared-media healthcheck.
    # Proxies to a stable in-stack container (docs) through the SAME
    # variable-upstream + resolver path the workspace containers use.
    # 200 = resolver configured and resolving at runtime; 502 "no resolver
    # defined" = config regression the healthcheck must catch at deploy
    # time. Closed-loop and safe: docs always serves its SPA fallback
    # (200), so the probe never depends on coder-dev-* containers being up.
    location = /__resolver_probe__ {
        access_log off;
        set $resolver_probe docs:80;
        proxy_pass http://$resolver_probe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ------------------------------------------------------------
    # FileGator — self-hosted file manager (media.structa.cloud/filegator/)
    # ------------------------------------------------------------
    # Proxied to the filegator container (port 8080). FileGator serves
    # relative asset paths and builds its API base from
    # window.location.pathname, so it works unchanged under this subpath.
    # Redirect the bare path so the SPA always loads under the trailing
    # slash (its relative assets and API base depend on it). The redirect
    # is scheme-relative so it stays on https after Traefik TLS termination.
    location = /filegator {
        absolute_redirect off;
        return 301 /filegator/;
    }

    location /filegator/ {
        proxy_pass http://filegator:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Allow chunked uploads up to FileGator's 100MB default
        client_max_body_size 128m;
        # Buffering off keeps chunked upload progress real-time
        proxy_buffering off;
    }

    # ------------------------------------------------------------
    # Docs — Structa Cloud documentation (Docsify SPA)
    # ------------------------------------------------------------
    # Proxied to the docs container (port 80). The Docsify SPA sets
    # basePath '/docs/' and uses history-mode routing, so the prefix is
    # stripped here: /docs/README.md -> docs:/README.md. The upstream
    # nginx (docs/Dockerfile) has its own try_files -> /index.html SPA
    # fallback for history-mode deep links.
    # Redirect the bare path so the SPA always loads under the trailing
    # slash (its relative assets and docsify routing depend on it).
    location = /docs {
        absolute_redirect off;
        return 301 /docs/;
    }

    location /docs/ {
        proxy_pass http://docs:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Doc content (HTML shell, markdown pages) is dynamic — always
        # revalidate so doc edits propagate without a cache flush.
        add_header Cache-Control "public, max-age=0, must-revalidate";

        # Hashed build assets -> immutable for one year. Docsify emits no
        # hashed files today, but this future-proofs any bundling pipeline
        # that adds content hashes to filenames.
        location ~* "^/docs/.+\.([0-9a-f]{8,})\.(?:css|js|mjs|woff2?|png|jpe?g|gif|svg|webp|ico)$" {
            rewrite ^/docs/(.+)$ /$1 break;
            proxy_pass http://docs:80;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Non-hashed static assets (theme.css, images, fonts) -> short
        # browser cache; ETag/Last-Modified from the upstream still allow
        # cheap 304 revalidations after the hour expires.
        location ~* ^/docs/.+\.(?:css|js|mjs|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
            rewrite ^/docs/(.+)$ /$1 break;
            proxy_pass http://docs:80;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # Return 404 for any other requests (this is a media-only server)
    location / {
        return 404;
    }
}

# ------------------------------------------------------------
# code-server — per-workspace IDE (code.structa.cloud)
# ------------------------------------------------------------
# Proxied to the workspace container coder-dev-code-server:8086 (provisioned
# by the dev-stack Coder template). Traefik routes code.localhost /
# code.structa.cloud / ws.structa.cloud here (see
# ../traefik/dynamic/code-server.yml). WebSocket upgrade headers are required
# for the code-server terminal and file watcher to work through the proxy.
server {
    listen 80;
    server_name code.localhost code.structa.cloud ws.structa.cloud;

    location / {
        # Variable-based upstream: the workspace container is provisioned by
        # the dev-stack Coder template and only exists while the workspace is
        # running. A literal hostname here would make `nginx -t` (the
        # shared-media healthcheck) fail whenever the workspace is stopped.
        set $code_server_upstream coder-dev-code-server:8086;
        proxy_pass http://$code_server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Long-lived WebSocket connections (terminal sessions)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}

# ------------------------------------------------------------
# FileGator — per-workspace file manager (filegator.structa.cloud)
# ------------------------------------------------------------
# Proxied to the workspace container coder-dev-filegator:8080 (provisioned by
# the dev-stack Coder template). Traefik routes filegator.localhost /
# filegator.structa.cloud here (see ../traefik/dynamic/filegator.yml). This
# is the workspace-scoped FileGator — distinct from the host-level shared
# FileGator served at media.structa.cloud/filegator/ above.
server {
    listen 80;
    server_name filegator.localhost filegator.structa.cloud;

    location / {
        # Variable-based upstream — see the code-server block above: keeps
        # `nginx -t` (shared-media healthcheck) green while the workspace is
        # stopped; requests 502 until the workspace is up.
        set $filegator_ws_upstream coder-dev-filegator:8080;
        proxy_pass http://$filegator_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Allow chunked uploads up to FileGator's 100MB default
        client_max_body_size 128m;
        # Buffering off keeps chunked upload progress real-time
        proxy_buffering off;
    }
}
