# ============================================================
# Main Orchestration - Includes All Sites & Shared Infrastructure
# ============================================================
# This file orchestrates deployment of all websites (ctc-research,
# lms-demo, vresume) along with shared infrastructure (traefik, db,
# cache, tasks, media server, nginx).
#
# Website services are defined in the canonical compose stack under compose/:
#   - compose/docker-compose.yml
#
# Infrastructure is defined in compose/:
#   - docker-compose.traefik.yml (reverse proxy)
#   - docker-compose.warehouse.yml (database & cache)
#   - docker-compose.tasks.yml (celery workers)
#   - docker-compose.utilities.yml (utilities)
#   - docker-compose.nginx.yml (media server)
# ============================================================

include:
  # Shared infrastructure and canonical website services
  - path: compose/docker-compose.yml
  - path: compose/docker-compose.traefik.yml
  - path: compose/docker-compose.warehouse.yml
  - path: compose/docker-compose.tasks.yml
  - path: compose/docker-compose.utilities.yml
  - path: compose/docker-compose.nginx.yml
