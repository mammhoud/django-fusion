# ============================================================
# Networks – all networks from both files
# ============================================================
networks:
  common:
    external: true
  warehouse-net:
    external: true
  internal:
    external: true
  traefik-net:
    external: true
    name: traefik-net
  site_network:
    name: site_network

# ============================================================
# Volumes – named volumes from both files
# ============================================================
volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data

# ============================================================
# Services
# ============================================================
services:
  # ----------------------------------------------------------
  # PostgreSQL – merged & fixed
  # ----------------------------------------------------------
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile          # uses your custom entrypoint
    container_name: postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - ../../.env
    environment:
      # Core PostgreSQL settings
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app_db
      PGDATA: /var/lib/postgresql/data/pgdata
      # Multiple databases – comma-separated list: db:owner:password.
      # AFFiNE is a permanent shared proxy service and uses the `affine`
      # database. Its role password is required; it has no repository default.
      INITDB_MULTIPLE_DATABASES: "${POSTGRES_DATABASES:-db_ctc:structa:CTCreSearch0x@,db_structa:structa:CTCreSearch0x@,vresume:structa:CTCreSearch0x@,coder:coder:CTCreSearch0x@,db_crm:structa:CTCreSearch0x@,affine:affine:${AFFINE_DB_PASSWORD:?AFFINE_DB_PASSWORD must be set}}"

      # ---- NEW: Force re‑initialization on every start ----
      # Set FORCE_REINIT=true to ignore the .init_done marker and run init scripts again
      FORCE_REINIT: "${FORCE_REINIT:-false}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/backups:/backups:Z
    networks:
      - common
      - warehouse-net
      - internal
      - traefik-net
      - site_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ----------------------------------------------------------
  # Redis – shared broker for Dramatiq
  # Container name MUST be default-redis; every site + the shared
  # task stack resolve it at redis://default-redis:6379/<db>.
  # ----------------------------------------------------------
  default-redis:
    image: redis:7-alpine
    container_name: default-redis
    restart: always
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    networks:
      - common
      - warehouse-net
      - internal
      - traefik-net
      - site_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

