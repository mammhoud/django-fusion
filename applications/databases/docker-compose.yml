# ============================================================
# Networks – all networks from both files
# ============================================================
networks:
  common:
    external: true
  warehouse-net:
    external: true
  internal:
    external: true
  traefik-net:
    external: true
    name: traefik-net
  site_network:
    name: site_network

# ============================================================
# Volumes – named volumes from both files
# ============================================================
volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  coder_data:
    name: coder_data

# ============================================================
# Services
# ============================================================
services:
  # ----------------------------------------------------------
  # PostgreSQL – merged & fixed
  # ----------------------------------------------------------
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile          # uses your custom entrypoint
    container_name: postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - ../../.env
    environment:
      # Core PostgreSQL settings
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app_db
      PGDATA: /var/lib/postgresql/data/pgdata
      # Multiple databases – comma‑separated list: db:owner:password
      # NOTE: `blinko` was removed (2026-08) — the dev-stack workspace replaced
      # Blinko with FileGator, which needs no database.
      INITDB_MULTIPLE_DATABASES: "${POSTGRES_DATABASES:-db_ctc:structa:CTCreSearch0x@,db_structa:structa:CTCreSearch0x@,vresume:structa:CTCreSearch0x@,coder:coder:CTCreSearch0x@,db_crm:structa:CTCreSearch0x@}"

      # ---- NEW: Force re‑initialization on every start ----
      # Set FORCE_REINIT=true to ignore the .init_done marker and run init scripts again
      FORCE_REINIT: "${FORCE_REINIT:-false}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/backups:/backups:Z
    networks:
      - common
      - warehouse-net
      - internal
      - traefik-net
      - site_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ----------------------------------------------------------
  # Redis – shared broker for Dramatiq + Celery
  # Container name MUST be default-redis; every site + the shared
  # task stack resolve it at redis://default-redis:6379/<db>.
  # ----------------------------------------------------------
  default-redis:
    image: redis:7-alpine
    container_name: default-redis
    restart: always
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    networks:
      - common
      - warehouse-net
      - internal
      - traefik-net
      - site_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------
  # Coder – self‑hosted cloud development environments (coder.com)
  # Uses the `coder` database created above by INITDB_MULTIPLE_DATABASES.
  # Connection env vars are exported straight into the Coder container.
  # ----------------------------------------------------------
  coder:
    image: ghcr.io/coder/coder:${CODER_VERSION:-latest}
    container_name: coder
    restart: unless-stopped
    # Docker group (gid 999 on this host) so the built-in provisioner's
    # `terraform apply` can use /var/run/docker.sock. Coder runs as uid 1000;
    # without this supplementary group the kreuzwerker/docker provider fails
    # with "permission denied" (seen in the dev-stack template build).
    group_add:
      - "${DOCKER_GROUP_GID:-999}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection — exported to Coder's env
      CODER_PG_CONNECTION_URL: "postgres://${CODER_DB_USER:-coder}:${CODER_DB_PASSWORD:-CTCreSearch0x@}@postgres:5432/${CODER_DB_NAME:-coder}?sslmode=disable"
      # Public URL users hit in their browser
      CODER_ACCESS_URL: "${CODER_ACCESS_URL:-https://coder.structa.cloud}"
      # Allow path-based apps to be accessed by the workspace owner
      CODER_DANGEROUS_ALLOW_PATH_APP_SITE_OWNER_ACCESS: "${CODER_DANGEROUS_ALLOW_PATH_APP_SITE_OWNER_ACCESS:-true}"
      # Network bind (HTTP only by default; flip CODER_TLS_ENABLED=true behind a reverse proxy)
      CODER_HTTP_ADDRESS: "0.0.0.0:${CODER_HTTP_PORT:-7080}"
      CODER_HTTPS_ADDRESS: "0.0.0.0:${CODER_HTTPS_PORT:-7443}"
      CODER_TLS_ENABLED: "${CODER_TLS_ENABLED:-false}"
      # Shared code-server instance — workspace "Open in IDE" links redirect here
      CODER_CODE_SERVER_PATH: "${CODER_CODE_SERVER_PATH:-https://code.structa.cloud}"
      # Wildcard URL is optional — only set when explicitly provided, because an
      # empty value makes Coder reject startup.
    ports:
      - "${CODER_HTTP_PORT:-7080}:7080"
      - "${CODER_HTTPS_PORT:-7443}:7443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/structa.cloud:/home/structa.cloud:ro
      - coder_data:/home/coder
    networks:
      # Static IP on `common` — the Coder workspace templates hardcode
      # coder_host_ip = 172.18.0.11 for the agent binary download and
      # control-plane URL. Pinning it here keeps that contract stable
      # across container recreations (a plain `up -d` would re-DHCP the
      # container to a different address and break workspace builds).
      common:
        ipv4_address: 172.18.0.11
      warehouse-net: {}
      internal: {}
      traefik-net: {}
      site_network: {}
    # NOTE: ghcr.io/coder/coder is a distroless image (no shell, no curl/wget),
    # so a shell-style healthcheck would always fail with exit 127. We rely on
    # `depends_on: condition: service_healthy` for postgres plus the Coder
    # container's own logs; if you ever need a Docker-level healthcheck, bake
    # one into a derived image (e.g. FROM coder COPY healthcheck.sh).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.coder.rule=Host(`${CODER_HOSTNAME:-coder.localhost}`)"
      - "traefik.http.routers.coder.entrypoints=web"
      # `server.port` is intentionally omitted — Traefik will route to the first
      # published port (CODER_HTTP_PORT, default 7080), so changing the env var
      # in one place still works.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

