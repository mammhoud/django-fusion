# ============================================================
# VResume Website + Worker
# ============================================================
x-site-infra-env: &site-infra-env
  DB_TYPE: ${DB_TYPE:-postgres}
  DB_HOST: ${DB_HOST:-database-server}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DB_NAME: ${DB_NAME_VRESUME:-vresume}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@default-redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@default-redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@default-redis:6379/2

services:
  vresume-web:
    build:
      context: ../..
      dockerfile: compose/Dockerfile
      args:
        PROJECT_PATH: VResume
    image: vresume-web:latest
    container_name: vresume-web
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: ../../.env
        required: false
    environment:
      RUNNING_ENV: docker
      APP_MODULE: ${APP_MODULE:-server:application}
      SERVER_TYPE: ${SERVER_TYPE:-gunicorn}
      SERVER_ENV: ${SERVER_ENV:-production}
      DEBUG: ${DEBUG:-False}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-configs.settings}
      <<: *site-infra-env
      LOG_DIR: /app/logs
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/2
      LOG_DIR: /app/logs/vresume
      USE_X_FORWARDED_HOST: "true"
      SECURE_PROXY_SSL_HEADER: HTTP_X_FORWARDED_PROTO,https
      WEBSITE: vresume
      DJANGO_SITE: vresume
      DJANGO_WEBSITE: vresume
      PROJECT_PATH: VResume
      WEBSITE_HOST: ${VRESUME_HOST:-vresume.structa.cloud}
      ALLOWED_HOSTS: vresume.structa.cloud,www.vresume.structa.cloud,resume.structa.cloud,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://vresume.structa.cloud,https://www.vresume.structa.cloud,https://resume.structa.cloud
      PORT: "5072"
      CELERY_TASK_DEFAULT_QUEUE: vresume
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5072/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ../configs:/app/configs:z
      - ../assets:/app/assets:z
      - ../libs:/app/libs:z
      - ../scripts:/app/scripts:z
      - ../tasks:/app/tasks:z
      - ../www:/app/www:z
      - ../manage.py:/app/manage.py:z
      - ../cli.py:/app/cli.py:z
      - ../__main__.py:/app/__main__.py:z
      - ../__about__.py:/app/__about__.py:z
      - ../VResume:/app/VResume:z
      - vresume-static:/app/VResume/static:rw
      - vresume-media:/app/VResume/media:rw
      - ../../logs:/app/logs:z
    expose:
      - "5072"
    networks:
      - common
      - warehouse-net

  vresume-worker:
    build:
      context: ../..
      dockerfile: compose/Dockerfile
      args:
        PROJECT_PATH: VResume
    image: vresume-worker:latest
    container_name: vresume-worker
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: ../../.env
        required: false
    environment:
      # Full environment block (same as web, minus PORT and healthcheck specific vars)
      RUNNING_ENV: docker
      SERVER_TYPE: ${SERVER_TYPE:-gunicorn}
      SERVER_ENV: ${SERVER_ENV:-production}
      DEBUG: ${DEBUG:-False}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-configs.settings}
      <<: *site-infra-env
      LOG_DIR: /app/logs
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/2
      LOG_DIR: /app/logs/vresume
      USE_X_FORWARDED_HOST: "true"
      SECURE_PROXY_SSL_HEADER: HTTP_X_FORWARDED_PROTO,https
      WEBSITE: vresume
      DJANGO_SITE: vresume
      DJANGO_WEBSITE: vresume
      PROJECT_PATH: VResume
      WEBSITE_HOST: ${VRESUME_HOST:-vresume.structa.cloud}
      CELERY_TASK_DEFAULT_QUEUE: vresume
    command: celery -A tasks.celery:app worker --loglevel=info --queues=vresume
    volumes:
      - ../configs:/app/configs:z
      - ../assets:/app/assets:z
      - ../libs:/app/libs:z
      - ../scripts:/app/scripts:z
      - ../tasks:/app/tasks:z
      - ../www:/app/www:z
      - ../manage.py:/app/manage.py:z
      - ../cli.py:/app/cli.py:z
      - ../__main__.py:/app/__main__.py:z
      - ../__about__.py:/app/__about__.py:z
      - ../VResume:/app/VResume:z
      - ../../logs:/app/logs:z
    networks:
      - common
      - warehouse-net

networks:
  common:
    external: true
  warehouse-net:
    external: true

volumes:
  vresume-static:
    external: true
  vresume-media:
    external: true
