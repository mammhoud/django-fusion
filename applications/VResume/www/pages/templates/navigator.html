{# VResume Navbar Component (BEM) #}
{# Enhanced navigator with Preline styling, Bootstrap responsive classes, Tailwind utilities, and HTMX integration #}
{% load i18n %}

<nav class="navigator" data-navigator>
  <ul class="navigator__list">
    {% for tab_name, tab_label in tabs %}
    <li class="navigator__item">
      <button class="navigator__link {% if active_tab == tab_name %}navigator__link--active{% endif %}"
              hx-get="{% url 'pages:tab' tab_name %}"
              hx-target="#vresume-tab-content"
              hx-push-url="true"
              hx-swap="innerHTML transition:true"
              hx-trigger="click"
              hx-indicator="#vresume-tab-content"
              hx-on:htmx:after-request="document.querySelectorAll('.navigator__link').forEach(el => el.classList.remove('navigator__link--active')); this.classList.add('navigator__link--active')"
              data-nav-link
              data-htmx-preloader>
        {% trans tab_label %}
      </button>
    </li>
    {% endfor %}
  </ul>
</nav>
