{% load i18n %}

{# VResume Footer - Theme toggle with family and mode switchers (BEM) #}
{# vResume layout has sidebar + main content with fixed navbar at bottom #}
<footer class="vresume-footer">
    <div class="vresume-footer__content">
        <p class="vresume-footer__text">&copy; {% now "Y" %} — {% trans "All Rights Reserved" %}</p>
        
        <!-- Theme Toggle Buttons -->
        <div class="vresume-footer__theme-toggle">
            <!-- Light mode button (shown when dark mode is active) -->
            <button type="button" 
                    class="vresume-footer__theme-btn vresume-footer__theme-btn--light theme-toggle dark-mode-active" 
                    data-theme-mode="light"
                    title="{% trans 'Switch to Light Mode' %}"
                    aria-label="{% trans 'Switch to Light Mode' %}">
                <span class="theme-btn__icon-wrapper">
                    <i class="ri ri-sun-line"></i>
                    <span class="theme-btn__color-indicator theme-btn__color-indicator--light"></span>
                </span>
            </button>
            
            <!-- Dark mode button (shown when light mode is active) -->
            <button type="button" 
                    class="vresume-footer__theme-btn vresume-footer__theme-btn--dark theme-toggle" 
                    data-theme-mode="dark"
                    title="{% trans 'Switch to Dark Mode' %}"
                    aria-label="{% trans 'Switch to Dark Mode' %}">
                <span class="theme-btn__icon-wrapper">
                    <i class="ri ri-moon-line"></i>
                    <span class="theme-btn__color-indicator theme-btn__color-indicator--dark"></span>
                </span>
            </button>

            <!-- Theme Family Switchers -->
            <button type="button" 
                    class="vresume-footer__theme-btn vresume-footer__theme-btn--ocean theme-toggle" 
                    data-theme-family="ocean"
                    title="{% trans 'Switch to Ocean Theme' %}"
                    aria-label="{% trans 'Switch to Ocean Theme' %}">
                <span class="theme-btn__icon-wrapper">
                    <i class="ri ri-droplet-line"></i>
                    <span class="theme-btn__color-indicator theme-btn__color-indicator--ocean"></span>
                </span>
            </button>

            <button type="button" 
                    class="vresume-footer__theme-btn vresume-footer__theme-btn--classic theme-toggle" 
                    data-theme-family="classic"
                    title="{% trans 'Switch to Classic Theme' %}"
                    aria-label="{% trans 'Switch to Classic Theme' %}">
                <span class="theme-btn__icon-wrapper">
                    <i class="ri ri-palette-line"></i>
                    <span class="theme-btn__color-indicator theme-btn__color-indicator--classic"></span>
                </span>
            </button>
        </div>
    </div>
</footer>
