version: '3.8'

services:
  anytype:
    image: anytyped/anytype:latest
    container_name: anytype
    restart: unless-stopped
    ports:
      - "41414:41414"
    volumes:
      - anytype-data:/home/anytype/.config/Anytype
      - ./files:/home/anytype/files:ro
    environment:
      - ANYTYPE_LOG_LEVEL=info
    networks:
      - common
      - traefik-net

networks:
  common:
    external: true
  traefik-net:
    external: true

volumes:
  anytype-data:
    driver: local
