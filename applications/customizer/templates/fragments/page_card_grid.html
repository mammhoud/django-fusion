<div class="row g-3">
  {% for page in pages %}
    <div class="col-md-6 col-xl-4">
      <article class="card h-100">
        <div class="card-body">
          <h2 class="h5">{{ page.title }}</h2>
          <code class="small d-block mb-3">{{ page.path }}</code>
          <button class="btn btn-outline-primary btn-sm"
                  type="button"
                  hx-get="{% url 'fragment_page_section_list' website.slug page.path %}"
                  hx-target="#sections-{{ forloop.counter }}"
                  hx-swap="innerHTML">
            Show linked sections
          </button>
          <div id="sections-{{ forloop.counter }}" class="mt-3"></div>
        </div>
      </article>
    </div>
  {% empty %}
    <div class="col"><p class="text-muted">No page templates discovered for {{ website.name }}.</p></div>
  {% endfor %}
</div>
