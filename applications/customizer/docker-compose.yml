# ============================================================
# Customizer Template Customizer — Service Definition
# ============================================================
# Runs alongside the main sites on port 5073.
# Uses SQLite (no Postgres dependency) and has its own
# self-contained Dockerfile.
# ============================================================

services:
  customizer:
    build:
      context: ..
      dockerfile: customizer/Dockerfile
      args:
        CUSTOMIZER_PORT: "5073"
    image: customizer:latest
    container_name: customizer
    restart: unless-stopped
    working_dir: /app/customizer
    env_file:
      - path: ../../.env
        required: false
    environment:
      CUSTOMIZER_SECRET_KEY: ${CUSTOMIZER_SECRET_KEY:-django-insecure-customizer-dev}
      CUSTOMIZER_DEBUG: ${CUSTOMIZER_DEBUG:-0}
      CUSTOMIZER_ALLOWED_HOSTS: ${CUSTOMIZER_ALLOWED_HOSTS:-localhost,127.0.0.1,customizer.localhost}
      CUSTOMIZER_PORT: "5073"
      DJANGO_SETTINGS_MODULE: settings
      PORT: "5073"
      WORKERS: ${CUSTOMIZER_WORKERS:-2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5073/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "5073:5073"
    volumes:
      # Data subdirectory — keeps SQLite DB + uploaded media persistent
      # without overwriting the app source code mounted at /app/customizer/
      - customizer-data:/app/customizer/data:rw
      - customizer-static:/app/customizer/staticfiles:rw
      - customizer-media:/app/customizer/assets/media:rw
      - ../../logs:/app/logs:z
    networks:
      - common
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.customizer.rule=Host(`${CUSTOMIZER_HOSTNAME:-customizer.localhost}`)"
      - "traefik.http.routers.customizer.entrypoints=web"
      - "traefik.http.services.customizer.loadbalancer.server.port=5073"

networks:
  common:
    external: true
  traefik-net:
    external: true

volumes:
  customizer-data:
    name: customizer-data
  customizer-static:
    name: customizer-static
  customizer-media:
    name: customizer-media
