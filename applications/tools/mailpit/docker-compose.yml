# =============================================================================
# Mailpit — email catcher for development and staging
# =============================================================================
# SMTP listener on :1025 (host + internal), web UI on :8025 (internal, routed
# by Traefik at mail.structa.cloud). Point Django EMAIL_HOST at `mailpit` /
# port 1025 to capture outbound mail instead of sending it.
# =============================================================================

networks:
  common:
    external: true
  traefik-net:
    external: true

services:
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - common
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
