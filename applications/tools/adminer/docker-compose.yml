# =============================================================================
# Adminer — lightweight database administration UI
# =============================================================================
# Replaces the commented-out service that used to live in
# applications/databases/docker-compose.yml. Routed by Traefik to the
# shared-proxy Nginx at tools.structa.cloud/adminer/ (see
# applications/proxy/configs/traefik/dynamic/tools.yml and the `tools`
# server block in applications/proxy/configs/nginx/default.conf.template);
# no host port is published. Connects to `postgres:5432` on the `common` network.
# =============================================================================

networks:
  common:
    external: true
  traefik-net:
    external: true

services:
  adminer:
    image: adminer:${ADMINER_VERSION:-latest}
    container_name: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: ${ADMINER_DESIGN:-hydra}
    networks:
      - common
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
