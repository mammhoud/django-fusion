# ============================================================
# Documentation Service (Docsify + nginx)
# ============================================================
# Container name 'docs' matches proxy/dynamic/docs.yml:
#   url: "http://docs:80"
# ============================================================

networks:
  common:
    name: common
    external: true

services:
  docs:
    image: structa-docs:latest
    container_name: docs
    restart: unless-stopped
    build:
      context: ../docs          # points to the docs/ directory
      dockerfile: ./Dockerfile   # adjust if needed
    networks:
      - common
    environment:
      - TZ=${TZ:-UTC}
    # Explicit unique host forwarding — publish the docs container's port 80
    # on host port 9080 instead of relying on the implicit 80/tcp exposure.
    # 9080 chosen to avoid collisions with: 80 (traefik), 443 (traefik-tls),
    # 5070 (ctc-research-web), 5432 (postgres), 7080/7443 (coder),
    # 8080 (traefik-dashboard).
    ports:
      - "9080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

