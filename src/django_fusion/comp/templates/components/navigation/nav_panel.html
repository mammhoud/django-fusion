<nav class="{{ css_class }}" aria-label="{{ title|default:"Navigation" }}">
  {% if title %}
  <div class="card-header">{{ title }}</div>
  {% endif %}
  {% if links %}
  <ul class="nav flex-column">
    {% for link in links %}
    <li class="nav-item">
      <a {{ link.attrs }}{% if link.is_active %} aria-current="page"{% endif %}>
        {% if link.icon %}<i class="{{ link.icon }} me-2"></i>{% endif %}
        <span>{{ link.label }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-muted mb-0">No navigation items.</p>
  {% endif %}
</nav>
