<form class="d-inline-flex" {% if hx_get %}hx-get="{{ hx_get }}"{% endif %} {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}>
  {% for key, value in extra_filters.items %}
  <input type="hidden" name="{{ key }}" value="{{ value }}">
  {% endfor %}
  <input class="form-control" type="search" name="q" value="{{ search_query }}" placeholder="{{ search_placeholder }}" style="max-width: {{ max_width }};">
</form>
