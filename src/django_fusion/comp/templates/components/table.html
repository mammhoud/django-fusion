<table class="{{ table_class }}" data-hx-target="{{ hx_target }}">
  {% if headers %}
  <thead>
    <tr>
      {% for header in headers %}
      <th>{{ header }}</th>
      {% endfor %}
    </tr>
  </thead>
  {% endif %}
  <tbody>
    {% for row in rows %}
    <tr>
      {% for cell in row %}
      <td>{{ cell }}</td>
      {% endfor %}
    </tr>
    {% empty %}
    <tr>
      <td colspan="{{ headers|length }}" class="text-muted">{{ empty_message }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
