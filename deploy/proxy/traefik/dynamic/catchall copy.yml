# ============================================
# Catch-All Configuration
# Returns 404 for any unrecognized domain.
#
# This router has priority 1 (lowest) so all named
# domain routers take precedence. Unrecognized domains
# are routed here and receive a 404 response via the
# noop service (no backends → Traefik returns 404).
# ============================================
http:
  routers:
    # Catch-all for HTTPS — lowest priority
    catchall-https:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints:
        - web-secure
      priority: 1
      service: noop@internal
      tls:

    # Catch-all for HTTP — redirect to HTTPS, then 404
    catchall-http:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints:
        - web
      priority: 1
      middlewares:
        - redirect-to-https
      service: noop@internal
