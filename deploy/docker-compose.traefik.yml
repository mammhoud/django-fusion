# ============================================================
# Shared Traefik Reverse Proxy
# ============================================================
# One proxy routes the three websites, the unified media server, and utilities.
# ============================================================

networks:
  traefik-net:
    name: traefik-net

volumes:
  traefik_acme:

services:
  structa-proxy:
    build:
      context: ./traefik
      dockerfile: Dockerfile
    image: traefik-proxy
    container_name: structa-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - traefik_acme:/etc/traefik/acme
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    environment:
      DOCKER_API_VERSION: "1.44"
      TRAEFIK_ACME_EMAIL: ${TRAEFIK_ACME_EMAIL:-admin@structa.cloud}
      TRAEFIK_LOG_LEVEL: ${TRAEFIK_LOG_LEVEL:-INFO}
    networks:
      - traefik-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
