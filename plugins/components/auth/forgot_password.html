{% load i18n static %}


<div class="container justify-content-center align-items-center mb-5">
  <div class="card shadow-lg p-4 radius-round" style="max-width: 480px; width: 100%; background-color: rgba(255,255,255,0.95);">
    <h2 class="text-center mb-4 fw-semibold">{% trans "Forgot Password" %}</h2>

    <!-- Forgot Password Form -->
    <form id="forgot-password-form" class="needs-validation" action="{% url 'plugins:password_forgot' %}" method="post" novalidate>
      {% csrf_token %}

      <!-- Email Input -->
      <div class="form-group mb-4">
        <label for="email" class="form-label fw-semibold">{% trans "Email address" %}</label>
        <input
          id="email"
          name="con_name"
          type="email"
          class="form-control"
          placeholder="{% trans 'Enter your email' %}"
          required
        />
        <div class="invalid-feedback">
          {% trans "Please enter a valid email address." %}
        </div>
      </div>

      <!-- Submit Button -->
      <div class="form-submit-group">
        <button type="submit" class="btn btn-md btn-gradient hover-icon-reverse radius-round w-100">
          <span class="icon-reverse-wrapper">
            <span class="btn-text">{% trans "Send Reset Link" %}</span>
            <span class="btn-icon"><i class="feather-arrow-right"></i></span>
            <span class="btn-icon"><i class="feather-arrow-right"></i></span>
          </span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ✅ Validation Script -->
<script>
(function () {
  'use strict';
  const form = document.querySelector('#forgot-password-form');

  form.addEventListener('submit', function (event) {
    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
    }

    form.classList.add('was-validated');
  }, false);
})();
</script>
