# =============================================================================
# Dynamic TLS certificates
# =============================================================================
# For local .localhost development, Traefik serves a single self-signed
# certificate that covers precis-lms.localhost.
# Production domains still obtain certs via Let's Encrypt (certResolver in each
# router config), but .localhost cannot pass public ACME validation, so this
# static certificate is used instead.
#
# To switch certificate strategies, see application/proxy/Makefile:
#   make proxy-certs-selfsigned   # use the cert below (default for local dev)
#   make proxy-certs-mkcert       # generate locally-trusted certs with mkcert
#   make proxy-certs-default      # remove static cert and use Traefik default
#
# The legacy production self-signed certificates below remain commented for
# emergency rollback only.
# =============================================================================

tls:
  certificates:
    - certFile: /etc/traefik/certs/localhost.crt
      keyFile: /etc/traefik/certs/localhost.key

  # Default certificate served when no SNI matches or when a request is made
  # without a known hostname. This prevents the browser from receiving the
  # generic Traefik default cert for the two local hosts.
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/localhost.crt
        keyFile: /etc/traefik/certs/localhost.key

