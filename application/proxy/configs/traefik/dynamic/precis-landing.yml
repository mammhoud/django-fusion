# =============================================================================
# Precis Landing — Traefik router config  [ACTIVE]
# =============================================================================
# Containers: precis-main-backend (Django/Wagtail, port 8074)
#             precis-main-frontend (Astro static, port 3000)
# Domain: structa.cloud / www.structa.cloud
# Backend paths (/accounts, /apis, /admin, /django-admin, /static, /media, /fragment, /learning)
#   are routed to the backend with priority 200.
# All other paths (the public document shell) are served from the frontend.
# TLS: Let's Encrypt HTTP-01 (certResolver: letsencrypt-http).
# =============================================================================

http:
  routers:
    precis-landing-backend-http:
      rule: '(Host(`structa.cloud`) || Host(`www.structa.cloud`)) && (PathPrefix(`/accounts`) || PathPrefix(`/api`) || PathPrefix(`/apis`) || PathPrefix(`/admin`) || PathPrefix(`/django-admin`) || PathPrefix(`/documents`) || PathPrefix(`/static`) || PathPrefix(`/media`) || PathPrefix(`/fragment`) || PathPrefix(`/learning`) || PathPrefix(`/i18n`))'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: precis-landing-backend
      priority: 200
    precis-landing-backend-https:
      rule: '(Host(`structa.cloud`) || Host(`www.structa.cloud`)) && (PathPrefix(`/accounts`) || PathPrefix(`/api`) || PathPrefix(`/apis`) || PathPrefix(`/admin`) || PathPrefix(`/django-admin`) || PathPrefix(`/documents`) || PathPrefix(`/static`) || PathPrefix(`/media`) || PathPrefix(`/fragment`) || PathPrefix(`/learning`) || PathPrefix(`/i18n`))'
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: precis-landing-backend
      priority: 200
      tls:
        certResolver: letsencrypt-http
    precis-landing-site-http:
      rule: 'Host(`structa.cloud`) || Host(`www.structa.cloud`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: precis-landing-frontend
      priority: 100
    precis-landing-site-https:
      rule: 'Host(`structa.cloud`) || Host(`www.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: precis-landing-frontend
      priority: 100
      tls:
        certResolver: letsencrypt-http

  services:
    precis-landing-backend:
      loadBalancer:
        servers:
          - url: 'http://precis-main-backend:8074'
        healthCheck:
          path: /apis/pages/
          interval: 15s
          timeout: 10s
    precis-landing-frontend:
      loadBalancer:
        servers:
          - url: 'http://precis-main-frontend:3000'
        healthCheck:
          path: /
          interval: 15s
          timeout: 10s
