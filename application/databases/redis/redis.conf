# Redis Configuration
# Generated for Phase 11 - Warehouses Infrastructure

################################## NETWORK #####################################

# Accept connections only from the local loopback or from network peers
# bind 127.0.0.1 ::1
# bind 0.0.0.0
# In containerized environment, listen on all interfaces
bind 0.0.0.0

# TCP listen() backlog.
tcp-backlog 511

# TCP keepalive.
tcp-keepalive 300

# Close the connection after a client is idle for N seconds
timeout 0

################################# GENERAL #####################################

# By default Redis does not run as a daemon
daemonize no

# Set server verbosity to 'debug', 'verbose', 'notice', or 'warning'
loglevel notice

# Specify the log file name
logfile ""

# Set the number of databases
databases 16

################################ SNAPSHOTTING  ################################

# Save the DB on disk
# save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

# Stop writes on BGSAVE error
stop-writes-on-bgsave-error yes

# Compress string objects using LZF when dump
rdbcompression yes

# RDB checksum
rdbchecksum yes

# The filename for the DB
dbfilename dump.rdb

# The working directory
dir ./

################################# REPLICATION #################################

# slaveof <masterip> <masterport>
# slaveof no one

################################## SECURITY ###################################

# Set a password for authentication
# requirepass foobared
requirepass ${REDIS_PASSWORD:-redis_password}

################################### CLIENTS ####################################

# Set the max number of connected clients
maxclients 10000

############################## MEMORY MANAGEMENT ###############################

# Set a memory usage limit
maxmemory 512mb

# LRU eviction policy when max-memory reached
maxmemory-policy allkeys-lru

############################# LAZY FREEING ####################################

# Asynchronous freeing of memory
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

############################ KERNEL OOM CONTROL ##############################

# OOM score adj for Redis
oom-score-adj no

############################ KERNEL TRANSPARENT HUGEPAGE ######################

disable-thp yes

############################## APPEND ONLY MODE ###############################

# Enable the AOF (Append Only File)
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy
appendfsync everysec

# Prevent fsync during rewrites
no-appendfsync-on-rewrite no

# Auto rewrite the AOF
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load truncated AOF
aof-load-truncated yes

################################ LUA SCRIPTING  ###############################

# Max execution time for Lua scripts in milliseconds
lua-time-limit 5000

################################ REDIS CLUSTER  ###############################

# cluster-enabled yes

# cluster-config-file nodes.conf

# cluster-node-timeout 15000

################################## SLOW LOG ###################################

# Log execution time of commands exceeding slowlog-log-slower-than
slowlog-log-slower-than 10000

# Maximum length of the slow log
slowlog-max-len 128

################################ LATENCY MONITOR ##############################

latency-monitor-threshold 0

############################# EVENT NOTIFICATION ##############################

notify-keyspace-events ""

############################### ADVANCED CONFIG ###############################

# Hash table settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog settings
hll-sparse-max-bytes 3000

# Stream settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Active defragmentation
activedefrag no
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-ignore-bytes 100mb
active-defrag-cycle-min 1
active-defrag-cycle-max 25

################################## MODULES #####################################

# loadmodule /path/to/module.so
