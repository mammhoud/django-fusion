# =============================================================================
# Blinko — self-hosted personal AI note tool
# =============================================================================
# Open-source, self-hosted personal AI note tool prioritizing privacy.
# Served at tools.structa.cloud/notes/ via the shared-proxy Nginx.
#
# Database: Blinko connects to the **shared** PostgreSQL cluster (`postgres` on
# the `common` network) using its dedicated `blinko` role and database, both
# created by application/databases/postgres/init/00-create-databases.sql on
# first start.  No dedicated blinko-db container needed — one PostgreSQL for
# everything.
#
# Networks: `common` (external) for postgres + proxy connectivity.
# Data: ./blinko-data/ (gitignored) for app-level data only.
# =============================================================================

networks:
  common:
    external: true

services:
  blinko:
    image: blinkospace/blinko:latest
    container_name: blinko
    ports:
      - "${BLINKO_PORT:-1111}:1111"
    environment:
      # Connects to the shared postgres cluster on the common network.
      DATABASE_URL: postgresql://${BLINKO_DB_USER:-blinko}:${BLINKO_DB_PASSWORD:?BLINKO_DB_PASSWORD must be set}@postgres:5432/${BLINKO_DB_NAME:-blinko}
      NEXTAUTH_SECRET: ${BLINKO_NEXTAUTH_SECRET:?BLINKO_NEXTAUTH_SECRET must be set}
      # Blinko is mounted below /notes/ by shared-proxy; both URL settings
      # must use the public prefix while Nginx strips it upstream.
      NEXTAUTH_URL: ${BLINKO_PUBLIC_URL:-https://tools.structa.cloud/notes}
      NEXT_PUBLIC_BASE_URL: ${BLINKO_PUBLIC_URL:-https://tools.structa.cloud/notes}
      BLINKO_PORT: "1111"
      NODE_ENV: production
    volumes:
      - ./blinko-data/app:/app/data
    networks:
      - common
    # PostgreSQL is managed separately by application/databases/ — this file
    # intentionally does not use cross-file depends_on (see the Coder pattern).
    # Blinko retries its database connection on startup while postgres becomes
    # ready, so the start order is safe.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1111/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped