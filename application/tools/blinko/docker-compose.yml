# =============================================================================
# Blinko — self-hosted personal AI note tool
# =============================================================================
# Open-source, self-hosted personal AI note tool prioritizing privacy.
# Served at tools.structa.cloud/notes/ via the tools-proxy Nginx.
#
# Database: Blinko runs on **SurrealDB** (`surrealdb` service below, persistent
# volume, credentials from .env). The SurrealDB migration (M1–M4) moved auth,
# the content graph, and the query engine off Prisma; PostgreSQL is no longer
# required at runtime.
#
# NOTE: pin SurrealDB to the 1.x line. The bundled server pins
# surrealdb.js@^1.0.0, which rejects v2/v3 engines (UnsupportedVersion), and
# server/lib/scheduler.ts uses v1-compatible upsert semantics
# (`UPDATE ... MERGE` on an explicit record ID).
#
# Networks: `common` (external) for proxy connectivity.
# Data: ./blinko-data/ (gitignored) — app data + SurrealDB store.
# =============================================================================

networks:
  common:
    external: true

services:
  surrealdb:
    image: surrealdb/surrealdb:v1.5.6
    container_name: blinko-surreal
    command: start --user root --pass ${SURREALDB_PASS:-blinko} file:/data/blinko.db
    ports:
      - "${SURREALDB_PORT:-8000}:8000"
    volumes:
      - ./blinko-data/surreal:/data
    networks:
      - common
    healthcheck:
      # The surrealdb image is shell-less (scratch); use the binary's
      # built-in readiness probe instead of wget/curl.
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  blinko:
    build:
      context: ./blinko
      dockerfile: dockerfile
      args:
        USE_MIRROR: "${USE_MIRROR:-false}"
    image: blinko-local:latest
    container_name: blinko
    depends_on:
      surrealdb:
        condition: service_healthy
    ports:
      - "${BLINKO_PORT:-1111}:1111"
    environment:
      NEXTAUTH_SECRET: ${BLINKO_NEXTAUTH_SECRET:-blinko-secret-change-me}
      # Blinko is mounted below /notes/ by tools-proxy; both URL settings
      # must use the public prefix while Nginx strips it upstream.
      NEXTAUTH_URL: ${BLINKO_PUBLIC_URL:-https://tools.structa.cloud/notes}
      NEXT_PUBLIC_BASE_URL: ${BLINKO_PUBLIC_URL:-https://tools.structa.cloud/notes}
      BLINKO_PORT: "1111"
      NODE_ENV: production
      # SurrealDB — sole datastore after the Prisma→SurrealDB migration.
      SURREALDB_URL: http://surrealdb:8000/rpc
      SURREALDB_USER: root
      SURREALDB_PASS: ${SURREALDB_PASS:-blinko}
      SURREALDB_NS: blinko
      SURREALDB_DB: blinko
    volumes:
      - ./blinko-data/app:/app/data
    networks:
      - common
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1111/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped