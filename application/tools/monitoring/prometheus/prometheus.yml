# Prometheus scrape configuration for the Structa Cloud monitoring stack.
# Add product targets (Django /metrics endpoints via django-prometheus) under
# the `django-sites` job as they are exposed.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  # xyOps — operations automation platform at ops.structa.cloud.
  # xyOps is itself a monitoring system (collects via xySat agents) and does
  # NOT expose a native Prometheus /metrics endpoint. This job scrapes the
  # health ping for basic uptime/latency monitoring via the prometheus
  # blackbox-exporter-like `metrics_path`. Revisit if xyOps adds a metrics
  # endpoint; meantime, use xyOps's own built-in dashboards for job/server
  # metrics.  Added to `common` network in xyops/docker-compose.yml.
  - job_name: xyops
    metrics_path: /api/app/ping
    static_configs:
      - targets: ['xyops:5522']
        labels:
          service: 'xyops'
          host: 'ops.structa.cloud'

  # Django product metrics (django-prometheus). Uncomment and add the
  # container names of each site backend once it exposes /metrics.
  # - job_name: django-sites
  #   static_configs:
  #     - targets:
  #         - 'precis-ctc-website:5070'
  #         - 'precis-landing-backend:8000'
