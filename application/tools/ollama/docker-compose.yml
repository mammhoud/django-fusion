# =============================================================================
# Ollama + Open WebUI — self-hosted LLM inference
# =============================================================================
# Backs the existing MCP agent configs (.agents/mcp/*) and Syntara/CeptorAI,
# which already point at `ollama:11434` / OLLAMA_BASE_URL. Models are pulled on
# demand into ./data (gitignored). Open WebUI provides the browser UI and is
# routed by Traefik → shared-proxy Nginx at tools.structa.cloud/ai/ (see
# application/proxy/configs/traefik/dynamic/tools.yml).
#
# Networks:
#   - common     → Django/MCP services resolve `ollama` by name
#   - ollama-net → dedicated inference network (created by make create-networks)
# =============================================================================

networks:
  common:
    external: true
  ollama-net:
    external: true
  traefik-net:
    external: true

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data:/root/.ollama
    networks:
      - common
      - ollama-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-main}
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-}
      WEBUI_AUTH: "false"
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - common
      - ollama-net
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  open-webui-data:
    name: open-webui-data
