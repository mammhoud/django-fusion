# ============================================
# Traefik Static Configuration
# ============================================

# ============================================
# Global Configuration
# ============================================
global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO
  format: common

accessLog:
  format: common
  bufferingSize: 100

api:
  dashboard: true
  insecure: true # Set to false in production!

ping: {}  # Enable /ping health endpoint

# ============================================
# EntryPoints
# ============================================
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: web-secure
          scheme: https
          permanent: true

  web-secure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# ============================================
# Providers
# ============================================
providers:
  # Docker provider disabled — Docker 29+ raised minimum API to 1.44
  # but Traefik's Go client negotiates down to 1.24 (known bug).
  # All services are configured via the file provider below.
  # docker:
  #   endpoint: "unix:///var/run/docker.sock"
  #   exposedByDefault: false
  #   network: traefik-net
  #   watch: true

  file:
    directory: /etc/traefik/dynamic
    watch: true

# ============================================
# Let's Encrypt (ACME)
# ============================================
certificatesResolvers:
  letsencrypt:
    acme:
      email: "vresume@structa.cloud"
      storage: /etc/traefik/acme/acme.json
      # Use staging for testing:
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      # To change this, set ACME_CA_SERVER in your container environment and update this file
      # Use production ACME server by default. Set ACME_CA_SERVER in your container environment
      # to override for testing or staging.
      # caServer: "https://acme-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web
      # Uncomment for DNS challenge (recommended for wildcard certs)
      # dnsChallenge:
      #   provider: cloudflare
      #   delayBeforeCheck: 0
