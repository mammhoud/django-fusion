# ============================================
# VRESUME.STRUCTA.CLOUD CONFIGURATION
# Domain: vresume.structa.cloud, www.vresume.structa.cloud
# ============================================
http:
  routers:
    # Redirect HTTP to HTTPS for media/static files
    vresume-media-http:
      rule: "(Host(`vresume.structa.cloud`) || Host(`www.vresume.structa.cloud`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: vresume-media-service
      priority: 100

    # HTTPS for media/static files
    vresume-media-https:
      rule: "(Host(`vresume.structa.cloud`) || Host(`www.vresume.structa.cloud`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: vresume-media-service
      priority: 100
      tls:
        certResolver: letsencrypt
        domains:
          - main: "vresume.structa.cloud"
            sans: ["www.vresume.structa.cloud"]

    # HTTPS for main site
    vresume-site-https:
      rule: "Host(`vresume.structa.cloud`) || Host(`www.vresume.structa.cloud`)"
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: vresume-site-service
      tls:
        certResolver: letsencrypt

  services:
    # Django backend
    vresume-site-service:
      loadBalancer:
        servers:
          - url: "http://vresume-website:5072"
        healthCheck:
          path: /
          interval: 30s
          timeout: 10s
          headers:
            Host: "vresume.structa.cloud"
            X-Forwarded-Proto: "https"

    # Nginx media/static server
    vresume-media-service:
      loadBalancer:
        servers:
          - url: "http://vresume-website-media:8273"
