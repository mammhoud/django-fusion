# ReadTheDocs Configuration
# https://docs.readthedocs.io/en/stable/config-file/v2/

version: 2

# Build documentation with MkDocs
build:
  os: ubuntu-20.04
  tools:
    python: "3.11"

# Build PDF and ePub
formats:
  - pdf
  - epub

# Python configuration
python:
  version: 3.11
  install:
    - requirements: docs/requirements.txt

# MkDocs configuration
mkdocs:
  configuration: mkdocs.yml

# Specify which branches to build
branches:
  include:
    - main
    - develop
  exclude:
    - staging

# Specify the submodules to include
submodules:
  include: all

# Specify environment variables
env:
  READTHEDOCS: "True"

# Specify the git configuration
git:
  depth: full

# Specify the search configuration
search:
  ranking:
    - index.md
    - getting-started.md
    - architecture/index.md
    - api/index.md

# Specify the build triggers
build_triggers:
  - branch: main
    event: push
  - branch: develop
    event: push

# Specify the preview builds
preview:
  enabled: true
  max_concurrent_builds: 4

# Specify the automation rules
automation_rules:
  - event: push
    branch: main
    action: build
  - event: pull_request
    action: build

# Specify the security settings
security:
  allowed_hosts:
    - vresume.readthedocs.io
    - vresume.structa.cloud

# Specify the CDN settings
cdn:
  enabled: true
  cache_ttl: 3600

# Specify the logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
