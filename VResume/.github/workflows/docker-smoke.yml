name: Docker Smoke

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: docker-smoke-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    name: Build and boot Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build and start containers
        run: docker compose up -d --build --remove-orphans

      - name: Show container status
        run: docker compose ps -a

      - name: Fail if any container exited or is unhealthy
        run: |
          set -e
          BAD_CONTAINERS="$(docker compose ps -a --status exited --services)"
          if [ -n "$BAD_CONTAINERS" ]; then
            echo "❌ Found exited containers:"
            echo "$BAD_CONTAINERS"
            docker compose logs --timestamps || true
            exit 1
          fi
          UNHEALTHY_CONTAINERS="$(docker compose ps --format '{{.Name}} {{.Status}}' | grep -Ei 'unhealthy' || true)"
          if [ -n "$UNHEALTHY_CONTAINERS" ]; then
            echo "❌ Found unhealthy containers:"
            echo "$UNHEALTHY_CONTAINERS"
            docker compose logs --timestamps || true
            exit 1
          fi

      - name: Fail if logs contain error patterns
        run: |
          set -e
          docker compose logs --timestamps > docker-compose.logs
          if grep -E -i "(traceback|fatal|panic|unhandled exception|\\berror\\b)" docker-compose.logs; then
            echo "❌ Error patterns detected in container logs"
            exit 1
          fi
          echo "✅ No error patterns detected in container logs"

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.logs
          if-no-files-found: warn

      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans
