{# Contact Map Section #}
{# Displays Google Maps embed from Wagtail settings or static fallback #}
{% load i18n %}

<section class="contact-map vresume-section" data-contact-map>
  <figure class="contact-map__figure">
    {% if page.map_embed_url %}
      <iframe
        class="contact-map__iframe"
        src="{{ page.map_embed_url }}"
        width="100%" height="100%" loading="lazy"></iframe>
    {% elif vresume_settings.map_embed_url %}
      <iframe
        class="contact-map__iframe"
        src="{{ vresume_settings.map_embed_url }}"
        width="100%" height="100%" loading="lazy"></iframe>
    {% else %}
      <iframe
        class="contact-map__iframe"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d199666.5651251294!2d-121.58334177520186!3d38.56165006739519!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809ac672b28397f9%3A0x921f6aaa74197fdb!2sSacramento%2C%20CA%2C%20USA!5e0!3m2!1sen!2sbd!4v1647608789441!5m2!1sen!2sbd"
        width="100%" height="100%" loading="lazy"></iframe>
    {% endif %}
  </figure>
</section>
