{% load i18n %}
{# Subscribe Newsletter Section #}
{% if page.subscribe_newsletter %}
<section class="newsletter vresume-section">
    <h3 class="vresume-section-title">{% trans "Subscribe Newsletter" %}</h3>
    <p class="newsletter__subtitle">{% trans "Get updates on new projects and insights delivered to your inbox." %}</p>
    
    <form class="newsletter__form" 
          hx-post="{% url 'pages:subscribe' %}"
          hx-target="#newsletter-response"
          hx-swap="innerHTML"
          hx-indicator="#newsletter-loading">
        {% csrf_token %}
        
        <div class="contact-form__wrap-input">
            <input type="email" name="email" class="contact-form__input" 
                   placeholder="{% trans 'Enter your email address' %}" required>
        </div>
        
        <div class="contact-form__btn-container">
            <button type="submit" class="contact-form__btn">
                <span>
                    {% trans "Subscribe" %}
                    <i class="ri ri-send-plane-line" id="newsletter-loading"></i>
                </span>
            </button>
        </div>
    </form>
    
    <div id="newsletter-response" class="contact-form__response"></div>
</section>
{% endif %}
