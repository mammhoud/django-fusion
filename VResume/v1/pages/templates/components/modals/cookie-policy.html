{# Cookie Policy Content — rendered into bootbox.dialog() via main.js #}
{% load i18n %}

<template id="cookie-policy-template">
    <div class="px-3 py-2">
        <p>{% trans "This website uses cookies to improve your experience and ensure basic functionality." %}</p>

        <ul>
            <li class="mb-2">
                <strong>{% trans "Essential Cookies:" %}</strong>
                {% trans "Required for the site to function properly, such as remembering your theme preference or cookie consent state." %}
            </li>
            <li class="mb-2">
                <strong>{% trans "Analytics Cookies:" %}</strong>
                {% trans "Help us understand how visitors interact with the website by collecting and reporting information anonymously." %}
            </li>
            <li class="mb-2">
                <strong>{% trans "Marketing Cookies:" %}</strong>
                {% trans "Used to track visitors across websites. The intention is to display ads that are relevant and engaging for the individual user." %}
            </li>
        </ul>
    </div>
</template>
