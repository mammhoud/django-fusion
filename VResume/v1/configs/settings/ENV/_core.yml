default:
  # Extends all defaults with development-specific values
  # ====================================
  # 🌐 Core Configuration (All Environments)
  # ====================================

  # ====================================
  # 🎯 Application Core
  # ====================================
  APP_NAME: "Virtual Resume"
  APP_VERSION: "1.0.0"
  SERVER_ENV: "@env SERVER_ENV development"
  RUNNING_ENV: "@env RUNNING_ENV local"
  MODULE: "@env MODULE CMS"

  # ====================================
  # 🏗️ Django Core
  # ====================================
  DJANGO_SETTINGS_MODULE: "@env DJANGO_SETTINGS_MODULE configs.settings"
  DJANGO_ASGI_APPLICATION: "core.server:application"
  DJANGO_WSGI_APPLICATION: "core.server:application"

  # ====================================
  # 🌍 Internationalization
  # ====================================
  LANGUAGE_CODE: "en-us"
  TIME_ZONE: "UTC"
  USE_I18N: true
  USE_TZ: true
  USE_L10N: true

  # ====================================
  # 🔧 Feature Flags
  # ====================================
  DEBUG: "@env DEBUG false"
  ENABLE_DEBUG_TOOLBAR: false
  ENABLE_SWAGGER: false
  ENABLE_SILK_PROFILING: false
  ENABLE_GRAPHQL: false
  ENABLE_API_DOCS: false

  # ====================================
  # 🌐 Host & Domain Defaults
  # ====================================
  DJANGO_HOST: "@env DJANGO_HOST localhost"
  DOMAIN_NAME: "@jinja {{ env.get('DOMAIN_NAME', env.get('DJANGO_HOST', 'localhost')) }}"
  DOCS_HOST: "@env DOCS_HOST docs.localhost"
  TRAEFIK_HOST: "@env TRAEFIK_HOST traefik.localhost"
  SITE_URL: "@jinja {{ 'https://' + env.get('DJANGO_HOST') if env.get('DJANGO_HOST') else 'http://localhost:' + env.get('PORT', '5080') }}"

  # ====================================
  # 👑 Admin Defaults
  # ====================================
  ADMIN:
    SUPERUSER_USERNAME: "@env DJANGO_SUPERUSER_USERNAME"
    SUPERUSER_EMAIL: "@env DJANGO_SUPERUSER_EMAIL"
    SITE_HEADER: "Virtual Resume Administration"
    SITE_TITLE: "Virtual Resume Admin"
    INDEX_TITLE: "Site Administration"
    URL: "admin/"
    SHOW_LANGUAGES: true
    RTL_SUPPORT: true
    SHOW_HISTORY: true
    SHOW_VIEW_ON_SITE: true
    SHOW_BACK_BUTTON: false
    SITE_URL: "/admin"

  # ====================================
  # 🎭 Authentication Defaults
  # ====================================
  AUTH:
    ACCOUNT_ALLOW_REGISTRATION: true
    ACCOUNT_EMAIL_VERIFICATION: "optional"
    ACCOUNT_EMAIL_REQUIRED: true
    ACCOUNT_LOGIN_METHODS: ["email"]
    ACCOUNT_USERNAME_MIN_LENGTH: 4
    ACCOUNT_USERNAME_BLACKLIST: ["admin", "root", "superuser"]
    ACCOUNT_UNIQUE_EMAIL: true
    ACCOUNT_CHANGE_EMAIL: true
    ACCOUNT_LOGOUT_ON_PASSWORD_CHANGE: true
    ACCOUNT_SESSION_REMEMBER: true
    SOCIALACCOUNT_ENABLED: true
    SOCIALACCOUNT_AUTO_SIGNUP: true

  # ====================================
  # 📱 API Defaults
  # ====================================
  API:
    VERSION: "v1"
    BASE_PATH: "/api/v1/"
    DEFAULT_PAGE_SIZE: 20
    MAX_PAGE_SIZE: 100
    ENABLE_VERSIONING: true
    ALLOWED_VERSIONS: ["v1"]

  # ====================================
  # 🎯 Wagtail Defaults
  # ====================================
  WAGTAIL:
    SITE_NAME: "Structa"
    ENABLE_UPDATE_CHECK: false
    PASSWORD_MANAGEMENT_ENABLED: true
    PASSWORD_RESET_ENABLED: true
    I18N_ENABLED: true

  # ====================================
  # 📊 Monitoring Defaults
  # ====================================
  MONITORING:
    ENABLED: false
    HEALTH_CHECKS: true
    METRICS: false
    PROFILING: false
    ALERTING: false

  PERFORMANCE:
    CACHE_MIDDLEWARE_SECONDS: 300
    CACHE_MIDDLEWARE_KEY_PREFIX: "middleware"
    GZIP_ENABLED: true
    GZIP_COMPRESSION_LEVEL: 6

  # ====================================
  # 🏗️ Variant Repositories (Unified)
  # ====================================
  CORE_REPO: "mammhoud/ctc-website"
  BLOG_REPO: "mammhoud/ctc-website"
  LMS_REPO: "mammhoud/ctc-website"
  ALL_REPO: "mammhoud/ctc-website"

testing:
  DEBUG: true
  ENABLE_DEBUG_TOOLBAR: false
  ENABLE_SWAGGER: false
  ENABLE_GRAPHQL: false

development:
  DEBUG: true
  ENABLE_DEBUG_TOOLBAR: true
  ENABLE_SWAGGER: true
  ENABLE_GRAPHQL: true
  ENABLE_API_DOCS: true

demo:
  APP_NAME: "Structa (Demo)"
  DEBUG: true
  ENABLE_DEBUG_TOOLBAR: true
  ENABLE_SWAGGER: true
  ENABLE_GRAPHQL: true
  ENABLE_API_DOCS: true
  MONITORING:
    ENABLED: true
  SENTRY:
    ENABLED: true
    ENVIRONMENT: "demo"
    TRACES_SAMPLE_RATE: 0.5

production:
  # Core
  APP_NAME: "V Resume"
  APP_VERSION: "1.0.0-production"
  DEBUG: false

  # Features
  ENABLE_DEBUG_TOOLBAR: false
  ENABLE_SWAGGER: false
  ENABLE_SILK_PROFILING: false
  ENABLE_GRAPHQL: false
  ENABLE_API_DOCS: false
  ENABLE_VUE_DEV_SERVER: false

  # Monitoring
  MONITORING:
    ENABLED: false
    PROVIDER: "sentry"
    HEALTH_CHECKS_ENABLED: true
    METRICS_ENABLED: true
    ALERTING_ENABLED: true

  # Sentry
  SENTRY:
    ENABLED: false
    DSN: "@env SENTRY_DSN"
    ENVIRONMENT: "production"
    RELEASE: "@format {this.APP_VERSION}"
    TRACES_SAMPLE_RATE: 0.1
    PROFILES_SAMPLE_RATE: 0.0

  # Performance
  PERFORMANCE:
    CACHE_MIDDLEWARE_SECONDS: 900
    GZIP_ENABLED: true
    BROTLI_ENABLED: true
    DATABASE_OPTIMIZATION: true
    TEMPLATE_CACHING: true

  # Scalability
  SCALABILITY:
    HORIZONTAL_SCALING: true
    LOAD_BALANCING: true
    DATABASE_READ_REPLICAS: 2
    CACHE_CLUSTERING: true

  # External Services
  EXTERNAL_SERVICES:
    GOOGLE_ANALYTICS_ID: "@env GOOGLE_ANALYTICS_ID"
    STRIPE_PUBLIC_KEY: "@env STRIPE_PUBLIC_KEY"
    STRIPE_SECRET_KEY: "@env STRIPE_SECRET_KEY"
    AWS_ACCESS_KEY_ID: "@env AWS_ACCESS_KEY_ID"
    AWS_SECRET_ACCESS_KEY: "@env AWS_SECRET_ACCESS_KEY"

  # Backup
  BACKUP:
    ENABLED: true
    SCHEDULE: "daily"
    STORAGE: "s3"
    S3_BUCKET: "@env AWS_BACKUP_BUCKET"
