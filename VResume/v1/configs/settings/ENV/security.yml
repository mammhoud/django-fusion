# ====================================
# 🛡️ Security Configuration
# ====================================

# Base defaults that apply to all environments
default:
  SECURITY:
    # Host Validation
    ALLOWED_HOSTS:
      - "localhost"
      - "127.0.0.1"
      - "0.0.0.0"
      - "::1"

    # CORS Configuration
    CORS_ALLOW_ALL_ORIGINS: false
    CORS_ALLOW_CREDENTIALS: true
    CORS_EXPOSE_HEADERS:
      - "Content-Disposition"
    CORS_ALLOWED_ORIGINS:
      - "@jinja http://localhost:{{ env.get('PORT', 5080) }}"
      - "@jinja http://127.0.0.1:{{ env.get('PORT', 5080) }}"

    # CSRF Protection
    CSRF_COOKIE_NAME: "csrftoken"
    CSRF_HEADER_NAME: "X-CSRFToken"
    CSRF_COOKIE_HTTPONLY: false
    CSRF_COOKIE_SAMESITE: "Lax"
    CSRF_FAILURE_VIEW: "django.views.csrf.csrf_failure"
    CSRF_USE_SESSIONS: false
    CSRF_TRUSTED_ORIGINS:
      - "@jinja http://localhost:{{ env.get('PORT', 5080) }}"
      - "@jinja http://127.0.0.1:{{ env.get('PORT', 5080) }}"
      - "@jinja https://{{ env.get('DJANGO_HOST', env.get('DOMAIN_NAME', 'localhost')) }}"

    # HTTPS/SSL Security
    SECURE_SSL_REDIRECT: "@env SECURE_SSL_REDIRECT false"
    SECURE_HSTS_SECONDS: "@env SECURE_HSTS_SECONDS 0"
    SECURE_HSTS_INCLUDE_SUBDOMAINS: true
    SECURE_HSTS_PRELOAD: "@env SECURE_HSTS_PRELOAD false"
    SECURE_PROXY_SSL_HEADER: ["HTTP_X_FORWARDED_PROTO", "https"]
    SECURE_REDIRECT_EXEMPT: []
    SECURE_REFERRER_POLICY: "same-origin"

    # Session Configuration
    SESSION_COOKIE_NAME: "sessionid"
    SESSION_COOKIE_AGE: 1209600
    SESSION_COOKIE_HTTPONLY: true
    SESSION_COOKIE_SECURE: "@env SESSION_COOKIE_SECURE false"
    SESSION_COOKIE_SAMESITE: "Lax"
    SESSION_COOKIE_PATH: "/"
    SESSION_ENGINE: "django.contrib.sessions.backends.db"

    # Headers Security
    X_FRAME_OPTIONS: "DENY"
    SECURE_CONTENT_TYPE_NOSNIFF: true
    SECURE_BROWSER_XSS_FILTER: true
    X_CONTENT_TYPE_OPTIONS: "nosniff"
    X_XSS_PROTECTION: "1; mode=block"

    # Password Security
    PASSWORD_HASHERS:
      - "django.contrib.auth.hashers.PBKDF2PasswordHasher"
      - "django.contrib.auth.hashers.PBKDF2SHA1PasswordHasher"
      - "django.contrib.auth.hashers.BCryptSHA256PasswordHasher"

    # Rate Limiting
    RATE_LIMIT_ENABLED: "@env RATE_LIMIT_ENABLED false"
    RATE_LIMIT_LOGIN_ATTEMPTS: 10
    RATE_LIMIT_LOGIN_TIMEOUT: 900
    RATE_LIMIT_API_REQUESTS: 1000
    RATE_LIMIT_API_TIMEFRAME: 3600

    # Admin Security
    ADMIN_URL: "@env ADMIN_URL admin/"
    ADMIN_SESSION_COOKIE_AGE: 7200
    ADMIN_CSRF_COOKIE_SECURE: true

    # Authentication
    LOGIN_URL: "/auth/sign-in/"
    LOGIN_REDIRECT_URL: "/dashboard/"
    LOGOUT_REDIRECT_URL: "/"

    # File Upload Security
    FILE_UPLOAD_MAX_MEMORY_SIZE: 26214400
    DATA_UPLOAD_MAX_MEMORY_SIZE: 26214400

# Development environment - minimal restrictions
development:
  SECURITY:
    ALLOWED_HOSTS:
      - "*"
    CORS_ALLOW_ALL_ORIGINS: true
    SECURE_SSL_REDIRECT: false
    SESSION_COOKIE_SECURE: false
    CSRF_COOKIE_SECURE: false

# Demo/staging environment - balanced security
demo:
  SECURITY:
    ALLOWED_HOSTS:
      - "@jinja {{ env.get('DOMAIN_NAME', 'demo.vresume.local') }}"
      - "localhost"

    SECURE_SSL_REDIRECT: true
    SECURE_HSTS_SECONDS: 2592000
    SESSION_COOKIE_SECURE: true
    CSRF_COOKIE_SECURE: true

# Production environment - maximum security
production:
  SECURITY:
    ALLOWED_HOSTS:
      - "website" # static docker/service alias
      - "localhost" # static local health checks
      - "127.0.0.1" # static loopback
      - "0.0.0.0" # static bind host
      - "vresume-website" # internal service alias
      - "docs" # internal docs service alias
      - "structa.cloud" # external domain
      - "www.structa.cloud" # www subdomain
      - "@jinja {{ env.get('DJANGO_HOST', env.get('DOMAIN_NAME', 'vresume.com')) }}"
      - "@jinja www.{{ env.get('DJANGO_HOST', env.get('DOMAIN_NAME', 'vresume.com')) }}"

    SECURE_SSL_REDIRECT: "@env SECURE_SSL_REDIRECT true"
    SECURE_HSTS_SECONDS: 31536000
    SECURE_HSTS_PRELOAD: true
    SESSION_COOKIE_SECURE: true
    CSRF_COOKIE_SECURE: true
    LOG_FAILED_LOGIN_ATTEMPTS: true
    LOG_SUSPICIOUS_ACTIVITY: true
