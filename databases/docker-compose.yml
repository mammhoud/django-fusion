# docker-compose.yml for coolify/databases
# Define database services (e.g., PostgreSQL, Redis) specific to this group.
# This file will be merged by the root compose when building.
services:
  coolify-db:
    container_name: coolify-db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coolify_password}
      POSTGRES_DB: ${POSTGRES_DB:-coolify}
    volumes:
      - coolify-db-data:/var/lib/postgresql/data
    networks:
      - coolify
