<body>
  <a class="skip-to-content" href="#/README">Skip to content</a>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Structa Cloud',
      repo: 'https://github.com/mammhoud/structa.cloud',
      // Served under the shared media host at /docs/ (see
      // applications/proxy/nginx/default.conf). History-mode routing
      // requires the explicit basePath so markdown/sidebar fetches resolve
      // under the subpath instead of the domain root.
      basePath: '/docs/',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      externalLinkTarget: '_blank',
      routerMode: 'history'
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
