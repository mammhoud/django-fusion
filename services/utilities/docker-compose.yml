version: '3.8'

services:
  # Prometheus - Monitoring and metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - utilities-net
      - traefik-net
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: logging-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki.yml:/etc/loki/loki.yml:ro
      - ./logging/data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - utilities-net
      - traefik-net
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/loki/api/v1/status/buildinfo"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.localhost`)"
      - "traefik.http.routers.loki.entrypoints=web"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PATHS_LOGS: /var/log/grafana
    networks:
      - utilities-net
      - traefik-net
      - coolify
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # Blinko - Note-taking and knowledge management
  blinko:
    image: blinko:latest
    container_name: utilities-blinko
    restart: unless-stopped
    ports:
      - "3010:3010"
    volumes:
      - ./services/blinko/data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3010
    networks:
      - utilities-net
      - traefik-net
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3010/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blinko.rule=Host(`blinko.localhost`)"
      - "traefik.http.routers.blinko.entrypoints=web"
      - "traefik.http.services.blinko.loadbalancer.server.port=3010"

networks:
  utilities-net:
    driver: bridge
    name: utilities-net
  internal:
    external: true
    name: internal
  coolify:
    external: true
    name: coolify
  traefik-net:
    external: true
    name: traefik-net
