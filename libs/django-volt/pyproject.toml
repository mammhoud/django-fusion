[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-volt"
version = "0.4.0"
description = "AI-powered data simulation and analytics framework for Django"
requires-python = ">=3.11"
dependencies = ["django>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["django_volt"]
