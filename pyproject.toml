[project]
name = "django-fusion"
version = "0.1.0"
description = "Reusable Django and Wagtail helpers for Structa Cloud sites"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "wagtail",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"], include = ["django_fusion*"]}}
include-package-data = true

[tool.pytest.ini_options]
addopts = ["-v"]
testpaths = ["tests"]
pythonpath = ["src"]
