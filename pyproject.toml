[project]
name = "django-fusion"
version = "0.5.0"
description = "Reusable Django and Wagtail helpers for Structa Cloud sites - component system, routing, forms/tables, allauth, Wagtail, and a `{% comp %}` template tag."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
# @tested django-fusion v0.2.0 - Built, linted (ruff), tested (pytest) with Django 4.2/5.0 on Python 3.11/3.12
authors = [
    { name = "Structa Cloud Team", email = "dev@structa.cloud" },
]
keywords = [
    "django",
    "wagtail",
    "components",
    "routing",
    "htmx",
    "allauth",
    "templating",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "attrs>=26.1.0",
    "colorama>=0.4.6",
    "django>=4.2",
    "django-colorfield",
    "dynaconf>=3.2,<4.0",
    "pluggy>=1.6.0",
    "pydantic>=2.0",
    "structlog>=24.1.0",
    "wagtail",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "hypothesis",
]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "hypothesis",
    "build",
    "twine",
]
webpack = [
    "django-webpack-loader>=3.2.3",
]
bolt = [
    "django-bolt>=0.4; python_version >= \"3.12\"",
    "msgspec>=0.21",
    "PyJWT>=2.8",
]
tables = [
    "django-tables2>=2.7",
]
auth = [
    "django-allauth>=65",
]

[project.urls]
Homepage = "https://github.com/mammhoud/django-fusion"
Repository = "https://github.com/mammhoud/django-fusion.git"
Issues = "https://github.com/mammhoud/django-fusion/issues"
Documentation = "https://github.com/mammhoud/django-fusion/tree/generic/docs"
Changelog = "https://github.com/mammhoud/django-fusion/blob/generic/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"], include = ["django_fusion*"]}}

# ---------------------------------------------------------------------------
# Recognized environment variables (opt-in diagnostics)
#
# The conftest recognizes *one* opt-in for diagnostics:
#
#   DJANGO_DEBUG_CONFTEST=1
#
#     When this is set in the env, conftest.py prints the active
#     Django TEMPLATES configuration (BACKEND, DIRS, APP_DIRS,
#     builtins, libraries, context_processors) plus the value of
#     DJANGO_SETTINGS_MODULE - useful when debugging "which settings
#     is actually active" scenarios.
#
#     The guard is exact-match `os.environ.get("DJANGO_DEBUG_CONFTEST") == "1"`,
#     NOT a truthy check, so empty strings / accidental values do NOT
#     trigger the print. This is enforced by
#     `tests/test_conftest_debug_is_quiet.py` (negative + positive
#     control).
#
#     Usage:
#         DJANGO_DEBUG_CONFTEST=1 uv run pytest -s tests/test_form_components.py
#
# Other env vars considered and rejected (for posterity):
#   - `DJANGO_SETTINGS_MODULE=tests.settings` - pytest-django would load
#     `tests/settings.py`, but django-fusion's tests/ stubs use Python's
#     regular sys.path import chain which pytest-django's lazy engine
#     init can fail to resolve. The conftest-side `settings.configure()`
#     remains the simplest working approach.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = ["-v"]
testpaths = ["tests"]
pythonpath = ["src"]
