# ============================================================================
# Structa Cloud — Unified Monorepo Workspace Root (uv)
# ============================================================================
#
# This is a *workspace orchestrator*, not a buildable package.
# All dependencies, build config, and scripts live in:
#   projects/pyproject.toml   — main package + dependency source-of-truth
#   libs/django-fusion/       — local lib (editable, via [tool.uv.sources])
#
# Single `.venv` at the repo root serves ALL local development.
# Docker builds use their own isolated env; never mount .venv.
#
# Rye-compatible: `uv` is the engine behind Rye. For Rye-specific
# scripts, install rye (`pip install rye`) and add [tool.rye.scripts].
#
# Quick start:
#   uv sync                  # Create/update unified .venv
#   uv run pytest            # Run tests from repo root
#   uv run -m django check   # Run Django checks (from projects/)
#   make venv-setup          # Same as uv sync + status info
#
# Python version: 3.11 (pinned in .python-version + Dockerfile)

# ── uv workspace config ─────────────────────────────────────────────────────

[tool.uv.workspace]
members = [
    "projects",
]

# Local sources for internal libs (editable installs).
# These are consumed by projects/pyproject.toml via its own
# [tool.uv.sources] which also points here — both root and
# projects/ resolve to the same lib paths.
[tool.uv.sources]
django-fusion = { path = "libs/django-fusion", editable = true }

# ── pytest configuration ───────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["--strict-markers", "--strict-config", "-v", "--tb=short", "--no-header", "--import-mode=importlib"]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = [
    "tests",
    "libs/django-fusion/tests/analyzer",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [
    ".",
    "libs/django-fusion/src",
]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
    "unit: unit tests",
    "django_db: enable database access for tests",
]

# ── Ruff (linter + formatter) ──────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Bumpver (versioning) ───────────────────────────────────────────────────

[tool.bumpver]
current_version = "1.0.3"
version_pattern = "MAJOR.MINOR.PATCH[-TAG]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['version = "{version}"']
"projects/__about__.py" = ['^__version__ = "{version}"']
"projects/VERSION" = ['^{version}$']

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
    "ruff>=0.11.0",
]
