[project]
name = "websites-workspace"
version = "1.0.3"
requires-python = ">=3.11"
# Shared dependencies across all workspace members.
# Individual members inherit these via the workspace mechanism.
dependencies = [
    # Core
    "click", "colorlog", "fire",
    "django>=4.2",
    # Auth & accounts
    "django-allauth[socialaccount]",
    # UI & templates
    "django-bird", "django-colorfield",
    "django-crispy-forms", "django-heroicons", "django-htmx",
    "django-unfold",
    # Dev tools
    "django-debug-toolbar", "django-extensions", "django-silk",
    # Data & forms
    "django-embed-video", "django-import-export", "django-simple-history",
    "django-tables2", "django-webpack-loader",
    # API
    "django-ninja", "ninja",
    # Payments
    "django-paypal", "stripe",
    # Cache & queue
    "django-redis", "django-rq", "celery[redis]",
    # Storage & media
    "django-storages[boto3]",
    # Config & env
    "django-environ", "dynaconf[vault]", "environ",
    # Logging & monitoring
    "django-structlog", "python-json-logger", "structlog",
    "sentry-sdk[django]",
    # Wagtail CMS
    "wagtail", "wagtail-font-awesome-svg", "wagtail-newsletter[mailchimp]",
    "wagtail-transfer", "wagtailfontawesome",
    # Server
    "gunicorn", "uvicorn", "watchfiles", "whitenoise",
    # DB
    "psycopg", "psycopg-binary",
    # Utilities
    "draftjs-exporter", "fido2", "hypothesis", "jinja2", "jwt",
    "livereload", "marshmallow", "pydantic", "pydantic-settings",
    "pytest", "pytest-django", "virtualenv",
    # Internal libs (sourced from GitHub — see [tool.uv.sources])
    "django-grep", "django-osoul", "django-rseal",
]

[tool.uv.workspace]
members = ["lms-demo", "ctc-research"]

# GitHub sources for internal libs — used by all workspace members.
# Pin to the 'generic' branch; uv resolves the exact commit at sync time.
[tool.uv.sources]
django-osoul = { git = "https://github.com/mammhoud/django-osoul", branch = "generic" }
django-rseal = { git = "https://github.com/mammhoud/django-rseal", branch = "generic" }
django-grep  = { git = "https://github.com/mammhoud/django-grep",  branch = "generic" }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["--strict-markers", "--strict-config", "-v", "--tb=short", "--no-header"]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
    "unit: unit tests",
    "django_db: enable database access for tests",
]

[tool.bumpver]
current_version = "1.0.3"
version_pattern = "MAJOR.MINOR.PATCH[-TAG]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml"                   = ['version = "{version}"']
"lms-demo/pyproject.toml"         = ['version = "{version}"']
"lms-demo/__about__.py"           = ['^__version__ = "{version}"']
