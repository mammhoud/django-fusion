# ============================================================
# Structa Project - Docker Compose
# Run infra first: docker compose up -d postgres redis (from workspace root)
# Then: docker compose -f structa.cloud/docker-compose.yml up -d
# ============================================================

x-django-base: &django-base
  build:
    context: .
    dockerfile: ./compose/django/Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  environment:
    - RUNNING_ENV=docker
  networks:
    - traefik-net
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${PORT:-5071}/health/ || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

networks:
  traefik-net:
    external: true

volumes:
  website_static:
    external: true
    name: website_static
  website_media:
    external: true
    name: website_media

services:
  # ============================================================
  # DJANGO MAIN APP
  # ============================================================
  website:
    <<: *django-base
    image: website
    container_name: structa-website
    external_links:
      - postgres
      - redis
    ports:
      - "5071:5071"
    volumes:
      - ./libs:/venv/libs:z
      - website_static:/app/assets/staticfiles:z
      - website_media:/app/assets/media:z
    environment:
      - RUNNING_ENV=docker
      - RELOAD=${RELOAD:-false}
      - SERVER_ENV=production
      - DEBUG=False
      - PORT=5071
      - DB_HOST=postgres
      - DB_NAME=db_structa
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/3
      - DJANGO_SETTINGS_MODULE=configs.settings
      - APP_MODULE=alliance.asgi:application
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*,structa-website,localhost,127.0.0.1,core.structa.cloud,structa.cloud,www.structa.cloud}
      - RUN_SETUP=true
      - LOAD_FIXTURES=${LOAD_FIXTURES:-false}
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:-admin}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-admin@structa.cloud}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-mk_pAssWord123}
      - DJANGO_SECURE_SSL_REDIRECT=false
      - DJANGO_SECURE_PROXY_SSL_HEADER=('HTTP_X_FORWARDED_PROTO', 'https')

  # ============================================================
  # WEBSITE-MEDIA - Static & Media Files
  # ============================================================
  website-media:
    build:
      context: .
      dockerfile: ./compose/nginx/Dockerfile
    image: website-media
    container_name: structa-website-media
    ports:
      - "8272:80"
    volumes:
      - website_static:/var/www/static:ro
      - website_media:/var/www/media:ro
    networks:
      - traefik-net
    restart: unless-stopped
    depends_on:
      - website
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # RQ WORKER
  # ============================================================
  website-worker:
    <<: *django-base
    image: website-worker
    container_name: structa-website-worker
    depends_on:
      - website
    external_links:
      - postgres
      - redis
    volumes:
      - ./libs:/venv/libs:z
      - website_static:/app/assets/staticfiles:z
      - website_media:/app/assets/media:z
    environment:
      - RUNNING_ENV=docker
      - SERVER_ENV=production
      - PORT=5075
      - DB_HOST=postgres
      - DB_NAME=db_structa
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/3
      - DJANGO_SETTINGS_MODULE=configs.settings
      - APP_MODULE=alliance.asgi:application
    command: /rqworker-start
    healthcheck:
      test: ["CMD-SHELL", "python com rqworker --help > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
