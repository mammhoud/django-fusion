# ============================================================
# Root Docker Compose – includes all sub‑compose files
# All networks and volumes are defined here to avoid conflicts.
# ============================================================

include:
  - applications/databases/docker-compose.yml
  - applications/proxy/docker-compose.yml
  - applications/compose/docker-compose.applications.yml
  # - services/utilities/docker-compose.yml
  # - services/ollama/docker-compose.yml
  # - services/mailpit/docker-compose.yml
  # - compose/docker-compose.docs.yml


# Global networks – all services will use these
networks:
  common:
    name: common
    driver: bridge
  traefik-net:
    name: traefik-net
    driver: bridge
  internal:
    name: internal
    driver: bridge
    internal: true
  utilities-net:
    name: utilities-net
    driver: bridge
  warehouse-net:
    name: warehouse-net
    driver: bridge
  ollama-net:
    name: ollama-net
    driver: bridge

# Global volumes – shared across services
volumes:
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  ctc-research-static:
    name: ctc-research-static
  ctc-research-media:
    name: ctc-research-media
  lms-static:
    name: lms-static
  lms-media:
    name: lms-media
  vresume-static:
    name: vresume-static
  vresume-media:
    name: vresume-media
  crm-static:
    name: crm-static
  crm-media:
    name: crm-media
  prometheus_data:
    name: prometheus_data
  loki_data:
    name: loki_data
  grafana_data:
    name: grafana_data
  mailpit-data:
    name: mailpit-data
  ollama:
    name: ollama
  open-webui:
    name: open-webui
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  cypercloud-static:
    name: cypercloud-static
  cypercloud-media:
    name: cypercloud-media
  cypercloud-data:
    name: cypercloud-data