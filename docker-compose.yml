# ============================================================
# Structa Cloud Workspace Compose Orchestrator
# ============================================================
# Runs the shared proxy, warehouse services, the three websites, and media
# frontends from the single canonical compose/ directory.
#
# Usage:
#   docker compose up -d
#   docker compose up -d traefik postgres redis ctc-research-website
# ============================================================

include:
  - path: compose/docker-compose.traefik.yml
  - path: compose/docker-compose.warehouse.yml
  - path: compose/docker-compose.yml
  - path: compose/docker-compose.nginx.yml
