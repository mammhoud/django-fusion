# ============================================================
# Alliance Standard Infrastructure (Non-Traefik)
# Simplified setup for local development.
# ============================================================

# ------------------------------------------------------------
# NETWORKS
# ------------------------------------------------------------
networks:
  traefik-net:
    external: true

services:
  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  # ============================================================
  # CORE - Django/Uvicorn Application
  # ============================================================
  core:
    build:
      context: ..
      dockerfile: ./structa.cloud/compose/django/Dockerfile
    image: alliance-website
    container_name: alliance-website
    restart: unless-stopped
    ports:
      - "${PORT:-8280}:5080"
    env_file:
      - ./.env
    volumes:
      - ../venv/libs:/venv/libs:rw
      - alliance_static:/app/assets/staticfiles:rw
      - alliance_media:/app/assets/media:rw
    environment:
      - PORT=5080
      - RUNNING_ENV=docker
      - SERVER_ENV=production
      - DEBUG=False
      - RELOAD=${RELOAD:-false}
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,alliance-website,*
      - RUN_SETUP=true
      - AUTH_CSRF_COOKIE_SECURE=False
      - DB_HOST=postgres
      - DB_NAME=db_structa
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-mk_pAssWord123}
      - DB_PORT=5432
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5080/health/ || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  # ============================================================
  # MEDIA - Nginx for static/media file serving
  # ============================================================
  alliance-media:
    build:
      context: .
      dockerfile: ./compose/nginx/Dockerfile
    image: alliance-media
    container_name: alliance-media
    restart: unless-stopped
    ports:
      - "${MEDIA_PORT:-8281}:80"
    volumes:
      - alliance_static:/var/www/static:ro
      - alliance_media:/var/www/media:ro
    depends_on:
      - core
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/static/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  alliance_static:
  alliance_media:
