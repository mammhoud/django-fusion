# ============================================================
# Infrastructure Services - Main Docker Compose
# Traefik, PostgreSQL, Redis, and supporting services
# ============================================================

networks:
  traefik-net:
    name: traefik-net
    driver: bridge

# ------------------------------------------------------------
# COMMON TEMPLATE BLOCKS
# ------------------------------------------------------------
x-django-base: &django-base
  restart: unless-stopped
  environment:
    - RUNNING_ENV=docker
  networks:
    - traefik-net
  healthcheck:
    test: ["CMD", "/root/.local/bin/uv", "run", "python", "com", "check"]
    interval: 30s
    timeout: 20s
    retries: 3
    start_period: 40s

services:
  # ============================================================
  # TRAEFIK REVERSE PROXY
  # ============================================================
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./compose/data/traefik_acme:/etc/traefik/acme
      - ./compose/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./compose/traefik/dynamic:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TRAEFIK_ACME_EMAIL: ${TRAEFIK_ACME_EMAIL:-admin@structa.cloud}
    networks:
      - traefik-net

  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  postgres:
    build:
      context: ./compose/postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mk_pAssWord123}
      INITDB_MULTIPLE_DATABASES: ${POSTGRES_DATABASES:-db_site,db_ctc,db_structa,blinko}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./compose/data/postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traefik-net

  # ============================================================
  # REDIS CACHE
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - ./compose/data/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traefik-net

  # ============================================================
  # REDIS STRUCTA - Dedicated Redis for Structa Core
  # ============================================================
  redis-structa:
    image: redis:7-alpine
    container_name: redis-structa
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password} --databases 16
    volumes:
      - ./compose/data/redis_structa:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traefik-net

  # ============================================================
  # ADMINER - Database Management
  # ============================================================
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    environment:
      ADMINER_DESIGN: ${ADMINER_DESIGN:-dracula}
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - traefik-net
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # BLINKO - Notes Application
  # Domain: space.structa.cloud
  # ============================================================
  blinko:
    image: blinkospace/blinko:latest
    container_name: blinko
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mk_pAssWord123}@postgres:5432/blinko
      NEXTAUTH_SECRET: ${BLINKO_SECRET:-my-secret-key-change-me}
      NEXTAUTH_URL: ${BLINKO_URL:-https://space.structa.cloud}
    networks:
      - traefik-net
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # CORE - Django/Uvicorn Application
  # Domain: core.structa.cloud
  # ============================================================
  core:
    <<: *django-base
    build:
      context: ./core
      dockerfile: ./compose/django/Dockerfile
    image: core
    container_name: core
    env_file:
      - core/.env
    volumes:
      - ./libs:/libs:z
      - core_static:/app/assets/staticfiles:z
      - core_media:/app/assets/media:z
    environment:
      - RUNNING_ENV=docker
      - RELOAD=${RELOAD:-false}
      - SERVER_ENV=production
      - DEBUG=False
      - PORT=5080
      - WORKERS=4
      - APP_MODULE=core.asgi:application
      - DB_HOST=postgres
      - DB_NAME=db_structa
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis-structa:6379/5
      - DJANGO_SETTINGS_MODULE=configs.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - RUN_SETUP=true
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:-admin}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-admin@structa.cloud}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-mk_pAssWord123}
      - DJANGO_SECURE_SSL_REDIRECT=false
      - DJANGO_SECURE_PROXY_SSL_HEADER=('HTTP_X_FORWARDED_PROTO', 'https')
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # CORE-NGINX - Static & Media Files
  # ============================================================
  core-nginx:
    build:
      context: ./core
      dockerfile: ./compose/nginx/Dockerfile
    image: core-nginx
    container_name: core-nginx
    volumes:
      - core_static:/var/www/static:ro
      - core_media:/var/www/media:ro
    networks:
      - traefik-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - core

  # ============================================================
  # DOCS - Documentation Site
  # Domains: site-docs.structa.cloud, site.structa.cloud, lms.structa.cloud
  # ============================================================
  docs:
    image: nginx:alpine
    container_name: docs
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./compose/nginx/ctc-docsify.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  core_static:
  core_media:
