# Local secrets (DO NOT COMMIT TO GIT)
# This file is loaded last and overrides other settings

local:
  # Local database credentials
  DATABASES:
    default:
      NAME: "alliance_local"
      USER: "postgres"
      PASSWORD: "local_password_here"
  
  # Local Redis
  CACHES:
    default:
      LOCATION: "redis://localhost:6379/1"
  
  # Email testing
  EMAIL_BACKEND: "django.core.mail.backends.filebased.EmailBackend"
  EMAIL_FILE_PATH: "@format {env.LOGS_DIR}/emails"