    retention_days: 14

production:
  <<: *db_default
  DATABASES:
    default:
      ENGINE: "@jinja {{ env.get('DB_ENGINE', 'django.db.backends.postgresql') }}"
      HOST: "@jinja {{ env.get('DB_HOST', 'postgres') }}"
      PORT: "@jinja {{ env.get('DB_PORT', '5432') }}"
      NAME: "@jinja {{ env.get('DB_NAME', 'db_ctc') }}"
      USER: "@jinja {{ env.get('DB_USER', 'postgres') }}"
      PASSWORD: "@jinja {{ env.get('DB_PASSWORD', 'mk_pAssWord123') }}"
      CONN_MAX_AGE: 600
      ATOMIC_REQUESTS: true
      OPTIONS:
        # sslmode: "require"
        # sslrootcert: "@format {env.get('DB_SSL_ROOT_CERT') or env.get('POSTGRES_SSL_CERT') or ''}"
        connect_timeout: 15
        keepalives: 1
        keepalives_idle: 60
        keepalives_interval: 15
        keepalives_count: 5
        # application_name: "@format {env.get('APP_NAME') or 'django_app'}"
      POOL_ARGS:
        max_overflow: 30
        pool_size: 20
        recycle: 1800
        timeout: 30
        pre_ping: true
        use_lifo: true

    # Read replica
    replica:
      ENGINE: "django.db.backends.postgresql"
      NAME: "production_db"
      USER: "readonly_user"
      HOST: "prod-db-replica.example.com"
      PORT: 5432
      CONN_MAX_AGE: 60
      OPTIONS:
        sslmode: "verify-full"
        connect_timeout: 30
        application_name: "django_replica"

  # Database routers for read/write splitting
  # DATABASE_ROUTERS: ["project.db_routers.PrimaryReplicaRouter"]

  # Connection pooling
  DATABASE_POOLING:
    enabled: true
    pool_size: 20
    max_overflow: 40
    recycle: 3600
    pre_ping: true

  # Health checks
  DATABASE_HEALTH:
    enabled: true
    timeout: 15
    interval: 10
    max_failures: 3

  # Automated backups
  DATABASE_BACKUP:
    enabled: true
    schedule: "0 2 * * *"  # Daily at 2 AM
    retention_days: 90
    storage: "s3://backups-bucket/"
    encryption: true

# Test environment
testing:
  <<: *db_default
  DATABASES:
    default:
      ENGINE: "django.db.backends.sqlite3"
      NAME: ":memory:"

  DATABASE_POOLING:
    enabled: false
