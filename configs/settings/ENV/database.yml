# databases.yaml - Complete database configuration

default: &db_default
  DATABASES:
    default:
      ENGINE: "django.db.backends.sqlite3"
      NAME: "@jinja {{ env.get('DB_NAME', 'db.sqlite3') }}"
      ATOMIC_REQUESTS: false

  DATABASE_ROUTERS: []

  DATABASE_POOLING:
    enabled: false
    max_overflow: 10
    pool_size: 5
    recycle: 3600

  DATABASE_HEALTH:
    enabled: true
    timeout: 10
    interval: 30

  DATABASE_BACKUP:
    enabled: false
    schedule: "0 2 * * *"
    retention_days: 30

