demo:
  <<: *db_default
  DATABASES:
    default:
      ENGINE: "@jinja {{ env.get('DB_ENGINE', 'django.db.backends.postgresql') }}"
      HOST: "@jinja {{ env.get('DB_HOST', 'postgres') }}"
      PORT: "@jinja {{ env.get('DB_PORT', '5432') }}"
      NAME: "@jinja {{ env.get('DB_NAME', 'db_ctc') }}"
      USER: "@jinja {{ env.get('DB_USER', 'postgres') }}"
      PASSWORD: "@jinja {{ env.get('DB_PASSWORD', 'mk_pAssWord123') }}"
      CONN_MAX_AGE: 180
      ATOMIC_REQUESTS: false
      OPTIONS:
        connect_timeout: 10
        keepalives: 1
        keepalives_idle: 30
        keepalives_interval: 10
        keepalives_count: 3
      POOL_ARGS:
        max_overflow: 15
        pool_size: 5
        recycle: 1800
        timeout: 20
        pre_ping: false
        use_lifo: false

staging:
