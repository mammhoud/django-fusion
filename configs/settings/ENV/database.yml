# databases.yaml - Complete database configuration
# Using @env for environment variable support via Dynaconf

default: &db_default
  DATABASES:
    default:
      ENGINE: "django.db.backends.sqlite3"
      NAME: "@env DATABASE_NAME db.sqlite3"
      ATOMIC_REQUESTS: false

  DATABASE_ROUTERS: []

  DATABASE_POOLING:
    enabled: false
    max_overflow: 10
    pool_size: 5
    recycle: 3600

development:
  <<: *db_default
  DATABASES:
    default:
      ENGINE: "@jinja {{ 'django.db.backends.postgresql' if env.get('DB_TYPE') == 'postgres' else 'django.db.backends.sqlite3' }}"
      NAME: "@env DB_NAME db.sqlite3"
      USER: "@env DB_USER"
      PASSWORD: "@env DB_PASSWORD"
      HOST: "@env DB_HOST localhost"
      PORT: "@env DB_PORT 5432"
      CONN_MAX_AGE: 0

production:
  <<: *db_default
  DATABASES:
    default:
      ENGINE: "django.db.backends.postgresql"
      HOST: "@jinja {{ env.get('DB_HOST', 'postgres') }}"
      PORT: "@jinja {{ env.get('DB_PORT', '5432') }}"
      NAME: "@jinja {{ env.get('DB_NAME', 'db_structa') }}"
      USER: "@jinja {{ env.get('DB_USER', 'structa') }}"
      PASSWORD: "@jinja {{ env.get('DB_PASSWORD', 'mk_pAssWord123') }}"
      CONN_MAX_AGE: 600
      ATOMIC_REQUESTS: true
      OPTIONS:
        connect_timeout: 15
        keepalives: 1
        keepalives_idle: 60
        keepalives_interval: 15
        keepalives_count: 5

  DATABASE_POOLING:
    enabled: true
    pool_size: 20
    max_overflow: 40
    recycle: 3600
    pre_ping: true

testing:
  <<: *db_default
  DATABASES:
    default:
      ENGINE: "django.db.backends.sqlite3"
      NAME: ":memory:"
