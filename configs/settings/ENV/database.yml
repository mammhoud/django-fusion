# ============================================
# Database Configuration
# default/development = SQLite
# production         = PostgreSQL (from env)
# testing            = SQLite in-memory
# ============================================

default: &db_default
  DATABASES:
    default:
      ENGINE: "django.db.backends.sqlite3"
      NAME: "@jinja {{ env.get('DB_NAME', 'db.sqlite3') }}"
      ATOMIC_REQUESTS: false

  DATABASE_ROUTERS: []
  DATABASE_POOLING:
    enabled: false
  DATABASE_HEALTH:
    enabled: true
    timeout: 10
    interval: 30
  DATABASE_BACKUP:
    enabled: false

# development — same as default: SQLite, reads DB_NAME from env if set
development:
  <<: *db_default
  DATABASES:
    default:
      ENGINE: "django.db.backends.sqlite3"
      NAME: "@jinja {{ env.get('DB_NAME', 'db.sqlite3') }}"
      ATOMIC_REQUESTS: false

# production — PostgreSQL, all values from env with safe defaults
production:
  <<: *db_default
  DATABASES:
    default:
      ENGINE: "@jinja {{ env.get('DB_ENGINE', 'django.db.backends.postgresql') }}"
      HOST: "@jinja {{ env.get('DB_HOST', 'postgres') }}"
      PORT: "@jinja {{ env.get('DB_PORT', '5432') }}"
      NAME: "@jinja {{ env.get('DB_NAME', 'db_structa') }}"
      USER: "@jinja {{ env.get('DB_USER', 'postgres') }}"
      PASSWORD: "@jinja {{ env.get('DB_PASSWORD', 'mk_pAssWord123') }}"
      CONN_MAX_AGE: 600
      ATOMIC_REQUESTS: true
      OPTIONS:
        connect_timeout: 15
        keepalives: 1
        keepalives_idle: 60
        keepalives_interval: 15
        keepalives_count: 5
      POOL_ARGS:
        max_overflow: 30
        pool_size: 20
        recycle: 1800
        timeout: 30
        pre_ping: true
        use_lifo: true

  DATABASE_POOLING:
    enabled: true
    pool_size: 20
    max_overflow: 40
    recycle: 3600
    pre_ping: true

  DATABASE_HEALTH:
    enabled: true
    timeout: 15
    interval: 10
    max_failures: 3

  DATABASE_BACKUP:
    enabled: true
    schedule: "0 2 * * *"
    retention_days: 90

# testing — in-memory SQLite
testing:
  <<: *db_default
  DATABASES:
    default:
      ENGINE: "django.db.backends.sqlite3"
      NAME: ":memory:"
  DATABASE_POOLING:
    enabled: false
