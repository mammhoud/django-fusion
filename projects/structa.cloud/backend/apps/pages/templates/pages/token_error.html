{% extends "pages/base.html" %}

{% block title %}Invitation invalid · Structa Cloud{% endblock %}

{% block content %}
  <section class="container-fusion py-24 text-center">
    <h1 class="text-6xl font-bold" style="font-size:6rem;margin:0;color:hsl(var(--fu-primary));">Invitation</h1>
    <p class="mt-4 text-xl" style="font-size:1.25rem;">This invitation link is invalid or has expired</p>
    <p style="color:hsl(var(--fu-text) / .7);margin-top:.5rem;">{{ message }}</p>
    <a href="/" class="btn btn-primary" style="margin-top:2rem;">Back to Home</a>
  </section>
{% endblock %}
