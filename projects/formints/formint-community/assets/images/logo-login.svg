<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="authC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="authF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="authG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="authT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="authGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#EA580C" flood-opacity="0.25"/>
    </filter>
    <filter id="authSpark" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="#1A1917"/>
  <!-- Octagonal ring -->
  <g filter="url(#authGlow)">
    <polygon points="250,80 315,125 355,190 355,310 315,375 250,420 185,375 145,310 145,190 185,125"
             fill="none" stroke="url(#authC)" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <!-- F-monogram -->
  <rect x="222" y="150" width="14" height="145" rx="3" fill="url(#authF)"/>
  <rect x="222" y="150" width="80" height="14" rx="3" fill="url(#authF)"/>
  <rect x="222" y="205" width="60" height="12" rx="3" fill="url(#authF)"/>
  <!-- Form dots -->
  <line x1="310" y1="150" x2="310" y2="218" stroke="url(#authT)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <circle cx="310" cy="168" r="4" fill="url(#authT)" opacity="0.4"/>
  <circle cx="310" cy="188" r="4" fill="url(#authT)" opacity="0.4"/>
  <circle cx="310" cy="208" r="4" fill="url(#authT)" opacity="0.4"/>
  <!-- Diamond spark -->
  <g filter="url(#authSpark)">
    <polygon points="250,320 268,350 250,380 232,350" fill="url(#authG)"/>
  </g>
  <!-- Wordmark -->
  <text x="250" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="32" letter-spacing="6" fill="#F8FAFC">FORMINT</text>
  <text x="250" y="482" text-anchor="middle" font-family="Arial, Helvetica, monospace" font-weight="500" font-size="10" letter-spacing="2.5" fill="#78716C">POINT OF SALE</text>
</svg>