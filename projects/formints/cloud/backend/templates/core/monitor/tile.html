<div class="fusion-monitor-tile" data-fusion-fragment="core.monitor.tile">
  <h3 class="fusion-monitor-tile__title">Cloud Backup Monitor</h3>
  <dl class="fusion-monitor-tile__stats">
    <div class="fusion-monitor-tile__stat">
      <dt>Last backup</dt>
      <dd>
        {% if latest_backup %}
          <span class="fusion-monitor-tile__filename">{{ latest_backup.filename }}</span>
          <span class="fusion-monitor-tile__status fusion-monitor-tile__status--{{ latest_backup.status }}">
            {{ latest_backup.status }}
          </span>
          {% if latest_backup.size_bytes %}
            <span class="fusion-monitor-tile__size">({{ latest_backup.size_bytes }} bytes)</span>
          {% endif %}
        {% else %}
          <span class="fusion-monitor-tile__empty">No backups recorded yet</span>
        {% endif %}
      </dd>
    </div>
    <div class="fusion-monitor-tile__stat">
      <dt>Sync queue depth</dt>
      <dd class="fusion-monitor-tile__queue">{{ sync_queue_depth }}</dd>
    </div>
  </dl>
</div>
