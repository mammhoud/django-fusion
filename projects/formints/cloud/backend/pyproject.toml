[project]
name = "formint-cloud"
version = "0.1.0"
description = "Formint Cloud — Django SaaS Platform with django-unfold admin, django-fusion components, and django-bolt"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
authors = [{ name = "Structa Cloud", email = "dev@structa.cloud" }]

dependencies = [
    # Django 5.2 LTS — first series with official Python 3.14 support (5.2.8+)
    # and the fixed template ``Context.__copy__`` (5.0's ``copy(super())`` breaks
    # on Python 3.14).
    "django>=5.2.8,<6.0",
    "channels>=4.0",
    "channels-redis>=4.0",
    "daphne>=4.0",
    # Dramatiq Redis broker for the django-fusion task registry (backup_db,
    # process_sync_queue). The [redis] extra pulls redis-py.
    "dramatiq[redis]>=2.0",
    "django-unfold>=0.40",
    "django-bolt>=0.1",
    "django-fusion",
    "djangorestframework>=3.15",
    "django-filter>=24.1",
    "psycopg2-binary>=2.9",
    # django-tenants 3.13 supports Django <6.1; keep <3.14 until Django 6 is adopted.
    "django-tenants>=3.6,<3.14",
    "gunicorn>=22.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "apscheduler>=3.10",
    "msgspec>=0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.8",
    "django-debug-toolbar>=4.4",
]

[project.scripts]
formint-cloud-server = "configs.asgi:application"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "configs*"]

[tool.uv.sources]
django-fusion = { path = "../../../../libs/django-fusion", editable = true }
django-bolt = { path = "../../../../libs/django-bolt", editable = true }
