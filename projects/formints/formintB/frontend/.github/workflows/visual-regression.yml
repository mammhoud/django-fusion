name: Visual Regression

# Re-captures the six POS-KO screenshots referenced by docs/PUBLISH.md after
# every release tag. Acts as both a CI gate (release can't ship with stale
# or absent JPGs) and an artifact publisher (snapshot saved per tag).
#
# Trigger: every `vX.Y.Z` tag push (matches release.yml's filter). Manual
# runs via `workflow_dispatch` are also accepted so maintainers can refresh
# ad-hoc without a tag.
#
# Failure semantics:
#   - FAIL if any of the 6 expected JPGs (01_posko_overview, 02_dashboard,
#     03_point_of_sale, 04_inventory, 05_reports, 06_settings) is missing
#     from docs/screenshots/ after the capture.
#   - FAIL if any JPG in `git log` history is older than 14 days — i.e.,
#     nobody has refreshed the committed screenshots recently. We probe
#     git history (not `find -mtime`) so a stale runner clock can't mask a
#     stale source. The capture itself always produces working-tree files
#     with `mtime = now`, so the `git log` age check is the trustworthy
#     pre-release gate.
#   - On success, upload the fresh captures as a workflow artifact named
#     `visual-regression-${ref}` with 7-day retention (no need to keep
#     them longer — the actual release artifacts are published by
#     release.yml).
#
# This workflow is intentionally NOT chained behind release.yml via
# `workflow_run` or `needs:`. It runs in parallel and is a soft pre-screen:
# failures block the artifact upload + add a clear run summary, but do
# not block the GitHub Release itself. If hard-gating is desired later,
# add `workflow_call` from release.yml or a `workflow_run` mirror.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      force_capture:
        description: 'Re-capture even if all 6 JPGs are present and fresh'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-and-verify:
    name: Capture & verify 6 marketplace JPGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo (full history for git-log age check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Chromium + ImageMagick
        # chromium-browser is NOT pre-installed on `ubuntu-latest` runners;
        # ImageMagick usually is, but `apt-get` keeps the install idempotent.
        # `snap` chromium would also work; the .deb is simpler.
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser imagemagick
          chromium-browser --version
          convert --version | head -1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Run capture pipeline
        # `make screenshots` boots vite detached, captures 6 routes via
        # headless Chromium, JPG-converts via ImageMagick, and writes
        # canonical files at docs/screenshots/{01..06}_*.jpg. The script
        # self-cleans _captures/ on exit; we don't need `make clean`
        # afterwards.
        run: make screenshots

      - name: Verify all 6 expected JPGs exist on disk
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            01_posko_overview
            02_dashboard
            03_point_of_sale
            04_inventory
            05_reports
            06_settings
          )
          missing=()
          for stem in "${expected[@]}"; do
            if [ ! -s "docs/screenshots/${stem}.jpg" ]; then
              missing+=("${stem}.jpg")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "✗ Missing screenshots after capture:"
              printf '   - docs/screenshots/%s\n' "${missing[@]}"
              echo "Pipeline produced fewer than 6 files — investigate scripts/dev/capture-screenshots.sh."
            } >&2
            exit 1
          fi
          echo "✓ All 6 expected JPGs present"
          ls -l docs/screenshots/*.jpg | awk '{printf "   %s  %s B\n", $NF, $5}'

      - name: Fail if any in-source JPG is older than 14 days
        # Uses git's commit timestamp (seconds since epoch) instead of
        # `find -mtime`, because:
        #   1. Modern ubuntu runners can be on slightly stale clocks;
        #   2. Files come out of `git checkout` with the committed-at
        #      time, not the runner's now-time, so `find -mtime` would
        #      misjudge freshness immediately after checkout.
        # Fail-closed semantics: any JPG that has NEVER been committed
        # (last_ts empty / 0) is treated as maximally stale — you'd want
        # to commit a known-good capture before shipping a release.
        shell: bash
        run: |
          set -euo pipefail
          cutoff_ts=$(date -u -d '14 days ago' +%s)
          stale=()
          for jpg in docs/screenshots/*.jpg; do
            [ -e "$jpg" ] || continue
            # -1 = last commit touching the file; --format=%ct = unix epoch.
            # May be empty when the file was never committed (e.g. a brand
            # new capture that wasn't `git add`-ed yet).
            last_ts="$(git log -1 --format=%ct -- "$jpg" 2>/dev/null || true)"
            if [ -z "${last_ts}" ] || [ "${last_ts}" = "0" ]; then
              stale+=("${jpg} (no committed history — never committed or unavailable)")
              continue
            fi
            if [ "${last_ts}" -lt "${cutoff_ts}" ]; then
              age_days=$(( ($(date -u +%s) - last_ts) / 86400 ))
              stale+=("${jpg} (committed ${age_days} days ago)")
            fi
          done
          if [ "${#stale[@]}" -gt 0 ]; then
            {
              echo "✗ Stale screenshots (>14 days old in source, or no commit history):"
              printf '   - %s\n' "${stale[@]}"
              echo ""
              echo "Refresh them locally with:"
              echo "   make screenshots       # regen docs/screenshots/*.jpg"
              echo "   git add docs/screenshots/"
              echo "   git commit -m 'docs: refresh marketplace screenshots'"
              echo "   git push"
              echo ""
              echo "Then re-tag the release."
            } >&2
            exit 1
          fi
          echo "✓ All JPGs fresh (committed within last 14 days)"

      - name: Upload captured screenshots as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.ref_name }}
          path: docs/screenshots/*.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Upload PUBLISH.md for the release-author reviewer
        # Tiny helper artifact so the reviewer of the failing run can see
        # what the live docs say about the JPG filenames.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-publish-md-${{ github.ref_name }}
          path: docs/PUBLISH.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize on the run page
        if: always()
        run: |
          {
            echo "### Visual Regression Summary"
            echo ""
            ls -l docs/screenshots/*.jpg 2>/dev/null | awk '{printf "- `%s`  %s B\n", $NF, $5}' || echo "- (no JPGs found)"
          } >> "$GITHUB_STEP_SUMMARY"
