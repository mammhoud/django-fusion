{% load wagtailcore_tags %}
<section style="margin:2.5rem 0;">
  {% if value.eyebrow %}<p class="kicker">{{ value.eyebrow }}</p>{% endif %}
  {% if value.title %}
    <h2 style="font-size:clamp(1.4rem, 3vw, 2rem); letter-spacing:-0.02em; margin:0.35rem 0 0.5rem;">{{ value.title }}</h2>
  {% endif %}
  {% if value.description %}
    <p class="muted" style="max-width:42rem; margin:0 0 1.25rem;">{{ value.description }}</p>
  {% endif %}
  <div style="display:flex; flex-wrap:wrap; gap:0.9rem;">
    {% for badge in value.badges %}
      {% include_block badge %}
    {% endfor %}
  </div>
</section>
