{% if orders %}
<div class="orders-list">
  {% for order in orders %}
  <div class="order-row" style="display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:0.6rem 0; border-bottom:1px solid var(--border, #e5e7eb);">
    <div>
      <span style="font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:0.08em;">{{ order.reference }}</span>
      <span class="muted" style="font-size:0.85rem;">· {{ order.created_at|date:"M j, Y" }} · {{ order.item_count }} items</span>
    </div>
    <span class="badge badge-{{ order.status_badge }}">{{ order.get_status_display }}</span>
  </div>
  {% endfor %}
</div>
{% else %}
<p class="muted" style="margin:0;">Orders you place while signed in appear here.</p>
{% endif %}
