<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Fine grain pattern — dark noise at low opacity works on any background -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="dimmed">
        <feFuncA type="linear" slope="0.10"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="dimmed" mode="multiply"/>
    </filter>
    <!-- Subtle leather-like directional texture -->
    <filter id="leather" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.12" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.92 0 0 0  0 0.82 0 0 0  0 0 0 0.05 0" in="noise" result="colored"/>
      <feBlend in="SourceGraphic" in2="colored" mode="overlay"/>
    </filter>
    <!-- Soft edge vignette — darkens corners slightly -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.06"/>
    </radialGradient>
  </defs>
  <!-- Layers build up: base fill → leather grain → fine noise → vignette -->
  <rect width="400" height="400" fill="#8B7355" opacity="0.025" filter="url(#leather)"/>
  <rect width="400" height="400" fill="#000" opacity="0.015" filter="url(#grain)"/>
  <rect width="400" height="400" fill="url(#vignette)"/>
</svg>
