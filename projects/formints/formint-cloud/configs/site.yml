# ─────────────────────────────────────────────────────────────────────────────
# formint-cloud — site.yml (project-level cascade layer)
# ─────────────────────────────────────────────────────────────────────────────
# Site identity + domains for the Formint Cloud master. Formint editions keep
# distinct identities (cloud vs pro vs community); this file owns the cloud
# SaaS master.
# ─────────────────────────────────────────────────────────────────────────────

default:
  SITE:
    name: formint-cloud
    aliases:
      - cloud
      - formintB
      - pos-cloud
    primary_domain: cloud.formint.app
    domains:
      - cloud.formint.app
      - localhost
    allowed_hosts:
      - cloud.formint.app
      - localhost
      - 127.0.0.1
      - formint-cloud-backend
      - formint-cloud-frontend
    default_email: "Formint Cloud <noreply@formint.app>"
    module: POS
    wagtail_site_name: "Formint Cloud"
