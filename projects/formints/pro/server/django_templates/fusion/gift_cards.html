{# Fusion component — Gift cards overview #}
<div class="fusion-gift-cards" hx-swap-oob="true" id="fusion-gift-cards">
  <div class="stat-card mb-3"><div class="stat-value">{{ data.card_count }}</div><div class="stat-label">Gift cards issued</div></div>
  <table class="table table-sm">
    <thead><tr><th>Code</th><th>Balance</th><th>Status</th><th>Expires</th></tr></thead>
    <tbody>
      {% for c in data.cards %}
      <tr class="hover">
        <td class="px-3 py-2 text-sm font-medium">{{ c.code }}</td>
        <td class="px-3 py-2 text-xs">{{ c.balance }}</td>
        <td class="px-3 py-2 text-xs">{{ c.disabled|yesno:"disabled,active" }}</td>
        <td class="px-3 py-2 text-xs">{{ c.expires_at|default:"—" }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center opacity-50 py-4">No gift cards yet</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
