[project]
name = "formint-pos-backend"
version = "0.1.0"
description = "Formint POS Professional Django data and HTMX boundary"
requires-python = ">=3.11"
dependencies = [
  "Django>=4.2,<5.1",
  "django-fusion",
  "django-unfold>=0.80",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "formint*"]

[project.scripts]
formint-backend = "server:manage"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-django>=4.8"]

[tool.uv.sources]
django-fusion = { path = "../../../../libs/django-fusion", editable = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
