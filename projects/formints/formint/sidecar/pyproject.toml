[project]
name = "formint-pos-sidecar"
dynamic = ["version"]
description = "Formint POS (merged) — Django + django-bolt + django-fusion Cloud Master sidecar"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Structa Cloud", email = "dev@structa.cloud" },
]

dependencies = [
    "django>=4.2,<5.1",
    "django-bolt[pydantic]",
    "django-fusion",
    "django-unfold>=0.50,<0.60",
    "channels>=4.0",        # Django Channels WebSocket (replaces Robyn WS)
    "daphne>=4.0",          # ASGI server (replaces the Robyn server)
    "websockets>=12.0",     # Cloud WebSocket sync client (ws_client.py)
    "asgiref>=3.8",
    "sqlparse>=0.4",        # Django management commands (migrate, makemigrations)
    "httpx>=0.27",
    "pydantic>=2.0",
    "django-tables2>=2.7",   # Required by django_fusion.comp.generic.table
    "wagtail>=6.0,<7.0",    # Compatible with Django>=4.2,<5.1 (wagtail 7.x requires Django>=5.2)
    # Merged from backend/ (formint app): Ninja API layer + fusion dual-mode
    "django-ninja>=1.0",
    "django-ninja-extra>=0.19",
    "ninja-schema",       # django_fusion.routes.schemas.model_schema (formint API schemas)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
formint-backend = "sidecar:main"

[project.urls]
Homepage = "https://github.com/mammhoud/structa.cloud"
Documentation = "https://structa.cloud/docs/pos"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "configs*", "formint*"]

[tool.setuptools.dynamic]
# Version from local about.py.
version = { attr = "about.__version__" }

[tool.setuptools]
py-modules = ["sidecar", "manage_bolt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.uv.sources]
django-fusion = { path = "../../../../libs/django-fusion", editable = true }
django-bolt = { path = "../../../../libs/django-bolt", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
