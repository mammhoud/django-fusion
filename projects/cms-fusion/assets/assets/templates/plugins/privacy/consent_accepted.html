{% load i18n %}
{# Swapped in after a successful consent POST (HTMX / Unpoly). #}

<div class="legal-modal__consent-success" role="status" aria-live="polite">
    <span class="legal-modal__consent-success-icon" aria-hidden="true">✓</span>
    <p class="legal-modal__consent-success-message">{{ message }}</p>
    <button type="button"
            class="btn btn--primary"
            up-dismiss
            hx-on:click="this.closest('[id$=-modal]')?.remove()">
        {% trans "Continue" %}
    </button>
</div>
