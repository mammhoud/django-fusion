# ============================================================
# cms-fusion — Full project stack (backend + frontend + worker)
# ============================================================

services:
  backend:
    build:
      context: ../../
      dockerfile: projects/cms-fusion/compose/Dockerfile.backend
      args:
        PROJECT_PATH: cms-fusion
    image: cms-fusion-backend:latest
    container_name: cms-fusion-backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      RUNNING_ENV: docker
      DJANGO_SETTINGS_MODULE: settings
      WEBSITE: cms-fusion
      DJANGO_SITE: cms-fusion
      PROJECT_PATH: cms-fusion
      PORT: "5075"
      HOST: "0.0.0.0"
      SERVER_TYPE: uvicorn
      WORKERS: "4"
      APP_MODULE: server:asgi_application
      DJANGO_SERVER_TYPE: asgi
      LOG_LEVEL: info
      DEBUG: "false"
      RUN_SETUP: "true"
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME_CMS_FUSION:-db_cms_fusion}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for CMS production}@default-redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for CMS production}@default-redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for CMS production}@default-redis:6379/2
      ALLOWED_HOSTS: localhost,127.0.0.1,cms-fusion.localhost,cms-fusion-backend
      CSRF_TRUSTED_ORIGINS: http://localhost:5075,http://cms-fusion.localhost
      CELERY_TASK_DEFAULT_QUEUE: cms-fusion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5075/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "5075:5075"
    volumes:
      - ./backend:/app/cms-fusion:rw
      - ../configs:/app/configs:ro
      - ../assets:/app/assets:ro
      - ../../libs:/app/libs:rw
      - ../../logs:/app/logs:z
      # Keep named volumes at Django's effective STATIC_ROOT and MEDIA_ROOT.
      - cms-fusion-static:/app/cms-fusion/assets/staticfiles:rw
      - cms-fusion-media:/app/cms-fusion/assets/media:rw
    networks:
      - common
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.cms-fusion-api-docker.rule=(Host(`cms-fusion.localhost`) || Host(`cms-fusion.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.cms-fusion-api-docker.entrypoints=web,web-secure"
      - "traefik.http.routers.cms-fusion-api-docker.tls=true"
      - "traefik.http.services.cms-fusion-api-docker.loadbalancer.server.port=5075"
      - "traefik.http.services.cms-fusion-api-docker.loadbalancer.healthcheck.path=/health/"

  worker:
    build:
      context: ../../
      dockerfile: projects/cms-fusion/compose/Dockerfile.backend
      args:
        PROJECT_PATH: cms-fusion
    image: cms-fusion-backend:latest
    container_name: cms-fusion-worker
    restart: unless-stopped
    env_file: ../../.env
    environment:
      RUNNING_ENV: docker
      DJANGO_SETTINGS_MODULE: settings
      WEBSITE: cms-fusion
      DJANGO_SITE: cms-fusion
      PROJECT_PATH: cms-fusion
      CELERY_TASK_DEFAULT_QUEUE: cms-fusion
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME_CMS_FUSION:-db_cms_fusion}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for CMS production}@default-redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for CMS production}@default-redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for CMS production}@default-redis:6379/2
    command: celery -A apps.domain.services.email.tasks:app worker --loglevel=info --queues=cms-fusion
    volumes:
      - ./backend:/app/cms-fusion:rw
      - ../configs:/app/configs:ro
      - ../assets:/app/assets:ro
      # Live libs mirror: the worker must see the same django-fusion source the
      # backend does, otherwise it imports the image-baked (potentially stale)
      # copy and crashes on new modules (e.g. django_fusion.models.certificate).
      # :rw required — django-fusion's editable install touches egg-info at import.
      - ../../libs:/app/libs:rw
      - ../../logs:/app/logs:z
    networks:
      - common
      - warehouse-net
      - traefik-net

  frontend:
    build:
      context: .
      dockerfile: compose/Dockerfile.frontend
    image: cms-fusion-frontend:latest
    container_name: cms-fusion-frontend
    restart: unless-stopped
    environment:
      PORT: "3002"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://cms-fusion.localhost/api}
    ports:
      - "3002:3002"
    networks:
      - common
      - traefik-net

networks:
  common:
    external: true
  warehouse-net:
    external: true
  traefik-net:
    external: true

volumes:
  cms-fusion-static:
    name: cms-fusion-static
  cms-fusion-media:
    name: cms-fusion-media
