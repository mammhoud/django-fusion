<!-- counter area start -->
<section class="counter__area counter__overlay pt-110 pb-60 p-relative" data-background="{{ block.value.background_image.url }}">
    <div class="container">
        <div class="row">
            {% for counter in block.value.counters %}
            <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6">
                <div class="counter__item p-relative text-center mb-30">
                    <div class="counter__icon mb-25">
                        <span class="icon {{ counter.value.icon_class }}"></span>
                    </div>
                    <div class="counter__content">
                        <h3 class="counter">{{ counter.value.number }}</h3>
                        <span>{{ counter.value.label }}</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
<!-- counter area end -->
