{% load i18n %}
{% load static unfold i18n wagtailcore_tags wagtailimages_tags wagtailsettings_tags %}
<div class="profile__avatar avatar avatar-xxl">
    <div class="profile__avatar-container position-relative">
        <img id="avatarImage"
             class="profile__avatar-img avatar-img rounded-circle border border-3 border-white shadow"
             src="{% if user_profile.profile_image %}{{ user_profile.profile_image.url }}{% else %}{% static 'images/default-avatar.jpg' %}{% endif %}"
             alt="{% trans 'Avatar' %}">
        <div class="profile__avatar-status"></div>

        {% if user == request.user %}
        <button class="profile__avatar-edit btn btn-sm btn-light rounded-circle shadow-sm"
                type="button"
                data-bs-toggle="modal"
                data-bs-target="#profileImageModal"
                title="{% trans 'Change profile picture' %}">
            <i class="bi bi-camera-fill"></i>
        </button>
        {% endif %}
    </div>
</div>

{# Modal moved to base_profile.html #}

<style>
/* Avatar Edit Button */
.profile__avatar-edit {
    position: absolute;
    bottom: 5px;
    right: 5px;
    width: 32px;
    height: 32px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: all 0.3s ease;
    border: 2px solid white;
}

.profile__avatar-edit:hover {
    background-color: var(--bs-primary);
    color: white;
    transform: scale(1.1);
}
</style>
