{% load i18n %}
{# View toggle (Grid/List) — BEM component #}
<div class="rbt-course-view-toggle" role="group" aria-label="{% trans 'View toggle' %}">
    <button
        type="button"
        class="rbt-course-view-toggle__button rbt-course-view-toggle__button--active"
        data-view-mode="grid"
        aria-label="{% trans 'Grid view' %}"
        title="{% trans 'Grid view' %}"
    >
        <i class="bi bi-grid-3x3-gap-fill"></i>
        <span class="rbt-course-view-toggle__label">{% trans "Grid" %}</span>
    </button>
    <button
        type="button"
        class="rbt-course-view-toggle__button"
        data-view-mode="list"
        aria-label="{% trans 'List view' %}"
        title="{% trans 'List view' %}"
    >
        <i class="bi bi-list-task"></i>
        <span class="rbt-course-view-toggle__label">{% trans "List" %}</span>
    </button>
</div>

<script>
    // View mode toggle — Grid/List switching
    (function() {
        const STORAGE_KEY = 'rbt-course-view-mode';

        function setViewMode(mode) {
            const gridContainer = document.querySelector('.rbt-course-grid');
            const listContainer = document.querySelector('.rbt-course-list');
            const buttons = document.querySelectorAll('.rbt-course-view-toggle__button');

            // Update buttons
            buttons.forEach(btn => {
                if (btn.dataset.viewMode === mode) {
                    btn.classList.add('rbt-course-view-toggle__button--active');
                } else {
                    btn.classList.remove('rbt-course-view-toggle__button--active');
                }
            });

            // Toggle containers
            if (mode === 'grid') {
                if (gridContainer) gridContainer.style.display = 'grid';
                if (listContainer) listContainer.style.display = 'none';
            } else {
                if (gridContainer) gridContainer.style.display = 'none';
                if (listContainer) listContainer.style.display = 'flex';
            }

            // Persist preference
            try {
                localStorage.setItem(STORAGE_KEY, mode);
            } catch (e) {}
        }

        function initViewToggle() {
            const buttons = document.querySelectorAll('.rbt-course-view-toggle__button');
            if (!buttons.length) return;

            // Restore saved preference (default to grid)
            let savedMode = null;
            try {
                savedMode = localStorage.getItem(STORAGE_KEY);
            } catch (e) {}
            const initialMode = (savedMode === 'grid' || savedMode === 'list') ? savedMode : 'grid';

            // Apply initial mode
            setViewMode(initialMode);

            // Bind click handlers
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const mode = this.dataset.viewMode;
                    if (mode) setViewMode(mode);
                });
            });

            // Sync any other toggle instances on the page
            document.addEventListener('rbt:view-mode', function(e) {
                if (e.detail && e.detail.mode) {
                    setViewMode(e.detail.mode);
                }
            });
        }

        // Run on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initViewToggle);
        } else {
            initViewToggle();
        }
    })();
</script>
