# ───────────────────────────────────────────────────────────────────
# cms-fusion — site-specific environment overrides
# ───────────────────────────────────────────────────────────────────
# Merged by Dynaconf on top of explicitly named YAML files from
# configs/Env/default/ (env profiles) + configs/Env/ (infrastructure).
# This file is loaded last, giving site-specific values highest priority.
# Consumed by the ``cfg()`` helper in configs.default:
#   env var → Dynaconf YAML → Python fallback in settings.py
# ───────────────────────────────────────────────────────────────────

default:
  # ── Site Identity ──
  WAGTAIL_SITE_NAME: "Fusion CMS"
  WAGTAILADMIN_BASE_URL: "http://localhost:5070"

  # ── Branding (purple theme) ──
  FUSION_SITE_NAME: "Fusion CMS"
  FUSION_COMPANY_NAME: "Fusion Inc."
  FUSION_CREATOR_NAME: "Fusion Team"
  FUSION_PRIMARY_COLOR: "#7c3aed"
  FUSION_SECONDARY_COLOR: "#5b21b6"

  # ── Feature Flags ──
  FUSION_RENDER_FIRST_DEFAULT: true

  # ── CORS Origins (consumed as CORS_ALLOWED_ORIGINS) ──
  CORS_ORIGINS:
    - "http://localhost:3001"
    - "http://localhost:3002"
    - "http://127.0.0.1:3001"
    - "http://127.0.0.1:3002"

  # ── Branding context processor (django-fusion built-in) ──
  FUSION_BRANDING_BACKEND: "django_fusion.contrib.branding.context_processors.fusion_branding_context"

development:
  DEBUG: true

demo:
  FUSION_SITE_NAME: "Fusion CMS (Demo)"

production:
  DEBUG: false
  CORS_ORIGINS:
    - "https://ctc-research.com"
    - "https://www.ctc-research.com"
