<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="max-width:400px; display:block; margin:auto;">
  <defs>
    <style>
      .loop-ring { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: drawLoop 2s ease forwards; }
      @keyframes drawLoop { to { stroke-dashoffset: 0; } }
      #loop-aura { opacity: 0; animation: loopAuraIn 1.5s ease forwards 1.5s; }
      @keyframes loopAuraIn { to { opacity: 0.12; } }
      #loop-chevron { opacity: 0; animation: loopChevronIn 0.6s ease forwards 2s; }
      @keyframes loopChevronIn { to { opacity: 1; } }
      #loop-spark { animation: loopSparkPulse 2.2s ease-in-out infinite 2.2s; transform-origin: center; }
      @keyframes loopSparkPulse { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.15); opacity: 1; } }
    </style>
    <linearGradient id="loop-bluePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="loop-blueLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="loop-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="loop-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="loop-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0EA5E9" flood-opacity="0.3"/>
    </filter>
    <filter id="loop-sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g id="loop-container" filter="url(#loop-glow)">
    <!-- Main recurrence loop — a circular arrow suggesting recurring revenue -->
    <path class="loop-ring" id="loop-main-ring" fill="none" stroke="url(#loop-bluePrimary)" stroke-width="20" stroke-linecap="round"
          d="M 250 100 A 150 150 0 1 1 130 170"/>
    <!-- Inner aura ring -->
    <circle id="loop-aura" cx="250" cy="250" r="115" fill="none" stroke="url(#loop-blueLight)" stroke-width="5" opacity="0"/>
    <!-- Chevron arrowhead at the loop terminus -->
    <g id="loop-chevron">
      <polygon points="118,145 95,190 142,185" fill="url(#loop-bluePrimary)" filter="url(#loop-glow)"/>
    </g>
    <!-- Revenue spark — the deal/currency symbol in the center -->
    <g id="loop-spark" filter="url(#loop-sparkGlow)">
      <!-- Dollar-inspired: two vertical bars bridged — revenue workspace -->
      <line x1="230" y1="215" x2="230" y2="285" stroke="url(#loop-amber)" stroke-width="10" stroke-linecap="round"/>
      <line x1="270" y1="215" x2="270" y2="285" stroke="url(#loop-amber)" stroke-width="10" stroke-linecap="round"/>
      <rect x="220" y="228" width="60" height="10" rx="5" fill="url(#loop-amber)" opacity="0.7"/>
      <rect x="220" y="262" width="60" height="10" rx="5" fill="url(#loop-amber)" opacity="0.7"/>
    </g>
    <!-- Subtle decorative orbit dots -->
    <circle cx="400" cy="160" r="5" fill="#38BDF8" opacity="0.4"/>
    <circle cx="100" cy="340" r="4" fill="#38BDF8" opacity="0.3"/>
    <circle cx="370" cy="380" r="3.5" fill="#38BDF8" opacity="0.25"/>
  </g>
</svg>