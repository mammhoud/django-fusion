<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="authBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="authAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="authGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0EA5E9" flood-opacity="0.25"/>
    </filter>
    <filter id="authSpark" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="#0A0E14"/>
  <!-- Recurrence loop mark -->
  <g filter="url(#authGlow)" transform="translate(100 60)">
    <path d="M150 30 A120 120 0 1 1 60 90" fill="none" stroke="url(#authBlue)" stroke-width="20" stroke-linecap="round"/>
    <polygon points="52,72 33,108 72,102" fill="url(#authBlue)"/>
  </g>
  <!-- Revenue bars -->
  <g filter="url(#authSpark)">
    <line x1="200" y1="310" x2="200" y2="380" stroke="url(#authAmber)" stroke-width="12" stroke-linecap="round"/>
    <line x1="260" y1="310" x2="260" y2="380" stroke="url(#authAmber)" stroke-width="12" stroke-linecap="round"/>
    <rect x="185" y="330" width="90" height="10" rx="5" fill="url(#authAmber)" opacity="0.5"/>
    <rect x="185" y="360" width="90" height="10" rx="5" fill="url(#authAmber)" opacity="0.5"/>
  </g>
  <!-- Wordmark -->
  <text x="250" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="36" letter-spacing="8" fill="#E8ECF0">LOOP</text>
  <text x="250" y="468" text-anchor="middle" font-family="Arial, Helvetica, monospace" font-weight="500" font-size="11" letter-spacing="3" fill="#5A6577">REVENUE WORKSPACE</text>
</svg>