{% load static %}{% load i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ page.title }} — Loop CRM{% endblock %}</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0a0a; --bg-deep:#080808; --panel:#0e0e0e; --panel-raised:#121212; --line:#262626; --line-soft:#1e1e1e; --ink:#eaeaea; --muted:#8a8a8a; --dim:#5a5a5a; --accent:#e61919; --accent-bright:#ff3b3b; --green:#4af626; }
    * { box-sizing:border-box; border-radius:0 !important; }
    body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.6 "Bricolage Grotesque",ui-sans-serif,sans-serif; }
    body::before { position:fixed; z-index:-1; inset:0; pointer-events:none; content:""; background-image:linear-gradient(rgba(234,234,234,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(234,234,234,.04) 1px,transparent 1px); background-size:4rem 4rem; }
    .loop-preview { max-width:72rem; margin:0 auto; padding:2rem clamp(1rem,4vw,3rem) 4rem; }
    .loop-nav { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.7rem clamp(1rem,4vw,3rem); border-bottom:1px solid var(--line-soft); }
    .loop-brand { display:flex; align-items:center; gap:.6rem; font-weight:750; letter-spacing:-.04em; text-decoration:none; color:var(--ink); }
    .loop-mark { display:grid; place-items:center; width:2rem; height:2rem; border:1px solid var(--accent); background:var(--panel); color:var(--accent-bright); }
    .loop-eyebrow { margin:0 0 .8rem; color:var(--accent); font:600 .64rem "JetBrains Mono",ui-monospace,monospace; letter-spacing:.16em; text-transform:uppercase; }
    .loop-hero { padding:clamp(2.5rem,6vw,5rem) 0; }
    .loop-hero h1 { margin:0; max-width:22ch; font-size:clamp(2.2rem,5vw,4.2rem); line-height:1.04; letter-spacing:-.06em; text-wrap:balance; }
    .loop-hero .accent { color:var(--accent-bright); }
    .loop-lede { max-width:38rem; margin:1.2rem 0 0; color:var(--muted); font-size:1.05rem; line-height:1.65; }
    .loop-actions { display:flex; flex-wrap:wrap; gap:.8rem; margin-top:1.8rem; }
    .loop-btn { display:inline-flex; align-items:center; padding:.6rem 1.1rem; border:1px solid var(--line); color:var(--ink); text-decoration:none; font:700 .72rem "JetBrains Mono",ui-monospace,monospace; letter-spacing:.06em; text-transform:uppercase; }
    .loop-btn--primary { border-color:var(--accent); background:var(--accent); color:#0a0a0a; }
    .loop-btn--outline { border-color:#3a3a3a; background:transparent; color:#b0b0b0; }
    .loop-note { margin:1.2rem 0 0; color:var(--dim); font:500 .62rem "JetBrains Mono",ui-monospace,monospace; letter-spacing:.06em; }
    .loop-dna { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); }
    .loop-dna__item { display:flex; flex-direction:column; gap:.3rem; padding:1.1rem; border-right:1px solid var(--line-soft); }
    .loop-dna__item:last-child { border-right:0; }
    .loop-dna__key { color:var(--dim); font:600 .56rem "JetBrains Mono",ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .loop-dna__item strong { font-size:1rem; font-weight:600; }
    .loop-section { padding:clamp(2.5rem,6vw,5rem) 0; }
    .loop-section h2 { margin:0; font-size:clamp(1.8rem,4vw,3rem); line-height:1.05; letter-spacing:-.05em; text-wrap:balance; }
    .loop-section__lede { max-width:42rem; margin:.8rem 0 0; color:var(--muted); line-height:1.65; }
    .loop-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin-top:2rem; }
    .loop-card { padding:1.4rem; border:1px solid var(--line); background:var(--panel); }
    .loop-card__label { margin-top:1.1rem; color:var(--accent); font:600 .6rem "JetBrains Mono",ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; }
    .loop-card h3 { margin:.5rem 0 0; font-size:1.3rem; letter-spacing:-.03em; }
    .loop-card p { margin:.6rem 0 0; color:var(--muted); line-height:1.6; }
    .loop-steps { margin:2rem 0 0; padding:0; list-style:none; border-top:1px solid var(--line-soft); }
    .loop-step { display:grid; grid-template-columns:3.5rem 1fr; gap:1rem; padding:1.3rem 0; border-bottom:1px solid var(--line-soft); }
    .loop-step__n { color:var(--accent); font:600 1rem "JetBrains Mono",ui-monospace,monospace; }
    .loop-step h3 { margin:0; font-size:1.2rem; }
    .loop-step p { margin:.4rem 0 0; color:var(--muted); }
    .loop-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin-top:2rem; }
    .loop-stat { padding:1.2rem; border:1px solid var(--line); background:var(--panel); }
    .loop-stat strong { font:700 2rem "JetBrains Mono",ui-monospace,monospace; letter-spacing:-.05em; }
    .loop-stat span { display:block; margin-top:.4rem; color:var(--muted); }
    .loop-tiers { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; align-items:stretch; margin-top:2rem; }
    .loop-tier { display:flex; flex-direction:column; padding:1.4rem; border:1px solid var(--line); background:var(--panel); }
    .loop-tier--featured { border-color:#5a2a2a; }
    .loop-tier h3 { margin:0; font-size:1rem; }
    .loop-tier__price { display:flex; align-items:baseline; gap:.55rem; margin:1rem 0 0; }
    .loop-tier__price strong { font-size:2.2rem; letter-spacing:-.06em; }
    .loop-tier__price span { color:var(--dim); font:500 .68rem "JetBrains Mono",ui-monospace,monospace; }
    .loop-tier p { margin:.8rem 0 0; color:var(--muted); font-size:.9rem; }
    .loop-tier ul { display:grid; gap:.5rem; margin:1.2rem 0; padding:1rem 0 0; border-top:1px solid var(--line-soft); list-style:none; }
    .loop-tier li { padding-left:1.1rem; color:var(--muted); font-size:.88rem; }
    .loop-tier li::before { position:absolute; margin-left:-1.1rem; color:var(--accent); content:"▸"; }
    .loop-tier .loop-btn { margin-top:auto; }
    .loop-faq { display:grid; gap:.6rem; margin-top:2rem; }
    .loop-faq__item { padding:1rem 1.1rem; border:1px solid var(--line); background:var(--panel); }
    .loop-faq__item h3 { margin:0; font-size:1rem; }
    .loop-faq__item p { margin:.5rem 0 0; color:var(--muted); }
    .loop-cta { padding:clamp(2.5rem,6vw,5rem) 0; }
    .loop-cta h2 { margin:0; font-size:clamp(1.8rem,4.5vw,3.2rem); letter-spacing:-.05em; }
    .loop-cta p { margin:.8rem 0 0; color:var(--muted); }
    .loop-legal { max-width:46rem; }
    .loop-legal .rich-text p { color:var(--muted); line-height:1.75; }
    .loop-legal .rich-text h2 { margin:1.6rem 0 .4rem; font-size:1.4rem; }
    .loop-legal .rich-text li { color:var(--muted); }
    .loop-preview__bar { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.2rem; padding:.55rem .8rem; border:1px solid var(--line); background:var(--panel-raised); color:var(--dim); font:600 .6rem "JetBrains Mono",ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .loop-preview__bar b { color:var(--accent-bright); font-weight:600; }
    @media (max-width:820px) {
      .loop-grid, .loop-tiers, .loop-stats { grid-template-columns:1fr; }
      .loop-dna { grid-template-columns:1fr; }
      .loop-dna__item { border-right:0; border-bottom:1px solid var(--line-soft); }
      .loop-dna__item:last-child { border-bottom:0; }
    }
  </style>
</head>
<body>
  <header class="loop-nav">
    <a class="loop-brand" href="/"><span class="loop-mark">↻</span><span>Loop CRM</span></a>
    <span class="loop-preview__bar"><b>WAGTAIL PREVIEW</b> {% if page.get_admin_display_title %}{{ page.get_admin_display_title }}{% else %}{{ page.title }}{% endif %}</span>
  </header>
  <div class="loop-preview">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
