<span id="channel-row-{{ channel.pk }}" class="loop-channel">
  <span class="loop-channel__dot loop-channel__dot--{{ channel.status }}" aria-hidden="true"></span>
  <span class="loop-channel__platform">{{ channel.get_platform_display }}</span>
  <span class="loop-channel__account">{{ channel.account_name }}</span>
  <span class="loop-channel__state">{{ channel.status|capfirst }}</span>
  {% if channel.refresh_error %}<small class="loop-form__error">{{ channel.refresh_error }}</small>{% endif %}
  <span class="loop-channel__actions">
    {% if channel.oauth_token %}<button class="loop-button loop-button--quiet" type="button" hx-post="/fragments/marketing/channels/{{ channel.pk }}/refresh/" hx-target="#channel-list" hx-swap="outerHTML">Refresh</button>{% endif %}
    <button class="loop-button loop-button--quiet" type="button" hx-post="/fragments/marketing/channels/{{ channel.pk }}/disconnect/" hx-target="#channel-list" hx-swap="outerHTML">Disconnect</button>
  </span>
</span>
