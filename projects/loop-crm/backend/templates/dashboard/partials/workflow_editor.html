{% load static %}
<section class="loop-card loop-card--wide" aria-label="Visual workflow editor" id="workflow-editor-panel">
  <div class="loop-section-heading"><div><span class="loop-card__label">Visual editor</span><h2>Build a workflow</h2></div><span class="loop-pill">no-code</span></div>
  <div id="workflow-editor" data-workflows='{{ workflows_json }}' data-actions='{{ action_catalog_json }}' data-triggers='{{ trigger_catalog_json }}' style="margin-top:1rem;">
    {% if workflows %}
    <div class="loop-finance-layout">
      <div class="loop-stack">
        <label class="loop-form__field"><span>Workflow</span><select id="we-workflow" aria-label="Workflow"></select></label>
        <label class="loop-form__field"><span>Trigger</span><select id="we-trigger" aria-label="Trigger"></select></label>
      </div>
      <div class="loop-stack">
        <div class="loop-section-heading"><div><span class="loop-card__label">Steps</span><h2 style="font-size:1rem;">Ordered actions</h2></div></div>
        <div id="we-steps" class="loop-list" style="margin-top:.75rem;"></div>
        <div class="loop-channels__actions" style="margin-top:.75rem;">
          <button class="loop-button loop-button--quiet" type="button" id="we-add"><span>Add step</span></button>
          <button class="loop-button loop-button--primary" type="button" id="we-save"><span>Save</span><span aria-hidden="true">↗</span></button>
          <span id="we-status" class="loop-pill" role="status" style="display:none;"></span>
        </div>
      </div>
    </div>
    {% else %}
    <div class="loop-empty-state"><strong>No workflows to edit yet.</strong><p>Create one in the form to enable the visual editor.</p></div>
    {% endif %}
  </div>
</section>
{% if workflows %}
<script>
(function () {
  var root = document.getElementById('workflow-editor');
  if (!root) return;
  var workflows = JSON.parse(root.dataset.workflows || '[]');
  var actions = JSON.parse(root.dataset.actions || '[]');
  var triggers = JSON.parse(root.dataset.triggers || '[]');
  var workflowSel = document.getElementById('we-workflow');
  var triggerSel = document.getElementById('we-trigger');
  var stepsEl = document.getElementById('we-steps');
  var statusEl = document.getElementById('we-status');

  function csrf() {
    var m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function current() {
    var id = parseInt(workflowSel.value, 10);
    for (var i = 0; i < workflows.length; i++) if (workflows[i].id === id) return workflows[i];
    return workflows[0];
  }

  function actionOptions(selected) {
    var html = '';
    for (var i = 0; i < actions.length; i++) {
      html += '<option value="' + actions[i].id + '"' + (actions[i].id === selected ? ' selected' : '') + '>' + actions[i].label + '</option>';
    }
    return html;
  }

  function stepSelect(value) {
    var sel = document.createElement('select');
    sel.className = 'we-step';
    sel.setAttribute('aria-label', 'Action');
    sel.innerHTML = actionOptions(value);
    return sel;
  }

  function renderSteps(list) {
    stepsEl.innerHTML = '';
    list.forEach(function (step, index) {
      var row = document.createElement('div');
      row.className = 'loop-list__item';
      var sel = stepSelect(step);
      var up = document.createElement('button');
      up.type = 'button'; up.className = 'loop-button loop-button--quiet'; up.textContent = '↑';
      up.addEventListener('click', function () { move(index, -1); });
      var down = document.createElement('button');
      down.type = 'button'; down.className = 'loop-button loop-button--quiet'; down.textContent = '↓';
      down.addEventListener('click', function () { move(index, 1); });
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'loop-button loop-button--quiet'; del.textContent = 'Remove';
      del.addEventListener('click', function () { remove(index); });
      var actionsWrap = document.createElement('span');
      actionsWrap.className = 'loop-channel__actions';
      actionsWrap.appendChild(up); actionsWrap.appendChild(down); actionsWrap.appendChild(del);
      row.appendChild(sel); row.appendChild(actionsWrap);
      stepsEl.appendChild(row);
    });
  }

  function collectSteps() {
    var out = [];
    var selects = stepsEl.querySelectorAll('select.we-step');
    for (var i = 0; i < selects.length; i++) out.push(selects[i].value);
    return out;
  }

  function remove(index) {
    var steps = collectSteps();
    steps.splice(index, 1);
    renderSteps(steps);
  }

  function move(index, delta) {
    var steps = collectSteps();
    var target = index + delta;
    if (target < 0 || target >= steps.length) return;
    var tmp = steps[index]; steps[index] = steps[target]; steps[target] = tmp;
    renderSteps(steps);
  }

  function load() {
    var wf = current();
    if (!wf) return;
    triggerSel.value = wf.trigger;
    renderSteps(wf.actions || []);
  }

  function showStatus(text, ok) {
    statusEl.textContent = text;
    statusEl.style.display = 'inline-flex';
    statusEl.style.color = ok ? 'var(--accent-2)' : '#ffaaa1';
    setTimeout(function () { statusEl.style.display = 'none'; }, 3200);
  }

  for (var i = 0; i < workflows.length; i++) {
    var opt = document.createElement('option');
    opt.value = workflows[i].id; opt.textContent = workflows[i].name;
    workflowSel.appendChild(opt);
  }
  for (var j = 0; j < triggers.length; j++) {
    var t = document.createElement('option');
    t.value = triggers[j].id; t.textContent = triggers[j].label;
    triggerSel.appendChild(t);
  }
  workflowSel.addEventListener('change', load);
  document.getElementById('we-add').addEventListener('click', function () {
    var steps = collectSteps();
    steps.push(actions.length ? actions[0].id : '');
    renderSteps(steps);
  });
  document.getElementById('we-save').addEventListener('click', function () {
    var wf = current();
    if (!wf) return;
    fetch('/fragments/workflows/' + wf.id + '/steps/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
      body: JSON.stringify({ trigger: triggerSel.value, actions: collectSteps() })
    }).then(function (resp) {
      return resp.json().then(function (body) { return { ok: resp.ok, body: body }; });
    }).then(function (result) {
      if (result.ok) {
        wf.trigger = result.body.trigger;
        wf.actions = result.body.actions;
        showStatus('Saved', true);
      } else {
        showStatus((result.body.actions || result.body.trigger || 'Save failed'), false);
      }
    }).catch(function () { showStatus('Save failed', false); });
  });

  load();
})();
</script>
{% endif %}
