<article class="loop-crm-row"><div class="loop-crm-row__main"><div class="loop-workflow-row__title"><strong>{{ contact.full_name }}</strong>{% if contact.title %}<span class="loop-pill">{{ contact.title }}</span>{% endif %}</div><p>{{ contact.company.name }} · {{ contact.email }}</p><small>{% if contact.phone %}{{ contact.phone }}{% else %}No phone recorded{% endif %} · {{ contact.workspace.name }}</small></div><div class="loop-crm-row__aside">{% if contact.linkedin_url %}<a href="{{ contact.linkedin_url }}" target="_blank" rel="noreferrer">LinkedIn ↗</a>{% endif %}</div></article>
