<form id="company-form" class="loop-form" method="post" action="/fragments/crm/companies/create/" hx-post="/fragments/crm/companies/create/" hx-target="#company-form" hx-select="#company-form" hx-swap="outerHTML" hx-indicator="#company-form-loading">
  {% csrf_token %}
  <div class="loop-form__header"><div><span class="loop-card__label">Account graph</span><h2>Add a company</h2></div><span id="company-form-loading" class="loop-loading loop-loading--inline htmx-indicator" role="status">Saving</span></div>
  {% if company_form.non_field_errors %}<div class="loop-form__error">{{ company_form.non_field_errors }}</div>{% endif %}
  {% for field in company_form %}<label class="loop-form__field" for="{{ field.id_for_label }}"><span>{{ field.label }}</span>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<strong class="loop-form__error">{{ error }}</strong>{% endfor %}</label>{% endfor %}
  <button class="loop-button loop-button--primary" type="submit">Save company <span aria-hidden="true">↗</span></button>
</form>
