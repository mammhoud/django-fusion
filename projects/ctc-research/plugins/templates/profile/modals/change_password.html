{% load i18n %}
<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border border-secondary">
            <div class="modal-header border-bottom border-secondary">
                <h5 class="modal-title">{% trans "Change Password" %}</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form action="{% url 'handlers:change_password' %}" method="POST">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">{% trans "Current Password" %}</label>
                        <input type="password" class="form-control bg-dark border-secondary text-light" 
                               name="current_password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{% trans "New Password" %}</label>
                        <input type="password" class="form-control bg-dark border-secondary text-light" 
                               name="new_password" required>
                        <small class="text-muted">{% trans "Minimum 8 characters with letters and numbers" %}</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{% trans "Confirm New Password" %}</label>
                        <input type="password" class="form-control bg-dark border-secondary text-light" 
                               name="confirm_password" required>
                    </div>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
                    <button type="submit" class="btn btn-primary">{% trans "Update Password" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
