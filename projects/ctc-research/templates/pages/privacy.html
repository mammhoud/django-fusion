<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title|default:"Privacy Policy" }}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #374151;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 768px;
      margin: 0 auto;
      padding: 4rem 1rem;
    }
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: #111827;
      margin: 0 0 0.75rem;
    }
    .last-updated {
      color: #6b7280;
      font-size: 0.875rem;
    }
    .card {
      background: #ffffff;
      border-radius: 1rem;
      border: 1px solid #f3f4f6;
      padding: 2rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .card section {
      margin-bottom: 1.5rem;
    }
    .card section:last-child {
      margin-bottom: 0;
    }
    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      margin: 0 0 0.75rem;
    }
    .card p {
      margin: 0 0 0.75rem;
    }
    .card a {
      color: #4f46e5;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>{{ page.title|default:"Privacy Policy" }}</h1>
      {% if page.last_updated %}
        <p class="last-updated">Last updated: {{ page.last_updated }}</p>
      {% endif %}
    </div>
    <div class="card">
      {% for block in page.blocks %}
        <section>
          {% if block.heading %}<h2>{{ block.heading }}</h2>{% endif %}
          {% if block.html %}{{ block.html|safe }}{% endif %}
        </section>
      {% endfor %}
    </div>
  </div>
</body>
</html>
