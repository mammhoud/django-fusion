{% extends "base_auth.html" %}
{% load i18n static %}

{% block auth_content %}
<section class="fragment--form">
  <section class="auth__card card card--form">
    <header class="auth__form-header text-center">
      <h2 class="auth__form-title">{% trans "Enter Login Code" %}</h2>
      <p>{% trans "We sent a code to your email/phone. Enter it below." %}</p>
    </header>
    <form method="post" action="{% url 'account_confirm_login_code' %}" hx-post="{% url 'account_confirm_login_code' %}" hx-target=".fragment--form" hx-swap="innerHTML">
      {% csrf_token %}
      <div class="form__group mb-4"><label for="id_code">{% trans "Code" %}</label><input id="id_code" name="code" type="text" class="form-control" required></div>
      <button class="btn btn-gradient w-100" type="submit">{% trans "Verify" %}</button>
    </form>
  </section>
</section>
{% endblock auth_content %}
