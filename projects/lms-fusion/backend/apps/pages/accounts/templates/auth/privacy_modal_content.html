{% load i18n %}
{# Context fields: privacy_content #}
{# Placeholders: none #}
{# HTMX Privacy Modal Content — loaded lazily via hx-get #}

<section class="fragment--form fragment--modal">
  <div class="modal fade" id="privacyPolicyModal" tabindex="-1" aria-labelledby="privacyPolicyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header border-bottom">
          <h5 class="modal-title" id="privacyPolicyModalLabel">
            <i class="bi bi-shield-lock me-2"></i>{% trans "Privacy Policy" %}
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
        </div>
        <div class="modal-body privacy-policy-content">
          {{ privacy_content|safe }}
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            {% trans "Close" %}
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
  document.addEventListener('privacyModalLoaded', function() {
    const modal = document.getElementById('privacyPolicyModal');
    if (modal) {
      const bsModal = new bootstrap.Modal(modal);
      bsModal.show();
    }
  });
  </script>
</section>
