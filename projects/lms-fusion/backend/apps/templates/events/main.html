{% load i18n wagtailcore_tags %}

<main class="events-page">
    <!-- Page Title Section -->
    <section class="section-lg page-title bg-light">
        <div class="container text-center">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-center">
                    <li class="breadcrumb-item">
                        <a href="/">{% trans "Home" %}</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
                </ol>
            </nav>
            <h1 class="fw-bold m-0">{{ page.title }}</h1>
            {% if page.intro_text %}
                <div class="lead text-muted mt-3">{{ page.intro_text|richtext }}</div>
            {% endif %}
        </div>
    </section>

    <!-- Events Grid -->
    <section class="events-section py-5">
        <div class="container">
            {% comp "events/includes/events_grid.html" /%}
        </div>
    </section>
</main>
