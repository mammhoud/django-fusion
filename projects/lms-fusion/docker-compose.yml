# ============================================================
# lms-fusion — Full project stack (backend + frontend + worker)
# ============================================================

services:
  backend:
    build:
      context: ../../
      dockerfile: projects/lms-fusion/compose/Dockerfile.backend
      args:
        PROJECT_PATH: lms-fusion
    image: lms-fusion-backend:latest
    container_name: lms-fusion-backend
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      RUNNING_ENV: docker
      DJANGO_SETTINGS_MODULE: settings
      WEBSITE: lms-fusion
      DJANGO_SITE: lms-fusion
      PROJECT_PATH: lms-fusion
      PORT: "5074"
      HOST: "0.0.0.0"
      SERVER_TYPE: gunicorn
      WORKERS: "4"
      LOG_LEVEL: info
      DEBUG: "false"
      APP_MODULE: server:asgi_application
      DJANGO_SERVER_TYPE: asgi
      RUN_SETUP: "true"
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME_LMS_FUSION:-db_lms_fusion}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://default-redis:6379/0
      CELERY_BROKER_URL: redis://default-redis:6379/1
      CELERY_RESULT_BACKEND: redis://default-redis:6379/2
      ALLOWED_HOSTS: localhost,127.0.0.1,lms-fusion.localhost,lms-fusion-backend
      CSRF_TRUSTED_ORIGINS: http://localhost:5074,http://lms-fusion.localhost
      CELERY_TASK_DEFAULT_QUEUE: lms-fusion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5074/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "5074:5074"
    volumes:
      - ./backend:/app/lms-fusion:rw
      - ./configs:/app/configs:ro
      - ../../logs:/app/logs:z
      - lms-fusion-static:/app/lms-fusion/static:rw
      - lms-fusion-media:/app/lms-fusion/media:rw
    networks:
      - common
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.lms-fusion-api-docker.rule=(Host(`lms-fusion.localhost`) || Host(`lms-fusion.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.lms-fusion-api-docker.entrypoints=web,web-secure"
      - "traefik.http.routers.lms-fusion-api-docker.tls=true"
      - "traefik.http.services.lms-fusion-api-docker.loadbalancer.server.port=5074"
      - "traefik.http.services.lms-fusion-api-docker.loadbalancer.healthcheck.path=/health/"

  worker:
    build:
      context: ../../
      dockerfile: projects/lms-fusion/compose/Dockerfile.backend
      args:
        PROJECT_PATH: lms-fusion
    image: lms-fusion-backend:latest
    container_name: lms-fusion-worker
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: settings
      WEBSITE: lms-fusion
      DJANGO_SITE: lms-fusion
      PROJECT_PATH: lms-fusion
      CELERY_TASK_DEFAULT_QUEUE: lms-fusion
      CELERY_BROKER_URL: redis://default-redis:6379/1
      CELERY_RESULT_BACKEND: redis://default-redis:6379/2
    command: celery -A www.worker.celery:app worker --loglevel=info --queues=lms-fusion
    volumes:
      - ./backend:/app/lms-fusion:rw
      - ./configs:/app/configs:ro
      - ../../logs:/app/logs:z
    networks:
      - common
      - warehouse-net
      - traefik-net

  frontend:
    build:
      context: .
      dockerfile: compose/Dockerfile.frontend
    image: lms-fusion-frontend:latest
    container_name: lms-fusion-frontend
    restart: unless-stopped
    environment:
      PORT: "3001"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://lms-fusion.localhost/api}
    ports:
      - "3001:3001"
    networks:
      - common
      - traefik-net

networks:
  common:
    external: true
  warehouse-net:
    external: true
  traefik-net:
    external: true

volumes:
  lms-fusion-static:
    name: lms-fusion-static
  lms-fusion-media:
    name: lms-fusion-media
