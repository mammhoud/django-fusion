<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="max-width:400px; display:block; margin:auto;">
  <defs>
    <style>
      .facet {
        transform: scale(0);
        transform-origin: center;
        animation: facetReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .facet-1 { animation-delay: 0s; }
      .facet-2 { animation-delay: 0.4s; }
      .facet-3 { animation-delay: 0.8s; }
      @keyframes facetReveal {
        to { transform: scale(1); }
      }
      #crm-isometric-container {
        animation: crmTilt3D 8s ease-in-out infinite 1.5s;
        transform-origin: center;
      }
      @keyframes crmTilt3D {
        0%,100% { transform: rotateY(0deg) rotateX(0deg); }
        50%     { transform: rotateY(8deg) rotateX(4deg); }
      }
      #crm-center-spark {
        animation: crmPulseGlow 2.5s ease-in-out infinite 1.5s;
        transform-origin: center;
      }
      @keyframes crmPulseGlow {
        0%,100% { transform: scale(1); opacity: 0.8; }
        50%     { transform: scale(1.15); opacity: 1; }
      }
    </style>
    <linearGradient id="crm-isoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="crm-isoNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="crm-isoSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="crm-sparkCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="crm-isoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g id="crm-isometric-container" filter="url(#crm-isoShadow)">
    <polygon class="facet facet-1" points="250,110 310,160 250,210 190,160" fill="url(#crm-isoGold)"/>
    <polygon class="facet facet-2" points="190,160 250,210 250,290 190,240" fill="url(#crm-isoNavy)"/>
    <polygon class="facet facet-3" points="250,210 310,160 310,240 250,290" fill="url(#crm-isoSlate)"/>
    <polygon id="crm-center-spark" points="250,220 270,250 250,280 230,250" fill="url(#crm-sparkCopper)"/>
    <polygon class="facet" points="140,140 170,160 140,180 110,160" fill="url(#crm-isoGold)" style="animation-delay:1.2s;"/>
    <polygon class="facet" points="360,180 390,200 360,220 330,200" fill="url(#crm-isoNavy)" style="animation-delay:1.6s;"/>
    <polygon class="facet" points="150,280 180,300 150,320 120,300" fill="url(#crm-isoSlate)" style="animation-delay:2.0s;"/>
  </g>
</svg>
