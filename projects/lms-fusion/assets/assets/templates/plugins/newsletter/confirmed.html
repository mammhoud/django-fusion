{% extends "base_page.html" %}
{% load static i18n %}

{% block content %}
<section class="newsletter-confirmed py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card">
                    <div class="card-body py-5">
                        <i class="fas fa-check-circle fa-4x text-success mb-4"></i>
                        <h2 class="card-title">{% trans "Subscription Confirmed!" %}</h2>
                        <p class="text-muted">
                            {% trans "Thank you for confirming your subscription." %}
                            {% trans "You will now receive our newsletter updates." %}
                        </p>
                        <a href="/" class="btn btn-primary mt-3">{% trans "Go to Homepage" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
