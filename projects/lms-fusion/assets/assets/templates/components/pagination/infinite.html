{% load i18n %}
{# Infinite scroll pagination component — uses HTMX intersection observer #}
{% if page_obj and page_obj.has_next %}
<div class="pagination-infinite"
     hx-get="?page={{ page_obj.next_page_number }}"
     hx-trigger="intersect once"
     hx-target="#product-grid"
     hx-swap="beforeend"
     hx-indicator="#infinite-spinner">
    <div id="infinite-spinner" class="text-center py-3">
        <span class="spinner-border spinner-border-sm text-secondary" role="status">
            <span class="visually-hidden">{% trans "Loading more..." %}</span>
        </span>
    </div>
</div>
{% endif %}
