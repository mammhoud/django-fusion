{% load i18n %}
<div class="settings-section">
    {% if success_message %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>{{ success_message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}
    
    <div class="settings-section__header">
        <h5 class="settings-section__title">{{ title }}</h5>
    </div>
    
    <div class="settings-section__content">
        <form id="{{ section }}Form" 
              onsubmit="event.preventDefault(); updateSection('{{ section }}', this);">
            {% csrf_token %}
            
            {% comp "profiles/partials/settings/"|add:section|add:"_form.html" / %}
            
            <div class="settings-form__actions mt-4">
                <button type="submit" class="btn btn-primary btn--settings">
                    <span class="htmx-indicator">
                        <span class="spinner-border spinner-border-sm" 
                              role="status" aria-hidden="true"></span>
                        {% trans "Saving..." %}
                    </span>
                    <span class="htmx-request-hidden">
                        <i class="fas fa-save me-2"></i>{% trans "Save Changes" %}
                    </span>
                </button>
                <button type="button" class="btn btn-outline-secondary btn--settings"
                        onclick="document.getElementById('{{ section }}Form').reset()">
                    <i class="fas fa-undo me-2"></i>{% trans "Reset" %}
                </button>
            </div>
        </form>
    </div>
</div>
