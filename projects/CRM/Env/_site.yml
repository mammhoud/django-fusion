# ───────────────────────────────────────────────────────────────────
# loop-crm — site-specific environment overrides
# ───────────────────────────────────────────────────────────────────
# Documented source of truth for the Loop-CRM website identity. Loop-CRM reads
# settings through os.environ (not Dynaconf); configs/site.py seeds these as
# env defaults, and docker-compose/.env supply the production values.
# ───────────────────────────────────────────────────────────────────

default:
  # ── Site Identity ──
  SITE_NAME: "loop-crm"
  SITE_DOMAIN: "crm.structa.cloud"
  DEFAULT_FROM_EMAIL: "Loop CRM <noreply@structa.cloud>"

  # ── Feature Flags ──
  FUSION_BOLT_ENABLED: "1"
  FUSION_BOLT_JWT_ISSUER: "loop-crm"

  # ── Allowed Hosts / Origins ──
  ALLOWED_HOSTS:
    - "crm.structa.cloud"
    - "www.crm.structa.cloud"
    - "loop-crm-backend"
    - "localhost"
    - "127.0.0.1"

development:
  DEBUG: true

production:
  DEBUG: false
  CSRF_TRUSTED_ORIGINS:
    - "https://crm.structa.cloud"
    - "https://www.crm.structa.cloud"
