# ─────────────────────────────────────────────────────────────────────────────
# loop-crm — defaults.yml (project-level cascade layer)
# ─────────────────────────────────────────────────────────────────────────────
# Local-dev and deployment *defaults* for Loop-CRM. This is the lowest
# project-owned YAML layer of the config cascade; every value here can be
# overridden by `Env/_site.yml`, the project `.env`, or environment variables
# (Compose `environment:` wins over everything).
#
# Loaded by django-fusion's `config.project` loader (`load_config`) — the
# backend seeds env defaults from it (backend/configs/site.py) and
# `make config-show` renders the merged result. See configs/README.md.
# ─────────────────────────────────────────────────────────────────────────────

default:
  # ── Local-dev defaults ──────────────────────────────────────────────
  DEBUG: true
  ALLOWED_HOSTS:
    - crm.structa.cloud
    - www.crm.structa.cloud
    - loop-crm-backend
    - localhost
    - 127.0.0.1
  PORT: 8074
  FRONTEND_PORT: 4321
  # Dual-mode render: false = data-API road (Astro renders /bolt + /api JSON),
  # true = Django fusion-render-first HTML.
  FUSION_RENDER_FIRST: false

  # ── Static files reference (read → output → deploy) ────────────────
  STATIC:
    read_dirs:
      - backend/assets/static
      - assets/static
      - frontend/public
    output_dir: backend/assets/staticfiles
    media_dir: backend/assets/media
    bundle_stats: backend/assets/static/bundles/bundles.json
    css_path: assets/static/css/fusion.css
    deploy:
      static_volume: loop-crm-static
      media_volume: loop-crm-media
      static_url: /static/
      media_url: /media/
      static_server: "whitenoise (backend) behind traefik /static/"
      media_server: "shared-proxy nginx (application/proxy)"

development:
  DEBUG: true

production:
  DEBUG: false
