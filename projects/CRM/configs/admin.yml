# ─────────────────────────────────────────────────────────────────────────────
# loop-crm — admin.yml (project-level cascade layer)
# ─────────────────────────────────────────────────────────────────────────────
# Admin panel + design-system (CSS panel) configuration. Admin surfaces are
# backend-owned (traefik routes /admin and /django-admin to the backend).
# ─────────────────────────────────────────────────────────────────────────────

default:
  ADMIN:
    panel_path: /admin/
    django_admin_path: /django-admin/
    wagtail_site_name: "Loop CRM"
    wagtailadmin_base_url: "https://crm.structa.cloud"
    csrf_trusted_origins:
      - https://crm.structa.cloud
      - https://www.crm.structa.cloud
      - http://localhost:8000
      - http://127.0.0.1:8000
      - http://localhost:4321
      - http://127.0.0.1:4321
    cors_allowed_origins:
      - https://crm.structa.cloud
      - https://www.crm.structa.cloud
      - http://localhost:4321
      - http://127.0.0.1:4321

  # ── CSS panel / design system ───────────────────────────────────────
  CSS_PANEL:
    source: frontend/src/styles/globals.css
    compiled: assets/static/css/fusion.css
    build_command: "make css"
    served_at: /static/css/fusion.css
    tailwind: true

development:
  ADMIN:
    wagtailadmin_base_url: "http://localhost:8000"
