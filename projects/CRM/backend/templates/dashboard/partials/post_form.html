<form id="post-form" class="loop-form" method="post" action="/fragments/posts/create/" hx-post="/fragments/posts/create/" hx-encoding="multipart/form-data" hx-target="#post-form" hx-select="#post-form" hx-swap="outerHTML" hx-indicator="#post-form-loading" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="loop-form__header"><div><span class="loop-card__label">New content</span><h2>Compose a post</h2></div><span id="post-form-loading" class="loop-loading loop-loading--inline htmx-indicator" role="status">Saving</span></div>
  {% if post_form.non_field_errors %}<div class="loop-form__error">{{ post_form.non_field_errors }}</div>{% endif %}
  {% for field in post_form %}
    <label class="loop-form__field" for="{{ field.id_for_label }}"><span>{{ field.label }}</span>{{ field }}{% for error in field.errors %}<strong class="loop-form__error">{{ error }}</strong>{% endfor %}</label>
  {% endfor %}
  <label class="loop-form__field" for="id_post_media"><span>Attach media</span><input type="file" id="id_post_media" name="media" accept="image/*,video/*"><small>Image or video for platforms that publish media (Instagram, TikTok, YouTube, photo posts).</small></label>
  <div id="post-media-preview" class="loop-media-preview" hidden>
    <img id="post-media-preview-image" class="loop-media-preview__thumb" alt="Media preview" hidden>
    <video id="post-media-preview-video" class="loop-media-preview__thumb" controls hidden></video>
    <div class="loop-media-preview__meta"><span id="post-media-preview-name" class="loop-media-preview__name"></span><button type="button" id="post-media-preview-clear" class="loop-media-preview__clear">Remove</button></div>
  </div>
  <button class="loop-button loop-button--primary" type="submit">Save draft <span aria-hidden="true">↗</span></button>
</form>
<script>
  // Live media preview for the composer. Bound once per page via a window
  // guard so the hx-select fragment swap never double-binds the listener.
  if (!window.__loopMediaPreviewBound) {
    window.__loopMediaPreviewBound = true;
    document.addEventListener("change", function (event) {
      if (!event.target || event.target.id !== "id_post_media") return;
      var file = event.target.files && event.target.files[0];
      var box = document.getElementById("post-media-preview");
      var name = document.getElementById("post-media-preview-name");
      var image = document.getElementById("post-media-preview-image");
      var video = document.getElementById("post-media-preview-video");
      if (!box || !file) return;
      URL.revokeObjectURL(image.src);
      URL.revokeObjectURL(video.src);
      image.hidden = true;
      video.hidden = true;
      if (file.type.indexOf("image/") === 0) {
        image.src = URL.createObjectURL(file);
        image.hidden = false;
      } else if (file.type.indexOf("video/") === 0) {
        video.src = URL.createObjectURL(file);
        video.hidden = false;
      }
      name.textContent = file.name;
      box.hidden = false;
    });
    document.addEventListener("click", function (event) {
      if (!event.target || event.target.id !== "post-media-preview-clear") return;
      var input = document.getElementById("id_post_media");
      var box = document.getElementById("post-media-preview");
      var image = document.getElementById("post-media-preview-image");
      var video = document.getElementById("post-media-preview-video");
      if (input) input.value = "";
      URL.revokeObjectURL(image.src);
      URL.revokeObjectURL(video.src);
      image.hidden = true;
      video.hidden = true;
      if (box) box.hidden = true;
    });
  }
</script>
