<form id="workflow-form" class="loop-form" method="post" action="/fragments/workflows/create/" hx-post="/fragments/workflows/create/" hx-target="#workflow-form" hx-select="#workflow-form" hx-swap="outerHTML" hx-indicator="#workflow-form-loading">
  {% csrf_token %}
  <div class="loop-form__header">
    <div><span class="loop-card__label">New automation</span><h2>Define a workflow</h2></div>
    <span id="workflow-form-loading" class="loop-loading loop-loading--inline htmx-indicator" role="status">Saving</span>
  </div>
  {% if workflow_form.non_field_errors %}<div class="loop-form__error">{{ workflow_form.non_field_errors }}</div>{% endif %}
  {% for field in workflow_form %}
    <label class="loop-form__field" for="{{ field.id_for_label }}">
      <span>{{ field.label }}</span>
      {{ field }}
      {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
      {% for error in field.errors %}<strong class="loop-form__error">{{ error }}</strong>{% endfor %}
    </label>
  {% endfor %}
  <button class="loop-button loop-button--primary" type="submit"><span>Create workflow</span><span aria-hidden="true">↗</span></button>
</form>
