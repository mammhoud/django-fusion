default:
  default: loop-crm
  websites:
    loop-crm:
      # Loop-CRM is the unified sales + marketing platform (crm.structa.cloud).
      domain: crm.structa.cloud
      port: 8074
      module: CRM
      ssl_enabled: true
      allowed_hosts: [crm.structa.cloud, www.crm.structa.cloud, loop-crm-backend, localhost, 127.0.0.1]
      csrf_trusted_origins: [https://crm.structa.cloud, https://www.crm.structa.cloud]
      cors_allowed_origins: [https://crm.structa.cloud, https://www.crm.structa.cloud]
