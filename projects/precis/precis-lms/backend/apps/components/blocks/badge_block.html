{% load wagtailcore_tags %}
{# Badge Block Template - Wagtail Bakery Style #}
{# When used as include: pass value=, When used as Wagtail block: self is available #}

{% firstof value self as badge %}
{% if badge and badge.text %}
<span class="badge {% if badge.color == 'primary' %}bg-primary{% elif badge.color == 'secondary' %}bg-secondary{% elif badge.color == 'success' %}bg-success{% elif badge.color == 'danger' %}bg-danger{% elif badge.color == 'warning' %}bg-warning text-dark{% elif badge.color == 'info' %}bg-info text-dark{% elif badge.color == 'light' %}bg-light text-dark{% elif badge.color == 'dark' %}bg-dark{% else %}bg-primary{% endif %} {% if badge.style == 'pill' %}rounded-pill{% endif %} {{ extra_class|default:'' }}">
    {% if badge.icon %}
    <i class="{{ badge.icon }} me-1"></i>
    {% endif %}
    {{ badge.text }}
</span>
{% endif %}
