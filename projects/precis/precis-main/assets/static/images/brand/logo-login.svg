<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="authT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FB392"/>
      <stop offset="100%" stop-color="#1F8A70"/>
    </linearGradient>
    <linearGradient id="authA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9962E"/>
      <stop offset="100%" stop-color="#A67B1E"/>
    </linearGradient>
    <linearGradient id="authP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EB"/>
      <stop offset="100%" stop-color="#E8E3D8"/>
    </linearGradient>
    <filter id="authGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#1F8A70" flood-opacity="0.25"/>
    </filter>
    <filter id="authLine" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#C9962E" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="#0C1210"/>
  <!-- Protocol Mark scaled up -->
  <g filter="url(#authGlow)" transform="translate(100 60) scale(1.5)">
    <!-- P stem -->
    <rect x="60" y="40" width="16" height="128" fill="url(#authP)"/>
    <!-- P bowl top -->
    <rect x="76" y="40" width="56" height="16" fill="url(#authP)"/>
    <!-- P bowl bottom (open) -->
    <rect x="76" y="84" width="44" height="16" fill="url(#authP)"/>
    <!-- Crosshair ring -->
    <circle cx="98" cy="92" r="9" fill="none" stroke="url(#authT)" stroke-width="3"/>
    <line x1="98" y1="44" x2="98" y2="120" stroke="url(#authT)" stroke-width="1.5" opacity="0.55"/>
    <line x1="62" y1="92" x2="120" y2="92" stroke="url(#authT)" stroke-width="1.5" opacity="0.55"/>
  </g>
  <!-- Evidence line -->
  <g filter="url(#authLine)">
    <line x1="130" y1="380" x2="370" y2="380" stroke="url(#authA)" stroke-width="4"/>
    <path d="M366 372 L386 380 L366 388 Z" fill="url(#authA)"/>
  </g>
  <!-- Wordmark -->
  <text x="250" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="38" letter-spacing="10" fill="#F5F2EB">PRECIS</text>
  <text x="250" y="468" text-anchor="middle" font-family="Arial, Helvetica, monospace" font-weight="400" font-size="11" letter-spacing="3" fill="#7E8A82">RESEARCH LMS</text>
</svg>