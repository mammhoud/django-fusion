{% load i18n %}
{% prop block %}

<section class="testimonial-section py-5">
    <div class="container">
        {% if block.value.title %}
            <div class="text-center mb-5">
                <h2>{{ block.value.title }}</h2>
                {% if block.value.subtitle %}
                    <p class="lead text-muted">{{ block.value.subtitle }}</p>
                {% endif %}
            </div>
        {% endif %}
        <div class="row g-4">
            {% for item in block.value.testimonials %}
                <div class="col-md-6 col-lg-4">
                    <figure class="testimonial-card h-100 p-4 border rounded shadow-sm mb-0">
                        <blockquote class="testimonial-card__quote mb-3">
                            <p class="mb-0">“{{ item.quote|default:item.text }}”</p>
                        </blockquote>
                        <figcaption class="testimonial-card__author">
                            {% if item.author %}
                                <strong>{{ item.author }}</strong>
                            {% endif %}
                            {% if item.role %}
                                <span class="text-muted d-block">{{ item.role }}</span>
                            {% endif %}
                        </figcaption>
                    </figure>
                </div>
            {% empty %}
                <p class="text-muted text-center w-100">{% trans "No testimonials available." %}</p>
            {% endfor %}
        </div>
    </div>
</section>
