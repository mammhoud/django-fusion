<form hx-post="{% url 'learning:course_enrollment_form' course.pk %}" hx-target="#enrollment-lead-form" hx-swap="outerHTML" class="learning-lead-form">
  {% csrf_token %}
  <p class="learning-kicker">[ ENROLLMENT INTEREST / {{ course.title|upper }} ]</p>
  <p class="learning-lead-form__intro">Leave your details and we'll keep you posted on this course.</p>
  <label class="learning-field"><span>Full name</span>{{ form.full_name }}</label>
  <label class="learning-field"><span>Email</span>{{ form.email }}</label>
  <label class="learning-field"><span>Phone (optional)</span>{{ form.phone }}</label>
  {% if form.errors %}<ul class="learning-form-errors">{% for field in form %}{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}{% endfor %}</ul>{% endif %}
  <button class="learning-button learning-button--primary learning-button--full" type="submit">REQUEST ACCESS <span aria-hidden="true">&gt;&gt;</span></button>
</form>
