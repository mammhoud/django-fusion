{% load i18n %}
{% prop specializations %}
<div class="filter-section mb-5">
    <!-- Header with search and view controls -->
    <div class="filter-header d-flex flex-column flex-md-row justify-content-between align-items-center mb-4">
        <!-- Search Bar -->
        <div class="search-wrapper mb-3 mb-md-0 w-100 w-md-auto">
            <div class="search-container position-relative">
                <input 
                    type="text" 
                    class="form-control search-input" 
                    placeholder="{% trans 'Search courses...' %}" 
                    aria-label="{% trans 'Search courses' %}"
                >
                <button class="btn search-btn position-absolute" type="button" aria-label="{% trans 'Search' %}">
                    <i class="fas fa-search"></i>
                </button>
                <button class="btn search-clear-btn position-absolute d-none" type="button" aria-label="{% trans 'Clear search' %}">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        
        <!-- View Switcher -->
        <div class="view-switcher d-flex align-items-center">
            <span class="me-2 text-muted d-none d-sm-inline">{% trans "View" %}:</span>
            <div class="btn-group btn-group-sm" role="group" aria-label="{% trans 'View toggle' %}">
                <button 
                    type="button" 
                    class="btn btn-outline-secondary view-btn active" 
                    data-view="grid"
                    aria-label="{% trans 'Grid view' %}"
                >
                    <i class="fas fa-th"></i>
                    <span class="d-none d-sm-inline ms-1">{% trans "Grid" %}</span>
                </button>
                <button 
                    type="button" 
                    class="btn btn-outline-secondary view-btn" 
                    data-view="list"
                    aria-label="{% trans 'List view' %}"
                >
                    <i class="fas fa-list"></i>
                    <span class="d-none d-sm-inline ms-1">{% trans "List" %}</span>
                </button>
            </div>
            
            <!-- Active filters display -->
            <div class="active-filters ms-3 d-none">
                <div class="badge bg-primary">
                    <span class="filter-text"></span>
                    <button class="btn-close btn-close-white ms-1" aria-label="{% trans 'Remove filter' %}"></button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Filter Tabs -->
    <div class="filter filter-style-3 text-center">
        {% if specializations %}
        <div class="filter-container">
            <ul class="nav nav-tabs justify-content-center" role="tablist">
                <li class="nav-item" role="presentation">
                    <button 
                        class="nav-link active" 
                        data-filter="*" 
                        role="tab" 
                        aria-selected="true"
                    >
                        {% trans "All" %}
                    </button>
                </li>
                {% for specialization in specializations %}
                <li class="nav-item" role="presentation">
                    <button 
                        class="nav-link" 
                        data-filter=".{{ specialization.slug }}" 
                        role="tab"
                        aria-selected="false"
                    >
                        {% if specialization.translated_name %}
                            {{ specialization.translated_name }}
                        {% else %}
                            {{ specialization.name }}
                        {% endif %}
                        <span class="badge bg-secondary ms-1 filter-count d-none">0</span>
                    </button>
                </li>
                {% endfor %}
            </ul>
            
            <!-- Mobile filter dropdown -->
            <div class="mobile-filter d-md-none mt-3">
                <select class="form-select form-select-sm mobile-filter-select">
                    <option value="*">{% trans "All Specializations" %}</option>
                    {% for specialization in specializations %}
                    <option value=".{{ specialization.slug }}">
                        {% if specialization.translated_name %}
                            {{ specialization.translated_name }}
                        {% else %}
                            {{ specialization.name }}
                        {% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        {% endif %}
    </div>
    
    <!-- Sort options -->
    <div class="sort-options mt-3 d-flex justify-content-end">
        <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-sort me-1"></i>
                {% trans "Sort by" %}: <span class="sort-current">{% trans "Relevance" %}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><button class="dropdown-item sort-option" data-sort="relevance">{% trans "Relevance" %}</button></li>
                <li><button class="dropdown-item sort-option" data-sort="name-asc">{% trans "Name (A-Z)" %}</button></li>
                <li><button class="dropdown-item sort-option" data-sort="name-desc">{% trans "Name (Z-A)" %}</button></li>
                <li><button class="dropdown-item sort-option" data-sort="date-newest">{% trans "Newest" %}</button></li>
                <li><button class="dropdown-item sort-option" data-sort="date-oldest">{% trans "Oldest" %}</button></li>
                <li><button class="dropdown-item sort-option" data-sort="rating">{% trans "Highest Rated" %}</button></li>
            </ul>
        </div>
    </div>
</div>

<!-- Filter Results Summary -->
<div class="filter-results-summary mb-4 d-none">
    <div class="alert alert-light d-flex justify-content-between align-items-center">
        <div>
            <span class="results-text">
                {% blocktrans with count='<span class="results-count">0</span>' %}
                Showing {{ count }} results
                {% endblocktrans %}
            </span>
            <span class="current-filter-text"></span>
        </div>
        <button class="btn btn-sm btn-outline-secondary clear-filters-btn">
            <i class="fas fa-times me-1"></i> {% trans "Clear all filters" %}
        </button>
    </div>
</div>
