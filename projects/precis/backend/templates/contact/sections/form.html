{% load i18n wagtailcore_tags %}

{# ── Contact Section: Form ───────────────────────────────────── #}
<div class="contact-form-section py-5">
    <div class="container">
        <div class="row g-5 justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="contact-form-section__form card border-0 shadow-sm p-4 p-lg-5">
                    {% if block.value.title %}
                    <h2 class="contact-form-section__title display-6 fw-bold mb-4">{{ block.value.title }}</h2>
                    {% endif %}
                    {% include_block block %}
                </div>
            </div>
        </div>
    </div>
</div>
