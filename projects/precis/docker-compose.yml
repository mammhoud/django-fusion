# ============================================================
# lms-fusion — Full project stack (backend + frontend + worker)
# ============================================================

services:
  backend:
    build:
      context: ../../
      dockerfile: projects/precis/compose/Dockerfile.backend
      args:
        SOURCE_PATH: precis
        PROJECT_PATH: lms-fusion
    image: lms-fusion-backend:latest
    container_name: lms-fusion-backend
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      RUNNING_ENV: docker
      SERVER_ENV: production
      DJANGO_SERVER_ENV: production
      DJANGO_SETTINGS_MODULE: settings
      WEBSITE: lms-fusion
      DJANGO_SITE: lms-fusion
      PROJECT_PATH: lms-fusion
      # Runtime container path differs from the host registry path (`precis`).
      WEBSITE_DIR: /app/lms-fusion
      DJANGO_WEBSITE_DIR: /app/lms-fusion
      PORT: "5074"
      HOST: "0.0.0.0"
      SERVER_TYPE: uvicorn
      WORKERS: "4"
      LOG_LEVEL: info
      DEBUG: "false"
      APP_MODULE: server:asgi_application
      DJANGO_SERVER_TYPE: asgi
      RUN_SETUP: "true"
      # Frontend assets are built in the dedicated Astro image; do not attempt
      # a webpack build from the backend container during production startup.
      BUILD_ASSETS_ON_START: "false"
      # Production startup runs migrations and safe fixture detection against
      # the shared PostgreSQL container. Destructive fixture replacement is
      # opt-in through FORCE_LOAD_DUMPS=true and the load_data --replace flag.
      LOAD_DATA_ON_START: ${LOAD_DATA_ON_START:-false}
      FORCE_LOAD_DUMPS: ${FORCE_LOAD_DUMPS:-false}
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME_LMS_FUSION:-db_lms_fusion}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for LMS production}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for LMS production}@default-redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for LMS production}@default-redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for LMS production}@default-redis:6379/2
      SITE_DOMAIN: ctc-research.com
      SITE_PORT: "443"
      WAGTAILADMIN_BASE_URL: https://ctc-research.com
      MEDIA_ROOT: /app/media
      ALLOWED_HOSTS: localhost,127.0.0.1,lms-fusion.localhost,lms-fusion.com,www.lms-fusion.com,ctc-research.com,www.ctc-research.com,arch.ctc-research.com,lms-fusion-backend
      CSRF_TRUSTED_ORIGINS: http://localhost:5074,http://lms-fusion.localhost,https://lms-fusion.com,https://www.lms-fusion.com,https://ctc-research.com,https://www.ctc-research.com,https://arch.ctc-research.com
      CELERY_TASK_DEFAULT_QUEUE: lms-fusion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5074/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "5074:5074"
    volumes:
      # The backend is mounted at the runtime site root because the shared
      # entrypoint and SiteCLI expect manage.py/settings.py there.
      - ./backend:/app/lms-fusion:rw
      - ../assets:/app/assets:ro
      - ../../libs:/app/libs:rw
      - ../../logs:/app/logs:z
      # Keep named volumes at Django's effective STATIC_ROOT and MEDIA_ROOT.
      - lms-fusion-static:/app/lms-fusion/assets/staticfiles:rw
      # settings.py resolves MEDIA_ROOT to the shared workspace assets path.
      - lms-fusion-media:/app/media:rw
      - ./Env:/app/lms-fusion/Env:ro
    networks:
      - common
      - warehouse-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.lms-fusion-api-docker.rule=(Host(`lms-fusion.localhost`) || Host(`lms-fusion.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.lms-fusion-api-docker.entrypoints=web,web-secure"
      - "traefik.http.routers.lms-fusion-api-docker.tls=true"
      - "traefik.http.services.lms-fusion-api-docker.loadbalancer.server.port=5074"
      - "traefik.http.services.lms-fusion-api-docker.loadbalancer.healthcheck.path=/health/"

  worker:
    build:
      context: ../../
      dockerfile: projects/precis/compose/Dockerfile.backend
      args:
        SOURCE_PATH: precis
        PROJECT_PATH: lms-fusion
    image: lms-fusion-backend:latest
    container_name: lms-fusion-worker
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      RUNNING_ENV: docker
      SERVER_ENV: production
      DJANGO_SERVER_ENV: production
      DEBUG: "false"
      DJANGO_SETTINGS_MODULE: settings
      WEBSITE: lms-fusion
      DJANGO_SITE: lms-fusion
      PROJECT_PATH: lms-fusion
      WEBSITE_DIR: /app/lms-fusion
      DJANGO_WEBSITE_DIR: /app/lms-fusion
      CELERY_TASK_DEFAULT_QUEUE: lms-fusion
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME_LMS_FUSION:-db_lms_fusion}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for LMS production}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for LMS production}@default-redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for LMS production}@default-redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required for LMS production}@default-redis:6379/2
    command: celery -A apps.domain.services.email.tasks:app worker --loglevel=info --queues=lms-fusion
    volumes:
      # The backend is mounted at the runtime site root because the shared
      # entrypoint and SiteCLI expect manage.py/settings.py there.
      - ./backend:/app/lms-fusion:rw
      - ../assets:/app/assets:ro
      # Live libs mirror: the worker must see the same django-fusion source the
      # backend does, otherwise it imports the image-baked (potentially stale)
      # copy and crashes on new modules (e.g. django_fusion.models.certificate).
      # :rw required — django-fusion's editable install touches egg-info at import.
      - ../../libs:/app/libs:rw
      - ../../logs:/app/logs:z
      - lms-fusion-media:/app/media:rw
      - ./Env:/app/lms-fusion/Env:ro
    networks:
      - common
      - warehouse-net
      - traefik-net

  frontend:
    build:
      context: .
      # The Astro build resolves @fusion/* imports against
      # /libs/django-fusion/js/fusion-js/src (see frontend/astro.config.mjs), so
      # that source dir must be available inside the builder stage. The frontend
      # build context (projects/precis) cannot COPY above itself, so it arrives
      # as an additional context (narrowed to the fusion-js source only).
      additional_contexts:
        fusionjs: ../../libs/django-fusion/js/fusion-js/src
      dockerfile: compose/Dockerfile.frontend
      args:
        PUBLIC_FUSION_API_URL: ${PUBLIC_FUSION_API_URL:-}
        PUBLIC_BUILD_API_URL: ${PUBLIC_BUILD_API_URL:-https://ctc-research.com}
        PUBLIC_ENABLE_BACKEND: ${PUBLIC_ENABLE_BACKEND:-true}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ctc-research.com}
    image: lms-fusion-frontend:latest
    container_name: lms-fusion-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Astro serves the consolidated LMS/CMS document shell.
      HOST: "0.0.0.0"
      PORT: "3002"
      PUBLIC_FUSION_API_URL: ${PUBLIC_FUSION_API_URL:-}
      PUBLIC_BUILD_API_URL: ${PUBLIC_BUILD_API_URL:-https://ctc-research.com}
      PUBLIC_ENABLE_BACKEND: ${PUBLIC_ENABLE_BACKEND:-true}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ctc-research.com}
    ports:
      - "3001:3002"
    networks:
      - common
      - traefik-net

networks:
  common:
    external: true
  warehouse-net:
    external: true
  traefik-net:
    external: true

volumes:
  lms-fusion-static:
    name: lms-fusion-static
    external: true
  lms-fusion-media:
    name: lms-fusion-media
    external: true
