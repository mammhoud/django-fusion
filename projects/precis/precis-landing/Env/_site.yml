# ───────────────────────────────────────────────────────────────────
# precis-landing — site-specific environment overrides
# ───────────────────────────────────────────────────────────────────
# Documented source of truth for the Precis Landing website identity.
# Precis Landing resolves settings through os.environ (standalone
# backend/settings.py); this file documents the site-level contract and
# keeps the Env layout in parity with the other Precis sites.
# ───────────────────────────────────────────────────────────────────

default:
  # ── Site Identity ──
  SITE_NAME: "precis-landing"
  SITE_DOMAIN: "structa.cloud"
  WAGTAIL_SITE_NAME: "StructAI Softwares"
  WAGTAILADMIN_BASE_URL: "https://structa.cloud"
  DEFAULT_FROM_EMAIL: "Structa Cloud <structa.cloud@gmail.com>"

  # ── Feature Flags ──
  FUSION_RENDER_FIRST: false

development:
  DEBUG: true

production:
  DEBUG: false
