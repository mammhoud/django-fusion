services:
  backend:
    build:
      context: ../../..
      dockerfile: projects/precis/precis-landing/backend/Dockerfile
    image: precis-landing-backend:latest
    container_name: precis-landing-backend
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: settings
      SERVER_ENV: production
      DJANGO_SECRET_KEY: ${LANDING_DJANGO_SECRET_KEY:-precis-landing-change-me}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: structa.cloud,www.structa.cloud,localhost,127.0.0.1,precis-landing-backend,precis-landing-frontend
      CSRF_TRUSTED_ORIGINS: https://structa.cloud,https://www.structa.cloud,http://localhost:3000,http://127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: https://structa.cloud,https://www.structa.cloud,http://localhost:3000,http://127.0.0.1:3000
      # Database wiring by type (configs/database.yml contract, parity with
      # precis-main). postgres is the container default (shared cluster,
      # application/databases, credentials from .env); DB_TYPE=sqlite keeps
      # the container on SQLite (CI/local runs).
      DB_TYPE: ${DB_TYPE:-postgres}
      DJANGO_DB_ENGINE: ${DJANGO_DB_ENGINE:-django.db.backends.postgresql}
      DJANGO_DB_NAME: ${DB_NAME_LANDING:-db_precis_landing}
      DJANGO_DB_USER: ${POSTGRES_USER:-admin}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (shared) in .env}
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Structa Cloud <structa.cloud@gmail.com>}
      # Gmail SMTP (structa.cloud@gmail.com) — resolved from .env; console
      # backend stays the default so an unset .env cannot break local dev.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      WAGTAILADMIN_BASE_URL: https://structa.cloud
      # Keep the data-API road as the deployment default; requests can still
      # opt into fusion-render with X-Fusion-Render-First: true.
      FUSION_RENDER_FIRST: "0"
    volumes:
      # Aligned with MEDIA_ROOT / STATIC_ROOT in backend/settings.py
      # (backend/assets/media + backend/assets/staticfiles) so the startup
      # collectstatic populates the named volumes and whitenoise serves them.
      - precis-landing-media:/app/precis-landing/backend/assets/media
      - precis-landing-static:/app/precis-landing/backend/assets/staticfiles
      # Site-level Env overrides (kept in parity with the other Precis sites).
      - ./Env:/app/precis-landing/Env:ro
      # Project config cascade (configs/*.yml) — YAML defaults for the
      # type-wired database contract. Also baked into the image by the
      # backend Dockerfile; the mount keeps local edits live.
      - ./configs:/app/precis-landing/configs:ro
    networks:
      - common
      - traefik-net
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && python manage.py seed_pages --force
      && python manage.py seed_learning
      && exec gunicorn wsgi:application --bind 0.0.0.0:8074 --workers 2 --timeout 120 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8074/apis/pages/\", timeout=4)' "]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  scheduler:
    build:
      context: ../../..
      dockerfile: projects/precis/precis-landing/backend/Dockerfile
    image: precis-landing-backend:latest
    container_name: precis-landing-scheduler
    restart: unless-stopped
    env_file:
      - path: ../../../.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: settings
      SERVER_ENV: production
      DJANGO_SECRET_KEY: ${LANDING_DJANGO_SECRET_KEY:-precis-landing-change-me}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,precis-landing-backend
      DB_TYPE: ${DB_TYPE:-postgres}
      DJANGO_DB_ENGINE: ${DJANGO_DB_ENGINE:-django.db.backends.postgresql}
      DJANGO_DB_NAME: ${DB_NAME_LANDING:-db_precis_landing}
      DJANGO_DB_USER: ${POSTGRES_USER:-admin}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (shared) in .env}
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Structa Cloud <structa.cloud@gmail.com>}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      WAGTAILADMIN_BASE_URL: https://structa.cloud
    volumes:
      # Shares the same Postgres DB (db_precis_landing) as the backend so the
      # scheduler's sync_task_history job mirrors into the same TaskExecution
      # table.
      - ./Env:/app/precis-landing/Env:ro
      - ./configs:/app/precis-landing/configs:ro
    # The backend applies migrations at startup, so wait for it to be healthy.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - common
    command: python -m django_fusion.tasks.scheduler

  frontend:
    build:
      # Repository-root context, matching the backend service — the Astro
      # build resolves the @fusion alias to libs/django-fusion/js/fusion-js
      # (copied into the image by frontend/Dockerfile).
      context: ../../..
      dockerfile: projects/precis/precis-landing/frontend/Dockerfile
    image: precis-landing-frontend:latest
    container_name: precis-landing-frontend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_FUSION_API_URL: http://precis-landing-backend:8074
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - common
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

networks:
  common:
    external: true
  traefik-net:
    external: true

volumes:
  precis-landing-media:
    name: precis-landing-media
  precis-landing-static:
    name: precis-landing-static
