# ============================================================
# precis-ctc — standalone stack (backend + frontend + worker)
# ============================================================

services:
  frontend:
    build:
      # The frontend Dockerfile expects the project root as build context
      # (it copies frontend/ and assets/). The fusion-js source arrives as an
      # additional context (narrowed to the fusion-js source only) because the
      # project context cannot COPY above itself.
      context: ..
      additional_contexts:
        fusionjs: ../../../../libs/django-fusion/js/fusion-js/src
      dockerfile: frontend/Dockerfile
      # The Astro static build calls the live backend API (PUBLIC_BUILD_API_URL)
      # during `npm run build` (getStaticPaths for /courses/[slug] etc.). All
      # build-time fetches are fail-soft (try/catch + seeded fallback slugs), so
      # `docker compose up -d --build` works in one phase even when the backend
      # is not yet healthy — the frontend then renders with fallback content.
      args:
        PUBLIC_FUSION_API_URL: ${PUBLIC_FUSION_API_URL:-}
        PUBLIC_BUILD_API_URL: ${PUBLIC_BUILD_API_URL:-https://ctc-research.com}
        PUBLIC_ENABLE_BACKEND: ${PUBLIC_ENABLE_BACKEND:-true}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ctc-research.com}
    image: precis-ctc-frontend:latest
    container_name: precis-ctc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      PUBLIC_FUSION_API_URL: ${PUBLIC_FUSION_API_URL:-}
      PUBLIC_BUILD_API_URL: ${PUBLIC_BUILD_API_URL:-https://ctc-research.com}
      PUBLIC_ENABLE_BACKEND: ${PUBLIC_ENABLE_BACKEND:-true}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ctc-research.com}
    ports:
      - "3003:3002"
    networks:
      - common
      - traefik-net

networks:
  common:
    external: true
  warehouse-net:
    external: true
  traefik-net:
    external: true

