<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" style="max-width:160px; display:block; margin:auto;">
  <defs>
    <style>
      .precis-mark { opacity: 0; animation: precisReveal 1s ease forwards 0.3s; }
      @keyframes precisReveal { to { opacity: 1; } }
      #precis-evidence-line {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: precisDrawLine 1.2s ease forwards 0.8s;
      }
      @keyframes precisDrawLine { to { stroke-dashoffset: 0; } }
      #precis-crosshair-ring {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: precisDrawLine 0.8s ease forwards 0.5s;
      }
    </style>
    <linearGradient id="precis-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FB392"/>
      <stop offset="100%" stop-color="#1F8A70"/>
    </linearGradient>
    <linearGradient id="precis-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9962E"/>
      <stop offset="100%" stop-color="#A67B1E"/>
    </linearGradient>
    <linearGradient id="precis-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EB"/>
      <stop offset="100%" stop-color="#E8E3D8"/>
    </linearGradient>
    <filter id="precis-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1F8A70" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g class="precis-mark" filter="url(#precis-glow)">
    <!-- Open-bowl P monogram — geometric, no curves, built on 8u grid -->
    <!-- Stem (4u = 16px) -->
    <rect x="60" y="40" width="16" height="128" fill="url(#precis-paper)"/>
    <!-- Top bar (bowl top) -->
    <rect x="76" y="40" width="56" height="16" fill="url(#precis-paper)"/>
    <!-- Middle bar (bowl bottom, open) -->
    <rect x="76" y="84" width="44" height="16" fill="url(#precis-paper)"/>
    <!-- Negative-space crosshair: precision mark -->
    <circle id="precis-crosshair-ring" cx="98" cy="92" r="9" fill="none" stroke="url(#precis-teal)" stroke-width="3"/>
    <line x1="98" y1="44" x2="98" y2="120" stroke="url(#precis-teal)" stroke-width="1.5" opacity="0.55"/>
    <line x1="62" y1="92" x2="120" y2="92" stroke="url(#precis-teal)" stroke-width="1.5" opacity="0.55"/>
    <!-- Evidence line — amber terminal rule with arrowhead -->
    <line id="precis-evidence-line" x1="36" y1="178" x2="152" y2="178" stroke="url(#precis-amber)" stroke-width="3"/>
    <path d="M150 170 L164 178 L150 186 Z" fill="url(#precis-amber)"/>
  </g>
</svg>