{% extends 'layout/auth/skeleton.html' %}
{% load i18n %}

{% block title %}{% trans "Confirm Access" %} — CTC Research{% endblock %}

{% block content %}
<div class="auth__card">
  <header class="auth__form-header">
    <span class="auth__form-eyebrow">Security</span>
    <h1 class="auth__form-title">{% trans "Confirm Access" %}</h1>
    <p class="auth__form-subtitle">
      {% trans "Please re-enter your password to continue." %}
    </p>
  </header>

  <form method="post"
        action="{% url 'account_reauthenticate' %}"
        hx-post="{% url 'account_reauthenticate' %}"
        hx-target=".auth__panel--form"
        hx-swap="innerHTML"
        novalidate>
    {% csrf_token %}

    <div class="form__group">
      <label class="form__label" for="id_password">{% trans "Password" %}</label>
      <input type="password" name="password" id="id_password"
             class="form__input" placeholder="{% trans 'Enter your password' %}"
             autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn">
      {% trans "Confirm" %}
    </button>
  </form>
</div>
{% endblock content %}
