{% extends "base_auth.html" %}
{% load i18n static %}

{% block auth_content %}
<section class="fragment--form">
  <section class="auth__card card card--form text-center">
    <div class="auth__logo mb-4"><a href="/"><img src="{% static 'images/brand/precis-protocol-mark.svg' %}" style="max-height:60px" alt="Logo"></a></div>
    <h2 class="auth__form-title">{% trans "Verify Your Email" %}</h2>
    <div class="alert alert-info">{% trans "A verification link has been sent to your email address." %}</div>
    <p class="small text-muted">{% trans "Check your spam folder if you don't see it." %}</p>
    <a href="{% url 'account_login' %}" class="btn btn-primary" hx-get="{% url 'account_login' %}" hx-target=".fragment--form" hx-swap="innerHTML">{% trans "Back to Login" %}</a>
  </section>
</section>
{% endblock auth_content %}
