# ─────────────────────────────────────────────────────────────────────────────
# precis-ctc — admin.yml (project-level cascade layer)
# ─────────────────────────────────────────────────────────────────────────────
# Admin panel + design-system (CSS panel) configuration. Admin surfaces are
# backend-owned on all public hosts (traefik routes /admin and /django-admin
# to the backend); the CSS panel is the compiled design system shared by the
# Django render road and the Astro build.
# ─────────────────────────────────────────────────────────────────────────────

default:
  ADMIN:
    panel_path: /admin/
    django_admin_path: /django-admin/
    wagtail_site_name: "CTC Research"
    wagtailadmin_base_url: "https://ctc-research.com"
    csrf_trusted_origins:
      - https://ctc-research.com
      - https://www.ctc-research.com
      - https://arch.ctc-research.com
      - http://localhost:5070
      - http://ctc-research.localhost
      - http://localhost:3001
      - http://localhost:3002
      - http://localhost:3003
    cors_allowed_origins:
      - https://ctc-research.com
      - https://www.ctc-research.com
      - https://arch.ctc-research.com
      - http://localhost:3001
      - http://localhost:3002
      - http://localhost:3003
      - http://127.0.0.1:3001
      - http://127.0.0.1:3002
      - http://127.0.0.1:3003

  # ── CSS panel / design system ───────────────────────────────────────
  # One Tailwind source drives both render roads: globals.css → fusion.css,
  # copied by collectstatic into STATIC_ROOT and served at /static/css/.
  CSS_PANEL:
    source: frontend/src/styles/globals.css
    compiled: assets/static/css/fusion.css
    build_command: "make assets-full (sass fusion.scss → fusion.css)"
    served_at: /static/css/fusion.css
    tailwind: true
    tokens_reference: frontend/src/styles/_variables.scss

development:
  ADMIN:
    wagtailadmin_base_url: "http://localhost:5070"
