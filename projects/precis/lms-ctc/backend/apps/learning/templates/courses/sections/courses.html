<!-- Course Catalog Section — BEM -->
{% load i18n %}
{% prop courses %}
{% prop specializations %}
<div class="rbt-course-catalog">
    <div class="container">
        <!-- Controls: search, sort, and view toggle -->
        <div class="rbt-course-catalog__header">
            <div class="rbt-course-catalog__controls">
                {% comp "courses/sections/search.html" specializations=specializations /%}
                {% comp "courses/partials/view_toggle.html" /%}
            </div>
        </div>

        <!-- Grid View (default) -->
        {% comp "courses/sections/grid.html" courses=courses /%}

        <!-- List View (hidden by default, toggled via JS) -->
        {% comp "courses/sections/list.html" courses=courses /%}
    </div>
</div>
