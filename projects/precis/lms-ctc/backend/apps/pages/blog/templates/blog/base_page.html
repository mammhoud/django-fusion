{% extends "blog/base.html" %}
{% load i18n %}

{% block content %}
<article class="blog-post">
    <header>
        <h1>{% block post_title %}{% endblock %}</h1>
        <div class="post-meta">
            {% block post_meta %}{% endblock %}
        </div>
    </header>

    <div class="post-content">
        {% block post_content %}{% endblock %}
    </div>

    <footer>
        {% block post_footer %}{% endblock %}
    </footer>
</article>
{% endblock %}
