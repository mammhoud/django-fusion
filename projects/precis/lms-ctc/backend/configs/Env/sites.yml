default:
  default: ctc-research
  websites:
    ctc-research:
      # CTC Research is the standalone medical research center site.
      path: precis/ctc-research
      aliases: [ctc, ctc-website, ctc-research.com, research]
      domain: ctc-research.com
      port: 5070
      module: LMS
      ssl_enabled: true
      allowed_hosts: [.ctc-research.com, ctc-research.com, www.ctc-research.com, arch.ctc-research.com, localhost, 127.0.0.1]
      csrf_trusted_origins: [http://ctc-research.com, https://ctc-research.com, http://www.ctc-research.com, https://www.ctc-research.com, https://arch.ctc-research.com]
      cors_allowed_origins: [http://ctc-research.com, https://ctc-research.com, http://www.ctc-research.com, https://www.ctc-research.com, https://arch.ctc-research.com]
    lms:
      # Precis is the canonical LMS project directory, relative to projects/.
      path: precis/main
      aliases: [structa, core, demo, structa.cloud, lms-fusion]
      domain: structa.cloud
      port: 5071
      module: LMS
      ssl_enabled: false
      allowed_hosts: [.structa.cloud, structa.cloud, www.structa.cloud, core.structa.cloud, localhost, 127.0.0.1]
      csrf_trusted_origins: [http://structa.cloud, https://structa.cloud, http://www.structa.cloud, https://www.structa.cloud, http://core.structa.cloud, https://core.structa.cloud]
      cors_allowed_origins: [http://structa.cloud, https://structa.cloud, http://www.structa.cloud, https://www.structa.cloud, http://core.structa.cloud, https://core.structa.cloud]
    shared:
      # Infrastructure-only sentinel for the shared worker/scheduler. It is
      # not a public website and must never be selected by a browser request.
      path: precis/main/backend
      aliases: [shared, www, shared-worker, shared-scheduler, tasks]
      domain: localhost
      port: 5080
      module: CMS
      ssl_enabled: false
      allowed_hosts: [localhost, 127.0.0.1]
      csrf_trusted_origins: [http://localhost, http://127.0.0.1]
      cors_allowed_origins: [http://localhost, http://127.0.0.1]
