<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Message</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f5;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f5; padding: 40px 20px;">
        <tr>
            <td align="center">
                <!-- Main Container -->
                <table width="600" cellpadding="0" cellspacing="0" style="background: linear-gradient(135deg, #0d9488 0%, #7c3aed 100%); border-radius: 20px 20px 0 0; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                    <tr>
                        <td align="center">
                            <!-- Header Icon -->
                            <div style="background-color: rgba(255,255,255,0.2); width: 80px; height: 80px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                                <span style="font-size: 40px;">📧</span>
                            </div>
                            <h1 style="color: #ffffff; margin: 0 0 10px 0; font-size: 32px; font-weight: 700;">New Support Message</h1>
                            <p style="color: rgba(255,255,255,0.9); margin: 0; font-size: 16px;">POS by Structa Cloud</p>
                        </td>
                    </tr>
                </table>
                
                <!-- Content Container -->
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                    <tr>
                        <td>
                            <!-- From Section -->
                            <div style="margin-bottom: 30px;">
                                <table width="100%" cellpadding="0" cellspacing="0" style="background: linear-gradient(135deg, #0d948815 0%, #7c3aed15 100%); border-left: 4px solid #0d9488; padding: 20px; border-radius: 8px;">
                                    <tr>
                                        <td>
                                            <p style="margin: 0 0 8px 0; color: #0d9488; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">From</p>
                                            <p style="margin: 0 0 4px 0; color: #1a1a1a; font-size: 18px; font-weight: 600;">{{SENDER_NAME}}</p>
                                            <p style="margin: 0; color: #666666; font-size: 14px;">
                                                <a href="mailto:{{SENDER_EMAIL}}" style="color: #0d9488; text-decoration: none;">{{SENDER_EMAIL}}</a>
                                            </p>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                            
                            <!-- Subject Section -->
                            <div style="margin-bottom: 30px;">
                                <p style="margin: 0 0 8px 0; color: #0d9488; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Subject</p>
                                <p style="margin: 0; color: #1a1a1a; font-size: 18px; font-weight: 600;">{{SUBJECT}}</p>
                            </div>
                            
                            <!-- Message Section -->
                            <div style="margin-bottom: 30px;">
                                <p style="margin: 0 0 12px 0; color: #0d9488; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Message</p>
                                <div style="background-color: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 4px solid #0d9488;">
                                    <p style="margin: 0; color: #333333; font-size: 15px; line-height: 1.6; white-space: pre-wrap;">{{MESSAGE}}</p>
                                </div>
                            </div>
                            
                            <!-- Reply Button -->
                            <div style="text-align: center; margin: 40px 0 20px 0;">
                                <a href="mailto:{{SENDER_EMAIL}}?subject=Re: {{SUBJECT}}" style="display: inline-block; background: linear-gradient(135deg, #0d9488 0%, #7c3aed 100%); color: #ffffff; text-decoration: none; padding: 15px 40px; border-radius: 8px; font-weight: 600; font-size: 16px; box-shadow: 0 4px 15px rgba(13, 148, 136, 0.4);">
                                    Reply to Message
                                </a>
                            </div>
                        </td>
                    </tr>
                </table>
                
                <!-- Footer -->
                <table width="600" cellpadding="0" cellspacing="0" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 30px; border-radius: 0 0 20px 20px;">
                    <tr>
                        <td align="center">
                            <img src="https://structa.cloud/logo.png" alt="Structa Cloud" style="width: 48px; height: 48px; object-fit: contain; margin-bottom: 12px;" onerror="this.style.display='none'">
                            <p style="margin: 0 0 6px 0; color: #ffffff; font-size: 16px; font-weight: 700;">Structa Cloud</p>
                            <p style="margin: 0 0 15px 0; color: rgba(255,255,255,0.7); font-size: 13px;">Powering POS</p>
                            <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-top: 15px;">
                                <p style="margin: 0; color: rgba(255,255,255,0.5); font-size: 11px;">
                                    This is an automated message from your POS application. Visit us at <a href="https://structa.cloud" style="color: #2dd4bf; text-decoration: none;">structa.cloud</a>
                                </p>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
