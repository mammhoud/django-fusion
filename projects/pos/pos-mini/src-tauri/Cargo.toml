[package]
name = "pos-mini"
version = "2.0.0"
edition = "2021"
description = "POS Mini — Rust/Diesel only edition. No sidecar, no Python."

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2", features = ["sqlite", "r2d2", "chrono"] }
diesel_migrations = "2"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "pos_mini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pos-mini"
path = "src/main.rs"
