[package]
name = "formint-pos"
version = "0.1.0"
description = "Formint POS Professional desktop shell"
authors = ["Structa Cloud Team <dev@structa.cloud>"]
license = "AGPL-3.0"
edition = "2021"
default-run = "formint-pos"

[lib]
name = "formint_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "formint-pos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1.20"

# The Rust boundary is intentionally limited to native capabilities. Django
# remains the authority for domain rules, validation, and persistence.
