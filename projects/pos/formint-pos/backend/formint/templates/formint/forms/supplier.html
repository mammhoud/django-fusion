<form class="fusion-form" data-fusion-form="{{ resource }}" data-fusion-fragment="formint.forms.{{ resource }}"
      hx-post="/htmx/forms/{{ resource }}/" hx-target="closest .form-card" hx-swap="outerHTML"
      hx-on::after-request="if(event.detail.successful) htmx.trigger('#formint-table-slot', 'htmx:load')">
  <div class="form-grid">
    {% for field in form %}
      <div class="form-field {% if field.name == 'address' %}field-wide{% endif %} {% if field.errors %}field-error{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<small class="form-hint">{{ field.help_text }}</small>{% endif %}
        {% for error in field.errors %}<small class="form-error">{{ error }}</small>{% endfor %}
      </div>
    {% endfor %}
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save supplier</button>
    <button type="button" class="btn btn-ghost" hx-get="/htmx/tables/suppliers/" hx-target="#formint-table-slot" hx-swap="innerHTML">Cancel</button>
  </div>
</form>
