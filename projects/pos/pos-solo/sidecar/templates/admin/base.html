<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}POS Admin{% endblock %} — {{ app_name }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #1e293b; border-right: 1px solid #334155; padding: 1.5rem 0; flex-shrink: 0; }
    .sidebar-brand { padding: 0 1.5rem 1.5rem; border-bottom: 1px solid #334155; margin-bottom: 1rem; }
    .sidebar-brand h2 { font-size: 1.1rem; color: #5eead4; display: flex; align-items: center; gap: 0.5rem; }
    .sidebar-nav { list-style: none; }
    .sidebar-nav li a { display: flex; align-items: center; gap: 0.6rem; padding: 0.65rem 1.5rem; color: #94a3b8; text-decoration: none; font-size: 0.875rem; transition: all 0.15s; border-left: 3px solid transparent; }
    .sidebar-nav li a:hover, .sidebar-nav li a.active { color: #e2e8f0; background: #0f172a; border-left-color: #5eead4; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.25rem; font-weight: 600; }
    .header-user { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; color: #94a3b8; }
    .header-user .role { background: #5eead4; color: #0f172a; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .header-user a { color: #f87171; text-decoration: none; }
    .content { padding: 1.5rem; flex: 1; overflow-y: auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h3 { font-size: 1rem; color: #5eead4; margin-bottom: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.35rem; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.55rem 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 0.875rem; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #5eead4; box-shadow: 0 0 0 2px rgba(94,234,212,0.15); }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.55rem 1.25rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.15s; text-decoration: none; }
    .btn-primary { background: #5eead4; color: #0f172a; }
    .btn-primary:hover { background: #2dd4bf; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.75rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table th { text-align: left; padding: 0.6rem 0.75rem; background: #0f172a; color: #94a3b8; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    table td { padding: 0.6rem 0.75rem; border-top: 1px solid #334155; }
    table tr:hover td { background: rgba(94,234,212,0.03); }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 6px; font-size: 0.7rem; font-weight: 600; }
    .badge-success { background: #065f46; color: #6ee7b7; }
    .badge-danger { background: #7f1d1d; color: #fca5a5; }
    .badge-warning { background: #78350f; color: #fcd34d; }
    .badge-info { background: #1e3a5f; color: #7dd3fc; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }
    .stat-card { text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 700; color: #5eead4; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-top: 0.25rem; }
    .flash { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; }
    .flash-success { background: #065f46; color: #6ee7b7; border: 1px solid #047857; }
    .flash-error { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    .actions-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    @media (max-width: 768px) { .layout { flex-direction: column; } .sidebar { width: 100%; } .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><h2>⚡ {{ app_name }}</h2></div>
      <ul class="sidebar-nav">
        <li><a href="/admin/dashboard" class="{% if page == 'dashboard' %}active{% endif %}">📊 Dashboard</a></li>
        <li><a href="/admin/settings" class="{% if page == 'settings' %}active{% endif %}">⚙️ Settings</a></li>
        <li><a href="/admin/devices" class="{% if page == 'devices' %}active{% endif %}">🖥️ Devices</a></li>
        <li><a href="/admin/products" class="{% if page == 'products' %}active{% endif %}">📦 Products</a></li>
        <li><a href="/admin/users" class="{% if page == 'users' %}active{% endif %}">👥 Users</a></li>
        <li><a href="/admin/sync-logs" class="{% if page == 'sync-logs' %}active{% endif %}">🔄 Sync Logs</a></li>
      </ul>
    </aside>
    <main class="main">
      <header class="header">
        <h1>{{ page_title }}</h1>
        <div class="header-user">
          <span>{{ user_name }}</span>
          <span class="role">{{ user_role }}</span>
          <a href="/admin/logout">Logout</a>
        </div>
      </header>
      <div class="content">
        {% if flash_message %}<div class="flash flash-{{ flash_type }}">{{ flash_message }}</div>{% endif %}
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
