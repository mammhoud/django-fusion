<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — {{ app_name }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; }
    .login-card h1 { font-size: 1.5rem; color: #5eead4; margin-bottom: 0.5rem; text-align: center; }
    .login-card p { color: #94a3b8; font-size: 0.875rem; text-align: center; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.35rem; font-weight: 500; }
    .form-group input { width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 1rem; text-align: center; letter-spacing: 0.15em; }
    .form-group input:focus { outline: none; border-color: #5eead4; box-shadow: 0 0 0 2px rgba(94,234,212,0.15); }
    .btn { width: 100%; padding: 0.75rem; border-radius: 8px; font-size: 0.95rem; font-weight: 600; border: none; cursor: pointer; background: #5eead4; color: #0f172a; transition: all 0.15s; }
    .btn:hover { background: #2dd4bf; }
    .error { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; text-align: center; }
    .hint { margin-top: 1.5rem; text-align: center; color: #64748b; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>⚡ {{ app_name }}</h1>
    <p>Enter your employee PIN to access the admin dashboard</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label>Employee PIN Code</label>
        <input type="password" name="pin" maxlength="6" placeholder="••••••" autofocus required autocomplete="off">
      </div>
      <button type="submit" class="btn">🔑 Sign In</button>
    </form>
    <div class="hint">Only employees with Admin or Manager role can sign in.</div>
  </div>
</body>
</html>
