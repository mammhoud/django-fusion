[project]
name = "pos-full-sidecar"
dynamic = ["version"]
description = "POS Full Edition — Robyn + Django ORM Cloud Master sidecar"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Structa Cloud", email = "dev@structa.cloud" },
]

dependencies = [
    "robyn>=0.50,<1.0",
    "django>=4.2,<5.1",
    "django-fusion",
    "django-unfold>=0.50,<0.60",
    "asgiref>=3.8",
    "sqlparse>=0.4", # Django management commands (migrate, makemigrations)
    "httpx>=0.27",
    "pydantic>=2.0",
    "Jinja2>=3.1", # Robyn template rendering
    "django-tables2>=2.7", # Required by django_fusion.comp.generic.table
    "wagtail>=6.0,<7.0", # Compatible with Django>=4.2,<5.1 (wagtail 7.x requires Django>=5.2)
    "twilio>=9.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pos-full-server = "server:main"

[project.urls]
Homepage = "https://github.com/mammhoud/structa.cloud"
Documentation = "https://structa.cloud/docs/pos"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
django-fusion = { path = "../../../../libs/django-fusion", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "routes*"]

[tool.setuptools.dynamic]
# Version from local __about__.py.
version = { attr = "__about__.__version__" }

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
