<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="max-width:400px; display:block; margin:auto;">
  <defs>
    <style>
      .crest-ring, .crest-shield {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawCrest 2.5s ease forwards;
      }
      @keyframes drawCrest {
        to { stroke-dashoffset: 0; }
      }
      #pos-crest-inner-ring {
        opacity: 0;
        animation: posFadeInGlow 2s ease forwards 0.5s;
      }
      @keyframes posFadeInGlow {
        to { opacity: 0.4; }
      }
      #pos-crest-outer-ring {
        transform-origin: center;
        animation: posRingRotate 20s linear infinite 2.5s;
      }
      @keyframes posRingRotate {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      #pos-crest-center-spark {
        animation: posPulseSpark 1.8s ease-in-out infinite 2.5s;
        transform-origin: center;
      }
      @keyframes posPulseSpark {
        0%,100% { transform: scale(1); fill: #F59E0B; }
        50%     { transform: scale(1.2); fill: #F97316; }
      }
    </style>
    <linearGradient id="pos-crestCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="pos-crestOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="pos-crestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#EA580C" flood-opacity="0.3"/>
    </filter>
    <filter id="pos-sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g id="pos-crest-container" filter="url(#pos-crestGlow)">
    <circle id="pos-crest-outer-ring" class="crest-ring" cx="250" cy="250" r="150" fill="none" stroke="url(#pos-crestCopper)" stroke-width="14"/>
    <circle id="pos-crest-inner-ring" cx="250" cy="250" r="110" fill="none" stroke="url(#pos-crestOrange)" stroke-width="6" opacity="0"/>
    <path class="crest-shield" fill="none" stroke="url(#pos-crestCopper)" stroke-width="12" stroke-linejoin="round"
          d="M 250 120 L 310 180 L 290 260 L 250 380 L 210 260 L 190 180 Z"/>
    <path fill="url(#pos-crestOrange)" opacity="0.15"
          d="M 250 120 L 310 180 L 290 260 L 250 380 L 210 260 L 190 180 Z" style="animation: posFadeInGlow 1.5s ease forwards 1.5s;"/>
    <polygon id="pos-crest-center-spark" points="250,230 270,250 250,270 230,250" fill="url(#pos-crestCopper)" filter="url(#pos-sparkGlow)"/>
  </g>
</svg>
