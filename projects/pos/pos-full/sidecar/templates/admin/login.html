<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — {{ app_name }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .login-card h1 { font-size: 1.5rem; color: #5eead4; margin-bottom: 0.5rem; text-align: center; }
    .login-card p.sub { color: #94a3b8; font-size: 0.875rem; text-align: center; margin-bottom: 1.75rem; }
    .tabs { display: flex; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 0.25rem; margin-bottom: 1.5rem; }
    .tabs button { flex: 1; padding: 0.5rem; background: transparent; border: none; color: #94a3b8; font-size: 0.8rem; font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.15s; }
    .tabs button.active { background: #5eead4; color: #0f172a; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.35rem; font-weight: 500; }
    .form-group input { width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: #5eead4; box-shadow: 0 0 0 2px rgba(94,234,212,0.15); }
    .form-group input.pin-input { text-align: center; letter-spacing: 0.15em; }
    .btn { width: 100%; padding: 0.75rem; border-radius: 8px; font-size: 0.95rem; font-weight: 600; border: none; cursor: pointer; background: #5eead4; color: #0f172a; transition: all 0.15s; }
    .btn:hover { background: #2dd4bf; }
    .error { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; text-align: center; }
    .hint { margin-top: 1.5rem; text-align: center; color: #64748b; font-size: 0.75rem; line-height: 1.5; }
    .divider { display: flex; align-items: center; gap: 0.75rem; color: #475569; font-size: 0.7rem; text-transform: uppercase; margin: 1.25rem 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #334155; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>⚡ {{ app_name }}</h1>
    <p class="sub">Sign in with your Django superuser (like the Unfold admin) or an Admin/Manager PIN</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST" action="/admin/login">
      <div class="tabs" role="tablist">
        <button type="button" class="active" onclick="switchTab('superuser')" id="tab-superuser">🔑 Superuser</button>
        <button type="button" onclick="switchTab('pin')" id="tab-pin">#️⃣ PIN Code</button>
      </div>

      <div id="panel-superuser">
        <div class="form-group">
          <label>Email / Username</label>
          <input type="text" name="email" placeholder="admin@pos-full.local" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <div id="panel-pin" style="display:none;">
        <div class="form-group">
          <label>Employee PIN Code</label>
          <input type="password" name="pin" maxlength="6" placeholder="••••••" class="pin-input" autocomplete="off">
        </div>
      </div>

      <button type="submit" class="btn">🔓 Sign In</button>
    </form>
    <div class="hint">
      Superuser: the account created with <code>--ensure-superuser</code> (default admin@pos-full.local).<br>
      PIN: employees with Admin or Manager role only.
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('tab-superuser').classList.toggle('active', tab === 'superuser');
      document.getElementById('tab-pin').classList.toggle('active', tab === 'pin');
      document.getElementById('panel-superuser').style.display = tab === 'superuser' ? 'block' : 'none';
      document.getElementById('panel-pin').style.display = tab === 'pin' ? 'block' : 'none';
    }
  </script>
</body>
</html>
