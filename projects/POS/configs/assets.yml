# Formint product asset settings
#
# This file is the human- and tooling-readable contract for the asset roots.
# Individual Astro and Django configs resolve these paths relative to their own
# file so local development, Tauri, and collected-static deployments share the
# same ownership model.

default:
  ASSETS:
    root: assets
    shared_root: assets/shared
    frontend:
      public_dir: assets/shared/public
      source_alias: '@formints-assets'
      styles: edition-owned
    backend:
      static_source: assets/shared/static
      static_url: /static/
      media_url: /media/
      collect_output: edition-owned

editions:
  community:
    frontend: astro-react
    backend: tauri-rust
  standard:
    frontend: astro-react
    backend: tauri-rust
  cloud:
    frontend: astro-react
    backend: django
  pro:
    frontend: astro-alpine
    backend: django
  client:
    frontend: vite-vue-and-astro
    backend: django

# Local overlays are valid only for files that are not shared by content or
# runtime contract, for example Standard's Tauri platform icon exports and the
# Client's storefront favicon.
