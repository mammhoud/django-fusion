name: i18n Strict Check

# Full i18n key validation — runs on every PR and push to main.
# Checks that ALL locale files (ar.json, de.json, es.json, fr.json) have
# every key present in en.json. Fails the build if any key is missing.
#
# This is the "strict" check vs. the PR-diff check in i18n.yml (which
# only catches NEW gaps introduced by a PR).
on:
  pull_request:
    paths:
      - 'src/i18n/**'
  push:
    branches: [main]
    paths:
      - 'src/i18n/**'

permissions:
  contents: read

concurrency:
  group: i18n-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate locale keys vs en.json
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate all locales
        run: node scripts/dev/check-i18n.cjs --check
