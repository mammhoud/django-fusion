name: i18n Check

# PR-time CI: catches when a PR adds a new key to src/i18n/en.json without
# providing translations in src/i18n/{fr,ar}.json. Pre-existing gaps do not
# fail the build (those are tracked separately in docs/i18n-gaps.md).
#
# Triggered on pull_request events only; the strict `make i18n-check`
# remains available locally for maintainers who want to clear the backlog.
#
# NOTE: `pull_request` (not `pull_request_target`) keeps this workflow safe
# for forks on public repos. For private repos accepting fork PRs, consider
# switching to a two-job hybrid pattern.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-no-new-gaps:
    name: No new missing translation keys
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout PR base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          fetch-depth: 1

      - name: Run i18n diff (base vs head)
        run: node scripts/github/diff-i18n.cjs ./base .

      - name: Upload gap report artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-gap-report
          path: docs/i18n-gaps.md
          if-no-files-found: ignore
          retention-days: 7
