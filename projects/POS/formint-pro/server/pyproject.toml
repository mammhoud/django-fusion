[project]
name = "formint-pos-server"
dynamic = ["version"]
description = "Formint POS (merged) — Django + django-bolt + django-fusion Cloud Master server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Structa Cloud", email = "dev@structa.cloud" },
]

dependencies = [
    "django>=5.2.8,<6.0",
    "django-bolt[pydantic]",
    "django-fusion",
    "django-unfold>=0.80,<1.0",
    "asgiref>=3.8",
    "sqlparse>=0.4",        # Django management commands (migrate, makemigrations)
    "httpx>=0.27",
    "pydantic>=2.0",
    "Jinja2>=3.1",          # Django template/Jinja rendering
    "django-tables2>=2.7",   # Required by django_fusion.comp.generic.table
    "wagtail>=7.0,<8.0",    # Django>=5.2 (wagtail 7.x)
    # Merged from backend/ (formint app): Ninja API layer + HTMX + tables
    "django-ninja>=1.0",
    "django-ninja-extra>=0.19",
    "ninja-schema>=0.14",   # django-fusion model_schema/encoder base classes
    "django-htmx>=1.19",
    "qrcode>=7.4,<9.0",   # QR Menu: SVG QR generation (lazy-imported at runtime)
    "python-barcode>=0.15",# Barcode Scanner: Code128 label SVG (lazy-imported at runtime)
    "daphne>=4.0",         # ASGI server (replaces Robyn)
    "channels>=4.0",       # WebSocket support (replaces Robyn WS)
    "PyJWT>=2.8",          # django-bolt JWT authentication (bolt_api.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pos-full-server = "server:main"

[project.urls]
Homepage = "https://github.com/mammhoud/structa.cloud"
Documentation = "https://structa.cloud/docs/pos"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "routes*"]

[tool.setuptools.dynamic]
# Version from local about.py.
version = { attr = "about.__version__" }

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.uv.sources]
django-fusion = { path = "../../../../libs/django-fusion", editable = true }
django-bolt = { path = "../../../../libs/django-bolt", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
