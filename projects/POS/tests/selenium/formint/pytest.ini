[pytest]
# This file makes this directory the pytest rootdir, so the repo-root
# pyproject.toml (pytest-django + DJANGO_SETTINGS_MODULE=tests.settings)
# is NOT loaded here. Selenium tests are pure browser tests — they talk to
# a running backend over HTTP and do not need a Django test database.
addopts = --strict-markers -v --tb=short --no-header
testpaths = .
python_files = test_*.py
