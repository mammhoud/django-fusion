{% load i18n %}
<section class="auth-fragment">
  <header class="text-center mb-6">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-blue-100">
      <svg class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>
    <h2 class="font-display text-2xl font-bold tracking-tight text-fu-ink">Verify your email</h2>
    <p class="mt-2 text-sm text-fu-muted">We've sent a verification link to your email address. Click the link to activate your account. Check your spam folder if it doesn't appear.</p>
  </header>

  <p class="text-center text-sm text-fu-muted">
    <a href="{% url 'account_login' %}"
       hx-get="{% url 'account_login' %}"
       hx-target="closest .auth-fragment"
       hx-swap="outerHTML"
       class="font-medium text-fu-link hover:text-fu-link-hover">← Back to sign in</a>
  </p>
</section>
