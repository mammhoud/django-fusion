{% load i18n %}
<section class="auth-fragment">
  {% if confirmation %}
    <header class="text-center mb-6">
      <h2 class="font-display text-2xl font-bold tracking-tight text-fu-ink">Confirm your email</h2>
      <p class="mt-1 text-sm text-fu-muted">
        Confirm that {{ confirmation.email_address.email }} is your address.
      </p>
    </header>

    <form method="post" action="{% url 'account_confirm_email' confirmation.key %}"
          hx-post="{% url 'account_confirm_email' confirmation.key %}"
          hx-target="closest .auth-fragment"
          hx-swap="outerHTML">
      {% csrf_token %}
      <button type="submit"
              class="w-full rounded-lg bg-fu-ink px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-fu-ink/90">
        Confirm email
      </button>
    </form>
  {% else %}
    <div class="text-center">
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-100">
        <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </div>
      <h2 class="font-display text-2xl font-bold tracking-tight text-fu-ink">Link expired</h2>
      <p class="mt-2 text-sm text-fu-muted">This confirmation link has expired or is invalid. Request a new one.</p>
    </div>
  {% endif %}
</section>
