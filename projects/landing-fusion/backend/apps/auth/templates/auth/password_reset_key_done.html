{% load i18n %}
<section class="auth-fragment">
  <header class="text-center mb-6">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-green-100">
      <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h2 class="font-display text-2xl font-bold tracking-tight text-fu-ink">Password reset complete</h2>
    <p class="mt-2 text-sm text-fu-muted">Your password has been changed. You can now sign in.</p>
  </header>

  <a href="{% url 'account_login' %}"
     hx-get="{% url 'account_login' %}"
     hx-target="closest .auth-fragment"
     hx-swap="outerHTML"
     class="block w-full rounded-lg bg-fu-ink px-4 py-2.5 text-center text-sm font-semibold text-white transition-colors hover:bg-fu-ink/90">
    Sign in
  </a>
</section>
