{% load i18n %}
<section class="auth-fragment" x-data="{ loading: false }">
  <header class="text-center mb-6">
    <h2 class="font-display text-2xl font-bold tracking-tight text-fu-ink">Reset your password</h2>
    <p class="mt-1 text-sm text-fu-muted">Enter your email and we'll send you a reset link</p>
  </header>

  <form method="post" action="{% url 'account_reset_password' %}"
        hx-post="{% url 'account_reset_password' %}"
        hx-target="closest .auth-fragment"
        hx-swap="outerHTML"
        @submit="loading = true"
        novalidate>
    {% csrf_token %}

    <div class="mb-5">
      <label for="id_email" class="mb-1.5 block text-sm font-medium text-fu-ink">Email</label>
      <input id="id_email" name="email" type="email"
             class="w-full rounded-lg border border-fu-line bg-fu-card px-3.5 py-2.5 text-sm text-fu-ink placeholder:text-fu-muted focus:border-fu-link focus:outline-none focus:ring-1 focus:ring-fu-link"
             placeholder="you@example.com" required autocomplete="email"
             value="{{ form.email.value|default:'' }}">
      {% for error in form.email.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
    </div>

    <button type="submit" :disabled="loading"
            class="w-full rounded-lg bg-fu-ink px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-fu-ink/90 disabled:opacity-60">
      <span x-show="!loading">Send reset link</span>
      <span x-show="loading" class="inline-flex items-center gap-2">
        <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
        Sending...
      </span>
    </button>
  </form>

  <p class="mt-5 text-center text-sm text-fu-muted">
    <a href="{% url 'account_login' %}"
       hx-get="{% url 'account_login' %}"
       hx-target="closest .auth-fragment"
       hx-swap="outerHTML"
       class="font-medium text-fu-link hover:text-fu-link-hover">← Back to sign in</a>
  </p>
</section>
