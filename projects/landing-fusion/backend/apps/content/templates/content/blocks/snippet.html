{% load wagtailcore_tags %}
{% comment %} A single reference snippet (SnippetBlock) — title + language label +
   verbatim code. Used as a reference for other projects (e.g. LMS reusing
   Formints models). {% endcomment %}
<figure class="card snippet__card overflow-hidden">
  <figcaption class="snippet__head flex items-center justify-between border-b border-fu-line bg-fu-card px-4 py-2.5">
    <span class="font-mono text-[0.7rem] uppercase tracking-[0.14em] text-fu-ink">{{ value.title }}</span>
    {% if value.language %}<span class="font-mono text-[0.65rem] uppercase tracking-[0.14em] text-fu-muted">{{ value.language }}</span>{% endif %}
  </figcaption>
  <pre class="snippet__code overflow-x-auto bg-[#0d0d0d] p-4 font-mono text-[0.78rem] leading-relaxed" style="color:#e6e6e6;"><code>{{ value.code }}</code></pre>
</figure>
