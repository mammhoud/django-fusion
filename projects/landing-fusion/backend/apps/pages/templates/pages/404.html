{% extends "pages/base.html" %}

{% block title %}Page not found · Fusion CMS{% endblock %}

{% block content %}

    <h1 class="text-6xl font-bold" style="font-size:6rem;margin:0;color:hsl(var(--fu-primary));">404</h1>
    <p class="mt-4 text-xl" style="font-size:1.25rem;">Page not found</p>

  </section>
{% endblock %}
