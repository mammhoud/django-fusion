{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ page.title|default:"Fusion CMS" }}{% endblock %}</title>
  <meta name="description" content="{% block description %}A modern landing experience built with Astro, HTMX and Alpine.js.{% endblock %}" />
  <meta name="theme-color" content="#7c3aed" />

  <!--
    FOUC-free theme init (plan §5.1) — same behavior as frontend/src/layouts/Layout.astro.
    Reads the stored theme from localStorage (system preference on first visit)
    and applies the class to <html>, which drives the `dark:` variant.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      var stored = null;
      try { stored = localStorage.getItem('fusion-theme'); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = stored ? stored === 'dark' : prefersDark;
      root.classList.remove('light', 'dark');
      root.classList.add(dark ? 'dark' : 'light');
    })();
  </script>

  <style>
    /* ── Fusion theme → HSL tokens (mirrors frontend/src/styles/globals.css) ── */
    :root {
      --fu-primary: 262 83% 58%;
      --fu-primary-dark: 262 70% 35%;
      --fu-accent: 262 83% 48%;
      --fu-bg: 0 0% 98%;
      --fu-text: 240 6% 10%;
      --fu-muted: 240 5% 96%;
      --fu-border: 240 6% 90%;
      --fu-card: 0 0% 100%;
    }
    .dark {
      --fu-primary: 262 83% 64%;
      --fu-primary-dark: 262 90% 75%;
      --fu-accent: 262 83% 70%;
      --fu-bg: 240 6% 8%;
      --fu-text: 0 0% 96%;
      --fu-muted: 240 5% 14%;
      --fu-border: 240 6% 22%;
      --fu-card: 240 6% 11%;
    }
    html { scroll-behavior: smooth; }
    body {
      background: hsl(var(--fu-bg));
      color: hsl(var(--fu-text));
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s ease, color .3s ease;
    }
    /* Composable helpers */
    .container-fusion { margin-inline: auto; width: 100%; max-width: 80rem; padding-inline: 1rem; }
    @media (min-width: 640px) { .container-fusion { padding-inline: 1.5rem; } }
    @media (min-width: 1024px) { .container-fusion { padding-inline: 2rem; } }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border-radius: .5rem; padding: .625rem 1.5rem; font-size: .875rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all .2s ease; border: 0; }
    .btn:focus-visible { outline: 2px solid hsl(var(--fu-primary)); outline-offset: 2px; }
    .btn-primary { background: hsl(var(--fu-primary)); color: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
    .btn-primary:hover { background: hsl(var(--fu-primary-dark)); }
    .btn-secondary { background: hsl(var(--fu-card)); color: hsl(var(--fu-text)); border: 1px solid hsl(var(--fu-border)); }
    .btn-secondary:hover { background: hsl(var(--fu-muted)); }
    .btn-outline { border: 2px solid hsl(var(--fu-primary)); color: hsl(var(--fu-primary)); background: transparent; }
    .btn-outline:hover { background: hsl(var(--fu-primary) / .1); }
    .btn-white { background: #fff; color: hsl(var(--fu-primary-dark)); box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1); }
    .card { background: hsl(var(--fu-card)); border-radius: 1rem; box-shadow: 0 1px 3px rgb(0 0 0 / .05); border: 1px solid hsl(var(--fu-border)); transition: all .3s ease; }
    .card:hover { box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1); }
    .card-gradient { background: linear-gradient(to bottom right, hsl(var(--fu-primary)), hsl(var(--fu-accent)), hsl(var(--fu-primary-dark))); color: #fff; border-radius: 1rem; }
    .section-hero { background: linear-gradient(to bottom right, hsl(var(--fu-primary)), hsl(var(--fu-accent)), hsl(var(--fu-primary-dark))); color: #fff; }
    .badge { display: inline-flex; align-items: center; gap: .25rem; border-radius: 9999px; padding: .125rem .625rem; font-size: .75rem; font-weight: 500; }
    .badge-primary { background: hsl(var(--fu-primary) / .1); color: hsl(var(--fu-primary-dark)); }
    .dark .badge-primary { color: hsl(var(--fu-primary)); }
    .input-field { width: 100%; border-radius: .5rem; border: 1px solid hsl(var(--fu-border)); background: hsl(var(--fu-card)); color: hsl(var(--fu-text)); padding: .625rem 1rem; font-size: .875rem; transition: all .2s ease; box-sizing: border-box; }
    .input-field:focus { border-color: hsl(var(--fu-primary)); outline: none; box-shadow: 0 0 0 2px hsl(var(--fu-primary) / .3); }
    .form-label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .25rem; }
    [x-cloak] { display: none !important; }
    .site-header { position: sticky; top: 0; z-index: 50; border-bottom: 1px solid hsl(var(--fu-border)); background: hsl(var(--fu-card) / .9); backdrop-filter: blur(8px); }
    .site-nav a { font-size: .875rem; font-weight: 500; color: hsl(var(--fu-text) / .7); text-decoration: none; transition: color .2s; }
    .site-nav a:hover { color: hsl(var(--fu-primary)); }
    .site-footer { border-top: 1px solid hsl(var(--fu-border)); background: hsl(var(--fu-text)); color: hsl(var(--fu-muted)); }
    .dark .site-footer { background: hsl(var(--fu-card)); }
    .site-footer a { color: hsl(var(--fu-muted)); text-decoration: none; }
    .site-footer a:hover { color: hsl(var(--fu-primary)); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div style="display:flex;min-height:100vh;flex-direction:column;">
    {% include "landing/partials/header.html" %}
    <main style="flex:1;">
      {% block content %}{% endblock %}
    </main>
    {% include "landing/partials/footer.html" %}
  </div>

  <!-- AHA runtime: HTMX + Alpine (bundled in the Astro frontend; CDN for the backend templates) -->
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/@alpinejs/collapse@3.14.8/dist/cdn.min.js" defer></script>
</body>
</html>
