{% extends "landing/base.html" %}
{% load wagtailcore_tags %}

{% block title %}{{ page.title }} · Fusion CMS{% endblock %}

{% block content %}
  <section class="container-fusion py-16" style="padding-block:4rem 5rem;">
    <div style="max-width:42rem;">
      <h1 class="text-3xl font-bold" style="font-size:1.875rem;margin:0 0 1.5rem;">{{ page.title }}</h1>
      <div style="color:hsl(var(--fu-text) / .7);line-height:1.7;">
        {{ page.body|richtext }}
      </div>
    </div>
  </section>
{% endblock %}
