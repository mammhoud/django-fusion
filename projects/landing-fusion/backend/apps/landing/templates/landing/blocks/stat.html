<div class="text-center">
  <div class="text-3xl font-bold text-fu-primary sm:text-4xl">
    <span x-data="{ n: 0, target: 0 }"
          x-init="target = parseInt('{{ value.value|default:"0" }}'.replace(/[^0-9]/g, '')) || 0; let s = 0; const step = Math.max(1, Math.round(target / 60)); const t = setInterval(() => { s += step; if (s >= target) { s = target; clearInterval(t); } n = s; }, 24);">
      <span x-text="n">0</span>{{ value.suffix }}
    </span>
  </div>
  <p class="mt-2 text-sm text-fu-text/70">{{ value.label }}</p>
</div>
