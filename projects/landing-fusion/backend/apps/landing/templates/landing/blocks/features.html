{% load wagtailcore_tags %}
<section id="features" class="container-fusion py-16 sm:py-20">
  <div class="mx-auto max-w-2xl text-center">
    {% if value.eyebrow %}<span class="badge-primary badge mb-4">{{ value.eyebrow }}</span>{% endif %}
    <h2 class="text-2xl font-bold text-fu-text sm:text-3xl">{{ value.title }}</h2>
    {% if value.description %}<p class="mt-4 text-fu-text/70">{{ value.description }}</p>{% endif %}
  </div>
  <div class="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    {% for feature in value.features %}
      {% include_block feature %}
    {% endfor %}
  </div>
</section>
