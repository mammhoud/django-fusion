# Production static fallback retained for future output:'static' builds.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /_astro/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ $uri.html /404.html;
  }
}
