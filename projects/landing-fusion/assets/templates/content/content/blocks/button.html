{% if value.href %}
<a href="{{ value.href }}" class="{% if value.style == 'primary' %}btn-primary{% elif value.style == 'secondary' %}btn-secondary{% elif value.style == 'outline' %}btn-outline{% else %}btn-white{% endif %}">
  {{ value.label }}
</a>
{% else %}
<button type="button" class="{% if value.style == 'primary' %}btn-primary{% elif value.style == 'secondary' %}btn-secondary{% elif value.style == 'outline' %}btn-outline{% else %}btn-white{% endif %}">
  {{ value.label }}
</button>
{% endif %}
