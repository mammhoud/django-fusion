{% extends "account/base_manage.html" %}
{% load i18n %}
{% block head_title %}{% trans "Sign Out" %}{% endblock %}
{% block auth_inner %}
<p class="tag-marker" style="margin:0 0 .25rem;">account</p>
<h2 style="margin:0 0 .5rem;font-family:'Bricolage Grotesque',sans-serif;font-size:1.5rem;font-weight:700;color:hsl(var(--fu-ink));">Sign out</h2>
<p style="margin:0 0 1.5rem;font-size:.8rem;color:hsl(var(--fu-muted));">Are you sure you want to sign out of Structa Cloud?</p>

<form method="post" action="{% url 'account_logout' %}">
  {% csrf_token %}
  {{ redirect_field }}
  <div style="display:flex;gap:.75rem;">
    <a href="/" class="btn btn-secondary" style="padding:.7rem 1rem;">Cancel</a>
    <button type="submit" class="btn btn-primary" style="padding:.7rem 1rem;">Sign Out</button>
  </div>
</form>
{% endblock %}
