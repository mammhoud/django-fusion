services:
  backend:
    build:
      context: ../..
      dockerfile: projects/landing-fusion/backend/Dockerfile
    image: landing-fusion-backend:latest
    container_name: landing-fusion-backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: settings
      DJANGO_SECRET_KEY: ${LANDING_DJANGO_SECRET_KEY:-landing-fusion-change-me}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: structa.cloud,www.structa.cloud,localhost,127.0.0.1,landing-fusion-backend,landing-fusion-frontend
      CSRF_TRUSTED_ORIGINS: https://structa.cloud,https://www.structa.cloud,http://localhost:3000,http://127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: https://structa.cloud,https://www.structa.cloud,http://localhost:3000,http://127.0.0.1:3000
      DJANGO_DB_PATH: /data/db.sqlite3
      DEFAULT_FROM_EMAIL: Structa Cloud <structa.cloud@gmail.com>
      WAGTAILADMIN_BASE_URL: https://structa.cloud
      # Keep the data-API road as the deployment default; requests can still
      # opt into fusion-render with X-Fusion-Render-First: true.
      FUSION_RENDER_FIRST: "0"
    volumes:
      - landing-fusion-db:/data
      # Aligned with MEDIA_ROOT / STATIC_ROOT in backend/settings.py
      # (backend/assets/media + backend/assets/staticfiles) so the startup
      # collectstatic populates the named volumes and whitenoise serves them.
      - landing-fusion-media:/app/landing-fusion/backend/assets/media
      - landing-fusion-static:/app/landing-fusion/backend/assets/staticfiles
    networks:
      - common
      - traefik-net
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && python manage.py seed_pages --force
      && python manage.py seed_learning
      && exec gunicorn wsgi:application --bind 0.0.0.0:8074 --workers 2 --timeout 120 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8074/apis/pages/\", timeout=4)' "]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    build:
      # Repository-root context, matching the backend service — the Astro
      # build resolves the @fusion alias to libs/django-fusion/js/fusion-js
      # (copied into the image by frontend/Dockerfile).
      context: ../..
      dockerfile: projects/landing-fusion/frontend/Dockerfile
    image: landing-fusion-frontend:latest
    container_name: landing-fusion-frontend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_FUSION_API_URL: http://landing-fusion-backend:8074
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - common
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

networks:
  common:
    external: true
  traefik-net:
    external: true

volumes:
  landing-fusion-db:
    name: landing-fusion-db
  landing-fusion-media:
    name: landing-fusion-media
  landing-fusion-static:
    name: landing-fusion-static
