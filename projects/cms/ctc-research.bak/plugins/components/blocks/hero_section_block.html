{% load wagtailcore_tags wagtailimages_tags components_field %}

{% image self.background_image fill-1920x800 as bg_img %}
<section id="{{ block_id }}" class="hero-section {{ block_classes }} text-center text-white position-relative"
         {% if self.data_attributes %}{{ self.data_attributes|safe }}{% endif %}
         style="background-image: url('{{ bg_img.url }}'); background-size: cover; background-position: center; min-height: 500px;">

    {% render_unhandled_fields unhandled_fields %}

    <div class="hero-overlay"
         style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, {{ self.overlay_opacity|default:0.6 }});">
    </div>

    <div class="container position-relative py-5 d-flex flex-column align-items-center justify-content-center" style="z-index: 10; min-height: 500px;">
        <h1 class="display-3 fw-bold mb-4">{{ self.title }}</h1>
        <a href="{{ self.button_link }}" class="btn btn-primary btn-lg px-5 py-3 rounded-pill fw-bold">
            {{ self.button_text }}
        </a>
    </div>
</section>
