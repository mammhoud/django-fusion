{# projects/cypercloud/components/cypercloud/card.html #}
<article class="card h-100">
  <div class="card-body">
    <h2 class="h5">{{ title }}</h2>
    <code class="small d-block mb-3">{{ path }}</code>
    <button class="btn btn-outline-primary btn-sm"
            type="button"
            hx-get="{% url 'fragment_page_section_list' website.slug page.path %}"
            hx-target="#sections-{{ counter }}"
            hx-swap="innerHTML">
      Show linked sections
    </button>
    <div id="sections-{{ counter }}" class="mt-3"></div>
  </div>
</article>
