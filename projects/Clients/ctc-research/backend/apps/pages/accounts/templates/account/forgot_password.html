{% load i18n %}

<div class="auth__card" id="forgot-pw-form-container">
  <header class="auth__form-header">
    <span class="auth__form-eyebrow">Recovery</span>
    <h2 class="auth__form-title">{% trans "Forgot Password" %}</h2>
    <p class="auth__form-subtitle">
      {% trans "Enter your email address and we'll send you a reset link." %}
    </p>
  </header>

  <form id="forgot-password-form"
        class="auth__form"
        action="{% url 'accounts:password_forgot' %}"
        method="post"
        novalidate
        hx-post="{% url 'accounts:password_forgot' %}"
        hx-target="#forgot-pw-form-container"
        hx-swap="outerHTML">
    {% csrf_token %}
    <input type="hidden" name="strategy" value="{% if request.htmx %}htmx{% else %}document{% endif %}">
    <input type="hidden" name="supports_sse" value="{{ request.supports_sse|yesno:'true,false' }}">

    <div class="form__group">
      <label class="form__label" for="id_email">{% trans "Email Address" %}</label>
      <input id="id_email"
             name="email"
             type="email"
             maxlength="254"
             class="form__input {% if form.email.errors %}is-invalid{% endif %}"
             placeholder="you@example.com"
             required>
      {% if form.email.errors %}
      <p class="invalid-feedback">
        {% for error in form.email.errors %}{{ error }}{% endfor %}
      </p>
      {% endif %}
    </div>

    <button class="btn" type="submit">
      <span class="btn__text">{% trans "Send Reset Link" %}</span>
    </button>
  </form>

  <footer class="auth__footer">
    <p>
      <a href="{% url 'accounts:login' %}"
         class="auth__link"
         hx-get="{% url 'accounts:login' %}"
         hx-target=".auth__panel--form"
         hx-swap="innerHTML">
        {% trans "Back to Sign In" %}
      </a>
    </p>
  </footer>
</div>
