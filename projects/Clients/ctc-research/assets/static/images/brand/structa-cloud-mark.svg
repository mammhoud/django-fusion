<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" style="max-width:400px; display:block; margin:auto;">
  <defs>
    <style>
      .structa-ring { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: drawStructa 2s ease forwards; }
      @keyframes drawStructa { to { stroke-dashoffset: 0; } }
      #structa-inner { opacity: 0; animation: structaFadeIn 1.5s ease forwards 0.6s; }
      @keyframes structaFadeIn { to { opacity: 0.3; } }
      #structa-crown {
        opacity: 0;
        animation: structaCrownIn 0.8s ease forwards 1.5s;
      }
      @keyframes structaCrownIn { to { opacity: 1; } }
      #structa-spark {
        animation: structaSparkPulse 2.5s ease-in-out infinite 2s;
        transform-origin: center;
      }
      @keyframes structaSparkPulse {
        0%,100% { transform: scale(1); opacity: 0.85; }
        50%     { transform: scale(1.12); opacity: 1; }
      }
    </style>
    <linearGradient id="structa-copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="structa-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="structa-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="structa-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="structa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#EA580C" flood-opacity="0.3"/>
    </filter>
    <filter id="structa-sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g id="structa-container" filter="url(#structa-glow)">
    <!-- Outer ring — copper, representing the cloud ecosystem -->
    <circle class="structa-ring" cx="250" cy="250" r="155" fill="none" stroke="url(#structa-copper)" stroke-width="12"/>
    <!-- Inner ring — subtle, represents precision -->
    <circle id="structa-inner" cx="250" cy="250" r="120" fill="none" stroke="url(#structa-navy)" stroke-width="4" opacity="0"/>
    <!-- Cloud / S-crown mark at top — the "Structa" identity -->
    <g id="structa-crown" opacity="0">
      <!-- Three peaks suggesting structure/cloud -->
      <path fill="url(#structa-orange)" opacity="0.85"
            d="M 210 145 L 230 115 L 250 140 L 270 115 L 290 145 L 275 155 L 225 155 Z"/>
      <!-- Horizontal structure line -->
      <rect x="200" y="158" width="100" height="5" rx="2.5" fill="url(#structa-orange)" opacity="0.6"/>
    </g>
    <!-- Central S monogram — geometric, angular -->
    <g opacity="0.9">
      <!-- S built from geometric blocks -->
      <path fill="url(#structa-orange)" d="M 230 200 L 270 200 L 270 230 L 245 230 L 230 250 L 230 300 L 270 300 L 270 270 L 245 270 L 270 250 L 230 250" 
            fill-rule="evenodd"/>
    </g>
    <!-- Bottom spark -->
    <g id="structa-spark" filter="url(#structa-sparkGlow)">
      <polygon points="250,340 262,360 250,380 238,360" fill="url(#structa-gold)"/>
    </g>
    <!-- Orbital dots — ecosystem products -->
    <circle cx="130" cy="130" r="5" fill="#1F8A70" opacity="0.5"/><!-- Precis/Teal -->
    <circle cx="370" cy="130" r="5" fill="#0EA5E9" opacity="0.5"/><!-- Loop CRM/Blue -->
    <circle cx="130" cy="370" r="5" fill="#EA580C" opacity="0.5"/><!-- Formint/Orange -->
    <circle cx="370" cy="370" r="5" fill="#7E8A82" opacity="0.4"/><!-- Neutral -->
    <!-- Connecting lines (subtle ecosystem web) -->
    <line x1="130" y1="130" x2="250" y2="250" stroke="#1F8A70" stroke-width="1" opacity="0.15"/>
    <line x1="370" y1="130" x2="250" y2="250" stroke="#0EA5E9" stroke-width="1" opacity="0.15"/>
    <line x1="130" y1="370" x2="250" y2="250" stroke="#EA580C" stroke-width="1" opacity="0.15"/>
    <line x1="370" y1="370" x2="250" y2="250" stroke="#7E8A82" stroke-width="1" opacity="0.12"/>
  </g>
</svg>