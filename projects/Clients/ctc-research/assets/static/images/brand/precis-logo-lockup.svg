<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%" style="max-width:380px; display:block; margin:auto;">
  <defs>
    <linearGradient id="pl-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FB392"/>
      <stop offset="100%" stop-color="#1F8A70"/>
    </linearGradient>
    <linearGradient id="pl-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9962E"/>
      <stop offset="100%" stop-color="#A67B1E"/>
    </linearGradient>
    <linearGradient id="pl-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EB"/>
      <stop offset="100%" stop-color="#E8E3D8"/>
    </linearGradient>
    <filter id="pl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F8A70" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Protocol Mark (scaled into lockup) -->
  <g transform="translate(20 10) scale(0.5)" filter="url(#pl-glow)">
    <rect x="60" y="40" width="16" height="128" fill="url(#pl-paper)"/>
    <rect x="76" y="40" width="56" height="16" fill="url(#pl-paper)"/>
    <rect x="76" y="84" width="44" height="16" fill="url(#pl-paper)"/>
    <circle cx="98" cy="92" r="9" fill="none" stroke="url(#pl-teal)" stroke-width="3"/>
    <line x1="98" y1="44" x2="98" y2="120" stroke="url(#pl-teal)" stroke-width="1.5" opacity="0.55"/>
    <line x1="62" y1="92" x2="120" y2="92" stroke="url(#pl-teal)" stroke-width="1.5" opacity="0.55"/>
    <line x1="36" y1="178" x2="152" y2="178" stroke="url(#pl-amber)" stroke-width="3"/>
    <path d="M150 170 L164 178 L150 186 Z" fill="url(#pl-amber)"/>
  </g>
  <!-- Wordmark -->
  <text x="148" y="68" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="40" letter-spacing="8" fill="#F5F2EB">PRECIS</text>
  <!-- Subtitle -->
  <text x="148" y="95" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="400" font-size="11" letter-spacing="3" fill="#7E8A82">RESEARCH LMS</text>
  <!-- Evidence line accent -->
  <line x1="148" y1="108" x2="340" y2="108" stroke="url(#pl-amber)" stroke-width="1.5"/>
  <path d="M338 104 L348 108 L338 112 Z" fill="url(#pl-amber)"/>
</svg>