# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.override.yml — LOCAL DEVELOPMENT overlay for precis-main
# ─────────────────────────────────────────────────────────────────────────────
# Compose loads this file automatically when running from this directory:
#
#     docker compose up -d --build
#
# Precedence (high → low): override file → docker-compose.yml →
# project .env → root .env → built-in defaults. See the env cascade section in
# docs/guides/config-cascade.md for the full contract.
#
# For production deploys the proxy Compose (application/proxy) targets the
# same services — the override is a local-dev convenience only and is ignored
# when the stack is brought up from another directory or with -f flags.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    # Local access without the Traefik proxy: http://localhost:8074
    ports:
      - "8074:8074"
    environment:
      # Local debugging defaults — production compose sets DJANGO_DEBUG=0.
      DJANGO_DEBUG: "1"
      # Allow the browser to reach the backend directly in local dev.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,precis-main-backend,precis-main-frontend
      WAGTAILADMIN_BASE_URL: http://localhost:8074
    # Live project configs (YAML defaults) — edits apply without rebuilding.
    # (Env/_site.yml and configs/ are already mounted read-only by the base
    # compose file.)
    volumes:
      - ./configs:/app/precis-main/configs:ro

  frontend:
    # Local access without the Traefik proxy: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      # Browser-facing API URL (host-published backend port), so the built
      # Astro site talks to the locally exposed backend in dev. This is
      # PUBLIC_BROWSER_API_URL (client-side only) — NOT PUBLIC_FUSION_API_URL,
      # which is the server-side SSG fetch base and must stay on the Docker
      # network name (precis-main-backend:8074, set in docker-compose.yml);
      # overriding it with localhost breaks the in-container build (ECONNREFUSED).
      PUBLIC_BROWSER_API_URL: http://localhost:8074

  scheduler:
    # No extra local config needed — it shares the backend's Postgres DB and
    # only runs after the backend healthcheck passes.
    volumes:
      - ./configs:/app/precis-main/configs:ro
