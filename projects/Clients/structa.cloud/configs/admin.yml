# ─────────────────────────────────────────────────────────────────────────────
# precis-main — admin.yml (project-level cascade layer)
# ─────────────────────────────────────────────────────────────────────────────
# Admin panel + design-system (CSS panel) configuration. The admin surfaces
# are backend-owned on both public hosts (traefik routes /admin and
# /django-admin to the backend); the CSS panel is the compiled Tailwind design
# system shared by the Django render road and the Astro build.
#
# Admin paths (backend-owned, proxy contract in application/proxy/README.md):
#   /admin        → /admin/        → Wagtail login
#   /django-admin → /django-admin/ → Django admin login
# ─────────────────────────────────────────────────────────────────────────────

default:
  ADMIN:
    panel_path: /admin/
    django_admin_path: /django-admin/
    wagtail_site_name: "StructAI Softwares"
    wagtailadmin_base_url: "https://structa.cloud"
    csrf_trusted_origins:
      - https://structa.cloud
      - https://www.structa.cloud
      - https://lms.structa.cloud
      - http://localhost:3000
      - http://127.0.0.1:3000
    cors_allowed_origins:
      - https://structa.cloud
      - https://www.structa.cloud
      - https://lms.structa.cloud
      - http://localhost:3000
      - http://127.0.0.1:3000

  # ── CSS panel / design system ───────────────────────────────────────
  # One Tailwind v4 source drives both render roads: `make css` compiles
  # frontend/src/styles/globals.css → assets/static/css/fusion.css, which
  # collectstatic copies into STATIC_ROOT and whitenoise serves at /static/.
  CSS_PANEL:
    source: frontend/src/styles/globals.css
    compiled: assets/static/css/fusion.css
    build_command: "make css"
    served_at: /static/css/fusion.css
    tailwind: true
    tokens_reference: frontend/src/styles/globals.css

development:
  ADMIN:
    wagtailadmin_base_url: "http://localhost:8074"
