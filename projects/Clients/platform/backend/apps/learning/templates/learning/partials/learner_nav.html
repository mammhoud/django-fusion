{% comment %}Learning surface navigation: direct learner routes, intentionally separate from the public marketing header.{% endcomment %}
<nav class="learning-nav" aria-label="Learning sections">
  <div class="container-fusion learning-nav__inner">
    <span class="learning-nav__mark">LEARN / 00</span>
    <div class="learning-nav__links">
      <a href="/learning/"{% if request.path == '/learning/' %} aria-current="page"{% endif %}><span>01</span> CATALOG</a>
      <a href="/learning/dashboard/"{% if request.path|slice:":19" == '/learning/dashboard' %} aria-current="page"{% endif %}><span>02</span> DASHBOARD</a>
      <a href="/learning/profile/"{% if request.path|slice:":17" == '/learning/profile' %} aria-current="page"{% endif %}><span>03</span> PROFILE</a>
    </div>
    {% if request.user.is_authenticated %}<span class="learning-nav__identity">USER / {{ request.user.email }}</span>{% endif %}
  </div>
</nav>
