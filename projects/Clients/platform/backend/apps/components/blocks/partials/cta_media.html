{% load wagtailimages_tags %}
{# CTA Block Media Partial — renders image or video for split-layout CTA blocks #}

{% if self.media_type == 'video' and self.video_url %}
<div class="cta-block__video-wrapper ratio ratio-16x9">
    <iframe src="{{ self.video_url }}"
            title="{{ self.media_alt|default:'CTA video' }}"
            allowfullscreen
            loading="lazy"
            class="rounded shadow-sm"></iframe>
</div>

{% elif self.media_image %}
{% image self.media_image fill-800x600 as media_img %}
<img src="{{ media_img.url }}"
     alt="{{ self.media_alt|default:'' }}"
     class="img-fluid rounded shadow-sm"
     loading="lazy">

{% endif %}
