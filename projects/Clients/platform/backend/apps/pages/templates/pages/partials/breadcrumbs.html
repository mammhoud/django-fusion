{% comment %}Precis Landing breadcrumb trail for nested pages.{% endcomment %}
{% if breadcrumbs %}
<nav aria-label="Breadcrumb" class="site-breadcrumb" data-fusion-component="breadcrumb">
  <div class="container-fusion">
    <ol class="site-breadcrumb__list" itemscope itemtype="https://schema.org/BreadcrumbList">
      {% for crumb in breadcrumbs %}
      <li class="site-breadcrumb__item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
        <meta itemprop="position" content="{{ forloop.counter }}">
        <a href="{{ crumb.href }}" itemprop="item" class="site-breadcrumb__link"><span itemprop="name">{{ crumb.label }}</span></a>
        <span class="site-breadcrumb__separator" aria-hidden="true">/</span>
      </li>
      {% endfor %}
      <li class="site-breadcrumb__item site-breadcrumb__item--current" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem" aria-current="page">
        <meta itemprop="position" content="{{ breadcrumbs|length|add:1 }}">
        <span itemprop="name">{{ breadcrumb_current|default:localized_content.title|default:page.title }}</span>
      </li>
    </ol>
  </div>
</nav>
{% endif %}
