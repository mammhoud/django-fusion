<div x-data="{ open: false }" class="card overflow-hidden">
  <button type="button" class="flex w-full items-center justify-between gap-4 p-5 text-left" @click="open = !open" :aria-expanded="open.toString()">
    <span class="text-sm font-semibold text-fu-text">{{ value.question }}</span>
    <svg class="h-5 w-5 shrink-0 text-fu-primary transition-transform duration-200" :class="open ? 'rotate-45' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
  </button>
  {% if value.answer %}
    <div x-show="open" x-cloak x-collapse>
      <div class="px-5 pb-5 text-sm text-fu-text/70">{{ value.answer }}</div>
    </div>
  {% endif %}
</div>
