{% load wagtailcore_tags %}
<section id="faq" class="container-fusion py-16 sm:py-20">
  <div class="max-w-2xl">
    {% if value.eyebrow %}<span class="badge-primary badge mb-4">{{ value.eyebrow }}</span>{% endif %}
    <h2 class="text-2xl font-bold text-fu-text sm:text-3xl">{{ value.title }}</h2>
    {% if value.description %}<p class="mt-4 text-fu-text/70">{{ value.description }}</p>{% endif %}
  </div>
  <div x-data="{ q: '' }" class="mx-auto mt-10 max-w-2xl">
    <div class="relative mb-6">
      <svg class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-fu-text/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="search" x-model="q" class="input-field !pl-11" placeholder="Search frequently asked questions" aria-label="Search frequently asked questions" />
    </div>
    <div class="space-y-3">
      {% for item in value.items %}
        <div x-show="!q || '{{ item.question|escapejs }}'.toLowerCase().includes(q.toLowerCase())" x-transition>
          {% include_block item %}
        </div>
      {% endfor %}
    </div>
  </div>
</section>
