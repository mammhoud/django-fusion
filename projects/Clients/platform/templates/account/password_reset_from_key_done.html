{% extends "account/base_entrance.html" %}
{% load i18n %}
{% block head_title %}{% trans "Change Password" %}{% endblock %}
{% block auth_inner %}
<p class="tag-marker" style="margin:0 0 .25rem;">account · security</p>
<h2 style="margin:0 0 .5rem;font-family:'Bricolage Grotesque',sans-serif;font-size:1.5rem;font-weight:700;color:hsl(var(--fu-ink));">Password changed</h2>
<p style="margin:0 0 1.5rem;font-size:.85rem;color:hsl(var(--fu-muted));">Your password has been updated successfully.</p>
<p style="margin:0;font-size:.8rem;">
  <a href="{% url 'account_login' %}" class="btn btn-primary" style="padding:.7rem 1rem;text-decoration:none;">Sign In</a>
</p>
{% endblock %}
