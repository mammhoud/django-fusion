<div class="card p-6 reveal" x-data x-intersect="$el.classList.add('reveal-visible')" style="--reveal-i: {{ reveal_i|default:0 }}">
  <div class="mb-4 flex h-11 w-11 items-center justify-center rounded-lg bg-fu-primary/10 text-fu-primary">
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="{{ value.icon }}" />
    </svg>
  </div>
  <h3 class="text-lg font-semibold text-fu-text">{{ value.title }}</h3>
  {% if value.description %}
    <p class="mt-2 text-sm text-fu-text/70">{{ value.description }}</p>
  {% endif %}
</div>
