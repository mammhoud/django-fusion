# ─────────────────────────────────────────────────────────────────────────────
# syntara (Cypercloud) — site.yml (project-level cascade layer)
# ─────────────────────────────────────────────────────────────────────────────
# Site identity + public domain. The runtime name "cypercloud" is preserved as
# the external identity (settings.py WEBSITE_NAME default); Syntara is the
# current filesystem/product name.
# ─────────────────────────────────────────────────────────────────────────────

default:
  SITE:
    name: syntara
    runtime_name: cypercloud
    aliases:
      - cypercloud
      - tinker
      - templatetinker
    primary_domain: cypercloud.localhost
    domains:
      - cypercloud.localhost
      - localhost
    allowed_hosts:
      - localhost
      - 127.0.0.1
      - cypercloud.localhost
      - syntara-backend
    default_email: "Syntara <noreply@structa.cloud>"
    module: AI
    wagtail_site_name: "Syntara"
