# ============================================================
# Cypercloud – AI Chat Customizer Service Definition
# ============================================================
# Runs alongside the main sites on port 5073.
# Uses SQLite (no Postgres dependency) and has its own
# self-contained Dockerfile.
# ============================================================

services:
  cypercloud:
    build:
      context: ..
      dockerfile: cypercloud/Dockerfile
      args:
        CYPERCLOUD_PORT: "5073"
    image: cypercloud:latest
    container_name: cypercloud
    restart: unless-stopped
    working_dir: /app/cypercloud
    env_file:
      - path: ../../.env
        required: false
    environment:
      CYPERCLOUD_SECRET_KEY: ${CYPERCLOUD_SECRET_KEY:-django-insecure-cypercloud-dev}
      CYPERCLOUD_DEBUG: ${CYPERCLOUD_DEBUG:-0}
      CYPERCLOUD_ALLOWED_HOSTS: ${CYPERCLOUD_ALLOWED_HOSTS:-localhost,127.0.0.1,cypercloud.localhost}
      CYPERCLOUD_PORT: "5073"
      DJANGO_SETTINGS_MODULE: settings
      PORT: "5073"
      WORKERS: ${CYPERCLOUD_WORKERS:-2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5073/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "5073:5073"
    volumes:
      # Data subdirectory — keeps SQLite DB + uploaded media persistent
      # without overwriting the app source code mounted at /app/cypercloud/
      - cypercloud-data:/app/cypercloud/data:rw
      - cypercloud-static:/app/cypercloud/staticfiles:rw
      - cypercloud-media:/app/cypercloud/assets/media:rw
      - ../../logs:/app/logs:z
    networks:
      - common
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cypercloud.rule=Host(`${CYPERCLOUD_HOSTNAME:-cypercloud.localhost}`)"
      - "traefik.http.routers.cypercloud.entrypoints=web"
      - "traefik.http.services.cypercloud.loadbalancer.server.port=5073"

networks:
  common:
    external: true
  traefik-net:
    external: true

volumes:
  cypercloud-data:
    name: cypercloud-data
  cypercloud-static:
    name: cypercloud-static
  cypercloud-media:
    name: cypercloud-media
