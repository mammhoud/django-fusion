version: "3.8"
services:
  traefik:
    image: traefik:v2.10
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.insecure=true
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      traefik.enable: "true"

  web-ctc:
    image: example/web:ctc
    restart: unless-stopped
    environment:
      - PROJECT_PATH=ctc-research.com
    labels:
      traefik.enable: "true"
      traefik.http.routers.web-ctc.rule: Host(`ctc-research.com`)
      traefik.http.routers.web-ctc.entrypoints: websecure

  web-structa:
    image: example/web:structa
    restart: unless-stopped
    environment:
      - PROJECT_PATH=structa.cloud
    labels:
      traefik.enable: "true"
      traefik.http.routers.web-structa.rule: Host(`structa.cloud`)
      traefik.http.routers.web-structa.entrypoints: websecure

  nginx-media:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - media_volume:/var/www/media:ro
      - ./docker/nginx/media.conf:/etc/nginx/conf.d/media.conf:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.media.rule: Host(`media.ctc-research.com`) || Host(`media.structa.cloud`)
      traefik.http.routers.media.entrypoints: websecure

volumes:
  media_volume:
    external: false

# Notes:
# - This compose shows Traefik as the reverse-proxy and an Nginx container serving
#   the `media` volume (shared uploads). Replace hostnames and images as needed.
