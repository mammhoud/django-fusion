# ============================================================
# VResume - Main Docker Compose Orchestrator
# ============================================================
# Production-ready stack with all services
# Includes: PostgreSQL, Redis, Django, Celery, Nginx, MkDocs
#
# Usage:
#   make up                    # Start all services (infrastructure + app)
#   make docker-full           # Start all services with Traefik proxy
#   make docker-docs           # Start documentation service
#   docker compose -f docker-compose.yml -f compose/websites/docker-compose.proxy.yml up -d
#
# Service Architecture:
#   Base Layer (compose/websites/docker-compose.yml):
#     - PostgreSQL 16
#     - Redis 7
#
#   App Layer (compose/websites/docker-compose.warehouse.yml):
#     - Django (Uvicorn)
#     - Celery Worker
#     - Celery Beat (Scheduler)
#     - Nginx (Reverse Proxy)
#
#   Docs Layer (compose/websites/docker-compose.docs.yml - Optional):
#     - MkDocs Documentation Server
#
#   Proxy Layer (compose/websites/docker-compose.proxy.yml - Optional):
#     - Traefik (Modern reverse proxy with auto SSL)
#
# Compose include files:
#   - Infrastructure: DB + Cache
#   - Application: Django + Celery + Nginx
#   - Documentation: MkDocs (optional)
#   - Proxy: Traefik (optional)

networks:
  traefik-net:
    name: traefik-net
    external: true

include:
  - path: compose/docker-compose.yml
  - path: compose/docker-compose.warehouse.yml
  - path: compose/docker-compose.traefik.yml


