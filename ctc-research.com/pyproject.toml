[project]
name = "alliance"
version = "1.0.3"
description = "CTC Research — LMS & Blog Platform"
requires-python = ">=3.11"
# Site-specific extras on top of workspace shared deps (websites/pyproject.toml).
dependencies = [
    "bumpver",
    "django-stubs",
    "dynaconf[vault]",
    "pydantic",
    "pydantic-settings",
    "hypothesis",
    "pytest",
    "pytest-django",
    "django-osoul",
    "django-rseal",
    "django-grep",
]

# Inherit GitHub sources from workspace root.
# Repeated here so standalone `uv sync` inside this directory still works.
[tool.uv.sources]
django-osoul = { git = "https://github.com/mammhoud/django-osoul", branch = "generic" }
django-rseal = { git = "https://github.com/mammhoud/django-rseal", branch = "generic" }
django-grep  = { git = "https://github.com/mammhoud/django-grep",  branch = "generic" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["www", "plugins", "configs"]

[tool.bumpver]
current_version = "1.0.3"
version_pattern = "MAJOR.MINOR.PATCH[-TAG]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['version = "{version}"']
"__about__.py"   = ['^__version__ = "{version}"']
