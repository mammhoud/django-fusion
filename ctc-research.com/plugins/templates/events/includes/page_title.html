{% load i18n wagtailcore_tags %}
{# Events page title section #}
<section class="page-title-area">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="page-title-content text-center">
                    <h1>{{ page.title }}</h1>
                    {% if page.intro %}
                    <p class="lead">{{ page.intro|richtext }}</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>
