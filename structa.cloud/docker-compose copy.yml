# ============================================================
# Default Docker Compose for Websites
# Combines proxy + warehouse + website services
# Usage:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml -f structa.docker-compose.yml up -d
#   docker compose -f docker-compose.yml -f ctc-research.docker-compose.yml up -d
#   docker compose -f docker-compose.yml -f vresume.docker-compose.yml up -d
# ============================================================

# This file extends the base infrastructure by including:
# - docker-compose.proxy.yml: Traefik reverse proxy
# - docker-compose.warehouse.yml: Redis, PostgreSQL, Blinko, Docs, Adminer
# - structa.docker-compose.yml: structa.cloud website
# - ctc-research.docker-compose.yml: ctc-research.com website
# - vresume.docker-compose.yml: vresume.structa.cloud website

# To run with specific website:
#   docker compose -f docker-compose.yml -f structa.docker-compose.yml up -d

# Or run all:
#   docker compose -f docker-compose.yml -f structa.docker-compose.yml -f ctc-research.docker-compose.yml -f vresume.docker-compose.yml up -d
