{% load static unfold i18n wagtailcore_tags wagtailimages_tags wagtailsettings_tags %}

<div class="profile__stat-card card border-0 shadow-sm h-100">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <div class="profile__stat-icon rounded-circle bg-{{ color }}-subtle p-2 mb-3">
                    <i class="bi {{ icon }} fs-4 text-{{ color }}"></i>
                </div>
                <h3 class="profile__stat-value mb-1">{{ value }}</h3>
                <p class="profile__stat-label text-muted mb-0">{{ label }}</p>
            </div>
            {% if trend %}
                <span class="profile__stat-trend badge bg-{{ color }}-subtle text-{{ color }}">
                    {{ trend }}
                </span>
            {% endif %}
        </div>
        <div class="profile__stat-progress mt-3">
            <div class="progress" style="height: 4px;">
                <div class="progress-bar bg-{{ color }}" style="width: 75%"></div>
            </div>
        </div>
    </div>
</div>
