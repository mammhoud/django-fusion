# ============================================================
# Proxy Services - Docker Compose
# Traefik reverse proxy
# Usage: docker compose -f docker-compose.proxy.yml up -d
# ============================================================

networks:
  traefik-net:
    external: true
    name: traefik-net

services:
  # ============================================================
  # TRAEFIK - Shared Reverse Proxy
  # ============================================================
  traefik:
    build:
      context: ../compose/traefik
      dockerfile: Dockerfile
    image: traefik-custom
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - traefik_acme:/etc/traefik/acme
      - ../compose/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../compose/traefik/dynamic:/etc/traefik/dynamic:ro
    environment:
      DOCKER_API_VERSION: "1.44"
      TRAEFIK_ACME_EMAIL: ${TRAEFIK_ACME_EMAIL:-vresume@structa.cloud}
    networks:
      - traefik-net

volumes:
  traefik_acme:
