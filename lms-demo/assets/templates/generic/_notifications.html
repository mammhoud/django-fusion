{# assets/templates/generic/_notifications.html #}
{% load i18n %}
{% load static %}

<!-- Unified Notification System - All notifications, toasts, alerts, and popups -->
<div data-notifications-init id="notification-container" class="notification-system notifications-init notification-system--fixed" {% if request.htmx %}hx-swap-oob="true" {% endif %}>

    <!-- Django Messages (Fallback for non-JS) -->
    {% if messages %}
    <div id="django-messages" class="notification-system__django-messages django-messages-container"
        style="display: none;" data-processed="false">
        {% for message in messages %}
        <div class="notification-system__message django-message django-message--{{ message.tags|default:'info' }}"
            data-level="{{ message.tags|default:'info' }}" data-message="{{ message|escape }}"
            data-tags="{{ message.extra_tags|default:'' }}">
            <div class="django-message__content">
                <i
                    class="django-message__icon {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' %}bi-x-circle-fill{% elif message.tags == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %} me-2"></i>
                <span class="django-message__text">{{ message }}</span>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Toast Container - For temporary notifications (auto-dismiss) -->
    <div id="toast-container" class="notification-system__toasts toast-container position-fixed p-3"
        style="z-index: 1055; top: 20px; right: 20px;" aria-live="polite" aria-atomic="true">
        <!-- Toasts will be dynamically added here -->
    </div>

    <!-- Alert Container - For inline persistent notifications -->
    <div id="alert-container" class="notification-system__alerts alert-container mb-3">
        <!-- Alerts will be dynamically added here -->
    </div>

    <!-- Popup/Modal Container - For modal popups -->
    <div id="popup-container" class="notification-system__popups" style="z-index: 1050;">
        <!-- Modals/Popups will be dynamically added here -->
    </div>

    <!-- SSE Connection Status Indicator -->
    <div id="sse-indicator" {% if hx_connection %} sse-connect="{{ hx_connection }}" {% else %}
        sse-connect="{% url 'plugins:notifications' %}" {% endif %} class="notification-system__sse-indicator"
        style="display: none;" aria-hidden="true">
        <div class="sse-indicator__dot"></div>
        <span class="sse-indicator__text">{% trans "Live updates" %}</span>
    </div>

    <!-- SSE Connection (HTMX SSE extension) -->
    {% if request.user.is_authenticated and hx_connection %}
    <div id="sse-connection" class="notification-system__sse-connection">
    </div>
    {% endif %}
</div>

<!-- Toast Template - For temporary notifications (auto-dismiss after 5 seconds) -->
<template id="toast-template">
    <div class="notification-system__toast toast" role="alert" aria-live="assertive" aria-atomic="true"
        data-bs-delay="5000">
        <div class="toast__header toast-header d-flex align-items-center bg-{{ level }} text-white">
            <i class="toast__icon {{ icon }} me-2 fs-5"></i>
            <div class="toast__content flex-grow-1">
                <strong class="toast__title me-auto">{{ title }}</strong>
                <small class="toast__time text-white-50 opacity-75">{{ time }}</small>
            </div>
            <button type="button" class="toast__close btn-close btn-close-white ms-2" data-bs-dismiss="toast"
                aria-label="{% trans 'Close' %}"></button>
        </div>
        <div class="toast__body toast-body theme-bg-secondary">
            <div class="toast__message d-flex align-items-center">
                {% if icon %}
                <i class="toast__message-icon {{ icon }} me-2 opacity-75"></i>
                {% endif %}
                <span class="toast__message-text">{{ message }}</span>
            </div>
            {% if actions %}
            <div class="toast__actions mt-2">
                {{ actions|safe }}
            </div>
            {% endif %}
        </div>
    </div>
</template>

<!-- Alert Template - For persistent notifications (requires manual dismissal) -->
<template id="alert-template">
    <div class="notification-system__alert alert alert-{{ level }} alert-dismissible fade show d-flex align-items-center"
        role="alert">
        <div class="alert__icon-container me-2">
            <i class="alert__icon {{ icon }} fs-5"></i>
        </div>
        <div class="alert__content flex-grow-1">
            <div class="alert__header d-flex align-items-center mb-1">
                <strong class="alert__title me-2">{{ title }}</strong>
                {% if badge %}
                <span class="alert__badge badge rounded-pill ms-2">{{ badge }}</span>
                {% endif %}
            </div>
            <div class="alert__body">
                <span class="alert__message">{{ message }}</span>
                {% if details %}
                <details class="alert__details mt-2">
                    <summary class="alert__details-summary btn btn-sm btn-link p-0">{% trans "Details" %}</summary>
                    <div class="alert__details-content mt-1 small opacity-75">{{ details|safe }}</div>
                </details>
                {% endif %}
            </div>
        </div>
        <button type="button" class="alert__close btn-close" data-bs-dismiss="alert" aria-label="{% trans 'Close' %}"></button>
    </div>
</template>

<!-- Popup Template - For modal popups (requires user interaction) -->
<template id="popup-template">
    <div class="notification-system__popup modal fade" role="dialog" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered {{ popup_size|default:'modal-md' }}">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">{{ title }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
                </div>
                <div class="modal-body">
                    {{ message|safe }}
                </div>
                <div class="modal-footer">
                    {% if show_cancel %}
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        {% trans "Cancel" %}
                    </button>
                    {% endif %}
                    {% if popup_actions %}
                    {{ popup_actions|safe }}
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</template>
