# ============================================================
# Warehouse Services - Docker Compose
# Redis, PostgreSQL, Blinko, Docs, Adminer
# Usage: docker compose -f docker-compose.warehouse.yml up -d
# ============================================================

networks:
  traefik-net:
    external: true
    name: traefik-net

volumes:
  website_static:
    external: true
    name: website_static
  website_media:
    external: true
    name: website_media
  redis_data:
    external: true
    name: redis_data

services:
  # ============================================================
  # REDIS - Shared Cache Service
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5

  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  postgres:
    build:
      context: ../compose/postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mk_pAssWord123}
      INITDB_MULTIPLE_DATABASES: ${POSTGRES_DATABASES:-db_site,db_ctc,db_structa,db_vresume,blinko}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ../compose/postgres/postgres_data:/var/lib/postgresql/data:Z
      - ../compose/postgres/backups:/backups:Z
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 60s
      timeout: 5s
      retries: 5

  # ============================================================
  # BLINKO - Notes Application
  # ============================================================
  blinko:
    image: blinkospace/blinko:latest
    container_name: blinko
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mk_pAssWord123}@postgres:5432/blinko
      NEXTAUTH_SECRET: ${BLINKO_SECRET:-my-secret-key-change-me}
      NEXTAUTH_URL: ${BLINKO_URL:-https://space.structa.cloud}
    networks:
      - traefik-net
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # DOCS - Documentation Site
  # ============================================================
  docs:
    image: nginx:alpine
    container_name: docs
    volumes:
      - ../docs:/usr/share/nginx/html:ro
      - ../compose/nginx/docsify.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ============================================================
  # ADMINER - Database Management
  # ============================================================
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    environment:
      ADMINER_DESIGN: ${ADMINER_DESIGN:-dracula}
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - traefik-net
    depends_on:
      postgres:
        condition: service_healthy
