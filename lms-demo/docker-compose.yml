# Per-site docker-compose for lms-demo

networks:
  traefik-net:
    name: traefik-net
    external: true
  site_network:
    name: site_network
    external: true

x-django-base: &django-base
  build:
    context: ..
    dockerfile: compose/django/Dockerfile
  restart: unless-stopped
  working_dir: /app
  env_file:
    - path: ../.env
      required: false
  environment: &django-env
    RUNNING_ENV: docker
    SERVER_TYPE: ${SERVER_TYPE:-gunicorn}
    SERVER_ENV: ${SERVER_ENV:-production}
    DEBUG: ${DEBUG:-False}
    DB_TYPE: ${DB_TYPE:-postgres}
    DB_HOST: ${DB_HOST:-postgres}
    DB_PORT: ${DB_PORT:-5432}
    DB_USER: ${DB_USER:-structa}
    DB_PASSWORD: ${DB_PASSWORD:-mk_pAssWord123}
    REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-settings}
    WORKERS: ${WORKERS:-4}
    TIMEOUT: ${TIMEOUT:-120}
  volumes:
    - ../:/app:z
    - ../assets/media:/app/assets/media:z
  networks:
    - traefik-net
    - site_network
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  lms-demo-website:
    <<: *django-base
    container_name: lms-demo-website
    build:
      context: ..
      dockerfile: compose/django/Dockerfile
      args:
        PROJECT_PATH: lms-demo
    environment:
      <<: *django-env
      PORT: 5071
      DB_NAME: ${STRUCTA_DB_NAME:-db_structa}
      DJANGO_SITE: lms-demo
      DJANGO_WEBSITE: lms-demo
      WEBSITE: lms-demo
      WEBSITE_NAME: lms-demo
      PROJECT_PATH: lms-demo
    labels:
      - "traefik.enable=true"
      - "traefik.frontend.rule=Host:lms-demo.local"
      - "traefik.http.routers.lms-demo.rule=Host(`lms-demo.local`)"
      - "traefik.http.services.lms-demo.loadbalancer.server.port=5071"
    healthcheck:
      test: ["CMD", "curl", "-fL", "http://localhost:5071/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  lms-demo-website-worker:
    <<: *django-base
    container_name: lms-demo-website-worker
    build:
      context: ..
      dockerfile: compose/django/Dockerfile
      args:
        PROJECT_PATH: lms-demo
    environment:
      <<: *django-env
      PORT: 5071
      DJANGO_SITE: lms-demo
      DJANGO_WEBSITE: lms-demo
      WEBSITE: lms-demo
      PROJECT_PATH: lms-demo
