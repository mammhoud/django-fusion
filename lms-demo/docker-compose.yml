# ============================================================
# Structa.Cloud Website - Docker Compose
# Usage: docker compose -f docker-compose.yml -f structa.docker-compose.yml up -d
# ============================================================

x-django-base: &django-base
  build:
    context: ..
    dockerfile: compose/django/Dockerfile
    args:
      - PROJECT_PATH=${PROJECT_PATH:-lms-demo}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    - RUNNING_ENV=docker
    - SERVER_TYPE=${SERVER_TYPE:-gunicorn}
    - PROJECT_PATH=${PROJECT_PATH:-lms-demo}
  networks:
    - traefik-net
  external_links:
    - postgres
    - redis
  volumes:
    - website_static:/app/assets/staticfiles:z
    - website_media:/app/assets/media:z
    # Mount pre-built frontend assets from host (faster builds)
    # Default uses project-local assets/.
    # To run from repo root, set ASSETS_DIR=./lms-demo/assets
    - ${ASSETS_DIR:-./assets}/static:/app/assets/static:ro
    - ${ASSETS_DIR:-./assets}/media:/app/assets/media:ro
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${PORT:-5071}/health/ || exit 1"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 120s

x-nginx-base: &nginx-base
  build:
    context: ..
    dockerfile: compose/nginx/Dockerfile
  networks:
    - traefik-net
  restart: unless-stopped
  volumes:
    - website_static:/var/www/static:ro
    - website_media:/var/www/media:ro
  healthcheck:
    test: ["CMD", "nginx", "-t"]
    interval: 30s
    timeout: 10s
    retries: 3

networks:
  traefik-net:
    external: true
    name: traefik-net

volumes:
  website_static:
    external: true
    name: website_static
  website_media:
    external: true
    name: website_media

services:
  # ============================================================
  # STRUCTA.CLOUD - Main Website
  # ============================================================
  structa-website:
    <<: *django-base
    image: structa-website
    container_name: structa-website
    ports:
      - "5071:5071"
    environment:
      - RELOAD=${RELOAD:-false}
      - SERVER_ENV=production
      - DEBUG=False
      - PORT=5071
      - DB_HOST=postgres
      - DB_NAME=db_structa
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/3
      - DJANGO_SETTINGS_MODULE=configs.settings
      - APP_MODULE=www.asgi:application
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*,structa-website,localhost,127.0.0.1,core.structa.cloud,structa.cloud,www.structa.cloud}
      - SITE_DOMAIN=core.structa.cloud
      - RUN_SETUP=false
      - LOAD_FIXTURES=${LOAD_FIXTURES:-false}
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:-admin}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-vresume@structa.cloud}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-mk_pAssWord123}
      - DJANGO_SECURE_SSL_REDIRECT=false
      - DJANGO_SECURE_PROXY_SSL_HEADER=('HTTP_X_FORWARDED_PROTO', 'https')
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================
  # STRUCTA WEBSITE MEDIA - Static & Media Files
  # ============================================================
  structa-website-media:
    <<: *nginx-base
    image: structa-website-media
    container_name: structa-website-media
    ports:
      - "8272:80"
    depends_on:
      - structa-website
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================
  # STRUCTA RQ WORKER
  # ============================================================
  structa-website-worker:
    <<: *django-base
    image: structa-website-worker
    container_name: structa-website-worker
    depends_on:
      - structa-website
    environment:
      - SERVER_ENV=production
      - PORT=5075
      - DB_HOST=postgres
      - DB_NAME=db_structa
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/3
      - DJANGO_SETTINGS_MODULE=configs.settings
      - APP_MODULE=www.asgi:application
    command: /rqworker-start
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'rqworker' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
