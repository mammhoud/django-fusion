{# packages/ui/forms/validation.html #}
{% if errors %}
    <div class="invalid-feedback d-block mt-1">
        {% for error in errors %}
            <div class="text-danger small"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
        {% endfor %}
    </div>
{% else %}
    {% if success_message %}
        <div class="valid-feedback d-block mt-1 text-success small">
            <i class="bi bi-check-circle me-1"></i>{{ success_message }}
        </div>
    {% endif %}
{% endif %}
