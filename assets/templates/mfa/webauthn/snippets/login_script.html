{# WebAuthn / Passkey login script snippet #}
{# This template is conditionally included when PASSKEY_LOGIN_ENABLED is True #}
<script>
(function() {
    'use strict';
    var buttonId = '{{ button_id|default:"passkey_login" }}';
    var button = document.getElementById(buttonId);
    if (!button) return;

    if (!window.PublicKeyCredential) {
        button.style.display = 'none';
        return;
    }

    button.addEventListener('click', function(e) {
        e.preventDefault();
        // Passkey authentication flow — handled by django-mfa2 or similar
        fetch('/mfa/webauthn/authenticate/begin/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        })
        .then(function(r) { return r.json(); })
        .then(function(options) {
            return navigator.credentials.get({ publicKey: options });
        })
        .then(function(credential) {
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = '/mfa/webauthn/authenticate/complete/';
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'credential';
            input.value = JSON.stringify(credential);
            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        })
        .catch(function(err) {
            console.warn('Passkey authentication failed:', err);
        });
    });
})();
</script>
