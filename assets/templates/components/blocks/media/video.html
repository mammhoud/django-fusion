{% load wagtailcore_tags i18n %}
{# Simplified Video Block Template #}
{% firstof value self as vid %}
{% if vid and vid.embed_url %}
<div class="video-block mb-4">
    {% if vid.video_title %}
        <h4 class="video-block__title mb-3">{{ vid.video_title }}</h4>
    {% endif %}

    <div class="ratio ratio-16x9 rounded overflow-hidden shadow-sm">
        <iframe src="{{ vid.embed_url }}" allowfullscreen title="{{ vid.video_title|default:'Video' }}"></iframe>
    </div>

    {% if vid.video_description %}
        <div class="video-block__description mt-3 text-muted">
            {{ vid.video_description|richtext }}
        </div>
    {% endif %}
</div>
{% endif %}
