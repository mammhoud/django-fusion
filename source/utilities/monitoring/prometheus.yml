# Prometheus Configuration
# Generated for Phase 11 - Utilities & Monitoring Infrastructure

global:
  scrape_interval: 15s  # Set the scrape interval to every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'app-monitor'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'localhost:9093'

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker daemon
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']
    metrics_path: '/metrics'

  # CTC Research application
  - job_name: 'ctc-research'
    static_configs:
      - targets: ['ctc-research:8000']
    metrics_path: '/metrics/'
    scrape_interval: 30s

  # LMS Demo application
  - job_name: 'lms-demo'
    static_configs:
      - targets: ['lms-demo:8001']
    metrics_path: '/metrics/'
    scrape_interval: 30s

  # VResume application
  - job_name: 'vresume'
    static_configs:
      - targets: ['vresume:8002']
    metrics_path: '/metrics/'
    scrape_interval: 30s

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 15s

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 15s

  # Node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s
