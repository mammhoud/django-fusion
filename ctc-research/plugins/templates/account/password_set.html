{% load i18n static %}

<section class="fragment--form">
  <section class="auth__card card card--form">
    <header class="auth__form-header text-center">
      <div class="auth__logo mb-4"><a href="/"><img src="{% static 'images/logo.png' %}" style="max-height:60px" alt="Logo"></a></div>
      <h2 class="auth__form-title">{% trans "Set Password" %}</h2>
      <p class="auth__form-subtitle text-muted mb-4">{% trans "Create a password to enable direct sign-in" %}</p>
    </header>
    {% include "account/snippets/messages.html" %}
    <form method="post" action="{% url 'account_set_password' %}" hx-post="{% url 'account_set_password' %}" hx-target=".fragment--form" hx-swap="innerHTML" hx-indicator="#set-spinner">
      {% csrf_token %}
      <div class="form__group mb-4"><label for="id_password1">{% trans "Password" %}</label><input id="id_password1" name="password1" type="password" class="form-control" required></div>
      <div class="form__group mb-4"><label for="id_password2">{% trans "Confirm Password" %}</label><input id="id_password2" name="password2" type="password" class="form-control" required></div>
      <div class="d-grid"><button class="btn btn-gradient radius-round w-100 py-2" type="submit">{% trans "Set Password" %}<span id="set-spinner" class="spinner-border spinner-border-sm ms-2 htmx-indicator" style="display:none"></span></button></div>
    </form>
  </section>
</section>
