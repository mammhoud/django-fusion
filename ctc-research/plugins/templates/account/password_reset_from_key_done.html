{% load i18n static %}

<section class="fragment--form">
  <section class="auth__card card card--form text-center">
    <div class="auth__logo mb-4"><a href="/"><img src="{% static 'images/logo.png' %}" style="max-height:60px" alt="Logo"></a></div>
    <h2 class="auth__form-title">{% trans "Password Reset Complete" %}</h2>
    <div class="alert alert-success">{% trans "Your password has been successfully updated." %}</div>
    <a href="{% url 'account_login' %}" class="btn btn-primary" hx-get="{% url 'account_login' %}" hx-target=".fragment--form" hx-swap="innerHTML">{% trans "Sign In" %}</a>
  </section>
</section>
