# ============================================================
# CTC-Research.com Website - Docker Compose
# Usage: docker compose -f docker-compose.yml -f ctc-research.docker-compose.yml up -d
# ============================================================

x-django-env: &django-env
  RUNNING_ENV: docker
  SERVER_TYPE: ${SERVER_TYPE:-gunicorn}
  PROJECT_PATH: ${PROJECT_PATH:-ctc-research}
  DJANGO_SITE: ${PROJECT_PATH:-ctc-research}
  DJANGO_WEBSITE: ${PROJECT_PATH:-ctc-research}
  WEBSITE: ${PROJECT_PATH:-ctc-research}
  WEBSITE_NAME: ${PROJECT_PATH:-ctc-research}
  DJANGO_SETTINGS_MODULE: settings
  PYTHONPATH: /app/${PROJECT_PATH:-ctc-research}:/app

x-django-base: &django-base
  build:
    context: ..
    dockerfile: compose/django/Dockerfile
    args:
      - PROJECT_PATH=${PROJECT_PATH:-ctc-research}
  restart: unless-stopped
  env_file:
    - path: .env.${SERVER_ENV:-production}
      required: false
    - path: .env
      required: false
  environment:
    <<: *django-env
  networks:
    - traefik-net
    - site_network
  external_links:
    - postgres
    - redis
  volumes:
    - website_static:/app/assets/staticfiles:z
    - website_media:/app/assets/media:z
    - ${LOGS_DIR:-./logs}:/app/logs:z
    # Mount pre-built frontend assets from host (faster builds)
    # Default uses project-local assets/.
    # To run from repo root, set ASSETS_DIR=./ctc-research/assets
    - ${ASSETS_DIR:-./assets}/static:/app/assets/static:ro
    - ${ASSETS_DIR:-./assets}/media:/app/assets/media:ro
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${PORT:-5070}/health/ || exit 1"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 120s

x-nginx-base: &nginx-base
  build:
    context: ..
    dockerfile: compose/nginx/Dockerfile
  networks:
    - traefik-net
    - site_network
  restart: unless-stopped
  volumes:
    - website_static:/var/www/static:ro
    - website_media:/var/www/media:ro
  healthcheck:
    test: ["CMD", "nginx", "-t"]
    interval: 30s
    timeout: 10s
    retries: 3

networks:
  traefik-net:
    external: true
    name: traefik-net
  site_network:
    external: true
    name: site_network

volumes:
  website_static:
    external: true
    name: website_static
  website_media:
    external: true
    name: website_media

services:
  # ============================================================
  # CTC-RESEARCH.COM - Main Website
  # ============================================================
  ctc-website:
    <<: *django-base
    image: ctc-website
    container_name: ctc-website
    ports:
      - "5070:5070"
    environment:
      <<: *django-env
      RELOAD: ${RELOAD:-false}
      SERVER_ENV: ${SERVER_ENV:-production}
      DEBUG: ${DEBUG:-false}
      PORT: ${PORT:-5070}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-ctc-research.com,www.ctc-research.com,arch.ctc-research.com,localhost,127.0.0.1}
      SITE_DOMAIN: ${SITE_DOMAIN:-ctc-research.com}
      RUN_SETUP: ${RUN_SETUP:-true}
      LOAD_FIXTURES: ${LOAD_FIXTURES:-false}
      FORCE_LOAD_DUMPS: ${FORCE_LOAD_DUMPS:-false}
      STRICT_PAGE_CONTENT: ${STRICT_PAGE_CONTENT:-true}
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME:-admin}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@ctc-research.com}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-('HTTP_X_FORWARDED_PROTO', 'https')}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================
  # CTC WEBSITE MEDIA - Static & Media Files
  # ============================================================
  ctc-website-media:
    <<: *nginx-base
    image: ctc-website-media
    container_name: ctc-website-media
    ports:
      - "8271:80"
    depends_on:
      - ctc-website
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================
  # CTC RQ WORKER
  # ============================================================
  ctc-website-worker:
    <<: *django-base
    image: ctc-website-worker
    container_name: ctc-website-worker
    depends_on:
      - ctc-website
    environment:
      <<: *django-env
      SERVER_ENV: ${SERVER_ENV:-production}
      PORT: ${WORKER_PORT:-5075}
    command: /rqworker-start
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'rqworker' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
