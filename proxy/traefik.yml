# ============================================
# Traefik Static Configuration for Coolify Proxy
# ============================================

global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO
  format: common

accessLog:
  format: common
  bufferingSize: 100

api:
  dashboard: true
  debug: false
  insecure: false          # dashboard is not exposed by default

ping: {}                   # health check endpoint

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: web-secure
          scheme: https
          permanent: true

  web-secure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

providers:
  file:
    directory: /traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@structa.cloud"
      storage: /traefik/acme/acme.json
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web

  letsencrypt-staging:
    acme:
      email: "admin@structa.cloud"
      storage: /traefik/acme/acme-staging.json
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web

