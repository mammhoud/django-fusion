http:
  routers:
    catchall-https:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints: [web-secure]
      priority: 1
      service: noop@internal
      tls: {}

    catchall-http:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints: [web]
      priority: 1
      middlewares: [redirect-to-https]
      service: noop@internal
