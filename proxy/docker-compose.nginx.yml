# ============================================================
# Workspace Shared Media Frontend (Nginx)
# ============================================================
# Provides static/media server with shared proxy settings

networks:
  traefik-net:
    name: traefik-net
  common:
    external: true

x-proxy-common: &proxy-common
  restart: unless-stopped
  networks:
    - traefik-net
    - common
x-media-base: &media-base
  build:
    context: ..
    dockerfile: ./services/media/Dockerfile
  restart: unless-stopped
  networks:
    - traefik-net
    - common
  healthcheck:
    test: ["CMD", "nginx", "-t"]
    interval: 30s
    timeout: 10s
    retries: 3

services:
  shared-media:
    <<: *media-base
    container_name: shared-media

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shared-media.rule=Host(`media.structa.cloud`) || Host(`media.ctc-research.com`) || Host(`media.lms-demo.com`) || Host(`media.vresume.structa.cloud`)"
      - "traefik.http.services.shared-media.loadbalancer.server.port=80"
    volumes:
      - ../applications/assets/media:/usr/share/nginx/html/media:ro
      - ../applications/assets/static:/usr/share/nginx/html/static:ro
      - ../assets/staticfiles:/var/www/static:ro
      - ../assets/media:/var/www/media:ro
      - ../ctc-research/assets/staticfiles:/var/www/sites/ctc-research/static:ro
      - ../lms-demo/assets/staticfiles:/var/www/sites/lms-demo/static:ro
      - ../VResume/assets/staticfiles:/var/www/sites/vresume/static:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
    networks:
      - common

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
