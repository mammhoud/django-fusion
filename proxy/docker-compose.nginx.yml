# ============================================================
# Workspace Shared Media Frontend (Nginx)
# ============================================================
# Provides static/media server with shared proxy settings

networks:
  traefik-net:
    name: traefik-net
  common:
    external: true

x-proxy-common: &proxy-common
  restart: unless-stopped
  networks:
    - traefik-net
    - common
x-media-base: &media-base
  build:
    context: ./nginx
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - traefik-net
    - common
  healthcheck:
    test: ["CMD", "nginx", "-t"]
    interval: 30s
    timeout: 10s
    retries: 3

services:
  shared-media:
    <<: *media-base
    container_name: shared-media

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shared-media.rule=Host(`media.structa.cloud`) || Host(`media.ctc-research.com`) || Host(`media.lms-demo.com`) || Host(`media.vresume.structa.cloud`)"
      - "traefik.http.services.shared-media.loadbalancer.server.port=80"
    volumes:
      # Site build output staticfiles
      - ../applications/ctc-research/assets/staticfiles:/var/www/sites/ctc-research/static:ro
      - ../applications/lms-demo/assets/staticfiles:/var/www/sites/lms-demo/static:ro
      - ../applications/VResume/assets/staticfiles:/var/www/sites/vresume/static:ro
      # Shared application static files
      - ../applications/assets/static:/var/www/static:ro
      # Site-specific media uploads
      - ../applications/ctc-research/assets/media:/var/www/media/ctc-research:ro
      - ../applications/lms-demo/assets/media:/var/www/media/lms-demo:ro
      - ../applications/VResume/assets/media:/var/www/media/vresume:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/nginx.conf:ro
    networks:
      - traefik-net
      - common

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
