# ============================================================
# VResume - Caddy Reverse Proxy (Optional)
# ============================================================
# Features:
#   - HTTP/HTTPS routing
#   - Service discovery via labels

networks:
  traefik-net:
    name: traefik-net
  coolify:
    name: coolify

x-proxy-common: &proxy-common
  restart: unless-stopped
  networks:
    - traefik-net
    - coolify

services:
  caddy:
    <<: *proxy-common
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "8081:80"
      - "8443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../assets/staticfiles:/var/www/static:ro
      - ../assets/media:/var/www/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
