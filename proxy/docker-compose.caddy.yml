# ============================================================
# VResume - Caddy Reverse Proxy (Optional)
# ============================================================
# Features:
#   - HTTP/HTTPS routing
#   - Service discovery via labels

networks:
  traefik-net:
    name: traefik-net

services:

  # # --- Option 2: Caddy Proxy ---
  vresume-caddy:
    image: caddy:2-alpine
    container_name: vresume-caddy
    restart: unless-stopped
    depends_on:
      - vresume-django
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../assets/staticfiles:/var/www/static:ro
      - ../assets/media:/var/www/media:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - traefik-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
