# ============================================================
# Local Traefik Reverse Proxy (standalone)
# Reads the same traefik.yml and dynamic/ folder as Coolify.
# ============================================================

networks:
  traefik-net:
    external: false   # create automatically if not exists
  coolify:
    external: true

volumes:
  traefik_acme:

x-proxy-common: &proxy-common
  restart: unless-stopped
  networks:
    - traefik-net
    - coolify

services:
  coolify-proxy:
    <<: *proxy-common
    container_name: coolify-proxy
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"       # dashboard (secured via basic-auth in middlewares)
    volumes:
      - traefik_acme:/etc/traefik/acme
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/traefik/certs:ro     # optional, only if you use static certs
    environment:
      TRAEFIK_ACME_EMAIL: admin@structa.cloud
      TRAEFIK_LOG_LEVEL: INFO
    networks:
      - traefik-net
      - coolify
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
