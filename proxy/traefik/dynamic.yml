# ============================================
# Traefik Static Configuration (full)
# ============================================

global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO
  format: common

accessLog:
  format: common
  bufferingSize: 100

api:
  dashboard: true
  debug: false
  insecure: false          # dashboard is not exposed by default; use secure entrypoint

ping: {}                   # health check endpoint – exposed on :8080

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: web-secure
          scheme: https
          permanent: true

  web-secure:
    address: ":443"
    http:
      tls: {}

  # Optional UDP entrypoint (if you need explicit UDP routing)
  # web-secure-udp:
  #   address: ":443/udp"

providers:
  file:
    directory: /etc/traefik/dynamic   # correct path for dynamic configs
    watch: true

# ===========================================================================
# ACME / Let's Encrypt — certificate resolvers
# ===========================================================================
# STEP 2 of the LE migration: uncomment ONE of the resolver blocks below,
# then restart the proxy: docker restart default-proxy
#
# After restarting, complete STEP 3 in proxy/traefik/dynamic/ctc-research.yml
# (flip routers to use certResolver and comment out the self-signed cert entry
# in proxy/traefik/dynamic/certs.yml).
#
# Prerequisites common to both options:
#   - proxy/acme/acme.json must exist with mode 0600
#     Run: touch proxy/acme/acme.json && chmod 600 proxy/acme/acme.json
#
# ---------------------------------------------------------------------------
# OPTION A — DNS-01 via Cloudflare (recommended; works even if port 80 is
#             blocked; required for wildcard certs)
#
# Prerequisites:
#   - ctc-research.com DNS managed by Cloudflare
#   - Cloudflare API token (Zone:DNS:Edit) set in proxy/.env as CF_DNS_API_TOKEN
#     Create at: https://dash.cloudflare.com/profile/api-tokens
#
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: structa.cloud@gmail.com
#       storage: /etc/traefik/acme/acme.json
#       caServer: https://acme-v02.api.letsencrypt.org/directory
#       # caServer: https://acme-staging-v02.api.letsencrypt.org/directory  # use for testing
#       dnsChallenge:
#         provider: cloudflare
#         delayBeforeCheck: 30
#         resolvers:
#           - 1.1.1.1:53
#           - 8.8.8.8:53
#
# ---------------------------------------------------------------------------
# OPTION B — HTTP-01 via Hostinger DNS (no API token needed)
#
# Prerequisites:
#   - STEP 1 must be done first: DNS A records for ctc-research.com must
#     point to 187.77.166.222 (set on Hostinger: https://hpanel.hostinger.com)
#   - Port 80 must be reachable from the internet on ctc-research.com
#   - Verify DNS before enabling: dig +short ctc-research.com A
#     must return 187.77.166.222, not 127.0.0.1
#
certificatesResolvers:
  letsencrypt-http:
    acme:
      email: structa.cloud@gmail.com
      storage: /etc/traefik/acme/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web
#
# ---------------------------------------------------------------------------
