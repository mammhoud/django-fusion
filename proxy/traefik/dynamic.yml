# ============================================
# Traefik Static Configuration (full)
# ============================================

global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO
  format: common

accessLog:
  format: common
  bufferingSize: 100

api:
  dashboard: true
  debug: false
  insecure: false          # dashboard is not exposed by default; use secure entrypoint

ping: {}                   # health check endpoint – exposed on :8080

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: web-secure
          scheme: https
          permanent: true

  web-secure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

  # Optional UDP entrypoint (if you need explicit UDP routing)
  # web-secure-udp:
  #   address: ":443/udp"

providers:
  file:
    directory: /etc/traefik/dynamic   # correct path for dynamic configs
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@structa.cloud"
      storage: /etc/traefik/acme/acme.json   # correct path
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web

  letsencrypt-staging:
    acme:
      email: "admin@structa.cloud"
      storage: /etc/traefik/acme/acme-staging.json
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web

# Optional static certificates (uncomment if you have custom certs)
# tls:
#   certificates:
#     - certFile: /etc/traefik/certs/ctc-research.crt
#       keyFile: /etc/traefik/certs/ctc-research.key
#     - certFile: /etc/traefik/certs/structa-cloud.crt
#       keyFile: /etc/traefik/certs/structa-cloud.key
#     - certFile: /etc/traefik/certs/vresume.crt
#       keyFile: /etc/traefik/certs/vresume.key