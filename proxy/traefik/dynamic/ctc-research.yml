# =============================================================================
# CTC Research — Traefik router config
# =============================================================================
#
# CURRENT STATE: serving self-signed TLS cert (browsers will warn).
#
# TO GET A TRUSTED LET'S ENCRYPT CERT — follow these 3 steps in order:
#
# STEP 1 — Fix DNS on Hostinger
#   Log in at https://hpanel.hostinger.com → DNS Zone for ctc-research.com
#   Add / update these A records (all pointing to this server):
#
#     @    A  187.77.166.222  (ctc-research.com)
#     www  A  187.77.166.222
#     arch A  187.77.166.222
#
#   Set TTL to 300. Wait a few minutes for propagation, then verify:
#     dig +short ctc-research.com A   # should return 187.77.166.222
#
# STEP 2 — Enable certificatesResolvers in proxy/traefik/dynamic.yml
#   See the comment block at the bottom of that file.
#   Uncomment the `certificatesResolvers:` section and restart the proxy:
#     docker restart default-proxy
#
# STEP 3 — Flip the routers below to use the LE cert resolver
#   On ctc-site-https and ctc-site-media-https, replace:
#     tls: {}
#   with:
#     tls:
#       certResolver: letsencrypt        # DNS-01 via Cloudflare
#   OR:
#     tls:
#       certResolver: letsencrypt-http   # HTTP-01 (no API token needed,
#                                        # but requires Step 1 DNS to be done first)
#
#   Then remove the ctc-research entry from proxy/traefik/dynamic/certs.yml
#   (see comment in that file) so Traefik stops serving the self-signed cert.
#
#   Traefik will request and store the LE cert automatically on next request.
#   No restart needed for Step 3 — the file provider hot-reloads.
# =============================================================================

http:
  routers:
    ctc-site-http:
      rule: 'Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: ctc-site-service
      priority: 10
    ctc-site-https:
      rule: 'Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)'
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: ctc-site-service
      tls:
        certResolver: letsencrypt-http
    ctc-site-media-http:
      rule: '(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`) || PathPrefix(`/sites/`))'
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: ctc-site-media-service
      priority: 100
    ctc-site-media-https:
      rule: '(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`) || PathPrefix(`/sites/`))'
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: ctc-site-media-service
      priority: 100
      tls:
        certResolver: letsencrypt-http
  services:
    ctc-site-service:
      loadBalancer:
        servers:
          - url: 'http://ctc-research-website:5070'
        healthCheck:
          path: /health/
          hostname: ctc-research.com
          interval: 30s
          timeout: 10s
    ctc-site-media-service:
      loadBalancer:
        servers:
          - url: 'http://shared-media:80'
