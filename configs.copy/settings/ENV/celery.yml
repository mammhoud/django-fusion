# ====================================
# 🥬 Celery Configuration
# ====================================
default:
  # Defaults for all environments
  CELERY:
    BROKER_URL: "@jinja {{ env.get('CELERY_BROKER_URL', env.get('REDIS_URL', 'redis://localhost:6379/3')) }}"
    RESULT_BACKEND: "@jinja {{ env.get('REDIS_URL', 'redis://localhost:6379/3') }}"
    TASK_ALWAYS_EAGER: false
    ACCEPT_CONTENT: ["json"]
    TASK_SERIALIZER: "json"
    RESULT_SERIALIZER: "json"
    TIMEZONE: "UTC"
    ENABLE_UTC: true
    TASK_TRACK_STARTED: true
    TASK_TIME_LIMIT: 1800
    TASK_SOFT_TIME_LIMIT: 1200
    WORKER_PREFETCH_MULTIPLIER: 1
    WORKER_MAX_TASKS_PER_CHILD: 100
    WORKER_CONCURRENCY: 1
    WORKER_SEND_TASK_EVENTS: true
    WORKER_DIRECT: false
    BROKER_CONNECTION_RETRY_ON_STARTUP: true
    BROKER_HEARTBEAT: 10
    BROKER_CONNECTION_TIMEOUT: 30
    BROKER_POOL_LIMIT: 10
    RESULT_EXPIRES: 3600
    RESULT_CACHE_MAX: 10000
    RESULT_EXTENDED: true

    # Queue configuration
    TASK_DEFAULT_QUEUE: "default"
    TASK_DEFAULT_EXCHANGE: "default"
    TASK_DEFAULT_EXCHANGE_TYPE: "direct"
    TASK_DEFAULT_ROUTING_KEY: "default"
    TASK_QUEUES:
      default:
        exchange: "default"
        exchange_type: "direct"
        routing_key: "default"
      priority:
        exchange: "priority"
        exchange_type: "direct"
        routing_key: "priority"

    # Beat scheduler
    BEAT_SCHEDULE: "@import configs.base.celery_beat:CELERY_BEAT_SCHEDULE"
    BEAT_SCHEDULER: "django_celery_beat.schedulers:DatabaseScheduler"

production:
  CELERY:
    WORKER_CONCURRENCY: 4
    TASK_TIME_LIMIT: 1800
    TASK_SOFT_TIME_LIMIT: 1200
