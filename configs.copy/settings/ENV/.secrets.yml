# ====================================
# 🔑 Secrets & Integration Credentials
# ====================================
# This file is loaded last by Dynaconf. Keep real values in environment
# variables or an untracked local override; the values below are safe defaults
# and env references only.

default:
  SECRETS:
    DJANGO_SECRET_KEY: "@env DJANGO_SECRET_KEY dev-secret-key-change-this-line-for-production"
    VAULT_ENABLED_FOR_DYNACONF: "@env VAULT_ENABLED_FOR_DYNACONF false"

  DATABASE_CREDENTIALS:
    NAME: "@env DB_NAME vresume"
    USER: "@env DB_USER vresume"
    PASSWORD: "@env DB_PASSWORD mk_pAssWord123"
    HOST: "@env DB_HOST vresume-postgres"
    PORT: "@env DB_PORT 5432"

  REDIS_CREDENTIALS:
    URL: "@env REDIS_URL redis://localhost:6379/0"
    PASSWORD: "@env REDIS_PASSWORD"

  EMAIL_CREDENTIALS:
    BACKEND: "@env EMAIL_BACKEND django.core.mail.backends.console.EmailBackend"
    HOST: "@env EMAIL_HOST localhost"
    PORT: "@env EMAIL_PORT 1025"
    USER: "@env EMAIL_USER"
    PASSWORD: "@env EMAIL_PASSWORD"
    FROM: "@env EMAIL_FROM hello@vresume.local"

  SUPERUSER_CREDENTIALS:
    USERNAME: "@env DJANGO_SUPERUSER_USERNAME"
    EMAIL: "@env DJANGO_SUPERUSER_EMAIL"
    PASSWORD: "@env DJANGO_SUPERUSER_PASSWORD"

  INTEGRATIONS:
    SENTRY_DSN: "@env SENTRY_DSN"
    GOOGLE_ANALYTICS_ID: "@env GOOGLE_ANALYTICS_ID"
    GOOGLE_MAP_API_KEY: "@env GOOGLE_MAP_API_KEY"
    GOOGLE_RECAPTCHA_SITE_KEY: "@env GOOGLE_RECAPTCHA_SITE_KEY"
    GOOGLE_RECAPTCHA_SECRET_KEY: "@env GOOGLE_RECAPTCHA_SECRET_KEY"
    STRIPE_PUBLIC_KEY: "@env STRIPE_PUBLIC_KEY"
    STRIPE_SECRET_KEY: "@env STRIPE_SECRET_KEY"
    AWS_ACCESS_KEY_ID: "@env AWS_ACCESS_KEY_ID"
    AWS_SECRET_ACCESS_KEY: "@env AWS_SECRET_ACCESS_KEY"
    AWS_STORAGE_BUCKET_NAME: "@env AWS_STORAGE_BUCKET_NAME"
    AWS_BACKUP_BUCKET: "@env AWS_BACKUP_BUCKET"
    SENDGRID_API_KEY: "@env SENDGRID_API_KEY"
    MAILGUN_API_KEY: "@env MAILGUN_API_KEY"
    GITHUB_CLIENT_ID: "@env GITHUB_CLIENT_ID"
    GITHUB_CLIENT_SECRET: "@env GITHUB_CLIENT_SECRET"
    GOOGLE_CLIENT_ID: "@env GOOGLE_CLIENT_ID"
    GOOGLE_CLIENT_SECRET: "@env GOOGLE_CLIENT_SECRET"
    FIDO2_RP_ID: "@env FIDO2_RP_ID"
    FIDO2_RP_NAME: "@env FIDO2_RP_NAME VResume"

local:
  DATABASE_CREDENTIALS:
    NAME: "@env DB_NAME vresume_local"
    USER: "@env DB_USER postgres"
    PASSWORD: "@env DB_PASSWORD local_password_here"
    HOST: "@env DB_HOST localhost"
    PORT: "@env DB_PORT 5432"

  CACHES:
    default:
      LOCATION: "@env REDIS_URL redis://localhost:6379/1"

  EMAIL_BACKEND: "django.core.mail.backends.filebased.EmailBackend"
  EMAIL_FILE_PATH: "@format {env.LOGS_DIR}/emails"
