default:
  # Default storage (local filesystem)
  STORAGE:
    DEFAULT_FILE_STORAGE: "django.core.files.storage.FileSystemStorage"
    STATICFILES_STORAGE: "django.contrib.staticfiles.storage.StaticFilesStorage"
    USE_S3: false
    MEDIA_ROOT: "assets/media"
    STATIC_ROOT: "staticfiles"
    STATIC_URL: "/static/"
    MEDIA_URL: "/media/"

production:
  # Production storage (AWS S3)
  STORAGE:
    DEFAULT_FILE_STORAGE: "storages.backends.s3boto3.S3Boto3Storage"
    STATICFILES_STORAGE: "storages.backends.s3boto3.S3Boto3Storage"
    USE_S3: false
    AWS_ACCESS_KEY_ID: "@env AWS_ACCESS_KEY_ID"
    AWS_SECRET_ACCESS_KEY: "@env AWS_SECRET_ACCESS_KEY"
    AWS_STORAGE_BUCKET_NAME: "xellent-static-production"
    AWS_S3_REGION_NAME: "us-east-1"
    AWS_S3_CUSTOM_DOMAIN: "cdn.ctc-research.com"
    AWS_S3_OBJECT_PARAMETERS:
      CacheControl: "max-age=86400"
    AWS_DEFAULT_ACL: "public-read"
    AWS_QUERYSTRING_AUTH: false
    AWS_S3_MAX_MEMORY_SIZE: 100000000
