[project]
name = "ecosystem-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.15.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
]

[tool.uv.workspace]
members = [
    "libs/django-osoul",
    "libs/django-grep",
    "libs/django-rseal",
    "libs/crafts-ai",
]

[tool.uv.sources]
django-osoul = { workspace = true }
django-grep  = { workspace = true }
django-rseal = { workspace = true }
nawaai       = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "*/tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["venv/libs", "ctc-research.com", "structa.cloud"]
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/venv/.py/*", "*/node_modules/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "sphinx>=8.1.3",
]
