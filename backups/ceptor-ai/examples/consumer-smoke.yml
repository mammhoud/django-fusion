# consumer-smoke.yml — paste into a SEPARATE repo's
# `.github/workflows/consumer-smoke.yml` to verify that
# `mammhoud/structa.cloud/deploy-preflight@v1.0.1` (the
# just-published Composite Action) resolves AND runs end-to-end
# from a real consumer's perspective.
#
# Why a separate repo? Composite-Action resolution
# (`uses: owner/repo/sub-path@vX.Y.Z`) fetches the action from
# GitHub by its `owner/repo/vX.Y.Z` reference. Exercising it from
# the action's home repo would short-circuit — GitHub resolves
# local-path references (`./.github/actions/...`) without going
# through the public-tag plumbing we want to verify.
#
# Setup:
#   1. Pick any throwaway repo (even an empty one will work — the
#      action runs against whatever Makefile lives at repo root).
#   2. Add a minimal Makefile with a `deploy-ci` target that
#      exercises the project-level preflight gates. Or use an
#      existing repo whose Makefile already has one.
#   3. Save this file at `.github/workflows/consumer-smoke.yml`.
#   4. Push to any branch; the workflow runs.
#
# Expected result: green run (assuming the consumer's Makefile
# passes preflight). The `make deploy-ci` invocation output is the
# action's literal stdout, so you should see the 🛡️ shield emoji
# from the deploy-ci Makefile recipe plus whatever preflight-network
# + deploy-preflight emit.
name: deploy-preflight @v1.0.1 consumer smoke

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Run deploy-preflight @v1.0.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mammhoud/structa.cloud/deploy-preflight@v1.0.1
