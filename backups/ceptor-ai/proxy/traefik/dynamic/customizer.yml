# =============================================================================
# Customizer — Traefik router config (STUB)
# =============================================================================
# The customizer backend is NOT YET DEPLOYED.
# applications/customizer/docker-compose.yml currently contains only
# `services: {}` (placeholder), so the router below points to a
# placeholder service name (`customizer:80`) and will respond with
# 502 Bad Gateway until the real service is built.
#
# The DNS A-record for customizer.structa.cloud is added in parallel
# so the certResolver can validate and the hostname is reserved.
#
# TODO (when the customizer service is implemented):
#   1. Update applications/customizer/docker-compose.yml with the real
#      service definition (name, port, network).
#   2. Update the `url:` field below to match the real service.
#   3. Remove this comment block.
# =============================================================================

http:
  routers:
    customizer-site-http:
      rule: 'Host(`customizer.structa.cloud`)'
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: customizer-site-service
      priority: 10
    customizer-site-https:
      rule: 'Host(`customizer.structa.cloud`)'
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: customizer-site-service
      tls:
        certResolver: letsencrypt-http
  services:
    customizer-site-service:
      loadBalancer:
        servers:
          # Placeholder — see TODO above. Will 502 until updated.
          - url: 'http://customizer:80'
