site: crm
aliases: [crm, crm.structa.cloud]
base_url: http://crm.local
port: 5074
commands:
  check: python manage.py --site crm check
  build: npm --prefix assets run build
routes:
  - path: /health/
    status: 200
  - path: /assets/health/
    status: 200
  - path: /health/database/
    status: 200
  - path: /
    status: [200, 301, 302]
  - path: /accounts/login/
    status: [200, 301, 302]
  - path: /django-admin/login/
    status: [200, 301, 302]
  - path: /crm/
    status: [200, 301, 302]
  - path: /set-language/
    status: [200, 302, 405]
  - path: /robots.txt
    status: [200, 404]
  - path: /this-path-does-not-exist-xyz/
    status: 404
