{% load laces %}
{# applications/customizer/templates/fragments/page_card_grid.html #}

<div class="row g-3">
  {% for page in pages %}
    <div class="col-md-6 col-xl-4">
      {% comp "components/card.html"
        title=page.title
        path=page.path
        page=page
        counter=forloop.counter
      /%}
    </div>
  {% empty %}
    <div class="col"><p class="text-muted">No page templates discovered for {{ website.name }}.</p></div>
  {% endfor %}
</div>
