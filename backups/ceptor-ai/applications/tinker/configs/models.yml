# Tinker — AI Model Registry (Dynaconf-based)
# ============================================================
# Each model entry defines:
#   id          – unique key used in forms and API calls
#   name        – display name in the model selector dropdown
#   provider    – "ollama" or "openai_compatible"
#   model       – model identifier sent to the provider's API
#   base_url    – API base URL (can use @format syntax for env vars)
#   api_key_env – environment variable holding the API key
#   timeout     – request timeout in seconds (optional)
#   default     – true for the pre-selected model (exactly one per provider)
#
# Dynaconf Features:
#   - Use {{ env 'VAR_NAME' or 'default_value' }} for environment overrides
#   - Use @format for string interpolation of other config values
#   - Environment-specific overrides via settings.{ENV}.yml files
#   - Type validation via pydantic schemas
#
# Usage in Python:
#   from dynaconf import settings
#   models = settings.MODELS
#   for model in models.get('registry', []):
#       print(model['name'], model['provider'])
# ============================================================

models:
  # ── Ollama (local) ────────────────────────────────────────
  # Base URL and model can be overridden via environment variables
  - id: gemma3-4b
    name: Gemma 3 4B
    provider: ollama
    model: gemma3:4b
    base_url: "{{ env 'OLLAMA_BASE_URL' or 'http://localhost:11434' }}"
    timeout: 60
    default: true

  - id: llama3-8b
    name: Llama 3 8B
    provider: ollama
    model: llama3:8b
    base_url: "{{ env 'OLLAMA_BASE_URL' or 'http://localhost:11434' }}"
    timeout: 60

  - id: mistral-7b
    name: Mistral 7B
    provider: ollama
    model: mistral:7b
    base_url: "{{ env 'OLLAMA_BASE_URL' or 'http://localhost:11434' }}"
    timeout: 60

  - id: codellama-7b
    name: CodeLlama 7B
    provider: ollama
    model: codellama:7b
    base_url: "{{ env 'OLLAMA_BASE_URL' or 'http://localhost:11434' }}"
    timeout: 60

  # ── OpenAI-compatible (cloud) ─────────────────────────────
  # API keys must be set via environment variables
  - id: claude-sonnet
    name: Claude 3.5 Sonnet
    provider: openai_compatible
    model: claude-3-5-sonnet-20241022
    base_url: "{{ env 'ANTHROPIC_API_URL' or 'https://api.anthropic.com/v1' }}"
    api_key_env: ANTHROPIC_API_KEY
    timeout: 90
    default: true

  - id: claude-haiku
    name: Claude 3 Haiku
    provider: openai_compatible
    model: claude-3-haiku-20240307
    base_url: "{{ env 'ANTHROPIC_API_URL' or 'https://api.anthropic.com/v1' }}"
    api_key_env: ANTHROPIC_API_KEY
    timeout: 60

  - id: gpt4o
    name: GPT-4o
    provider: openai_compatible
    model: gpt-4o
    base_url: "{{ env 'OPENAI_API_URL' or 'https://api.openai.com/v1' }}"
    api_key_env: OPENAI_API_KEY
    timeout: 90

  - id: gpt4o-mini
    name: GPT-4o Mini
    provider: openai_compatible
    model: gpt-4o-mini
    base_url: "{{ env 'OPENAI_API_URL' or 'https://api.openai.com/v1' }}"
    api_key_env: OPENAI_API_KEY
    timeout: 60

  - id: deepseek-chat
    name: DeepSeek Chat
    provider: openai_compatible
    model: deepseek-chat
    base_url: "{{ env 'DEEPSEEK_API_URL' or 'https://api.deepseek.com/v1' }}"
    api_key_env: DEEPSEEK_API_KEY
    timeout: 90
