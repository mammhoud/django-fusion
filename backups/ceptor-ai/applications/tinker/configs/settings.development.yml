# Development Environment Configuration
# ============================================================
# Overrides for settings.yml in development
#
# Load order: settings.yml → settings.development.yml → environment variables

---

APP:
  environment: development

DJANGO:
  debug: true
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
    - "tinker.localhost"
    - "*.localhost"

DATABASE:
  engine: "django.db.backends.sqlite3"
  name: "db.sqlite3"

OLLAMA:
  enabled: true
  base_url: "http://localhost:11434"
  timeout: 60

LOGGING:
  loggers:
    django:
      level: "DEBUG"
    tinker:
      level: "DEBUG"

EMAIL:
  backend: "django.core.mail.backends.console.EmailBackend"
