{% load wagtailcore_tags wagtailimages_tags %}
{# Block Quote Template - Wagtail Bakery Style #}

<figure class="block-quote block-quote--{{ self.quote_style|default:'default' }} text-{{ self.alignment|default:'left' }} {% if self.quote_icon %}has-icon--{{ self.icon_position|default:'top-left' }}{% endif %}">

    {% if self.quote_icon %}
    <div class="block-quote__icon">
        <i class="bi bi-quote"></i>
    </div>
    {% endif %}

    <blockquote class="block-quote__text">
        {{ self.quote_text }}
    </blockquote>

    {% if self.citation or self.avatar %}
    <figcaption class="block-quote__footer">
        {% if self.avatar %}
        <div class="block-quote__avatar">
            {% image self.avatar fill-64x64 class="rounded-circle" %}
        </div>
        {% endif %}

        {% if self.citation %}
        <cite class="block-quote__citation">
            {% if self.citation_url %}
            <a href="{{ self.citation_url }}" target="_blank" rel="noopener noreferrer">
                {{ self.citation }}
            </a>
            {% else %}
            {{ self.citation }}
            {% endif %}
        </cite>
        {% endif %}
    </figcaption>
    {% endif %}

</figure>
