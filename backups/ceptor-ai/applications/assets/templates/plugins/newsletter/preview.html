<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview: {{ newsletter.title }}</title>
    <style>
        .newsletter-preview {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .newsletter-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .newsletter-meta {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="newsletter-preview">
        <div class="newsletter-header">
            {% if newsletter.header_image %}
                <img src="{{ newsletter.header_image.url }}" alt="{{ newsletter.title }}" style="max-width: 100%; height: auto;">
            {% endif %}
            <h1>{{ newsletter.title }}</h1>
            <div class="newsletter-meta">
                <strong>Subject:</strong> {{ newsletter.subject }}<br>
                <strong>Audience:</strong> {{ newsletter.get_audience_type_display }}<br>
                <strong>Status:</strong> {{ newsletter.status }}
            </div>
        </div>
        
        <div class="newsletter-content">
            {{ newsletter.body }}
        </div>
        
        {% if newsletter.important_announcement %}
            <div class="important-notice" style="background: #fff3cd; border: 1px solid #ffeaa7; padding: 15px; margin: 20px 0; border-radius: 5px;">
                <strong>⚠ Important Announcement</strong>
            </div>
        {% endif %}
    </div>
</body>
</html>
