{# Search Input Component for HTMX-based filtering #}
{# Usage: {% comp "components/search/search_input.html" / %} #}

<div class="search-input__wrapper">
  <input
    type="text"
    name="q"
    class="search-input__field"
    placeholder="Search projects..."
    x-model="currentQ"
    @input.debounce.300ms="$refs.filterForm.requestSubmit()"
    @keydown.enter.prevent="$refs.filterForm.requestSubmit()"
    aria-label="Search"
  />
  
  {# Clear button - only visible when search has content #}
  <button
    type="button"
    class="search-input__clear"
    x-show="currentQ"
    @click="currentQ = ''; $refs.filterForm.requestSubmit()"
    aria-label="Clear search"
    title="Clear search"
  >
    <span aria-hidden="true">×</span>
  </button>
</div>
