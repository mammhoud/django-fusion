{# Privacy Policy Content — rendered into bootbox.dialog() via main.js #}
{% load i18n %}

<template id="privacy-policy-template">
    <div class="px-3 py-2">
        <p>{% trans "Your privacy is important to us. This policy explains how we collect, use, and protect your data." %}</p>

        <h5>{% trans "1. Information We Collect" %}</h5>
        <p>{% trans "We only collect data necessary for core functionality and to improve your experience. This includes basic usage data and any information you explicitly provide via contact forms." %}</p>

        <h5>{% trans "2. How We Use Information" %}</h5>
        <p>{% trans "Your information is used strictly to provide and maintain our services, and to communicate with you when requested." %}</p>

        <h5>{% trans "3. Data Security" %}</h5>
        <p>{% trans "We implement industry-standard security measures to protect your personal information from unauthorized access." %}</p>
    </div>
</template>
