{% load i18n %}

<li class="skills__item">
  <div class="skills__header">
    <h5 class="h5 skills__name">{{ self.name }}</h5>
    <data class="skills__level" value="{{ self.level }}">{{ self.level }}%</data>
  </div>
  <div class="skills__progress-bg">
    <div class="skills__progress-fill" style="width: {{ self.level }}%;"></div>
  </div>
</li>
