[project]
name = "lms-demo"
version = "1.0.3"
description = "LMS Demo (structa.cloud) — part of Structa Cloud workspace"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sites use their own conftest.py → _django_settings.configure() to
# configure Django directly. Disable pytest-django so it does not
# auto-load the workspace's applications/pyproject.toml-inherited
# DJANGO_SETTINGS_MODULE = "tests.settings" (which can fail on sites
# that ship a local tests/ package — pytest-django then tries to
# import a non-existent local tests.settings module).
#
# Trade-off: this disables pytest-django's @pytest.mark.django_db,
# client, and django_assert_num_queries fixtures. Re-enable by
# dropping `-p no:pytest_django` and instead adding
# DJANGO_SETTINGS_MODULE = "<your_site>.settings" (or whatever the
# site's settings module is) here.
addopts = [
    "-p", "no:pytest_django",
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
    "--no-header",
    "--import-mode=importlib",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
