{% extends "crm/layout/skeleton.html" %}
{% load i18n laces laces %}

{% block title %}{% trans "Inventory Items" %}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h4 mb-0 fw-semibold">{% trans "Items" %}</h1>
  <a href="{% url 'inventory:item:add' %}" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-circle me-1"></i>{% trans "Add Item" %}
  </a>
</div>

{# HTMX live search fragment container #}
<div id="item-list-container"
     hx-get="{% url 'inventory:item-list-fragment' %}"
     hx-trigger="load"
     hx-target="#item-list-container"
     hx-swap="innerHTML">
  {% comp "plugins/base/loader.html" /%}
</div>
{% endblock content %}
