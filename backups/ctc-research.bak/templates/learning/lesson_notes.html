{% load i18n %}
<h4 class="mb-3">{% trans "My Notes" %}</h4>

<div class="card">
    <div class="card-body">
        <form method="post" action="{% url 'save_notes' lesson.id %}">
            {% csrf_token %}
            <textarea name="notes" class="form-control" rows="8" placeholder="Take notes for this lesson... You can timestamp your notes by right-clicking in the video player.">{{ user_notes.content|default:'' }}</textarea>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <small class="text-muted">
                    {% if user_notes.last_saved %}
                    Last saved: {{ user_notes.last_saved|timesince }} ago
                    {% else %}
                    Notes are automatically saved
                    {% endif %}
                </small>
                <button type="submit" class="button button-sm button-radius button-primary">
                    <i class="bi bi-cloud-check me-2"></i>Save Notes
                </button>
            </div>
        </form>
    </div>
</div>

<div class="alert alert-info mt-3">
    <i class="bi bi-info-circle me-2"></i>
    <strong>Tip:</strong> Right-click anywhere in the notes area to insert the current video timestamp.
</div>
