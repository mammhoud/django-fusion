{% load i18n static %}
{# Context fields: request #}
{# Placeholders: none #}

<section class="fragment--form">
  <section class="auth__card card card--form">
    <header class="auth__form-header">
      <h2 class="auth__form-title">{% trans "Forgot Password" %}</h2>
      <p class="auth__form-subtitle mb-4">
        {% trans "Enter your email address and we'll send you a reset link." %}
      </p>
    </header>

    <form id="forgot-password-form"
          class="auth__form needs-validation"
          action="{% url 'plugins:password_forgot' %}"
          method="post"
          novalidate>
      {% csrf_token %}
      <input type="hidden" name="strategy" value="{{ strategy|default:'fragment' }}">
      <input type="hidden" name="supports_sse" value="{{ supports_sse|default:'false' }}">

      <div class="form__group mb-4">
        <label for="email" class="form__label fw-semibold">{% trans "Email address" %}</label>
        <div class="form__input-wrapper input-group input-group-lg">
          <span class="form__icon rounded-start border-0 px-3">
            <i class="fas fa-envelope"></i>
          </span>
          <input
            id="email"
            name="con_name"
            type="email"
            class="form__input form-control border-0 rounded-end ps-1"
            placeholder="{% trans 'Enter your email' %}"
            required
          />
        </div>
        <div class="invalid-feedback">
          {% trans "Please enter a valid email address." %}
        </div>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn--primary auth__submit mb-0">
          <span class="btn__text">{% trans "Send Reset Link" %}</span>
          <i class="fas fa-arrow-right ms-2"></i>
        </button>
      </div>
    </form>

    <footer class="auth__footer mt-4 text-center">
      <p>
        <a href="{% url 'plugins:login' %}"
           class="auth__link"
           hx-get="{% url 'plugins:login' %}"
           hx-target=".fragment--form"
           hx-swap="innerHTML"
           hx-push-url="{% url 'plugins:login' %}">
          <u>{% trans "Back to Sign In" %}</u>
        </a>
      </p>
    </footer>
  </section>
</section>
