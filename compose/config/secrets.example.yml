# Example Secrets Configuration
# 
# This file serves as a template for secrets.yml
# Copy to secrets.yml and fill in actual values
# secrets.yml is git-ignored and should never be committed
#
# WARNING: This file contains database passwords and sensitive credentials
# Do NOT commit the actual secrets.yml to version control

passwords:
  # Database Credentials
  postgres:
    user: postgres
    password: "CHANGE_ME_POSTGRES_PASSWORD"
    admin_password: "CHANGE_ME_ADMIN_PASSWORD"
    root_password: "CHANGE_ME_ROOT_PASSWORD"

  # Django Applications
  django:
    secret_key: "CHANGE_ME_DJANGO_SECRET_KEY"
    admin_user: "admin"
    admin_password: "CHANGE_ME_ADMIN_PASSWORD"

  # Redis
  redis:
    password: "CHANGE_ME_REDIS_PASSWORD"

  # Service Integrations
  services:
    email_password: "CHANGE_ME_EMAIL_PASSWORD"
    api_key: "CHANGE_ME_API_KEY"
    webhook_secret: "CHANGE_ME_WEBHOOK_SECRET"

# Database Configuration (production)
database:
  postgres:
    host: "postgres"
    port: 5432
    name: "structa_cloud"
    user: "postgres"
    # password is referenced from passwords.postgres.password

# SSL/TLS Certificates (if using custom certs)
certificates:
  private_key_path: "/secrets/certs/private.key"
  cert_path: "/secrets/certs/certificate.crt"
  ca_bundle_path: "/secrets/certs/ca-bundle.crt"

# API Keys and Tokens (production)
integrations:
  cloudflare:
    api_token: "CHANGE_ME_CLOUDFLARE_TOKEN"
    email: "your-email@example.com"
  
  github:
    token: "CHANGE_ME_GITHUB_TOKEN"
    
  aws:
    access_key_id: "CHANGE_ME_AWS_ACCESS_KEY"
    secret_access_key: "CHANGE_ME_AWS_SECRET_KEY"
    region: "us-east-1"
