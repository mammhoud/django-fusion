# ============================================
# Traefik Static Configuration
# ============================================

# ============================================
# Global Configuration
# ============================================
global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO
  format: common

accessLog:
  format: common
  bufferingSize: 100

api:
  dashboard: true
  insecure: true # Set to false in production!

ping: {}  # Enable /ping health endpoint

# ============================================
# EntryPoints
# ============================================
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: web-secure
          scheme: https
          permanent: true

  web-secure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# ============================================
# Providers
# ============================================
providers:
  # Docker provider disabled — Docker 29+ raised minimum API to 1.44
  # but Traefik's Go client negotiates down to 1.24 (known bug).
  # All services are configured via the file provider below.
  # docker:
  #   endpoint: "unix:///var/run/docker.sock"
  #   exposedByDefault: false
  #   network: traefik-net
  #   watch: true

  file:
    directory: /etc/traefik/dynamic
    watch: true
    # Watches all subdirectories including:
    # - /etc/traefik/dynamic/ctc-research.yml (ctc-research.com)
    # - /etc/traefik/dynamic/structa-cloud.yml (core.structa.cloud)
    # - /etc/traefik/dynamic/vresume/vresume-structa.yml (vresume.structa.cloud)

# ============================================
# Certificate Resolvers
# ============================================
certificatesResolvers:
  # Primary resolver: Uses static certificates from file store
  default:
    acme:
      # Email for optional Let's Encrypt integration (can leave empty for static certs only)
      email: ${TRAEFIK_ACME_EMAIL:-admin@structa.cloud}
      storage: /etc/traefik/acme/acme.json
      
      # Use production CA for valid Let's Encrypt certificates
      caServer: ${TRAEFIK_ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}
      
      # HTTP challenge (requires port 80 accessible from internet)
      httpChallenge:
        entryPoint: web
  
  # Fallback: Let's Encrypt ACME (optional, can be enabled for automatic renewal)
  letsencrypt:
    acme:
      email: ${TRAEFIK_ACME_EMAIL:-admin@structa.cloud}
      storage: /etc/traefik/acme/acme.json
      caServer: ${TRAEFIK_ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}
      httpChallenge:
        entryPoint: web

# ============================================
# Static Certificates (Local Files) - PRIMARY METHOD
# ============================================
# These certificates are used by default for all HTTPS connections.
# Traefik will match domain names to certificates and serve them.
# Certificate validity dates:
#   - ctc-research.crt: Valid until Jun 2, 2027
#   - structa-cloud.crt: Valid until Jun 2, 2027
#   - vresume.crt: Valid until Jun 2, 2027
#
# To renew certificates, regenerate new certificate files and restart Traefik:
#   docker compose restart structa-proxy
#
tls:
  stores:
    default:
      # Default certificate when no domain matches
      defaultCertificate:
        certFile: /etc/traefik/certs/ctc-research.crt
        keyFile: /etc/traefik/certs/ctc-research.key
  
  certificates:
    # CTC Research certificates (primary + SANs)
    - certFile: /etc/traefik/certs/ctc-research.crt
      keyFile: /etc/traefik/certs/ctc-research.key
    
    # Structa Cloud certificates (primary + SANs)  
    - certFile: /etc/traefik/certs/structa-cloud.crt
      keyFile: /etc/traefik/certs/structa-cloud.key
    
    # VResume certificates
    - certFile: /etc/traefik/certs/vresume.crt
      keyFile: /etc/traefik/certs/vresume.key
