# ============================================
# Website routers, Django backends, and media/static backends
# ============================================
http:
  routers:
    ctc-media-http:
      rule: "(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: ctc-media-service
      priority: 100

    ctc-media-https:
      rule: "(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: ctc-media-service
      priority: 100
      tls:
        certResolver: letsencrypt
        domains:
          - main: "ctc-research.com"
            sans: ["www.ctc-research.com", "arch.ctc-research.com"]

    ctc-site-https:
      rule: "Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)"
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: ctc-site-service
      tls:
        certResolver: letsencrypt

    lms-demo-media-http:
      rule: "(Host(`structa.cloud`) || Host(`www.structa.cloud`) || Host(`core.structa.cloud`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: lms-demo-media-service
      priority: 100

    lms-demo-media-https:
      rule: "(Host(`structa.cloud`) || Host(`www.structa.cloud`) || Host(`core.structa.cloud`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: lms-demo-media-service
      priority: 100
      tls:
        certResolver: letsencrypt
        domains:
          - main: "structa.cloud"
            sans: ["*.structa.cloud", "www.structa.cloud", "core.structa.cloud"]

    lms-demo-site-https:
      rule: "Host(`structa.cloud`) || Host(`www.structa.cloud`) || Host(`core.structa.cloud`)"
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: lms-demo-site-service
      tls:
        certResolver: letsencrypt

  services:
    ctc-site-service:
      loadBalancer:
        servers:
          - url: "http://ctc-website:5070"
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
          headers:
            Host: "ctc-research.com"
            X-Forwarded-Proto: "https"

    ctc-media-service:
      loadBalancer:
        servers:
          - url: "http://ctc-website-media:80"

    lms-demo-site-service:
      loadBalancer:
        servers:
          - url: "http://structa-website:5071"
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
          headers:
            Host: "core.structa.cloud"
            X-Forwarded-Proto: "https"

    lms-demo-media-service:
      loadBalancer:
        servers:
          - url: "http://structa-website-media:80"
