# ============================================
# STRUCTA.CLOUD CONFIGURATION (LMS-DEMO)
# Domains: core.structa.cloud, structa.cloud, www.structa.cloud
# ============================================
http:
  routers:
    # Redirect HTTP to HTTPS for media/static files
    structa-media-http:
      rule: "(Host(`structa.cloud`) || Host(`www.structa.cloud`) || Host(`core.structa.cloud`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: structa-media-service
      priority: 100

    # HTTPS for media/static files
    structa-media-https:
      rule: "(Host(`structa.cloud`) || Host(`www.structa.cloud`) || Host(`core.structa.cloud`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: structa-media-service
      priority: 100
      tls:
        certResolver: letsencrypt
        domains:
          - main: "structa.cloud"
            sans: ["*.structa.cloud", "www.structa.cloud", "core.structa.cloud"]

    # HTTPS for main site
    structa-site-https:
      rule: "Host(`structa.cloud`) || Host(`www.structa.cloud`) || Host(`core.structa.cloud`)"
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: structa-site-service
      tls:
        certResolver: letsencrypt

  services:
    # Django backend
    structa-site-service:
      loadBalancer:
        servers:
          - url: "http://structa-website:5071"
        healthCheck:
          path: /
          interval: 30s
          timeout: 10s
          headers:
            Host: "core.structa.cloud"
            X-Forwarded-Proto: "https"

    # Nginx media/static server
    structa-media-service:
      loadBalancer:
        servers:
          - url: "http://structa-website-media:8272"
