# ============================================
# CTC-RESEARCH.COM CONFIGURATION
# Domains: ctc-research.com, www.ctc-research.com, arch.ctc-research.com
#          ctc-research.local (local dev)
# Backend: ctc-research-website:5070
# ============================================
http:
  routers:
    # HTTP → HTTPS redirect for main site
    ctc-site-http:
      rule: "Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`) || Host(`ctc-research.local`)"
      entryPoints: [web]
      middlewares: [redirect-to-https]
      service: ctc-site-service
      priority: 10

    # HTTP → HTTPS for media/static files
    ctc-media-http:
      rule: "(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`) || PathPrefix(`/sites/`))"
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: ctc-media-service
      priority: 100

    # HTTPS for media/static (nginx — highest priority)
    ctc-media-https:
      rule: "(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`) || PathPrefix(`/sites/`))"
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: ctc-media-service
      priority: 100
      tls:
        domains:
          - main: "ctc-research.com"
            sans: ["www.ctc-research.com", "arch.ctc-research.com"]

    # FALLBACK: Django serves static/media when nginx misses
    ctc-static-fallback-https:
      rule: "(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      middlewares: [compress, security-headers]
      service: ctc-site-service
      priority: 50
      tls:

    # HTTPS for main Django app
    ctc-site-https:
      rule: "Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`) || Host(`ctc-research.local`)"
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: ctc-site-service
      priority: 10
      tls:
        domains:
          - main: "ctc-research.com"
            sans: ["www.ctc-research.com", "arch.ctc-research.com"]

  services:
    # Django backend — container_name = ctc-research-website, port 5070
    ctc-site-service:
      loadBalancer:
        servers:
          - url: "http://ctc-research-website:5070"
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s

    # Nginx media/static server
    ctc-media-service:
      loadBalancer:
        servers:
          - url: "http://shared-media:80"
