# ============================================================
# Documentation Service (Docsify + nginx)
# ============================================================
# Container name 'docs' matches proxy/dynamic/docs.yml:
#   url: "http://docs:80"
# ============================================================

networks:
  common:
    name: common
    external: true

services:
  docs:
    image: structa-docs:latest
    container_name: docs
    restart: unless-stopped
    build:
      context: ../../docs          # points to the docs/ directory
      dockerfile: /data/coolify/compose/docs/Dockerfile   # adjust if needed
    networks:
      - common
    environment:
      - TZ=${TZ:-UTC}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No Traefik labels needed – routing is handled by proxy/dynamic/docs.yml