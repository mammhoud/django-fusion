# ============================================================
# VResume - Documentation Service (MkDocs)
# ============================================================
# Standalone documentation service with MkDocs Material theme
# Usage: docker compose -f compose/docker-compose.docs.yml up -d
#
# Features:
#   - Auto-reload during development
#   - Production-ready static output
#   - Material design theme
#   - Search functionality
#   - Mermaid diagram support

networks:
  traefik-net:
    name: traefik-net
    external: true

services:
  vresume-docs:
    build:
      context: ..
      dockerfile: ./compose/docs/Dockerfile
    image: vresume-docs:latest
    container_name: vresume-docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8000}:8000"
    volumes:
      - ../docs:/docs/docs:ro
      - ../mkdocs.yml:/docs/mkdocs.yml:ro
      - ../README.md:/docs/README.md:ro
    networks:
      - traefik-net
    environment:
      - DOCS_ENV=${DOCS_ENV:-development}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
