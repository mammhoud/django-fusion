# ============================================================
# Documentation Service (Docsify + nginx)
# ============================================================
# Serves the docs/ directory via nginx:1.27-alpine with Docsify
# client-side rendering — no build step required.
#
# Container name 'docs' matches proxy/dynamic/docs.yml:
#   url: "http://docs:80"
#
# Usage (from coolify/ root directory):
#   docker compose -f applications/compose/docker-compose.docs.yml up -d

networks:
  common:
    name: common
    external: true

services:
  docs:
    build:
      # context resolves to: /data/coolify/docs
      # dockerfile must be relative to context OR absolute
      context: ../../docs
      dockerfile: /data/coolify/compose/docs/Dockerfile
    image: structa-docs:latest
    container_name: docs
    restart: unless-stopped
    networks:
      - common
    environment:
      - TZ=${TZ:-UTC}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Routing via static file: proxy/dynamic/docs.yml → http://docs:80
    # No Docker labels needed — default-proxy uses file provider
