# ============================================================
# VResume - Base Infrastructure Services (PostgreSQL & Redis)
# ============================================================
# Database and cache layer
# Usage: docker compose -f compose/docker-compose.yml up -d

networks:
  traefik-net:
    name: traefik-net
    external: true

x-django-base: &django-base
  build:
    context: ..
    dockerfile: ./compose/django/Dockerfile
  restart: unless-stopped
  env_file:
    - path: ../.env
      required: false
  environment: &django-env
    RUNNING_ENV: docker
    DB_TYPE: ${DB_TYPE:-postgres}
    DB_HOST: ${DB_HOST:-vresume-postgres}
    DB_PORT: ${DB_PORT:-5432}
    DB_NAME: ${DB_NAME:-vresume}
    DB_USER: ${DB_USER:-vresume}
    DB_PASSWORD: ${DB_PASSWORD:-mk_pAssWord123}
    REDIS_URL: redis://:${REDIS_PASSWORD:-mk_pAssWord123}@vresume-redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-mk_pAssWord123}@vresume-redis:6379/1
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-configs.settings}
    SERVER_ENV: ${SERVER_ENV:-production}
    DEBUG: ${DEBUG:-False}
    PORT: ${PORT:-5072}
  volumes:
    - ../:/app:z
  networks:
    - traefik-net
  # depends_on:
  depends_on:
    - vresume-postgres
    - vresume-redis


services:
  # ============================================================
  # DJANGO APPLICATION SERVER
  # ============================================================
  vresume-website:
    <<: *django-base
    container_name: vresume-website
    # ports:
    #   - "5072:5072"  # removed to avoid duplicate host port when composing multiple stacks; canonical mapping lives in VResume/compose/docker-compose.yml
    environment:
      <<: *django-env
      WORKERS: ${WORKERS:-4}
      TIMEOUT: ${TIMEOUT:-120}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-fL", "-H", "X-Forwarded-Proto: https", "http://localhost:5072/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

