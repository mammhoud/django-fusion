# ============================================================
# Website base definitions
# This file keeps common anchors and network definitions used by
# per-site docker-compose.yml files located in each website directory.
#
# It intentionally does not declare website services; those live in
# each website's `docker-compose.yml` so sites can be managed independently.
# ============================================================

networks:
  traefik-net:
    name: traefik-net
    external: true
  site_network:
    name: site_network
    external: true

x-django-base: &django-base
  build:
    context: ..
    dockerfile: compose/django/Dockerfile
  restart: unless-stopped
  working_dir: /app
  env_file:
    - path: ../.env
      required: false
  environment: &django-env
    RUNNING_ENV: docker
    SERVER_TYPE: ${SERVER_TYPE:-gunicorn}
    SERVER_ENV: ${SERVER_ENV:-production}
    DEBUG: ${DEBUG:-False}
    DB_TYPE: ${DB_TYPE:-postgres}
    DB_HOST: ${DB_HOST:-postgres}
    DB_PORT: ${DB_PORT:-5432}
    DB_USER: ${DB_USER:-structa}
    DB_PASSWORD: ${DB_PASSWORD:-mk_pAssWord123}
    REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@structa-cache:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@structa-cache:6379/1
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-settings}
    WORKERS: ${WORKERS:-4}
    TIMEOUT: ${TIMEOUT:-120}
  volumes:
    - ../:/app:z
    - ../assets/media:/app/assets/media:z
  networks:
    - traefik-net
    - site_network
  depends_on:
    structa-postgres-db:
      condition: service_healthy
    structa-redis-cache:
      condition: service_healthy


