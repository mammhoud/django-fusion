# ============================================================
# Website base definitions
# This file keeps common anchors and network definitions used by
# per-site docker-compose.yml files located in each website directory.
#
# It intentionally does not declare website services; those live in
# each website's `docker-compose.yml` so sites can be managed independently.
# ============================================================

networks:
  traefik-net:
    name: traefik-net
  site_network:
    name: site_network

x-django-base: &django-base
  build:
    context: ..
    dockerfile: compose/django/Dockerfile
  restart: unless-stopped
  working_dir: /app
  env_file:
    - path: ../.env
      required: false
  environment: &django-env
    RUNNING_ENV: docker
    SERVER_TYPE: ${SERVER_TYPE:-gunicorn}
    SERVER_ENV: ${SERVER_ENV:-production}
    DEBUG: ${DEBUG:-False}
    DB_TYPE: ${DB_TYPE:-postgres}
    DB_HOST: ${DB_HOST:-structa-db}
    DB_PORT: ${DB_PORT:-5432}
    DB_USER: ${DB_USER:-structa}
    DB_PASSWORD: ${DB_PASSWORD:-mk_pAssWord123}
    REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@structa-cache:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_password}@structa-cache:6379/1
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-settings}
    WORKERS: ${WORKERS:-4}
    TIMEOUT: ${TIMEOUT:-120}
  volumes:
    - ../:/app:z
    - ../assets/media:/app/assets/media:z
  networks:
    - traefik-net
    - site_network
  depends_on:
    structa-db:
      condition: service_healthy
    structa-cache:
      condition: service_healthy



services:
  ctc-research-website:
    <<: *django-base
    container_name: ctc-research-website
    build:
      context: ..
      dockerfile: compose/django/Dockerfile
      args:
        PROJECT_PATH: ctc-research
    environment:
      <<: *django-env
      DJANGO_SITE: ctc-research
      DJANGO_WEBSITE: ctc-research
      WEBSITE: ctc-research
      PROJECT_PATH: ctc-research
      PORT: 5070
      DB_NAME: ${CTC_DB_NAME:-db_ctc}
      DJANGO_SETTINGS_MODULE: settings
      ALLOWED_HOSTS: "ctc-research.com,www.ctc-research.com,arch.ctc-research.com,ctc-research-website,ctc-web,ctc-research.local,ctc-website.local,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://ctc-research.com,https://www.ctc-research.com,https://arch.ctc-research.com,http://ctc-research-website,http://ctc-web,http://ctc-research.local,http://localhost,http://127.0.0.1"
      SITE_DOMAIN: "ctc-research.com"
      WAGTAILADMIN_BASE_URL: "https://ctc-research.com"
    labels:
      - "traefik.enable=true"
      - "traefik.frontend.rule=Host:ctc-website.local,ctc-research.local"
      - "traefik.http.routers.ctc-website.rule=Host(`ctc-website.local`) || Host(`ctc-research.local`)"
      - "traefik.http.services.ctc-website.loadbalancer.server.port=5070"
    healthcheck:
      test: ["CMD", "curl", "-fL", "http://127.0.0.1:5070/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  lms-demo-website:
    <<: *django-base
    container_name: lms-demo-website
    profiles: ["lms"]
    build:
      context: ..
      dockerfile: compose/django/Dockerfile
      args:
        PROJECT_PATH: lms-demo
    environment:
