      DJANGO_SITE: lms-demo
      DJANGO_WEBSITE: lms-demo
      WEBSITE: lms-demo
      PROJECT_PATH: lms-demo
      PORT: 5071
      DB_NAME: ${STRUCTA_DB_NAME:-db_structa}
      ALLOWED_HOSTS: "structa.cloud,www.structa.cloud,core.structa.cloud,lms-demo.local,lms-demo-website,localhost,127.0.0.1"
    labels:
      - "traefik.enable=true"
      - "traefik.frontend.rule=Host:lms-demo.local"
      - "traefik.http.routers.lms-demo.rule=Host(`lms-demo.local`)"
      - "traefik.http.services.lms-demo.loadbalancer.server.port=5071"
    healthcheck:
      test: ["CMD", "curl", "-fL", "http://127.0.0.1:5071/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  vresume-website:
    <<: *django-base
    container_name: vresume-website
    profiles: ["vresume"]
    build:
      context: ..
      dockerfile: compose/django/Dockerfile
      args:
        PROJECT_PATH: VResume
    environment:
      <<: *django-env
      DJANGO_SITE: vresume
      DJANGO_WEBSITE: vresume
      WEBSITE: vresume
      PROJECT_PATH: vresume
      PORT: 5072
      DB_NAME: ${VRESUME_DB_NAME:-vresume}
      ALLOWED_HOSTS: "vresume.structa.cloud,www.vresume.structa.cloud,resume.structa.cloud,vresume.local,vresume-website,localhost,127.0.0.1"
    labels:
      - "traefik.enable=true"
      - "traefik.frontend.rule=Host:vresume.local"
      - "traefik.http.routers.vresume.rule=Host(`vresume.local`)"
      - "traefik.http.services.vresume.loadbalancer.server.port=5072"
    healthcheck:
      test: ["CMD", "curl", "-fL", "http://127.0.0.1:5072/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
