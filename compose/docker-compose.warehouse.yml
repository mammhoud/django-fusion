# ============================================================
# Shared Warehouse Services
# ============================================================
# Central PostgreSQL/Redis and utility containers for all workspace websites.
# ============================================================

networks:
  traefik-net:
    name: traefik-net
    external: true
  site_network:
    name: site_network
    external: true

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    build:
      context: ..
      dockerfile: compose/postgres/Dockerfile
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mk_pAssWord123}
      INITDB_MULTIPLE_DATABASES: "${POSTGRES_DATABASES:-db_ctc:structa:mk_pAssWord123,db_structa:structa:mk_pAssWord123,vresume:structa:mk_pAssWord123,blinko}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/backups:/backups:Z
    networks:
      - traefik-net
      - site_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    networks:
      - traefik-net
      - site_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  docs:
    image: python:3.12-slim
    container_name: docs
    restart: unless-stopped
    networks:
      - traefik-net

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    environment:
      ADMINER_DESIGN: ${ADMINER_DESIGN:-dracula}
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - traefik-net
      - site_network
    depends_on:
      postgres:
        condition: service_healthy

  blinko:
    image: blinkospace/blinko:latest
    container_name: blinko
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mk_pAssWord123}@postgres:5432/blinko
      NEXTAUTH_SECRET: ${BLINKO_SECRET:-my-secret-key-change-me}
      NEXTAUTH_URL: ${BLINKO_URL:-https://space.structa.cloud}
    networks:
      - traefik-net
      - site_network
    depends_on:
      postgres:
        condition: service_healthy
