# ============================================================
# VResume - Application Services (Django & Celery)
# ============================================================
# Application layer with Django, Celery workers, and Nginx
# Usage: docker compose -f compose/docker-compose.nginx.yml up -d

networks:
  traefik-net:
    name: traefik-net
    external: true

services:
  # ============================================================
  # NGINX REVERSE PROXY (Optional if not using Traefik)
  # ============================================================
  vresume-website-media:
    build:
      context: ..
      dockerfile: ./compose/nginx/Dockerfile
    env_file:
      - path: ../.env
        required: false
    container_name: vresume-website-media
    restart: unless-stopped
    depends_on:
      - vresume-website
    # ports:
    #   - "80:80"
    #   - "443:443"
    volumes:
      - ../${PROJECT_PATH:-ctc-research}/assets/staticfiles:/var/www/static:ro
      - ../assets/media:/var/www/media:ro
      - ./media/ssl:/etc/nginx/ssl

    networks:
      - traefik-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - DJANGO_HOST=${DJANGO_HOST:-localhost}
      - DJANGO_PORT=${PORT:-5073}

volumes:
  staticfiles:
    driver: local
