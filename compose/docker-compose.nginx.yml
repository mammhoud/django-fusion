# ============================================================
# Workspace Media Frontends
# ============================================================
# Provides one unified static/media server plus optional per-site media servers.
# ============================================================

networks:
  traefik-net:
    name: traefik-net
    external: true

x-media-base: &media-base
  build:
    context: ..
    dockerfile: ./compose/media/Dockerfile
  restart: unless-stopped
  networks:
    - traefik-net
  healthcheck:
    test: ["CMD", "nginx", "-t"]
    interval: 30s
    timeout: 10s
    retries: 3

services:
  workspace-media:
    <<: *media-base
    container_name: workspace-media
    volumes:
      - ../assets/staticfiles:/var/www/static:ro
      - ../assets/media:/var/www/media:ro
      - ../ctc-research/assets/staticfiles:/var/www/sites/ctc-research/static:ro
      - ../lms-demo/assets/staticfiles:/var/www/sites/lms-demo/static:ro
      - ../VResume/assets/staticfiles:/var/www/sites/vresume/static:ro

  ctc-research-media:
    <<: *media-base
    container_name: ctc-research-media
    volumes:
      - ../ctc-research/assets/staticfiles:/var/www/static:ro
      - ../assets/media:/var/www/media:ro

  lms-demo-media:
    <<: *media-base
    container_name: lms-demo-media
    volumes:
      - ../lms-demo/assets/staticfiles:/var/www/static:ro
      - ../assets/media:/var/www/media:ro

  vresume-media:
    <<: *media-base
    container_name: vresume-media
    volumes:
      - ../VResume/assets/staticfiles:/var/www/static:ro
      - ../assets/media:/var/www/media:ro
