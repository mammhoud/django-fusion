# ============================================================
# Workspace Shared Media Frontend
# ============================================================
# Provides one canonical static/media server for shared files and isolated
# per-site mount points under /var/www/sites/<site>/.
# ============================================================

networks:
  traefik-net:
    name: traefik-net
    external: true

x-media-base: &media-base
  build:
    context: ..
    dockerfile: ./compose/media/Dockerfile
  restart: unless-stopped
  networks:
    - traefik-net
  healthcheck:
    test: ["CMD", "nginx", "-t"]
    interval: 30s
    timeout: 10s
    retries: 3

services:
  shared-media:
    <<: *media-base
    container_name: shared-media
    labels:
      - "traefik.enable=true"
      - "traefik.frontend.rule=Host:shared-media.local,ctc-media.local,lms-media.local,vresume-media.local"
      - "traefik.http.routers.shared-media.rule=Host(`shared-media.local`) || Host(`ctc-media.local`) || Host(`lms-media.local`) || Host(`vresume-media.local`)"
      - "traefik.http.services.shared-media.loadbalancer.server.port=80"
    volumes:
      - ../assets/staticfiles:/var/www/static:ro
      - ../assets/media:/var/www/media:ro
      - ../ctc-research/assets/staticfiles:/var/www/sites/ctc-research/static:ro
      - ../ctc-research/assets/media:/var/www/sites/ctc-research/media:ro
      - ../lms-demo/assets/staticfiles:/var/www/sites/lms-demo/static:ro
      - ../lms-demo/assets/media:/var/www/sites/lms-demo/media:ro
      - ../VResume/assets/staticfiles:/var/www/sites/vresume/static:ro
      - ../VResume/assets/media:/var/www/sites/vresume/media:ro
