# ============================================================
# Celery Workers Docker Compose Configuration
# ============================================================

# x-task-redis-env: &task-redis-env

services:
  ctc-research-worker:
    image: ctc-research-worker:latest
    container_name: ctc-research-worker
    build:
      context: ..
      dockerfile: compose/django/Dockerfile
      args:
        PROJECT_PATH: ctc-research
    command: celery -A tasks worker --loglevel=info
    restart: unless-stopped
    working_dir: /app
    environment:
      # <<: *task-redis-env
      DJANGO_SETTINGS_MODULE: configs.settings
    networks:
      - common

  lms-demo-worker:
    image: lms-demo-worker:latest
    container_name: lms-demo-worker
    build:
      context: ..
      dockerfile: compose/django/Dockerfile
      args:
        PROJECT_PATH: lms-demo
    command: celery -A tasks worker --loglevel=info
    restart: unless-stopped
    working_dir: /app
    environment:
      # <<: *task-redis-env
      DJANGO_SETTINGS_MODULE: configs.settings
    networks:
      - common

  vresume-worker:
    image: vresume-worker:latest
    container_name: vresume-worker
    build:
      context: ..
      dockerfile: compose/django/Dockerfile
      args:
        PROJECT_PATH: vresume
    command: celery -A tasks worker --loglevel=info
    restart: unless-stopped
    working_dir: /app
    environment:
      # <<: *task-redis-env
      DJANGO_SETTINGS_MODULE: configs.settings
    networks:
      - common

networks:
  common:
    name: common
    external: true
