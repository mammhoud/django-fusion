# ============================================================
# Shared Media/Static Server (HTTP only)
# ============================================================
# Serves static files, media files, and per-site assets for all websites.
# HTTPS is handled by Traefik reverse proxy.
# ============================================================

server {
    listen 80;
    server_name _;

    # Gzip compression for optimal performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;

    # Shared static files (/static/)
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Shared media files (/media/)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Per-site static and media files (/sites/<site>/static/ and /sites/<site>/media/)
    location /sites/ {
        alias /var/www/sites/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        autoindex on;
        autoindex_format html;
        types {
            text/css css;
            text/javascript js;
            application/javascript js;
            image/svg+xml svg svgz;
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            font/otf otf;
            font/eot eot;
        }
    }

    # Health check endpoint for monitoring
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Return 404 for any other requests
    location / {
        return 404;
    }
}
