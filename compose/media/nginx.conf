# ============================================================
# Shared Media/Static Server (HTTP only)
# ============================================================
# Serves static files, media files, and per-site assets for all websites.
# HTTPS is handled by Traefik reverse proxy.
# ============================================================

upstream django_backend {
    server ctc-research-website:5070;
}

server {
    listen 80;
    server_name _;

    # Gzip compression for optimal performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;

    # MIME types configuration
    types {
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        image/svg+xml                         svg svgz;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/gif                             gif;
        image/webp                            webp;
        font/woff                             woff;
        font/woff2                            woff2;
        font/ttf                              ttf;
        font/otf                              otf;
        font/eot                              eot;
        text/html                             html;
    }

    # ============================================================
    # STATIC FILES - Try site-specific first, then shared, then Django
    # ============================================================
    location /static/ {
        alias /var/www/sites/ctc-research/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-ctc-static";
        access_log off;
        
        # If not found in ctc-research, fallback to Django
        error_page 404 = @django_static;
    }

    # ============================================================
    # MEDIA FILES - Try site-specific first, then shared, then Django
    # ============================================================
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Served-By "nginx-shared-media";
        access_log off;
        
        # If not found in ctc-research, fallback to Django
        error_page 404 = @django_media;
    }

    # ============================================================
    # SITES DIRECTORY
    # ============================================================
    location /sites/ {
        alias /var/www/sites/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-sites";
        access_log off;
    }

    # ============================================================
    # DJANGO FALLBACK LOCATIONS
    # ============================================================
    location @django_static {
        proxy_pass http://django_backend/static$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Served-By "django-fallback";
        access_log off;
    }

    location @django_media {
        proxy_pass http://django_backend/media$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Served-By "django-fallback";
        access_log off;
    }

    # Health check endpoint for monitoring
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Default location - return 404
    location / {
        return 404;
    }
}
