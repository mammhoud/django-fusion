[project]
name = "vresume"
version = "1.0.3"
description = "VResume website — part of Structa Cloud workspace"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]  # required for `uv pip install --editable` so hatchling can locate the package
