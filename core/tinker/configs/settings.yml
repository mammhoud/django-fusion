# Tinker Configuration File
# ============================================================
# Dynaconf-based configuration for Tinker
# 
# Precedence Order:
#   1. Environment variables (.env file)
#   2. settings.{ENV}.yml (environment-specific overrides)
#   3. settings.yml (defaults, this file)
#
# Usage:
#   - Set TINKER_ENV to switch environments: development, staging, production
#   - Override any value via environment variables: export DEBUG=false
#   - Use dynaconf settings object in Django for type-safe access

---
# ============================================================
# Application Settings
# ============================================================

APP:
  name: "Tinker"
  title: "Tinker Template Customizer"
  description: "AI-powered template discovery and customization"
  version: "1.0.0"
  environment: development

# ============================================================
# Django Settings
# ============================================================

DJANGO:
  secret_key: "{{ env 'TINKER_SECRET_KEY' or 'django-insecure-tinker-dev' }}"
  debug: "{{ env 'TINKER_DEBUG' or true }}"
  allowed_hosts:
    - "{{ env 'TINKER_ALLOWED_HOSTS' or 'localhost,127.0.0.1,tinker.localhost' }}"
  time_zone: "UTC"
  language_code: "en-us"
  
# ============================================================
# Database Settings
# ============================================================

DATABASE:
  engine: "django.db.backends.sqlite3"
  name: "db.sqlite3"
  # For PostgreSQL, override in production environment:
  # engine: "django.db.backends.postgresql"
  # host: "{{ env 'DB_HOST' or 'localhost' }}"
  # port: "{{ env 'DB_PORT' or 5432 }}"
  # name: "{{ env 'DB_NAME' or 'tinker_db' }}"
  # user: "{{ env 'DB_USER' or 'tinker_user' }}"
  # password: "{{ env 'DB_PASSWORD' }}"

# ============================================================
# Static Files & Media
# ============================================================

STATIC_FILES:
  url: "/static/"
  root: "staticfiles/"
  dirs:
    - "assets/static"
    - "assets/bundles"

MEDIA:
  url: "/media/"
  root: "assets/media/"

# ============================================================
# Template Configuration
# ============================================================

TEMPLATES:
  dirs:
    - "templates"
    - "../assets/templates"
  app_dirs: true

# ============================================================
# AI Model Configuration
# ============================================================

MODELS:
  registry_file: "configs/models.yml"
  default_provider: "ollama"
  timeout: 60

# ============================================================
# Ollama Configuration
# ============================================================

OLLAMA:
  enabled: true
  base_url: "{{ env 'OLLAMA_BASE_URL' or 'http://localhost:11434' }}"
  model: "{{ env 'OLLAMA_MODEL' or 'gemma3:4b' }}"
  timeout: 60

# ============================================================
# Ceptor-AI Configuration
# ============================================================

CEPTOR_AI:
  enabled: true
  agents_dir: "../../.kilo/agent/"
  models_file: "../../.kilo/models.yml"

# ============================================================
# Template Sites Configuration
# ============================================================

CUSTOMIZER:
  apps:
    - slug: "ctc-research"
      name: "CTC Research"
      template_root: "{{ env 'TINKER_CTC_TEMPLATES' or '../ctc-research/templates' }}"
    - slug: "lms-demo"
      name: "Structa LMS Demo"
      template_root: "{{ env 'TINKER_LMS_TEMPLATES' or '../lms-demo/templates' }}"
    - slug: "VResume"
      name: "VResume"
      template_root: "{{ env 'TINKER_VRESUME_TEMPLATES' or '../VResume/www/pages/templates' }}"

# ============================================================
# Security Settings
# ============================================================

SECURITY:
  csrf_cookie_secure: false
  session_cookie_secure: false
  # Enable in production:
  # csrf_cookie_secure: true
  # session_cookie_secure: true
  # ssl_redirect: true
  secure_browser_xss_filter: true
  secure_content_security_policy:
    default-src: "'self'"
    script-src: "'self' 'unsafe-inline'"
    style-src: "'self' 'unsafe-inline'"

# ============================================================
# Logging Configuration
# ============================================================

LOGGING:
  version: 1
  disable_existing_loggers: false
  formatters:
    simple:
      format: "[%(levelname)s] %(message)s"
    verbose:
      format: "[%(asctime)s] %(name)s - %(levelname)s - %(message)s"
  handlers:
    console:
      class: "logging.StreamHandler"
      formatter: "simple"
      level: "DEBUG"
  loggers:
    django:
      handlers: ["console"]
      level: "INFO"
    tinker:
      handlers: ["console"]
      level: "DEBUG"

# ============================================================
# Cache Configuration
# ============================================================

CACHES:
  default:
    backend: "django.core.cache.backends.locmem.LocMemCache"
    location: "tinker-cache"
    timeout: 300

# ============================================================
# Email Configuration
# ============================================================

EMAIL:
  backend: "django.core.mail.backends.console.EmailBackend"
  host: "{{ env 'EMAIL_HOST' }}"
  port: "{{ env 'EMAIL_PORT' or 587 }}"
  use_tls: "{{ env 'EMAIL_USE_TLS' or true }}"
  user: "{{ env 'EMAIL_USER' }}"
  password: "{{ env 'EMAIL_PASSWORD' }}"
  from_address: "{{ env 'DEFAULT_FROM_EMAIL' or 'noreply@tinker.local' }}"

# ============================================================
# API Settings
# ============================================================

API:
  versioning: "rest_framework.versioning.NamespaceVersioning"
  pagination_size: 20
  throttle_rate: "100/hour"

# ============================================================
# Gunicorn Settings
# ============================================================

GUNICORN:
  workers: "{{ env 'TINKER_WORKERS' or 2 }}"
  worker_class: "uvicorn.workers.UvicornWorker"
  max_requests: 1000
  max_requests_jitter: 100
  timeout: 120
