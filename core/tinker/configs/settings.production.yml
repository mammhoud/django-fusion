# Production Environment Configuration
# ============================================================
# Overrides for settings.yml in production
#
# Load order: settings.yml → settings.production.yml → environment variables
# IMPORTANT: All secrets should be set via environment variables, not in files

---

APP:
  environment: production

DJANGO:
  debug: false
  secret_key: "{{ env 'TINKER_SECRET_KEY' }}"  # MUST be set via .env
  allowed_hosts:
    - "{{ env 'TINKER_ALLOWED_HOSTS' }}"  # e.g., tinker.example.com

DATABASE:
  engine: "django.db.backends.postgresql"
  host: "{{ env 'DB_HOST' }}"
  port: "{{ env 'DB_PORT' or 5432 }}"
  name: "{{ env 'DB_NAME' }}"
  user: "{{ env 'DB_USER' }}"
  password: "{{ env 'DB_PASSWORD' }}"

SECURITY:
  csrf_cookie_secure: true
  session_cookie_secure: true
  secure_ssl_redirect: true

LOGGING:
  version: 1
  disable_existing_loggers: false
  formatters:
    json:
      class: "pythonjsonlogger.jsonlogger.JsonFormatter"
      format: "%(asctime)s %(name)s %(levelname)s %(message)s"
  handlers:
    console:
      class: "logging.StreamHandler"
      formatter: "json"
      level: "INFO"
  loggers:
    django:
      handlers: ["console"]
      level: "INFO"
    tinker:
      handlers: ["console"]
      level: "INFO"

CACHES:
  default:
    backend: "django_redis.cache.RedisCache"
    location: "{{ env 'REDIS_URL' or 'redis://localhost:6379/1' }}"
    options:
      client_class: "django_redis.client.DefaultClient"
      connection_pool_kwargs:
        max_connections: 50

GUNICORN:
  workers: "{{ env 'TINKER_WORKERS' or 4 }}"
  worker_class: "uvicorn.workers.UvicornWorker"
  max_requests: 1000
  timeout: 120
