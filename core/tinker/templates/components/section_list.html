{# applications/customizer/components/customizer/section_list.html #}
<h3 class="h6">Sections linked to {{ page_title }}</h3>
<ul class="list-group list-group-flush">
  {% for section in sections %}
    <li class="list-group-item px-0 d-flex justify-content-between gap-3">
      <code>{{ section.path }}</code>
      <span class="badge text-bg-secondary">{{ section.category }}</span>
    </li>
  {% empty %}
    <li class="list-group-item px-0 text-muted">No linked sections discovered.</li>
  {% endfor %}
</ul>
