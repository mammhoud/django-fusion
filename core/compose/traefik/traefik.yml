# Traefik Static Configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: common

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@structa.cloud
      storage: /etc/traefik/acme/acme.json
      httpChallenge:
        entryPoint: web
