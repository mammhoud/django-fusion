# ============================================
# All Django Services — Routers & Backends
# Covers:
#   - structa.cloud, www.structa.cloud
#   - core.structa.cloud
#   - ctc-research.com, www.ctc-research.com, arch.ctc-research.com
# ============================================
http:

  # ------------------------------------------
  # ROUTERS
  # ------------------------------------------
  routers:

    # --- structa.cloud (main site) ---
    structa-http:
      rule: "Host(`structa.cloud`) || Host(`www.structa.cloud`)"
      entryPoints: [web]
      middlewares: [redirect-www-to-root, compress, redirect-to-https]
      service: structa-service

    structa-https:
      rule: "(Host(`structa.cloud`) || Host(`www.structa.cloud`)) && !PathPrefix(`/static/`) && !PathPrefix(`/media/`)"
      entryPoints: [web-secure]
      middlewares: [redirect-www-to-root, compress, csrf-headers, security-headers]
      service: structa-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "structa.cloud"
            sans:
              - "www.structa.cloud"

    structa-assets:
      rule: "(Host(`structa.cloud`) || Host(`www.structa.cloud`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      service: structa-nginx-service
      tls:
        certResolver: letsencrypt

    # --- core.structa.cloud ---
    core-http:
      rule: "Host(`core.structa.cloud`)"
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: core-service

    core-https:
      rule: "Host(`core.structa.cloud`) && !PathPrefix(`/static/`) && !PathPrefix(`/media/`)"
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: core-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "core.structa.cloud"

    core-assets:
      rule: "Host(`core.structa.cloud`) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      service: core-nginx-service
      tls:
        certResolver: letsencrypt

    # --- ctc-research.com ---
    ctc-main-http:
      rule: "Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)"
      entryPoints: [web]
      middlewares: [redirect-www-to-root, compress]
      service: ctc-main-service

    ctc-main-https:
      rule: "(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && !PathPrefix(`/static/`) && !PathPrefix(`/media/`)"
      entryPoints: [web-secure]
      middlewares: [redirect-www-to-root, compress, csrf-headers, security-headers]
      service: ctc-main-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "ctc-research.com"
            sans:
              - "www.ctc-research.com"
              - "arch.ctc-research.com"

    ctc-assets:
      rule: "(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      service: ctc-nginx-service
      tls:
        certResolver: letsencrypt

  # ------------------------------------------
  # SERVICES
  # ------------------------------------------
  services:

    structa-service:
      loadBalancer:
        servers:
          - url: "http://core:5080"
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
          followRedirects: false
        sticky:
          cookie:
            name: structa_lb
            secure: true
            httpOnly: true

    structa-nginx-service:
      loadBalancer:
        servers:
          - url: "http://core-nginx:80"

    core-service:
      loadBalancer:
        servers:
          - url: "http://core:5080"
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
          followRedirects: false
        sticky:
          cookie:
            name: core_lb
            secure: true
            httpOnly: true

    core-nginx-service:
      loadBalancer:
        servers:
          - url: "http://core-nginx:80"

    ctc-main-service:
      loadBalancer:
        servers:
          - url: "http://ctc-django-main:5070"
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
          followRedirects: false
        sticky:
          cookie:
            name: ctc_main_lb
            secure: true
            httpOnly: true

    ctc-nginx-service:
      loadBalancer:
        servers:
          - url: "http://ctc-nginx:80"
