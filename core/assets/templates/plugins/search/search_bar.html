{# packages/ui/search/search_bar.html #}
{% load i18n %}

<div class="search-bar-container w-100">
    <form method="get" action="{{ hx_url }}" class="position-relative"
          {% if hx_url %}
          hx-get="{{ hx_url }}"
          hx-target="{{ hx_target }}"
          hx-trigger="submit, keyup changed delay:500ms from:input[type='search']"
          {% if hx_indicator %}hx-indicator="{{ hx_indicator }}"{% endif %}
          {% endif %}>
        <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0">
                <i class="bi bi-search text-muted"></i>
            </span>
            <input type="search"
                   name="{{ name|default:'q' }}"
                   class="form-control border-start-0 ps-0 {{ input_class|default:'' }}"
                   placeholder="{{ placeholder|default:_('Search...') }}"
                   value="{{ value|default:'' }}"
                   aria-label="{% trans 'Search' %}"
                   autocomplete="off">
            {% if show_button %}
            <button class="btn btn-primary" type="submit">
                {% trans "Search" %}
            </button>
            {% endif %}
        </div>
    </form>
</div>
