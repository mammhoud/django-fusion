{% load i18n wagtailcore_tags %}
{# Events page title — BEM component #}
<section class="rbt-event-title">
    <div class="container">
        <div class="rbt-event-title__inner text-center">
            <nav class="rbt-event-title__breadcrumb" aria-label="{% trans 'Breadcrumb' %}">
                <ol class="breadcrumb justify-content-center">
                    <li class="breadcrumb-item"><a href="/">{% trans "Home" %}</a></li>
                    <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
                </ol>
            </nav>
            <h1 class="rbt-event-title__heading">{{ page.title }}</h1>
            {% if page.intro %}
                <p class="rbt-event-title__intro">{{ page.intro|richtext }}</p>
            {% endif %}
        </div>
    </div>
</section>
