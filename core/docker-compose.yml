services:
  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: postgres
  #   restart: unless-stopped
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mk_pAssWord123}
  #     POSTGRES_DB: db_structa
  #     PGDATA: /var/lib/postgresql/data/pgdata
  #   volumes:
  #     - ./compose/data/postgres_data:/var/lib/postgresql/data:Z
  #   healthcheck:
  #     test: [ "CMD-SHELL", "pg_isready -U postgres" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ============================================================
  # CORE - Django/Uvicorn Application
  # ============================================================
  core:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    image: core
    container_name: core
    restart: unless-stopped
    ports:
      - "8280:5080"
    env_file:
      - ./.env
    volumes:
      - ../libs:/libs:rw
      - core_static:/app/assets/staticfiles:rw
      - core_media:/app/assets/media:rw
    environment:
      - RUNNING_ENV=docker
      - SERVER_ENV=production
      - DEBUG=False
      - PORT=5080
      - DB_HOST=postgres
      - DB_NAME=db_structa
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - RUN_SETUP=true
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:-admin}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-admin@structa.cloud}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-mk_pAssWord123}
    # depends_on:
    #   postgres:
    #     condition: service_healthy

volumes:
  core_static:
  core_media:
