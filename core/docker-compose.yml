# ============================================================
# Alliance Standard Infrastructure (Non-Traefik)
# Simplified setup for local development.
# ============================================================

# ------------------------------------------------------------
# NETWORKS
# ------------------------------------------------------------
networks:
  app-net:
    driver: bridge
  traefik-net:
    external: true

services:
  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  # ============================================================
  # CORE - Django/Uvicorn Application
  # ============================================================
  core:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    image: alliance-website
    container_name: alliance-website
    restart: unless-stopped
    ports:
      - "${PORT:-8280}:5080"
    env_file:
      - ./.env
    volumes:
      - ../libs:/libs:rw
      - alliance_static:/app/assets/staticfiles:rw
      - alliance_media:/app/assets/media:rw
    environment:
      - PORT=5080
      - RUNNING_ENV=docker
      - SERVER_ENV=production
      - DEBUG=False
      - RELOAD=${RELOAD:-false}
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,alliance-website,*
      - RUN_SETUP=true
    networks:
      - app-net
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5080/health/ || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

volumes:
  alliance_static:
  alliance_media:
