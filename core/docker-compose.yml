# ============================================================
# Alliance — Local Development
# Database: SQLite (no external services)
# Usage:    docker compose up -d --build
# ============================================================

networks:
  app-net:
    driver: bridge
  traefik-net:
    external: true

services:
  core:
    build:
      context: .
      dockerfile: ./compose/django/Dockerfile
    image: core
    container_name: core
    restart: unless-stopped
    ports:
      - "${PORT:-8280}:5080"
    env_file:
      - ./.env
    volumes:
      - ../libs:/libs:rw
      - core_static:/app/assets/staticfiles:rw
      - core_media:/app/assets/media:rw
    environment:
      - RUNNING_ENV=docker
      - SERVER_ENV=${SERVER_ENV:-development}
      - DEBUG=${DEBUG:-true}
      - PORT=5080
      - RELOAD=${RELOAD:-false}
      - RUN_SETUP=true
      # Domain & security — read from .env, fallback to open local defaults
      - DOMAIN=${DOMAIN:-localhost}
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8280,http://127.0.0.1:8280}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8280,http://127.0.0.1:8280}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_NAME=${DB_NAME:-db_structa}
      - REDIS_URL=${REDIS_URL:-redis://:redis_password@redis:6379/5}
    networks:
      - app-net
      - traefik-net

volumes:
  core_static:
  core_media:
