default:
  EMAIL_STRATEGY: "smtp"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: 587
  EMAIL_USE_TLS: true
  EMAIL_USE_SSL: false
  EMAIL_USER: "@jinja {{ env.get('EMAIL_USER', '') }}"
  EMAIL_PASSWORD: "@jinja {{ env.get('EMAIL_PASSWORD', 'password') }}"
  DEFAULT_FROM_EMAIL: "@jinja {{ env.get('DEFAULT_FROM_EMAIL', 'noreply@example.com') }}"
  SERVER_EMAIL: "@jinja {{ env.get('DEFAULT_FROM_EMAIL', 'noreply@example.com') }}"
  EMAIL_SUBJECT_PREFIX: "[AllianceCore] "
  EMAIL_TIMEOUT: 30

  # Email queue
  EMAIL_QUEUE_ENABLED: false
  EMAIL_QUEUE_BATCH_SIZE: 10

  # Email tracking
  EMAIL_TRACKING_ENABLED: false

demo:
  EMAIL_STRATEGY: "smtp"


