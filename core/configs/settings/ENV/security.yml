# ====================================
# 🛡️ Security Configuration
# ====================================

# Base defaults that apply to all environments
default:
  # Core Application Settings
  DEBUG: false

  # Core Security Settings
  DJANGO_SECRET_KEY: "django-insecure-&8!z+9#2(0@1^4$5%6*7)8-9=0+1_2@3#4$5%6^7&8*9(0)1"

  SECURITY:
    # Host Validation
    ALLOWED_HOSTS:
      - "localhost"
      - "127.0.0.1"
      - "0.0.0.0"
      - "::1"

    # CORS Configuration
    CORS_ALLOW_ALL_ORIGINS: false
    CORS_ALLOW_CREDENTIALS: true
    CORS_EXPOSE_HEADERS:
      - "Content-Disposition"
    CORS_ALLOWED_ORIGINS:
      - "http://localhost:5080"
      - "http://127.0.0.1:5080"
      - "http://127.0.0.1:5055"
      - "http://localhost:5070"
      - "http://localhost:5055"
      - "http://127.0.0.1:5070"

    # CSRF Protection
    CSRF_COOKIE_NAME: "csrftoken"
    CSRF_HEADER_NAME: "HTTP_X_CSRFTOKEN"
    CSRF_COOKIE_HTTPONLY: false
    CSRF_COOKIE_SAMESITE: "Lax"
    CSRF_FAILURE_VIEW: "django.views.csrf.csrf_failure"
    CSRF_USE_SESSIONS: false
    CSRF_TRUSTED_ORIGINS:
      - "http://localhost:5080"
      - "http://127.0.0.1:5080"
      - "http://127.0.0.1:5055"
      - "http://localhost:5070"
      - "http://localhost:5055"
      - "http://127.0.0.1:5070"

    # HTTPS/SSL Security
    SECURE_SSL_REDIRECT: false
    SECURE_HSTS_SECONDS: 0
    SECURE_HSTS_INCLUDE_SUBDOMAINS: false
    SECURE_HSTS_PRELOAD: false
    SECURE_PROXY_SSL_HEADER:
      - "HTTP_X_FORWARDED_PROTO"
      - "https"
    SECURE_REDIRECT_EXEMPT: []
    SECURE_REFERRER_POLICY: "same-origin"

    # Session Configuration
    SESSION_COOKIE_NAME: "sessionid"
    SESSION_COOKIE_AGE: 1209600
    SESSION_COOKIE_HTTPONLY: true
    SESSION_COOKIE_SECURE: false
    SESSION_COOKIE_SAMESITE: "Lax"
    SESSION_COOKIE_PATH: "/"
    SESSION_COOKIE_DOMAIN: null
    SESSION_SAVE_EVERY_REQUEST: true
    SESSION_EXPIRE_AT_BROWSER_CLOSE: false
    SESSION_ENGINE: "django.contrib.sessions.backends.db" # Fixed: Changed from cached_db

    # Headers Security
    X_FRAME_OPTIONS: "DENY"
    SECURE_CONTENT_TYPE_NOSNIFF: true
    SECURE_BROWSER_XSS_FILTER: true
    X_CONTENT_TYPE_OPTIONS: "nosniff"
    X_XSS_PROTECTION: "1; mode=block"

    # Password Security
    PASSWORD_HASHERS:
      - "django.contrib.auth.hashers.PBKDF2PasswordHasher"
      - "django.contrib.auth.hashers.PBKDF2SHA1PasswordHasher"
      - "django.contrib.auth.hashers.BCryptSHA256PasswordHasher"

    # Rate Limiting
    RATE_LIMIT_ENABLED: false
    RATE_LIMIT_LOGIN_ATTEMPTS: 10
    RATE_LIMIT_LOGIN_TIMEOUT: 900
    RATE_LIMIT_API_REQUESTS: 1000
    RATE_LIMIT_API_TIMEFRAME: 3600
    RATE_LIMIT_BURST: 10
    RATE_LIMIT_CACHE_PREFIX: "ratelimit"
    REST_FRAMEWORK_THROTTLE_ENABLED: false
    REST_FRAMEWORK_THROTTLE_ANON: "100/hour"
    REST_FRAMEWORK_THROTTLE_USER: "1000/hour"
    REST_FRAMEWORK_THROTTLE_BURST: "50/5min"

    # Admin Security
    ADMIN_URL: "admin/"
    ADMIN_SESSION_COOKIE_AGE: 7200
    ADMIN_CSRF_COOKIE_SECURE: true

    # Authentication
    LOGIN_URL: "/auth/sign-in/"
    LOGIN_REDIRECT_URL: "/dashboard/"
    LOGOUT_REDIRECT_URL: "/"
    AUTHENTICATION_BACKENDS:
      - "django.contrib.auth.backends.ModelBackend"

    # File Upload Security
    FILE_UPLOAD_MAX_MEMORY_SIZE: 26214400
    DATA_UPLOAD_MAX_MEMORY_SIZE: 26214400
    DATA_UPLOAD_MAX_NUMBER_FIELDS: 1000

    # Database Security
    DB_CONN_MAX_AGE: 600
    DB_ATOMIC_REQUESTS: false
    DB_DISABLE_SERVER_SIDE_CURSORS: false

    # Cache Security
    CACHE_KEY_PREFIX: "xellent_"
    CACHE_TIMEOUT: 300
    CACHE_VERSION: 1

    # API Security
    API_RATE_LIMIT_ENABLED: true
    API_KEY_REQUIRED: false
    API_VERSION_HEADER: "X-API-Version"
    API_DEFAULT_VERSION: "v1"

    # JWT Token Settings
    JWT_ACCESS_TOKEN_LIFETIME_DAYS: 30
    JWT_REFRESH_TOKEN_LIFETIME_DAYS: 365
    JWT_SLIDING_TOKEN_LIFETIME_DAYS: 60
    JWT_VERIFICATION_TOKEN_LIFETIME_DAYS: 1
    JWT_SLIDING_TOKEN_REFRESH_LIFETIME_DAYS: 90
    JWT_ACTION_TOKEN_LIFETIME_MINUTES: 5
    JWT_PASSWORD_RESET_TOKEN_LIFETIME_MINUTES: 30
    JWT_UPDATE_LAST_LOGIN: false
    JWT_ALGORITHM: "HS256"
    JWT_AUTH_HEADER_TYPES:
      - "Bearer"
      - "JWT"
    JWT_USER_ID_FIELD: "id"
    JWT_USER_ID_CLAIM: "user_id"

    # Logging Security
    LOG_SECURITY_EVENTS: false
    SECURITY_LOG_LEVEL: "INFO"
    LOG_FAILED_LOGIN_ATTEMPTS: false
    LOG_SUSPICIOUS_ACTIVITY: false

    # Email Security
    EMAIL_USE_TLS: true
    EMAIL_USE_SSL: false
    EMAIL_TIMEOUT: 10

# Development environment - minimal restrictions
development:
  DEBUG: true
  SECURITY:
    ALLOWED_HOSTS:
      - "*"
      - "localhost"
      - "127.0.0.1"
      - "0.0.0.0"
      - "::1"
      - "structa-demo"

    CORS_ALLOW_ALL_ORIGINS: true
    CORS_ALLOWED_ORIGINS: []
    CSRF_TRUSTED_ORIGINS:
      - "http://localhost:*"
      - "http://127.0.0.1:*"

    SECURE_SSL_REDIRECT: false
    SECURE_HSTS_SECONDS: 0
    SESSION_COOKIE_SECURE: false
    CSRF_COOKIE_SECURE: false

    RATE_LIMIT_ENABLED: false
    REST_FRAMEWORK_THROTTLE_ENABLED: false
    LOG_SECURITY_EVENTS: false

# Demo/staging environment - balanced security
demo:
  DEBUG: false
  SECURITY:
    ALLOWED_HOSTS:
      - "demo.structa.cloud"
      - "staging.structa.cloud"
      - "*.structa.cloud"
      - "*.vercel.app"
      - "*.onrender.com"
      - "*.railway.app"
      - "*.herokuapp.com"
      - "*.fly.dev"
      - "structa-demo"
      - "structa-main"
      - "structa-demo"
      - "structa-main"
      - "localhost"
      - "127.0.0.1"
      - "0.0.0.0"

    CORS_ALLOW_ALL_ORIGINS: false
    CORS_ALLOWED_ORIGINS:
      - "https://demo.structa.cloud"
      - "http://demo.structa.cloud"
      - "http://www.structa.cloud"
      - "http://structa.cloud"
      - "https://staging.structa.cloud"
      - "http://localhost:5055"
      - "http://localhost:5080"
      - "http://localhost:5030"
      - "http://localhost:5070"
      - "http://127.0.0.1:5055"
      - "http://127.0.0.1:5030"
      - "http://127.0.0.1:5070"

    CSRF_TRUSTED_ORIGINS:
      - "https://demo.structa.cloud"
      - "http://demo.structa.cloud"
      - "http://www.structa.cloud"
      - "http://structa.cloud"
      - "https://staging.structa.cloud"
      - "http://localhost:5055"
      - "http://localhost:5030"
      - "http://localhost:5070"
      - "http://localhost:5080"
      - "http://127.0.0.1:5055"
      - "http://127.0.0.1:5030"
      - "http://127.0.0.1:5070"

    SECURE_SSL_REDIRECT: false
    SECURE_HSTS_SECONDS: 2592000 # 30 days
    SECURE_HSTS_INCLUDE_SUBDOMAINS: true
    SECURE_HSTS_PRELOAD: false
    SESSION_COOKIE_SECURE: true
    CSRF_COOKIE_SECURE: true

    # Proxy settings for demo/staging
    USE_X_FORWARDED_HOST: true
    USE_X_FORWARDED_PORT: true
    SECURE_PROXY_SSL_HEADER:
      - "HTTP_X_FORWARDED_PROTO"
      - "https"

    RATE_LIMIT_ENABLED: true
    REST_FRAMEWORK_THROTTLE_ENABLED: true
    LOG_SECURITY_EVENTS: true
    SECURITY_LOG_LEVEL: "WARNING"

# Production environment - maximum security
production:
  DEBUG: false

  SECURITY:
    ALLOWED_HOSTS:
      - "structa.cloud"
      - "www.structa.cloud"
      - "arch.structa.cloud"
      - "api.structa.cloud"
      - "db.structa.cloud"
      - "structa-main"
      - "structa-demo"
      - "structa-main"
      - "structa-demo"
      - "127.0.0.1"
      - "localhost"
      - "*.structa.cloud" # Added wildcard for all subdomains

    CORS_ALLOW_ALL_ORIGINS: false
    CORS_ALLOWED_ORIGINS:
      - "https://structa.cloud"
      - "https://www.structa.cloud"
      - "https://arch.structa.cloud"
      - "https://api.structa.cloud"
      - "https://db.structa.cloud"

    CSRF_TRUSTED_ORIGINS:
      - "https://structa.cloud"
      - "https://www.structa.cloud"
      - "https://arch.structa.cloud"
      - "https://api.structa.cloud"
      - "https://db.structa.cloud"

    SECURE_SSL_REDIRECT: false
    SECURE_HSTS_SECONDS: 31536000 # 1 year
    SECURE_HSTS_INCLUDE_SUBDOMAINS: true
    SECURE_HSTS_PRELOAD: true
    SESSION_COOKIE_SECURE: true
    CSRF_COOKIE_SECURE: true

    # Proxy settings for production (if behind nginx/apache)
    USE_X_FORWARDED_HOST: true
    USE_X_FORWARDED_PORT: true
    SECURE_PROXY_SSL_HEADER:
      - "HTTP_X_FORWARDED_PROTO"
      - "https"

    RATE_LIMIT_ENABLED: true
    RATE_LIMIT_LOGIN_ATTEMPTS: 5
    REST_FRAMEWORK_THROTTLE_ENABLED: true
    LOG_SECURITY_EVENTS: true
    LOG_FAILED_LOGIN_ATTEMPTS: true
    LOG_SUSPICIOUS_ACTIVITY: true
    SECURITY_LOG_LEVEL: "WARNING"
