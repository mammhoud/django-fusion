# ============================================================
# Main Docker Compose - All Services
# Usage: docker compose up -d
# Or: docker compose -f docker-compose.yml -f websites/structa.docker-compose.yml up -d
# Or: docker compose -f docker-compose.yml -f websites/ctc-research.docker-compose.yml up -d
# ============================================================

networks:
  traefik-net:
    name: traefik-net
    driver: bridge
  site_network:
    external: true
    name: site_network

volumes:
  traefik_acme:
  redis_data:

services:
  # ============================================================
  # TRAEFIK REVERSE PROXY
  # ============================================================
  traefik:
    build:
      context: .
      dockerfile: ./compose/traefik/Dockerfile
    image: traefik
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - traefik_acme:/etc/traefik/acme
      - ./compose/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./compose/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./VResume/compose/traefik/dynamic:/etc/traefik/dynamic/vresume:ro
    environment:
      DOCKER_API_VERSION: "1.44"
      TRAEFIK_ACME_EMAIL: ${TRAEFIK_ACME_EMAIL:-vresume@structa.cloud}
    networks:
      - traefik-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================
  # REDIS - Shared Cache Service
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    networks:
      - traefik-net
      - site_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  postgres:
    build:
      context: ./compose/postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mk_pAssWord123}
      INITDB_MULTIPLE_DATABASES: "${POSTGRES_DATABASES:-db_site,db_ctc:structa:mk_pAssWord123,db_structa:structa:mk_pAssWord123,vresume:structa:mk_pAssWord123,blinko}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./compose/postgres/postgres_data:/var/lib/postgresql/data:Z
      - ./compose/postgres/backups:/backups:Z
    networks:
      - traefik-net
      - site_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 60s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
