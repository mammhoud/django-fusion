# ============================================
# Blinko Service Configuration
# Domain: space.structa.cloud
# ============================================
http:
  routers:
    blinko-http:
      rule: "Host(`space.structa.cloud`)"
      entryPoints:
        - web
      middlewares:
        - compress
      service: blinko-service

    blinko-https:
      rule: "Host(`space.structa.cloud`)"
      entryPoints:
        - web-secure
      middlewares:
        - compress
        - security-headers
      service: blinko-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "space.structa.cloud"

  services:
    blinko-service:
      loadBalancer:
        servers:
          - url: "http://blinko:1111"
        healthCheck:
          path: /
          interval: 60s
          timeout: 5s
