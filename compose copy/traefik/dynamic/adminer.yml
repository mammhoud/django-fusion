# ============================================
# Adminer Service Configuration
# ============================================
http:
  routers:
    adminer-http:
      rule: "Host(`adminer.ctc-research.com`)"
      entryPoints:
        - web
      middlewares:
        - compress
      service: adminer-service

    adminer-https:
      rule: "Host(`adminer.ctc-research.com`)"
      entryPoints:
        - web-secure
      middlewares:
        - compress
        - security-headers
      service: adminer-service
      tls:
        certResolver: letsencrypt

  services:
    adminer-service:
      loadBalancer:
        servers:
          - url: "http://adminer:8080"
        healthCheck:
          path: /
          interval: 60s
          timeout: 5s
