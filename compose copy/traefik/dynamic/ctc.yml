# ============================================
# CTC Service Configuration
# Domain: ctc-research.com, www.ctc-research.com, arch.ctc-research.com
# ============================================
http:
  routers:
    ctc-http:
      rule: "Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)"
      entryPoints:
        - web
      middlewares:
        - compress
        - redirect-to-https
      service: ctc-service

    ctc-https:
      rule: "Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)"
      entryPoints:
        - web-secure
      middlewares:
        - compress
        - security-headers
      service: ctc-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "ctc-research.com"
            sans:
              - "www.ctc-research.com"

  services:
    ctc-service:
      loadBalancer:
        servers:
          - url: "http://ctc-website:5070"
        healthCheck:
          path: /
          interval: 30s
          timeout: 5s
