# ============================================
# VResume Service Configuration
# Domain: vresume.structa.cloud
# ============================================
http:
  routers:
    vresume-http:
      rule: "Host(`vresume.structa.cloud`)"
      entryPoints:
        - web
      middlewares:
        - compress
        - redirect-to-https
      service: vresume-service

    vresume-https:
      rule: "Host(`vresume.structa.cloud`)"
      entryPoints:
        - web-secure
      middlewares:
        - compress
        - security-headers
      service: vresume-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "vresume.structa.cloud"

  services:
    vresume-service:
      loadBalancer:
        servers:
          - url: "http://vresume-website:5072"
        healthCheck:
          path: /
          interval: 30s
          timeout: 5s
