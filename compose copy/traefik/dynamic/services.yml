# ============================================
# All Django Services — Routers & Backends
# Covers:
#   - structa.cloud, www.structa.cloud
#   - core.structa.cloud
#   - ctc-research.com, www.ctc-research.com, arch.ctc-research.com
# ============================================
http:
  # ------------------------------------------
  # ROUTERS
  # ------------------------------------------
  routers:
    # --- structa.cloud (main site) ---
    structa-http:
      rule: "Host(`structa.cloud`) || Host(`www.structa.cloud`)"
      entryPoints: [web]
      middlewares: [redirect-www-to-root, compress, redirect-to-https]
      service: structa-service

    structa-https:
      rule: "(Host(`structa.cloud`) || Host(`www.structa.cloud`)) && !PathPrefix(`/static/`) && !PathPrefix(`/media/`)"
      entryPoints: [web-secure]
      middlewares:
        [redirect-www-to-root, compress, csrf-headers, security-headers]
      service: structa-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "structa.cloud"
            sans:
              - "www.structa.cloud"

    structa-assets:
      rule: "(Host(`structa.cloud`) || Host(`www.structa.cloud`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      service: structa-nginx-service
      tls:
        certResolver: letsencrypt

    # --- site.structa.cloud (Django frontend) ---
    site-http:
      rule: "Host(`site.structa.cloud`)"
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: core-service

    site-https:
      rule: "Host(`site.structa.cloud`) && !PathPrefix(`/static/`) && !PathPrefix(`/media/`)"
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: core-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "site.structa.cloud"

    site-assets:
      rule: "Host(`site.structa.cloud`) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      service: core-nginx-service
      tls:
        certResolver: letsencrypt

    # --- core.structa.cloud ---
    core-http:
      rule: "Host(`core.structa.cloud`)"
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: core-service

    core-https:
      rule: "Host(`core.structa.cloud`) && !PathPrefix(`/static/`) && !PathPrefix(`/media/`)"
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: core-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "core.structa.cloud"

    core-assets:
      rule: "Host(`core.structa.cloud`) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      service: core-nginx-service
      tls:
        certResolver: letsencrypt

    # --- ctc-research.com ---
    website-http:
      rule: "Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)"
      entryPoints: [web]
      middlewares: [redirect-www-to-root, compress]
      service: website-service

    website-https:
      rule: "(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && !PathPrefix(`/static/`) && !PathPrefix(`/media/`)"
      entryPoints: [web-secure]
      middlewares:
        [redirect-www-to-root, compress, csrf-headers, security-headers]
      service: website-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "ctc-research.com"
            sans:
              - "www.ctc-research.com"
              - "arch.ctc-research.com"

    website-assets:
      rule: "(Host(`ctc-research.com`) || Host(`www.ctc-research.com`) || Host(`arch.ctc-research.com`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
      entryPoints: [web-secure]
      service: website-nginx-service
      tls:
        certResolver: letsencrypt

    # --- vresume.structa.cloud ---
    vresume-http:
      rule: "Host(`vresume.structa.cloud`)"
      entryPoints: [web]
      middlewares: [compress, redirect-to-https]
      service: vresume-service

    vresume-https:
      rule: "Host(`vresume.structa.cloud`)"
      entryPoints: [web-secure]
      middlewares: [compress, csrf-headers, security-headers]
      service: vresume-service
      tls:
        certResolver: letsencrypt
        domains:
          - main: "vresume.structa.cloud"

  # ------------------------------------------
  # SERVICES
  # ------------------------------------------
  services:
    structa-service:
      loadBalancer:
        servers:
          - url: "http://structa-website:5071"
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
          followRedirects: false
        sticky:
          cookie:
            name: structa_lb
            secure: true
            httpOnly: true

    structa-nginx-service:
      loadBalancer:
        servers:
          - url: "http://structa-website-media:80"

    core-service:
      loadBalancer:
        servers:
          - url: "http://structa-website:5071"
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
          followRedirects: false
        sticky:
          cookie:
            name: core_lb
            secure: true
            httpOnly: true

    core-nginx-service:
      loadBalancer:
        servers:
          - url: "http://structa-website-media:80"

    website-service:
      loadBalancer:
        servers:
          - url: "http://ctc-website:5070"
        healthCheck:
          path: /health/
          interval: 30s
          timeout: 10s
          followRedirects: false
        sticky:
          cookie:
            name: website_lb
            secure: true
            httpOnly: true

    website-nginx-service:
      loadBalancer:
        servers:
          - url: "http://ctc-website-media:80"

    vresume-service:
      loadBalancer:
        servers:
          - url: "http://vresume-website:5072"
        healthCheck:
          path: /
          interval: 30s
          timeout: 10s
          followRedirects: false
        sticky:
          cookie:
            name: vresume_lb
            secure: true
            httpOnly: true
