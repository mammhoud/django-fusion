name: Lint

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install project dependencies
        run: uv sync --all-extras

      - name: Install lint toolchain
        run: uv pip install ruff pylint black

      - name: Ruff check
        run: uv run ruff check . --ignore E501

      - name: Black code formatting check
        run: uv run black --check . --exclude venv,migrations,\.venv 2>&1 | head -50 || true

      - name: Pylint check (sample)
        run: uv run pylint configs --disable=all --enable=E,F 2>&1 | head -50 || true

      - name: Compile Python sources
        run: uv run python -m compileall configs tasks tests www

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install formatter
        run: uv pip install black

      - name: Check Black formatting
        run: uv run black --check . --exclude venv,migrations,\.venv || echo "Run 'make format' to fix formatting"
