# fusion-ci: Runs Django checks + tests, Next.js builds + unit tests, and
# Playwright E2E tests for the fusion projects (cms-fusion and lms-fusion).
# Each project gets separate backend, frontend, and E2E jobs so failures
# are isolated.
#
# Triggered on changes to fusion project files, lib submodules, or this
# workflow file.

name: Fusion CI (cms-fusion + lms-fusion)

on:
  pull_request:
    paths:
      - 'projects/cms-fusion/**'
      - 'projects/lms-fusion/**'
      - 'libs/django-fusion/**'
      - 'libs/ceptor-ai/**'
      - 'libs/django-bolt/**'
      - 'applications/scripts/dev/check_domain_drift.sh'
      - '.github/workflows/fusion-ci.yml'
  push:
    branches: ['**']
    paths:
      - 'projects/cms-fusion/**'
      - 'projects/lms-fusion/**'
      - 'libs/django-fusion/**'
      - 'libs/ceptor-ai/**'
      - 'libs/django-bolt/**'
      - 'applications/scripts/dev/check_domain_drift.sh'
      - '.github/workflows/fusion-ci.yml'
  workflow_dispatch:

# Prevent duplicate runs on the same PR/branch
concurrency:
  group: fusion-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── CMS-Fusion Backend (Python/Django) ────────────────────────────────

  cms-fusion-backend:
    name: CMS-Fusion — Django Checks + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          version: 'latest'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run Django system checks
        run: make check WEBSITE=cms-fusion

      - name: Verify root Makefile convenience target
        working-directory: ${{ github.workspace }}
        run: make cms-fusion check

      - name: Run migrations
        working-directory: ${{ github.workspace }}
        run: make cms-fusion migrate

      - name: Validate fixture files
        run: uv run python cms-fusion/backend/manage.py load_fusion_fixtures --full --dry-run

      - name: Run fixture content tests
        run: uv run python -m pytest cms-fusion/backend/tests/test_fixture_content.py -v --tb=short

      - name: Run remaining tests
        run: uv run python -m pytest cms-fusion/backend/tests/ --ignore=cms-fusion/backend/tests/test_fixture_content.py -q

  # ── CMS-Fusion Frontend (Next.js) ────────────────────────────────────

  cms-fusion-frontend:
    name: CMS-Fusion — Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/cms-fusion/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/cms-fusion/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build theme SCSS
        run: npm run build:theme

      - name: Build Next.js
        run: npm run build

      - name: Run unit tests
        run: npm test

  # ── CMS-Fusion E2E (Playwright) ────────────────────────────────────

  cms-fusion-e2e:
    name: CMS-Fusion — Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/cms-fusion/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/cms-fusion/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build theme SCSS
        run: npm run build:theme

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cms-fusion-playwright-report
          path: projects/cms-fusion/frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cms-fusion-test-results
          path: projects/cms-fusion/frontend/test-results/
          retention-days: 7

  # ── LMS-Fusion Backend (Python/Django) ───────────────────────────────

  lms-fusion-backend:
    name: LMS-Fusion — Django Checks + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          version: 'latest'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run Django system checks
        run: make check WEBSITE=lms-fusion

      - name: Verify root Makefile convenience target
        working-directory: ${{ github.workspace }}
        run: make lms-fusion check

      - name: Run migrations
        working-directory: ${{ github.workspace }}
        run: make lms-fusion migrate

      - name: Validate fixture files
        run: uv run python lms-fusion/backend/manage.py load_fusion_fixtures --full --dry-run

      - name: Run fixture content tests
        run: uv run python -m pytest lms-fusion/backend/tests/test_fixture_content.py -v --tb=short

      - name: Run remaining tests
        run: uv run python -m pytest lms-fusion/backend/tests/ --ignore=lms-fusion/backend/tests/test_fixture_content.py -q

  # ── LMS-Fusion Frontend (Next.js) ────────────────────────────────────

  lms-fusion-frontend:
    name: LMS-Fusion — Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/lms-fusion/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/lms-fusion/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build theme SCSS
        run: npm run build:theme

      - name: Build Next.js
        run: npm run build

      - name: Run unit tests
        run: npm test

  # ── LMS-Fusion E2E (Playwright) ────────────────────────────────────

  lms-fusion-e2e:
    name: LMS-Fusion — Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/lms-fusion/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/lms-fusion/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build theme SCSS
        run: npm run build:theme

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lms-fusion-playwright-report
          path: projects/lms-fusion/frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lms-fusion-test-results
          path: projects/lms-fusion/frontend/test-results/
          retention-days: 7

  # ── Domain Drift Check ─────────────────────────────────────────────

  domain-drift-check:
    name: Domain Drift — cms-fusion ↔ lms-fusion
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check domain code for drift
        run: bash applications/scripts/dev/check_domain_drift.sh

  # ── Deploy to Staging (manual only, requires all checks to pass) ────

  deploy-staging:
    name: Deploy to Staging
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - cms-fusion-backend
      - cms-fusion-frontend
      - cms-fusion-e2e
      - lms-fusion-backend
      - lms-fusion-frontend
      - lms-fusion-e2e
      - domain-drift-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create required Docker networks
        run: |
          for net in common traefik-net warehouse-net; do
            docker network inspect $net >/dev/null 2>&1 || docker network create $net
          done

      # ── Build & deploy CMS-Fusion ──────────────────────────────────

      - name: Build cms-fusion backend image
        run: |
          docker compose -f projects/cms-fusion/docker-compose.yml build \
            --build-arg PROJECT_PATH=cms-fusion backend

      - name: Build cms-fusion frontend image
        run: |
          docker compose -f projects/cms-fusion/docker-compose.yml build frontend

      - name: Start cms-fusion services (SQLite for staging)
        run: |
          docker compose -f projects/cms-fusion/docker-compose.yml up -d --remove-orphans \
            -e DB_TYPE=sqlite \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT= \
            backend frontend

      - name: Wait for cms-fusion backend health
        run: |
          for i in $$(seq 1 12); do
            if curl -sf http://127.0.0.1:5075/health/ >/dev/null 2>&1; then
              echo "✓ CMS-Fusion backend is healthy"
              exit 0
            fi
            echo "  attempt $$i/12 — waiting..."
            sleep 10
          done
          echo "✗ CMS-Fusion backend did not become healthy"
          echo "=== CMS-Fusion backend logs ==="
          docker compose -f projects/cms-fusion/docker-compose.yml logs --tail=50 backend
          exit 1

      # ── Build & deploy LMS-Fusion ───────────────────────────────────

      - name: Build lms-fusion backend image
        run: |
          docker compose -f projects/lms-fusion/docker-compose.yml build \
            --build-arg PROJECT_PATH=lms-fusion backend

      - name: Build lms-fusion frontend image
        run: |
          docker compose -f projects/lms-fusion/docker-compose.yml build frontend

      - name: Start lms-fusion services (SQLite for staging)
        run: |
          docker compose -f projects/lms-fusion/docker-compose.yml up -d --remove-orphans \
            -e DB_TYPE=sqlite \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT= \
            backend frontend

      - name: Wait for lms-fusion backend health
        run: |
          for i in $$(seq 1 12); do
            if curl -sf http://127.0.0.1:5076/health/ >/dev/null 2>&1; then
              echo "✓ LMS-Fusion backend is healthy"
              exit 0
            fi
            echo "  attempt $$i/12 — waiting..."
            sleep 10
          done
          echo "✗ LMS-Fusion backend did not become healthy"
          echo "=== LMS-Fusion backend logs ==="
          docker compose -f projects/lms-fusion/docker-compose.yml logs --tail=50 backend
          exit 1

      - name: Show deployment status
        run: |
          echo "=== Docker Services Status ==="
          docker compose -f projects/cms-fusion/docker-compose.yml ps
          echo ""
          docker compose -f projects/lms-fusion/docker-compose.yml ps
          echo ""
          echo "=== Health Checks ==="
          curl -s http://127.0.0.1:5075/health/ && echo " — CMS-Fusion"
          curl -s http://127.0.0.1:5076/health/ && echo " — LMS-Fusion"
