name: Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: smoke-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: Smoke Tests - Django & Docker
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      - name: Install project dependencies
        run: uv sync --all-extras
      
      - name: Django system check
        run: uv run ./manage.py check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      
      - name: Collect static files
        run: uv run ./manage.py collectstatic --noinput --no-color
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      
      - name: Validate project structure
        run: |
          echo "Checking project structure..."
          test -d ctc-research && echo "✓ ctc-research"
          test -d lms-demo && echo "✓ lms-demo"
          test -d VResume && echo "✓ VResume"
          test -d compose && echo "✓ compose"
          test -d infra && echo "✓ infra"
          test -d warehouses && echo "✓ warehouses"
          test -d utilities && echo "✓ utilities"
      
      - name: Validate Docker Compose files
        run: |
          echo "Validating main docker-compose..."
          docker compose config --quiet
          
          echo "Validating warehouses compose..."
          docker compose -f warehouses/docker-compose.yml config --quiet
          
          echo "Validating utilities compose..."
          docker compose -f utilities/docker-compose.yml config --quiet
      
      - name: Check critical imports
        run: |
          echo "Checking critical imports..."
          uv run python -c "from django.conf import settings; print('✓ Django')"
          uv run python -c "from rest_framework import viewsets; print('✓ DRF')"
          uv run python -c "from wagtail.models import Page; print('✓ Wagtail')"
      
      - name: Run quick sanity tests
        run: uv run pytest tests/unit/test_app_structure.py -v --tb=short || true

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - ctc-research
          - lms-demo
          - vresume
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Check Docker Compose file
        run: docker compose config --quiet
      
      - name: Validate ${{ matrix.service }} service
        run: |
          echo "Validating ${{ matrix.service }} service definition..."
          docker compose config | grep -A 5 "${{ matrix.service }}-website" || \
          docker compose config | grep -A 5 "${{ matrix.service }}"

  configuration-check:
    name: Configuration Validation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      - name: Check for required environment files
        run: |
          echo "Checking environment configuration..."
          test -f .env.example && echo "✓ .env.example exists"
          test -f .env.dev && echo "✓ .env.dev exists"
          test -f Makefile && echo "✓ Makefile exists"
          test -f docker-compose.yml && echo "✓ docker-compose.yml exists"
      
      - name: Validate Makefile targets
        run: |
          echo "Checking Makefile targets..."
          grep -q "^help:" Makefile && echo "✓ help target"
          grep -q "^docker-up:" Makefile && echo "✓ docker-up target"
          grep -q "^test:" Makefile && echo "✓ test target"
          grep -q "^run-dev:" Makefile && echo "✓ run-dev target"
      
      - name: Validate documentation
        run: |
          echo "Checking documentation..."
          test -d docs && echo "✓ docs directory"
          test -f docs/MAKEFILE_REFERENCE.md && echo "✓ MAKEFILE_REFERENCE.md"
          test -f DOCUMENTATION_INDEX.md && echo "✓ DOCUMENTATION_INDEX.md"

  health-check-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [smoke-tests, docker-build-check, configuration-check]
    if: always()
    
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "✓ Smoke tests passed"
          fi
          if [ "${{ needs.docker-build-check.result }}" == "success" ]; then
            echo "✓ Docker build check passed"
          fi
          if [ "${{ needs.configuration-check.result }}" == "success" ]; then
            echo "✓ Configuration check passed"
          fi
