name: Architecture Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: boundary-check — run import-linter against all five contracts
  # ─────────────────────────────────────────────────────────────────────────────
  boundary-check:
    name: Boundary Check (import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run import-linter
        run: uv run lint-imports --config .importlinter

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: duplication-check — verify code duplication stays below 70%
  # ─────────────────────────────────────────────────────────────────────────────
  duplication-check:
    name: Duplication Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run duplication analysis
        run: uv run python scripts/analyze_duplication.py --threshold 0.70 --fail-on-violation

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: test-all-packages — run tests for all four shared packages
  # ─────────────────────────────────────────────────────────────────────────────
  test-all-packages:
    name: Test Package (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: django-osoul
            path: venv/libs/django-osoul
            module: django_osoul
          - package: django-rseal
            path: venv/libs/django-rseal
            module: django_rseal
          - package: django-grep
            path: venv/libs/django-grep
            module: django_grep
          - package: nawaai
            path: venv/libs/nawaai
            module: crafts_ai

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync --all-extras

      - name: Run tests for ${{ matrix.package }}
        working-directory: ${{ matrix.path }}
        run: uv run --directory ${{ matrix.path }} pytest tests/ -v --tb=short --no-header -q
        continue-on-error: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: test-projects — run tests for both Django projects
  # ─────────────────────────────────────────────────────────────────────────────
  test-projects:
    name: Test Project (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ctc-research
            path: ctc-research.com
            settings: configs.settings.test
          - project: structa-cloud
            path: structa.cloud
            settings: configs.settings.test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync --all-extras

      - name: Run tests for ${{ matrix.project }}
        working-directory: ${{ matrix.path }}
        env:
          DJANGO_SETTINGS_MODULE: ${{ matrix.settings }}
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
          DATABASE_URL: sqlite:///test.db
        run: uv run --directory ${{ matrix.path }} pytest tests/ -v --tb=short --no-header -q --ignore=tests/selenium --ignore=tests/integration
        continue-on-error: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: import-check — run scripts/check_imports.py for additional validation
  # ─────────────────────────────────────────────────────────────────────────────
  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run import boundary check
        run: uv run python scripts/check_boundaries.py --fail-on-error
