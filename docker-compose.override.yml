# ============================================================
# Structa - Docker Compose Override
# This file extends docker-compose.yml for local development
# Usage: docker compose up (automatically merges with base)
# ============================================================

services:
  # ============================================================
  # DJANGO MAIN APP - Development Overrides
  # ============================================================
  website:
    environment:
      - DEBUG=${DEBUG:-true}
      - SERVER_ENV=${SERVER_ENV:-development}
      - RELOAD=${RELOAD:-true}
      - WORKERS=${WORKERS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    volumes:
      - ./:/app:rw  # Mount source for hot reload
      - ./libs:/venv/libs:rw
      - website_static:/app/assets/staticfiles:rw
      - website_media:/app/assets/media:rw

  # ============================================================
  # WEBSITE-MEDIA - Development Overrides
  # ============================================================
  website-media:
    ports:
      - "${PORT:-8272}:80"  # Expose nginx on port 8272 for local development
    depends_on:
      - website

  # ============================================================
  # RQ WORKER - Development Overrides
  # ============================================================
  website-worker:
    volumes:
      - ./:/app:rw  # Mount source for hot reload
      - ./libs:/venv/libs:rw
      - website_static:/app/assets/staticfiles:rw
      - website_media:/app/assets/media:rw
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}

volumes:
  website_static:
  website_media:
